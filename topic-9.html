<script src="assets/meta.js"></script><script src="assets/index.js"></script><script>window.PAGE={"id": "t9", "t": "TOPIC 9 — Compliance and Ethics in IS Audit", "s": "9 · Compliance and Ethics in IS Audit", "g": "Topics", "c": "#ca8a04", "k": "9", "f": "topic-9.html", "w": 5023, "md": "# TOPIC 9 — Compliance and Ethics in IS Audit\n\n**Classification:** Core (short topic, 2 teaching hours)\n**Sources:** There is **no dedicated deck or handout** for this topic in your zip. Official fragments only: GDPR, HIPAA, ISO/IEC 27001 and PCI DSS appear as examples of laws and standards in Topics 1 and 5 (\"compliance monitoring\", \"compliance audits and assessments\"); CW1 Q26 and Q46 test the Uganda Data Protection and Privacy Act, 2019 and the idea of compliance; Topic 2 introduces white, gray and black hat hackers; Topic 6 describes compliance audits. **Everything else here is Supplementary explanation.** Legal details (names of laws, regulator roles) are given from general knowledge and **must be checked against what your lecturer teaches and the current text of each law**.\n**Outline items:** (a) legal and regulatory compliance: overview of relevant laws and regulations; compliance audits and assessments. (b) Professional ethics for IS auditors: code of ethics and professional conduct for IS auditors; ethical considerations in auditing practices.\n\n## PHASE 1 — UNDERSTANDING\n\n### 9.1 The big picture\n\nTwo questions run through this topic:\n\n1. **Compliance:** is the organization following the laws, regulations, standards and contracts that apply to it? (An external yardstick.)\n2. **Ethics:** is the **auditor** behaving honestly, independently and carefully while checking? (An internal, professional yardstick.)\n\nThey are related but different. **Compliance** means obeying rules that exist. **Ethics** means doing the right thing, including where the rules are silent.\n\n**Where it connects.** Backward: the \"Compliance\" attribute in Topic 6 and the \"compliance and legal requirements\" component of the ISMS in Topic 1 and the governance principle in Topic 5 all point here. Forward: Topic 8's reporting duties (honesty, completeness) and the Practical Lab's handling of data (privacy, confidentiality) are ethics applied.\n\n### 9.2 Key terms\n\n| Term | Meaning |\n|---|---|\n| **Compliance** | Following the laws, regulations, standards and internal policies that apply (CW1 Q46: ensuring an organization follows laws like GDPR and the Uganda Data Protection Act) |\n| **Compliance audit** | Gives management a tool for internal review of compliance in their operating units; the audit programme covers one or many compliance areas (Topic 6 notes) |\n| **Compliance assessment** | An evaluation of how well the organization meets specific requirements, identifying gaps (Topic 5 notes: \"compliance audits and assessments to identify gaps or deficiencies in policy implementation and enforcement\") |\n| **Regulation** | A rule issued by a regulator with legal force (for example a financial regulator's guidelines) |\n| **Personal data** | Information that identifies a living person |\n| **Data subject** | The person the personal data is about |\n| **Consent** | The data subject's agreement to the collection or use of their personal data |\n| **Data minimisation** | Collect only the data that is necessary for the stated purpose |\n| **Code of ethics** | A profession's published standards of behaviour for its members |\n| **Independence** | Freedom from conflicts that could bias the auditor's judgement, in fact and in appearance |\n| **Objectivity** | Basing conclusions on evidence, not on pressure or preference |\n| **Confidentiality** | Not disclosing information obtained during the audit without authority |\n| **Due professional care** | Diligence, competence and caution in carrying out the work |\n\n### 9.3 Legal and regulatory compliance: an overview\n\n#### 9.3.1 What the notes name\n\n| Item | Where it appears | What it is (from the notes' usage) |\n|---|---|---|\n| **GDPR** | Topics 1 and 5 | A data protection regulation (the General Data Protection Regulation of the European Union) |\n| **HIPAA** | Topics 1, 5, and the audit slides (healthcare audit example) | A US law on health information |\n| **PCI DSS** | Topic 5, and the audit slides (e-commerce audit example) | The payment card industry data security standard |\n| **ISO/IEC 27001** | Topics 1, 3, 5 | The ISMS standard against which organizations are certified |\n| **Uganda Data Protection and Privacy Act, 2019** | CW1 Q26 and Q46 | Ugandan data protection law |\n\n**CW1 questions to know:**\n- **Q26:** the Act places a strong emphasis on a specific provision *before collecting personal data*. The expected answer in this question set is **explicit consent**.\n- **Q46:** the practice of ensuring an organization follows laws like GDPR and the Uganda Data Protection Act is **compliance** (not risk transfer, data masking or threat modelling).\n\n#### 9.3.2 Laws and regulators likely to matter in Uganda (supplementary; verify with your lecturer)\n\n> **Supplementary explanation.** For a Ugandan bank like the fictional BBCBank in CW2, the main layers of requirement are:\n>\n> | Layer | Examples (general knowledge, check current texts) | Relevance |\n> |---|---|---|\n> | **Data protection law** | The Data Protection and Privacy Act, 2019 | Rules on collecting, using, storing and sharing personal data; consent; security safeguards; rights of data subjects |\n> | **Cyber and electronic law** | The Computer Misuse Act, 2011; the Electronic Transactions Act, 2011; the Electronic Signatures Act, 2011 | Offences such as unauthorised access; legal recognition of electronic records and signatures |\n> | **Sector regulation** | Bank of Uganda requirements for financial institutions, including expectations on ICT risk, security, outsourcing and business continuity (the CW2 brief refers to \"prudential expectations for the financial sector in Uganda\") | Binding on banks; auditors test against them |\n> | **International standards** | ISO/IEC 27001, COBIT, NIST, PCI DSS (where cards are processed) | Good practice or contractual requirements |\n> | **Internal policy** | The organization's own IT and security policies | The nearest criteria for day-to-day audit tests |\n>\n> **Note:** this table is a map, not legal advice. Exam answers should name the laws your lecturer named and describe what they require, not rely on section numbers.\n\n#### 9.3.3 Data protection ideas that run through most laws (supplementary)\n\n| Principle | Plain meaning | Example in a bank |\n|---|---|---|\n| **Lawful, fair processing, with consent where required** | Only collect and use data with a lawful basis; ask the person before collecting | Account opening form has a clear consent statement |\n| **Purpose limitation** | Use data only for the stated purpose | Customer phone numbers are not sold to marketers |\n| **Data minimisation** | Collect only what is necessary | Do not ask for religion on a savings form |\n| **Accuracy** | Keep data correct and up to date | A process to correct customer records |\n| **Storage limitation** | Keep data only as long as needed | A retention schedule with deletion |\n| **Security safeguards** | Protect against loss, misuse and unauthorised access | Encryption, access controls (Topics 1 to 4, 7) |\n| **Accountability and openness** | Be able to show compliance; tell people how data is used | A privacy notice; a named data protection officer |\n| **Data subject rights** | People can ask to see or correct their data | A process for access requests |\n\nNotice how these tie to what you have already learned: the **security safeguards** principle *is* Topics 1 to 4 and 7; **data masking** (CW1 Q28) and **encryption** are techniques that help meet it.\n\n### 9.4 Compliance audits and assessments\n\n**What the notes say.**\n- Topic 6: a **compliance audit** gives management a tool for internal review of compliance in their operating units; the audit programme covers one or many compliance areas, each applicable to a unit depending on its activities, funding, regulatory rules or any other pre-defined criterion. Example in the slides: compliance audits such as GDPR and HIPAA.\n- Topic 5: \"assess compliance\", \"conduct compliance audits and assessments to identify gaps or deficiencies in policy implementation and enforcement\", and \"review evidence of compliance, such as audit reports, compliance assessments, and regulatory filings\".\n\n> **Supplementary explanation: a step-by-step compliance audit.**\n>\n> | Step | What happens | Concrete example |\n> |---|---|---|\n> | 1. **Identify requirements** | List every law, regulation, standard and contract clause that applies, in a compliance register | Data Protection Act; bank regulator guidelines; PCI DSS; the internal data policy |\n> | 2. **Map to controls** | For each requirement, name the control that is supposed to meet it | \"Consent before collection\" → consent field in account opening form |\n> | 3. **Plan tests** | Decide evidence and procedures; sample or test all | Review 50 account opening forms |\n> | 4. **Test** | Gather evidence and evaluate | Count forms with signed consent |\n> | 5. **Assess gaps** | Where requirements are not met | 8 of 50 lack consent |\n> | 6. **Report** | Findings in five-part format (Topic 8) | Condition, criteria (the Act), cause, effect, recommendation |\n> | 7. **Follow up** | Verify fixes; update register as laws change | Re-test in 90 days |\n\n**Worked example (illustrative): a data protection compliance check of account opening.**\n\n| Requirement | Test | Evidence | Result |\n|---|---|---|---|\n| Consent obtained before collecting personal data | Sample 50 account opening files; check signed consent | Files | 8 of 50 have no consent: **non-compliant** |\n| Collect only necessary data | Compare form fields with the stated purposes | Form | Asks for tribe and religion with no stated purpose: **non-compliant** |\n| Security safeguards | Check storage of scanned IDs | Server access list | Scanned IDs accessible to all branch staff: **non-compliant** |\n| Retention | Compare retention policy with records kept | Retention schedule, file sample | Records kept for 15 years with no justification: **gap** |\n| Data subject access process | Ask for the procedure and a log of requests | Procedure, log | Procedure exists and is used: **compliant** |\n\n**Finding (condition, criteria, cause, effect, recommendation) for the first line:**\n- *Condition:* 8 of 50 sampled account files (16%) contain no evidence of customer consent (WP I1).\n- *Criteria:* the data protection law requires consent before collecting personal data; the bank's data policy mirrors this.\n- *Cause:* the consent clause was removed from the revised form and not restored.\n- *Effect:* regulatory sanctions, complaints and reputational harm.\n- *Recommendation:* reinstate the consent clause within 14 days; obtain consent for the affected customers; add a form checklist at account opening. Owner: Head of Retail Operations.\n\n**Compliance is not the same as security.** A bank can comply with every written rule and still be vulnerable; it can also be secure in places and non-compliant (for example, no consent form). Auditors report on both.\n\n### 9.5 Professional ethics for IS auditors\n\n#### 9.5.1 Why ethics matters to an auditor\n\nAn audit opinion has value only if readers trust the auditor. Auditors see confidential data, have powerful access, and are paid by the organization they examine. **Ethics** keeps the auditor honest, independent and careful when it would be easier not to be.\n\n#### 9.5.2 The code of ethics and professional conduct (supplementary)\n\n> **Supplementary explanation.** Your notes mention ISACA guidelines (Topic 6) but do not reproduce its code of professional ethics. In summary, ISACA's code expects its members to:\n> 1. **Support standards and procedures** for the effective governance and management of information systems, including audit, control, security and risk management.\n> 2. **Perform duties with objectivity, due diligence and professional care**, following professional standards.\n> 3. **Serve stakeholders' interests lawfully**, maintaining high standards of conduct and character and not discrediting the profession.\n> 4. **Maintain the privacy and confidentiality of information** obtained in the course of their duties, unless disclosure is legally required; never use it for personal benefit or release it to inappropriate parties.\n> 5. **Maintain competence** and undertake only activities they can reasonably expect to complete with professional competence.\n> 6. **Disclose accurate results of all work** to appropriate parties, including all material facts known to them that, if hidden, might distort the reporting.\n> 7. **Support the professional education of stakeholders** about information systems security and control.\n>\n> (This is a paraphrase; check the exact code wording, and check which professional bodies your lecturer wants you to cite, for example internal audit and national accounting bodies as well.)\n\n**The core principles, in a form to memorise:**\n\n| Principle | What it means | Concrete example |\n|---|---|---|\n| **Integrity** | Honesty and straightforwardness | Reporting an unfavourable result even when management objects |\n| **Objectivity** | Conclusions based on evidence, free of bias | Not softening a finding because the auditee is a friend |\n| **Independence** | Free from conflicts of interest, in fact **and** appearance | Not auditing a system you designed or run |\n| **Confidentiality** | Do not disclose or misuse audit information | Encrypting working papers; not discussing findings outside the engagement |\n| **Competence** | Take on only work you are qualified to do; keep skills current | Bring in a specialist for a technical test beyond your skill |\n| **Due professional care and scepticism** | Diligence, evidence-based doubt | Do not accept an explanation without evidence |\n| **Compliance with law and authority** | Work lawfully and within the engagement authority | Test only with written authorisation |\n| **Full and accurate reporting** | Disclose all material facts | Do not omit a serious finding |\n\n#### 9.5.3 Ethical considerations in auditing practice\n\n| Issue | The ethical question | Good practice |\n|---|---|---|\n| **Authorisation and scope** | Am I allowed to do this test? | Written authorisation and rules of engagement before any VAPT; never exceed scope. Note Topic 2: **white hat** (authorised), **gray hat** (breaks in without harm, then tells; still unauthorised), **black hat** (malicious). Authority is what separates an auditor from an offender. |\n| **Privacy in testing** | Am I handling people's data properly? | Use the minimum data necessary; protect extracts with encryption and access controls; delete when no longer needed; do not look at records unrelated to the audit |\n| **Independence and conflicts** | Could my judgement be, or look, biased? | Disclose and avoid conflicts (auditing your own work, a relative's department); rotate where possible |\n| **Gifts and pressure** | Am I being influenced? | Decline gifts and favours; escalate pressure to soften a finding |\n| **Honest reporting** | Am I reporting everything material? | Include all material findings; do not let management delete findings; record management's disagreement rather than hide it |\n| **Competence** | Can I do this properly? | Do not claim expertise you lack; seek help or decline |\n| **Handling discovered fraud or illegal acts** | What if I find something criminal? | Do not investigate beyond competence or authority; escalate to the appropriate person (for example the audit committee) per policy and law |\n| **Use of tools and data** | Is my own conduct lawful? | Use licensed tools; follow the law (unauthorised access is an offence); acknowledge sources and avoid plagiarism in the report |\n| **Academic integrity** | Is the work honestly mine? | Your CW2 brief requires Turnitin below 20% and individual contribution; the outline says academic dishonesty is a serious offence |\n\n#### 9.5.4 A method for ethical dilemmas (supplementary)\n\n1. **Identify the facts** and who is affected.\n2. **Identify the principles** involved (independence, confidentiality, integrity, law).\n3. **List options** (including escalating).\n4. **Test each option:** is it lawful? honest? fair to stakeholders? defensible if made public?\n5. **Decide, document and, where required, escalate.**\n\n**Worked dilemma 1 (illustrative).** *During an access review you notice that the CFO's account was used at 3 a.m. to approve a large payment to a company owned by the CFO's brother. The CFO asks you to leave it out of the report \"for now\".*\n- Principles: integrity, objectivity, full reporting, independence.\n- Options: (a) leave it out; (b) include it quietly; (c) report to the audit committee per policy and present the factual evidence without accusing.\n- Decision: (c). Omitting a material fact breaches full and accurate reporting; accusing without proof exceeds the auditor's role. Document the request to omit and escalate.\n\n**Worked dilemma 2 (illustrative).** *While doing a penetration test within scope, you discover a weakness in a connected system that was not in scope.*\n- Principles: legality, authorisation.\n- Decision: stop; do not test it; report that the weakness may exist and ask for authority to include it. Testing outside scope would be unauthorised access.\n\n**Worked dilemma 3 (illustrative).** *You extracted customer ID numbers into Excel for testing and want to keep the file on your laptop for revision.*\n- Principles: confidentiality, privacy.\n- Decision: not allowed. Use the minimum data, protect the file, and delete or return it at the end of the engagement per the agreed terms.\n\n### 9.6 Text diagram: compliance and ethics around the audit\n\n```\n          LAW, REGULATION, STANDARDS, CONTRACTS, POLICY   (what the auditee must meet)\n                              |\n                        COMPLIANCE AUDIT\n                              |\n  AUDITOR ---> INDEPENDENCE, OBJECTIVITY, CONFIDENTIALITY, COMPETENCE, INTEGRITY <--- AUDITOR\n      |             (what the auditor must meet while auditing)                           |\n      +---> authorised scope ---> evidence ---> honest, complete report ---> follow-up ---+\n```\n\n### 9.7 Common misconceptions and exam traps\n\n| Trap | Truth |\n|---|---|\n| \"Compliance and ethics are the same thing\" | Compliance = following external rules; ethics = the auditor's professional conduct, including where rules are silent. |\n| \"If we are compliant we are secure\" | Compliance is a minimum yardstick; security needs risk-based controls. |\n| \"Compliance is transferring risk\" | CW1 Q46: compliance is following the laws (not risk transfer). |\n| \"Consent is optional in data protection\" | CW1 Q26: the Act emphasises explicit consent before collecting personal data. |\n| \"A gray hat is acceptable because no harm is done\" | Gray hat activity is still done without authority; an auditor works only with authorisation. |\n| \"Independence only means not being related to the auditee\" | It also means being free from bias in judgement, in fact and in appearance. |\n| \"I can keep audit data for later use\" | Confidentiality and privacy require minimum use, protection and secure disposal. |\n| \"If management asks, I can leave out a finding\" | The auditor must report all material facts. |\n| \"Ethics means only avoiding crime\" | It also covers competence, objectivity, due care and honesty. |\n\n### 9.8 Checklist: compliance and ethics in any scenario\n\n1. **Which requirement applies?** (law, regulation, standard, contract, internal policy)\n2. **What is the control and what is the evidence?**\n3. **Is it a compliance gap, a security gap, or both?**\n4. **For the auditor's conduct:** authorised? independent? objective? confidential? competent? complete?\n5. **If unsure, escalate and document.**\n\n### 9.9 Revision summary (Topic 9)\n\n- Compliance = following laws, regulations, standards and policies (examples in notes: GDPR, HIPAA, PCI DSS, ISO/IEC 27001, Uganda Data Protection and Privacy Act, 2019). CW1: the Act emphasises explicit consent; ensuring law-following is compliance.\n- Compliance audit: identify requirements, map to controls, test, assess gaps, report, follow up.\n- Data protection ideas: consent, purpose limitation, minimisation, accuracy, storage limitation, security safeguards, accountability, data subject rights.\n- Ethics for IS auditors: integrity, objectivity, independence, confidentiality, competence, due care, lawful conduct, full and accurate reporting.\n- Ethical practice: authorised scope, privacy in testing, conflicts, gifts and pressure, honest reporting, handling fraud, lawful tools, academic integrity.\n- Compliance is not security; ethics is not only avoiding crime.\n\n---\n\n## PHASE 2 — COMPREHENSION CHECKS (Topic 9)\n\n**C1. Explain, in your own words, the difference between compliance and ethics.**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nCompliance is whether the organization follows the rules that apply to it (laws, regulations, standards, policies). Ethics is whether people, here the auditor, act honestly, independently and carefully, including in situations the rules do not cover. A bank can be compliant while its auditor is biased, and an auditor can be ethical while the bank is non-compliant.\n\n**Check:** external rules vs professional conduct.\n<\/details>\n\n**C2. Why does the data protection principle of consent exist? What would happen if a bank collected customers' personal data without it?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nIt gives people control over their own data. Without consent the bank could collect and use information the customer never agreed to, breaching privacy and the law. Consequences: regulatory penalties, complaints, loss of customer trust and possible compensation claims. (CW1 Q26 expects explicit consent before collecting personal data.)\n\n**Check:** control for the data subject; legal and reputational risk.\n<\/details>\n\n**C3. Why must an auditor have written authorisation before a penetration test, even when the aim is to help?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nBecause accessing systems without authority is unlawful and can disrupt services, regardless of intent. Authorisation defines scope, timing and methods and protects both the auditor and the organization. It is what separates an ethical (white hat) test from unauthorised access, which is why the notes distinguish white hat from gray hat and black hat.\n\n**Check:** authority, scope and legality.\n<\/details>\n\n**C4. What would happen to the credibility of an audit if the auditor were not independent?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nReaders could not be sure that the findings and opinion were unbiased. If the auditor audited their own system or depended on the auditee's favour, they might understate problems. Even the appearance of bias damages trust, so the report would carry less weight with the board, regulators and external parties.\n\n**Check:** trust depends on freedom from bias in fact and appearance.\n<\/details>\n\n**C5. How does a compliance audit relate to the five-part finding format of Topic 8?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nIn a compliance audit, the **criteria** are the law, regulation, standard or policy requirement. The tests produce the **condition** (what was found). The cause, effect and recommendation then complete the finding. The legal requirement therefore becomes the benchmark in the report.\n\n**Check:** requirement = criteria.\n<\/details>\n\n**C6. Give an original example of an ethical conflict for an IS auditor and how to resolve it.**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\n*Example:* an auditor is offered a paid consulting contract by the manager whose department is currently being audited. Accepting would create a conflict of interest that threatens independence. Resolution: decline or disclose and withdraw from that audit, tell the audit leadership, and document the decision.\n\n**Check:** identify the conflict, protect independence, disclose, document.\n<\/details>\n\n**C7. Which part of this topic would confuse someone seeing it for the first time?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\n(1) Compliance vs ethics. (2) Compliance vs security. (3) Gray hat hackers: no harm intended but still no authority. (4) The list of laws, since your notes name few: learn the five named in the notes, and what your lecturer says about the Ugandan laws.\n<\/details>\n\n---\n\n## PHASE 3 — ACTIVE RECALL BANK (Topic 9)\n\n### Level 1 — Basic recall\n\n**Q1.** Name four laws, regulations or standards mentioned in your notes and CW1 as compliance examples.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** GDPR; HIPAA; PCI DSS; ISO/IEC 27001; the Uganda Data Protection and Privacy Act, 2019.\n\n**Common mistake:** naming NIST or COBIT, which are frameworks rather than laws, although they can serve as criteria.\n<\/details>\n\n**Q2.** Which provision does the Uganda Data Protection and Privacy Act, 2019 emphasise before personal data is collected (CW1 Q26)?\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Explicit consent (of the data subject).\n\n**Common mistake:** choosing \"data masking\" or \"multi-factor authentication\"; those are technical controls, not provisions on collection.\n<\/details>\n\n**Q3.** Define compliance (CW1 Q46 style).\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Compliance is ensuring that an organization follows applicable laws, regulations, standards and its own policies, such as GDPR and the Uganda Data Protection Act.\n\n**Common mistake:** confusing it with risk transfer.\n<\/details>\n\n**Q4.** List five principles an IS auditor's ethics should include.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Any five of: integrity; objectivity; independence; confidentiality; competence; due professional care; lawful conduct; full and accurate reporting.\n\n**Common mistake:** listing technical skills instead of ethical principles.\n<\/details>\n\n### Level 2 — Understanding\n\n**Q5.** Distinguish a compliance audit from a security audit.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** A compliance audit compares practice with specific requirements (laws, regulations, standards, policies) and reports gaps. A security audit (Topic 6) provides vulnerability assessments of networks and systems, reports weaknesses and recommends remedies. One checks conformity with rules; the other checks resistance to threats. A system can pass one and fail the other.\n\n**Marking:** two definitions (2), contrast (2).\n\n**Common mistake:** treating them as the same.\n<\/details>\n\n**Q6.** Explain what independence means for an IS auditor and why it matters.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Independence means being free from conflicts of interest and undue influence that could bias judgement, both in fact and in appearance (for example, not auditing a system you designed or operate). It matters because the value of the audit opinion depends on readers trusting that it is unbiased.\n\n**Common mistake:** limiting it to \"not being related to the auditee\".\n<\/details>\n\n**Q7.** Explain how data protection principles overlap with the security controls you studied in Topics 1 to 4.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** The \"security safeguards\" principle requires protecting personal data against loss, misuse and unauthorised access, which is delivered by confidentiality controls, encryption, access control (DAC/MAC/RBAC), network security, physical security and incident response. Data masking supports confidentiality in non-production environments. Compliance therefore depends in part on the security controls working.\n\n**Common mistake:** treating compliance as paperwork unrelated to security controls.\n<\/details>\n\n### Level 3 — Application\n\n**Q8.** An auditor reviews 60 loan files and finds 9 without a signed customer consent for credit bureau checks, and the form also collects marital status for no stated reason. Identify the compliance issues and write the finding for the consent gap (five parts).\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** *Issues:* (1) missing consent before collecting or using personal data; (2) collection of data not needed for a stated purpose (minimisation). *Finding:* *Condition:* 9 of 60 sampled loan files (15%) have no signed consent for credit bureau checks (WP I2). *Criteria:* the data protection law and the bank's data policy require consent before collecting and using personal data. *Cause:* consent is a paper form that is not checked before loan processing. *Effect:* regulatory sanctions, complaints and reputational harm. *Recommendation:* make consent a mandatory step in the system before approval; obtain consent from the affected customers; owner head of credit; 30 days.\n\n**Marking:** two issues (2), five-part finding (5).\n\n**Common mistake:** writing the effect as a cause.\n<\/details>\n\n**Q9.** During a penetration test within scope, you find an exposed admin page on a server that is not in the scope. A colleague says \"just have a quick look\". What should you do and why?\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Do not test it. Stop at the scope boundary, record what was observed, inform the engagement lead and the client, and ask for written authority to include the server. Testing without authority could be unauthorised access under the law and breach the code of ethics (compliance with law, authorised scope).\n\n**Marking:** decision (1), reasons (2), steps (2).\n\n**Common mistake:** arguing that good intentions justify it.\n<\/details>\n\n**Q10.** Management asks the auditor to remove a medium-rated finding \"to avoid upsetting the board\". Describe the ethical considerations and the proper response.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** The auditor must report all material facts accurately; omitting a finding would breach integrity and objectivity and could mislead the board. Proper response: re-check the evidence and rating; discuss with management; if they disagree, record their response in the report rather than removing the finding; escalate to the audit committee if pressure continues; document the request.\n\n**Marking:** principles (2), actions (3).\n\n**Common mistake:** agreeing to remove it in exchange for a promise to fix it.\n<\/details>\n\n### Level 4 — Exam mastery\n\n**Q11.** \"A bank that complies with every applicable law is secure.\" Discuss. (10 marks)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer outline:**\n1. *Position:* false; compliance is necessary but not sufficient.\n2. *What compliance gives:* a minimum, externally set baseline; evidence of accountability; avoidance of penalties.\n3. *Why it is not security:* laws set general requirements and change slowly; they cannot cover every threat or technology; controls may exist on paper but not operate (design vs operating effectiveness); a bank can meet a requirement narrowly while remaining exposed (for example, a consent form exists but data is poorly protected).\n4. *Why security is not compliance either:* a technically strong organization might still lack consent forms or retention rules.\n5. *Link to the course:* compliance audits (Topic 6), risk-based controls (Topic 7), ISMS (Topic 1) and governance (Topic 5): compliance is one component of a broader approach.\n6. *Conclusion:* aim for compliance as a floor and risk-based security as the goal; audit both.\n\n**Marking criteria:** position (1), compliance role (2), limits (3), converse point (1), course link (2), conclusion (1).\n\n**Common mistake:** treating compliance as worthless.\n<\/details>\n\n**Q12.** You are auditing BBCBank's customer onboarding. (a) Describe the compliance audit you would run for data protection, with five requirements, tests and evidence. (b) Identify three ethical issues for you as auditor in handling the data and say how you would manage each. (c) Say how you would report one finding. (14 marks)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer outline:**\n(a) *Requirements, tests, evidence:* consent before collection (sample files, signed consent); minimisation (compare form fields with purposes); security safeguards (access list to scanned IDs and data stores); retention (retention schedule vs record age); data subject access process (procedure and request log); possibly breach response and third-party processors (contracts). Evidence: files, forms, access lists, schedules, logs.\n(b) *Ethical issues:* (1) privacy: use the minimum data, mask or avoid copying personal details, store extracts encrypted, delete at the end; (2) authority and confidentiality: access only under the authority of the engagement, do not discuss customer information outside the team; (3) independence and objectivity: report gaps honestly even if the head of retail is a friend, disclose any conflict.\n(c) *Finding:* five parts, for example the consent gap: condition (8 of 50 files, 16%), criteria (the law and bank policy), cause (form change), effect (sanctions, trust), recommendation (restore clause, obtain consent, owner, 14 days).\n\n**Marking criteria:** (a) 6, (b) 5, (c) 3.\n\n**Common mistake:** describing only technical tests and ignoring the auditor's own handling of data.\n<\/details>\n\n\n---"};</script><script src="assets/app.js"></script><script src="assets/live.js"></script></html>
