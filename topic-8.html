<script src="assets/meta.js"></script><script src="assets/index.js"></script><script>window.PAGE={"id": "t8", "t": "TOPIC 8 — IS Audit Reporting and Communication", "s": "8 · IS Audit Reporting and Communication", "g": "Topics", "c": "#c026d3", "k": "8", "f": "topic-8.html", "w": 6121, "md": "# TOPIC 8 — IS Audit Reporting and Communication\n\n**Classification:** Applied/Practical, Likely exam focus (CW2 is an audit report)\n**Sources:** There is **no dedicated deck or handout** for this topic in your zip. The **only official source** is the CW2 take-home brief (BBCBank), which prescribes the report structure and the five-part finding format. Scattered mentions appear in Topic 5 (communicate results, follow up) and Topics 1, 5 and 6 (vulnerability assessment and penetration testing). Everything else in this topic is **Supplementary explanation**, built by sound audit practice, and follows the outline.\n**Outline items:** (a) audit findings and recommendations: reviewing policies and procedures; testing controls; vulnerability assessment and penetration testing; documenting and communicating audit findings; providing actionable recommendations. (b) Audit reporting: developing clear and concise audit reports; communicating findings to different stakeholders.\n\n## PHASE 1 — UNDERSTANDING\n\n### 8.1 The big picture\n\nAn audit is only useful if the people who can fix the problems **understand** what was found, **believe** it, and know **what to do**. Topic 8 is the last step of the audit chain from Topic 6:\n\n```\n PLAN -> GATHER -> TEST CONTROLS -> FINDINGS -> REPORT -> FOLLOW UP\n (T6)    (T6)       (T6, T7)         (this topic)           (T5, T6)\n```\n\n**Where it connects.** Backward: findings come from tests of the controls in Topic 7, using the techniques in Topic 6 and the Practical Lab. Forward: Topic 9 (ethics) governs how the auditor behaves when reporting (honesty, confidentiality, objectivity). CW2 is, in effect, a graded Topic 8 exercise.\n\n### 8.2 Key terms\n\n| Term | Meaning |\n|---|---|\n| **Finding** | A reportable issue found by the audit: a gap between what should be and what is |\n| **Condition** | What the auditor found (the fact), supported by evidence |\n| **Criteria** | What it should have been: the policy, standard or approved parameter |\n| **Cause** | Why the condition exists (the root reason) |\n| **Effect** | The business or regulatory risk that results |\n| **Recommendation** | The action to fix it, with a responsible owner and a realistic timeline |\n| **Management response** | Management's reply to a finding: agree or disagree, planned action |\n| **Management action plan** | The consolidated list of agreed actions, owners and target dates |\n| **Executive summary** | A short opening section: overall opinion, top findings, high-level risk posture |\n| **Working papers** | The auditor's recorded work: test sheets, recomputation worksheets, screenshots, evidence logs |\n| **Vulnerability assessment (VA)** | Identifying and ranking weaknesses, often with scanning tools |\n| **Penetration test (PT)** | An authorised simulated attack that tries to exploit weaknesses |\n| **Severity** | How serious a weakness is (for example, critical, high, medium, low) |\n| **Follow-up** | Checking later whether agreed actions were done and worked |\n\n### 8.3 From evidence to finding: the five elements (the CW2 format)\n\n**Official source (CW2 brief):** for each finding present:\n\n1. **Condition supported by evidence.**\n2. **Criteria** from policy, standards or approved parameters.\n3. **Cause** explaining the underlying reason.\n4. **Effect** describing the business or regulatory risk.\n5. **Recommendation** with responsible owner and realistic timeline.\n\n**Why five elements?** Condition alone (\"passwords are weak\") invites argument. The criteria show the benchmark; the cause lets management fix the **root**, not the symptom; the effect shows why it matters; the recommendation shows what to do and who owns it.\n\n**Worked finding 1: password configuration (CW2 area (b)), illustrative.**\n\n| Element | Text |\n|---|---|\n| **Condition** | The Active Directory configuration export (WP B1) shows a minimum password length of 6 characters, no password expiry, and an account lockout threshold of 10 attempts. Multi-factor authentication is not enabled for the 14 administrator accounts of the Core Banking System (WP B2) |\n| **Criteria** | The IT Security Policy (section 4.2) requires a minimum of 8 characters, expiry every 90 days, lockout after 5 attempts, and MFA for privileged accounts |\n| **Cause** | Settings were left at installation defaults and were never reconciled to the policy; no periodic configuration review exists |\n| **Effect** | Weak, non-expiring passwords make credential guessing and reuse easier; unauthorised administrator access could allow fraud or system disruption, and breach regulatory expectations on access control |\n| **Recommendation** | Align configuration to policy within 30 days; enforce MFA for all privileged accounts within 60 days; introduce a quarterly configuration compliance check. **Owner:** Head of IT Security |\n\n**Worked finding 2: tariff accuracy and excise duty (CW2 area (c)), with invented numbers.**\n\n| Element | Text |\n|---|---|\n| **Condition** | Using Excel, the audit team recomputed the charge for all 60,000 mobile channel withdrawals in the period (WP C1). 1,620 transactions (2.7%) were charged 2,000 instead of 2,300; excise duty of 300 was not applied. Shortfall: 1,620 × 300 = 486,000 UGX |\n| **Criteria** | The approved tariff guide sets a fee of 2,000 plus excise duty of 15% of the fee (300) |\n| **Cause** | The tariff table in the channel system was updated without the excise duty parameter for one product code (no review of the change) |\n| **Effect** | Under-collection of excise duty owed to the revenue authority; potential regulatory penalties; inconsistent customer charges |\n| **Recommendation** | Correct the product setup within 14 days; recover the shortfall and report as required; add a pre-release tariff test to change management. **Owner:** Head of Product with Head of IT |\n\n**Worked finding 3: leavers' access (CW2 area (f)), illustrative.**\n\n| Element | Text |\n|---|---|\n| **Condition** | 12 of 480 leavers in the period (2.5%) still had active Core Banking accounts at the review date; two of them logged in after leaving (WP F2, F3) |\n| **Criteria** | The access control policy requires accounts to be disabled within one working day of exit |\n| **Cause** | HR and IT have no automated link; leavers are notified by email, which is not always sent |\n| **Effect** | Risk of unauthorised access, data theft and fraud using former staff credentials |\n| **Recommendation** | Automate leaver notification from the HR system within 60 days; monthly reconciliation of HR leavers to active users; investigate the two post-exit logins immediately. **Owner:** Head of IT and Head of HR |\n\n**A weak finding versus a strong one:**\n\n| Weak | Strong |\n|---|---|\n| \"Access controls are poor.\" | \"12 of 480 leavers (2.5%) still had active accounts; two logged in after leaving.\" |\n| \"Management should improve things.\" | \"Automate leaver notification within 60 days. Owner: Head of IT.\" |\n| \"The system is insecure and staff are careless.\" | Neutral, factual, about the control (not blame) |\n| No evidence reference | \"(WP F2)\" points to the working paper |\n\n### 8.4 Reviewing policies and procedures, and testing controls (outline items)\n\nReviewing policies and procedures and testing controls are the **sources of findings**. You have already learned both:\n\n- **Reviewing policies and procedures:** Topic 5's evaluation steps (review documentation, assess compliance, evaluate implementation) and Topic 3's policy checklist. *In a finding, the policy provides the criteria.*\n- **Testing controls:** Topic 6 (evidence techniques, sampling, around/through/with the computer) and Topic 7 (design, implementation, operation). *The test results provide the condition.*\n\n**The link:** policy review tells you **what should be**; control testing tells you **what is**; the finding states the **gap**.\n\n### 8.5 Vulnerability assessment and penetration testing (VAPT)\n\n**What the notes say.** Topic 5 lists vulnerability assessments and penetration testing as ways to **test controls**; Topic 6 describes security audits as providing network vulnerability assessments; Topic 1 lists penetration testing and static code analysis under application security. CW2 area (g) asks for \"scope, tooling, techniques, severity classification, business impact and prioritised remediation\".\n\n> **Supplementary explanation: VA vs PT.**\n>\n> | | **Vulnerability assessment (VA)** | **Penetration test (PT)** |\n> |---|---|---|\n> | Purpose | Find and rank as many weaknesses as possible | Show whether weaknesses can really be exploited and how far an attacker could get |\n> | Method | Mostly automated scanning plus review | Skilled testers simulate an attacker, mostly manual |\n> | Breadth vs depth | Broad | Deep on chosen targets |\n> | Result | A list of weaknesses with severity | A demonstration of impact (for example, \"reached the customer database\") |\n> | Analogy in plain terms | Checking every door and window to list which are unlocked | Trying to actually get in through an unlocked door and see how far you can go |\n>\n> **Ethical and legal requirement:** testing must be done only with **written authorisation** and clear **rules of engagement** (what is in scope, when, which methods). Testing without authority is a crime. (See Topic 9.)\n\n**The VAPT process (what CW2 (g) wants you to cover):**\n\n| Step | What is covered |\n|---|---|\n| **1. Scope** | Which systems, networks, applications and periods; what is excluded |\n| **2. Tools and techniques** | Which scanners or manual techniques; whether it is black-box (no knowledge), grey-box or white-box (full knowledge) |\n| **3. Discovery and scanning** | Identify hosts, services and known weaknesses |\n| **4. Exploitation (PT only)** | Attempt to exploit weaknesses within the agreed rules |\n| **5. Analysis and severity classification** | Rate each weakness (for example critical, high, medium, low) |\n| **6. Business impact** | What the weakness means for the business: data exposed, services stopped |\n| **7. Prioritised remediation** | Fix in order of risk, with owners and dates |\n| **8. Retest** | Confirm that fixes work |\n\n**Worked example: prioritising VA results (illustrative).** Severity alone is not enough: the same weakness matters more on an internet-facing critical system.\n\n| ID | Weakness | Severity | Asset and exposure | Priority | Suggested timeline |\n|---|---|---|---|---|---|\n| 1 | Unpatched web server with a known serious flaw | High | Internet-facing, critical | **1** | 7 days |\n| 2 | Default administrator password on a network switch | High | Internal, important | **2** | 14 days |\n| 3 | Unnecessary file transfer service open | Medium | Internal file server | **3** | 30 days |\n| 4 | Missing security headers on the public website | Low | Public, low-value | **4** | 90 days |\n\nReading it line by line: IDs 1 and 2 are both \"High\", but ID 1 is reachable from the internet and sits on a critical system, so it ranks first; ID 4 is low severity on a low-value asset, so it can wait.\n\n**How VAPT appears in the report:** in the methodology (approach and scope), in the findings (each weakness written in the five-part format or summarised in a table), and in appendices (scan outputs, with sensitive details protected).\n\n### 8.6 Documenting and communicating findings\n\n**Documenting (supplementary).**\n- Record every test in a **working paper**: objective, procedure, population and sample, results, exceptions, conclusion, and who did it and when.\n- Keep **evidence** (exports, screenshots, logs) referenced by working paper number. CW2 requires a ZIP titled `GroupName_WorkingPapers.zip` containing \"test sheets, recomputation worksheets, screenshots, evidence logs\".\n- Make every figure in the report **traceable** to a working paper.\n\n**Communicating (supplementary).**\n1. **Confirm facts first.** Before reporting, discuss each finding with the process owner to check the facts are right.\n2. **Draft report** with findings and recommendations.\n3. **Management response:** management agrees or disagrees and commits to actions, owners and dates.\n4. **Exit meeting:** present the main findings and the opinion.\n5. **Final report** issued to the right audience.\n6. **Follow-up:** the notes (Topic 5) call for monitoring implementation of recommendations and for follow-up audits to verify corrective actions.\n\n### 8.7 Providing actionable recommendations\n\nAn **actionable** recommendation is one the owner can actually carry out and you can later check.\n\n| Quality | What it means | Example |\n|---|---|---|\n| **Specific** | Says exactly what to do | \"Disable accounts within 1 working day of exit\" |\n| **Addresses the cause** | Fixes the root reason, not only the symptom | Automate the HR-to-IT notification (cause) as well as disabling the 12 accounts (symptom) |\n| **Owned** | Names a responsible person or role | Head of IT |\n| **Time-bound and realistic** | A date or period that can be met | Within 60 days |\n| **Proportionate** | Cost and effort fit the risk | Do not recommend a new system to fix a one-line setting |\n| **Measurable** | You can tell when it is done | Monthly reconciliation shows zero active leavers |\n\n**Weak vs actionable:**\n\n| Weak | Actionable |\n|---|---|\n| \"Improve password security.\" | \"Set minimum length to 8, expiry to 90 days and lockout to 5 attempts in Active Directory within 30 days. Owner: Head of IT Security.\" |\n| \"Management should consider backups.\" | \"Perform a full restore test of the core banking backup each quarter, document the result and report to the IT steering committee. Owner: Head of Infrastructure.\" |\n\n**Prioritising recommendations:** order by **risk rating** (high first), then by effort (quick fixes early). The management action plan consolidates them.\n\n### 8.8 Developing clear and concise audit reports\n\n#### 8.8.1 The required structure (official source: CW2 brief)\n\nThe CW2 report must be a **professional IT and IS audit report** to management of BBCBank Ltd, a single PDF, written in **formal academic and professional language**, with:\n\n| # | Section | What it must contain (CW2 brief) |\n|---|---|---|\n| 1 | **Executive summary** | Overall opinion, top findings, high-level risk posture |\n| 2 | **Background and scope** | Objectives, systems covered, period reviewed, standards referenced |\n| 3 | **Methodology** | Procedures, sampling, data sources from MUBSEP, and where applicable the VAPT approach |\n| 4 | **Detailed findings and recommendations** | Structured by the **nine areas** (a to i). Each finding: condition with evidence, criteria, cause, effect, recommendation with owner and timeline |\n| 5 | **Testing summaries** | For interest recomputation, tariff accuracy and excise duty, product eligibility, and access and segregation reviews: the basis of calculation and reconciliation outcomes |\n| 6 | **Availability, capacity, performance and DR/BCP observations** | With any identified gaps |\n| 7 | **Management action plan** | Consolidated agreed actions, owners and target dates |\n| 8 | **Appendices** | Referenced artefacts, workpapers, calculations, screenshots, evidence logs |\n\n**The nine areas (CW2):** (a) IT policy review; (b) password configuration compliance; (c) tariff application accuracy; (d) application controls for interest income recomputation; (e) product eligibility validation; (f) segregation of duties and access rights; (g) vulnerability assessment and penetration testing; (h) ICT capability and operations; (i) authentication, authorisation and accounting mechanisms.\n\n**Submission rules (CW2 brief), worth ticking off:**\n- Submit the **PDF report** and **one ZIP titled GroupName_WorkingPapers.zip** (test sheets, recomputation worksheets, screenshots, evidence logs) via MUBSEP.\n- The PDF must have a **cover page** with the group number and members, including student and registration numbers.\n- Report length: **not less than 15 pages and not more than 20**.\n- Check **Turnitin** before uploading; plagiarism must be **below 20%**.\n- Each member must complete the **self and peer evaluation** form.\n- After submission, each group gets a **scope area to present and defend** orally; each member must contribute and be ready to answer if chosen randomly.\n- Show all worksheets and justify choices.\n\n#### 8.8.2 What the executive summary looks like (supplementary)\n\nA one-to-two page summary that a busy director can read alone:\n\n1. **Overall opinion.** One sentence on the adequacy and effectiveness of the IT control environment (for example, \"needs significant improvement\").\n2. **Top findings.** The three to five most serious, each in one line with its risk.\n3. **High-level risk posture.** Which of confidentiality, integrity and availability are most exposed.\n4. **What must happen next.** The key actions and timeline.\n\n**Sample (invented) executive summary extract:**\n\n> \"Overall, the control environment over BBCBank's core systems requires significant improvement. Key issues: (1) password settings do not meet policy and administrators lack multi-factor authentication; (2) excise duty was not applied on 1,620 of 60,000 mobile transactions, a shortfall of UGX 486,000 in the sample period; (3) 12 leavers retain active accounts. Confidentiality and integrity carry the highest risk; availability arrangements are partly effective. Management has agreed 14 actions, the most urgent due within 30 days.\"\n\n#### 8.8.3 Ratings and opinions (supplementary)\n\nOrganizations use different scales, so state yours in the report.\n\n**A simple finding rating (illustrative):**\n\n| Rating | Meaning |\n|---|---|\n| **High** | Serious weakness with significant likelihood and impact; act immediately |\n| **Medium** | Weakness that needs timely correction |\n| **Low** | Minor improvement |\n\n**A simple overall opinion scale (illustrative):** *Satisfactory* (controls adequate and effective), *Needs improvement* (some weaknesses), *Unsatisfactory* (significant weaknesses, objectives at risk).\n\n#### 8.8.4 Writing clearly and concisely (supplementary)\n\n| Rule | Why |\n|---|---|\n| **One finding, one issue** | Easier to assign and track |\n| **Lead with the number** | \"12 of 480 (2.5%)\" beats \"some\" |\n| **Short sentences, active voice** | Clear and readable |\n| **Define a term once, then use it consistently** | Avoids confusion |\n| **Neutral, factual tone: criticise the control, not the person** | Keeps the report credible and fair |\n| **Reference evidence (WP numbers)** | The reader can verify |\n| **Use tables for summaries** | Dense information is easier to scan |\n| **Avoid padding and copied text** | Plagiarism limit; the report must be 15 to 20 pages |\n\n### 8.9 Communicating findings to different stakeholders\n\nThe same finding is told differently to different audiences.\n\n| Audience | What they need | Format and tone |\n|---|---|---|\n| **Board audit and risk committee** | The overall opinion, the biggest risks, trends and decisions needed | Executive summary, one page, no technical jargon |\n| **Senior management** | Findings that need resources or decisions; deadlines; ownership | Summary tables, priorities, business impact |\n| **IT managers and process owners** | Detail: exactly what, where, why and how to fix | Full finding, evidence references, technical detail |\n| **Regulators or external auditors (where relevant)** | Compliance status and remediation | Formal, factual, evidence-backed |\n| **Operational staff affected** | What changes for them | Practical, short |\n\n**Same finding, three versions (illustrative).**\n\n- *To the board:* \"Former staff can still log in to core banking, which creates a fraud and data theft risk. Management has agreed an automated fix within 60 days.\"\n- *To the CIO:* \"12 of 480 leavers (2.5%) retain active core banking accounts; two logged in post-exit. HR-to-IT notification is manual. Recommend automated deprovisioning and monthly reconciliation; owner Head of IT; 60 days.\"\n- *To the helpdesk team:* \"Disable accounts on the leaver's last day. You will receive a daily list from HR starting next month; confirm completion in the ticket.\"\n\n### 8.10 Presenting and defending the report (CW2 oral session)\n\n(From the CW2 brief: each group is assigned a scope area to present and defend; each member must contribute and answer if chosen randomly.)\n\n> **Supplementary explanation: how to prepare.**\n> - Know **your numbers**: population, sample, exceptions, rates, amounts, and where the working paper is.\n> - Be able to explain **why** you chose each procedure and each sampling decision (the brief says to \"justify your decision for choices taken\").\n> - Be ready for **\"what if\"** questions: \"What if the sample had been larger?\", \"What if management disagrees?\", \"What is the effect in money terms?\".\n> - Practise explaining a finding in **thirty seconds** using condition, criteria, cause, effect, recommendation.\n> - **Every member** should be able to explain the whole methodology, not just their own area.\n\n### 8.11 Text diagram: the reporting flow\n\n```\n TEST RESULT (exception)\n      |\n      v\n CONFIRM FACTS with process owner\n      |\n      v\n WRITE FINDING (condition, criteria, cause, effect, recommendation) + rating + WP reference\n      |\n      v\n MANAGEMENT RESPONSE (agree, action, owner, date)\n      |\n      v\n REPORT: executive summary -> findings -> testing summaries -> management action plan -> appendices\n      |\n      v\n COMMUNICATE to audience (board, management, IT, regulators)\n      |\n      v\n FOLLOW UP: were actions done? did they work?\n```\n\n### 8.12 Common misconceptions and exam traps\n\n| Trap | Truth |\n|---|---|\n| \"A finding is just a list of problems\" | A finding needs five elements: condition with evidence, criteria, cause, effect, recommendation with owner and timeline. |\n| \"Cause and effect are the same\" | Cause is **why** it happened; effect is **what it means** for the organization. |\n| \"The recommendation can be general\" | It must be specific, owned, time-bound and aimed at the cause. |\n| \"VA and PT are the same\" | VA finds and ranks weaknesses; PT tries to exploit them to show impact. |\n| \"Severity decides priority on its own\" | Priority combines severity with asset criticality and exposure. |\n| \"The executive summary is an introduction\" | It states the overall opinion, top findings and risk posture. |\n| \"The report is the end\" | Follow-up verifies that actions were implemented and effective. |\n| \"A longer report is a better report\" | CW2 requires 15 to 20 pages; clarity and evidence matter more than length. |\n| \"Everyone gets the same version of the findings\" | Tailor the detail and tone to the audience. |\n| \"Unauthorised testing is fine if it finds weaknesses\" | VAPT needs written authorisation and rules of engagement. |\n\n### 8.13 Checklist: reviewing a draft finding or report\n\n1. **Condition:** a fact, with numbers and an evidence reference?\n2. **Criteria:** the policy, standard or approved parameter is named?\n3. **Cause:** the root cause, not just a repeat of the condition?\n4. **Effect:** business or regulatory risk, ideally with money, time or customers?\n5. **Recommendation:** specific, owned, time-bound, aimed at the cause?\n6. **Rating** stated and consistent?\n7. **Does the executive summary match the findings?**\n8. **Can every number be traced to a working paper?**\n9. **Tone** neutral and professional? **Audience** right?\n10. **Length and formatting** within the brief (15 to 20 pages, cover page, Turnitin below 20%)?\n\n### 8.14 Revision summary (Topic 8)\n\n- Finding = condition (with evidence), criteria, cause, effect, recommendation (with owner and timeline).\n- Policy review gives the criteria; control testing gives the condition.\n- VA finds and ranks weaknesses; PT exploits them under written authority. VAPT steps: scope, tools and techniques, discovery, exploitation (PT), severity classification, business impact, prioritised remediation, retest.\n- Actionable recommendation: specific, addresses the cause, owned, time-bound, proportionate, measurable.\n- CW2 report: executive summary; background and scope; methodology; detailed findings by nine areas; testing summaries; availability/capacity/performance/DR-BCP observations; management action plan; appendices. PDF of 15 to 20 pages with cover page; working papers ZIP; plagiarism below 20%; oral defence.\n- Communicate to different stakeholders: tailor detail and tone (board, senior management, IT, regulators).\n- Follow up: monitor implementation and re-audit to verify effectiveness.\n\n\n---\n\n## PHASE 2 — COMPREHENSION CHECKS (Topic 8)\n\n**C1. Explain, in your own words, why a finding needs a cause and not just a condition and recommendation.**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nThe condition says what is wrong; the recommendation says what to do. Without the cause, the recommendation may fix only the symptom. For example, if 12 leavers have active accounts and the recommendation is simply \"disable them\", the same problem will reappear next month because the underlying cause (no automatic link between HR and IT) remains. Stating the cause lets management fix the root and lets the auditor check later that the right thing was fixed.\n\n**Check:** symptom vs root cause.\n<\/details>\n\n**C2. Why do audit reports separate \"criteria\" from \"condition\"?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nBecause a gap only exists relative to a benchmark. The condition is what you found; the criteria are what it should have been (policy, standard or approved parameter). Separating them shows the reader the benchmark and proves the finding is not just the auditor's opinion. If management disputes the finding, the argument is about whether the criteria apply, not about whether the auditor likes the result.\n\n**Check:** the finding is a comparison between two things.\n<\/details>\n\n**C3. What would happen if a report gave recommendations without owners and timelines?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nNobody would be accountable, and nobody would know when to act, so actions would drift and many would never be done. At follow-up, the auditor would have nothing specific to verify. The management action plan in the CW2 brief exists precisely to record agreed actions, owners and target dates.\n\n**Check:** accountability and verifiability.\n<\/details>\n\n**C4. How does a vulnerability assessment relate to a penetration test?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nA vulnerability assessment finds and ranks weaknesses, usually with scanning tools, giving breadth. A penetration test takes some of those weaknesses and attempts to exploit them under written authority, showing depth and real impact. They complement each other: the VA tells you what could be exploited; the PT shows what actually can be, and how far an attacker could go. Both end with a severity ranking and prioritised remediation.\n\n**Check:** find and rank vs exploit and demonstrate.\n<\/details>\n\n**C5. Why should the same finding be written differently for the board and for the IT manager?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nThey need different things. The board needs the risk, the overall opinion and any decision required, in plain language. The IT manager needs the exact detail (what, where, evidence, cause and fix) to act. Giving the board technical detail wastes their time and hides the message; giving the IT manager only a high-level summary leaves them unable to fix anything.\n\n**Check:** content and tone follow the audience's decision.\n<\/details>\n\n**C6. Give an original example of a weak finding and rewrite it using the five elements.**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\n*Weak:* \"Backups are not done properly.\"\n*Rewritten:*\n- *Condition:* the restore test log (WP D1) shows no restore of the core banking backup in the last 18 months; 2 of 10 sampled nightly backups failed without follow-up.\n- *Criteria:* the DR policy requires a restore test every quarter and daily failure follow-up.\n- *Cause:* no owner is assigned to backup monitoring.\n- *Effect:* in a failure, data may not be recoverable, risking prolonged outage and data loss.\n- *Recommendation:* assign an owner; run and document quarterly restore tests starting this quarter; report failures daily. Owner: Head of Infrastructure. 60 days.\n\n**Check:** numbers, benchmark, root cause, consequence, owned action.\n<\/details>\n\n**C7. Which part of this topic would confuse someone seeing it for the first time?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\n(1) Cause vs effect. (2) VA vs PT. (3) Severity vs priority. (4) Executive summary vs introduction. (5) The CW2 structure, since the nine areas, the testing summaries and the management action plan are different parts of the report.\n<\/details>\n\n---\n\n## PHASE 3 — ACTIVE RECALL BANK (Topic 8)\n\n### Level 1 — Basic recall\n\n**Q1.** List the five elements of a finding in the CW2 brief.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Condition supported by evidence; criteria from policy, standards or approved parameters; cause explaining the underlying reason; effect describing the business or regulatory risk; recommendation with responsible owner and realistic timeline.\n\n**Common mistake:** leaving out the owner or the timeline.\n<\/details>\n\n**Q2.** List the eight components the CW2 audit report must include.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Executive summary; background and scope; methodology; detailed findings and recommendations (by the nine areas); testing summaries; availability, capacity, performance and DR/BCP observations; management action plan; appendices.\n\n**Common mistake:** omitting the management action plan or the testing summaries.\n<\/details>\n\n**Q3.** Name the nine areas the CW2 audit must examine.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** (a) IT policy review; (b) password configuration compliance; (c) tariff application accuracy; (d) application controls for interest income recomputation; (e) product eligibility validation; (f) segregation of duties and access rights; (g) vulnerability assessment and penetration testing; (h) ICT capability and operations; (i) authentication, authorisation and accounting mechanisms.\n\n**Marking:** one mark each.\n\n**Common mistake:** replacing (i) with \"network security\".\n<\/details>\n\n**Q4.** State the CW2 submission requirements for the PDF and the ZIP.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** One PDF report (cover page with group number and members and their student and registration numbers; 15 to 20 pages; formal professional language; Turnitin plagiarism below 20%) and one ZIP titled GroupName_WorkingPapers.zip containing test sheets, recomputation worksheets, screenshots and evidence logs, both submitted via MUBSEP. Each member also submits the self and peer evaluation form.\n\n**Common mistake:** forgetting the self and peer evaluation.\n<\/details>\n\n**Q5.** Define vulnerability assessment and penetration test in one sentence each.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** A vulnerability assessment identifies and ranks weaknesses in systems, usually with scanning tools. A penetration test is an authorised simulated attack that tries to exploit weaknesses to show real impact.\n\n**Common mistake:** omitting \"authorised\".\n<\/details>\n\n### Level 2 — Understanding\n\n**Q6.** Distinguish cause from effect, with an example from an access control finding.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Cause is why the condition exists; effect is what it means for the business. In a leavers' access finding, the cause is that HR does not automatically notify IT when staff leave; the effect is the risk of unauthorised access, fraud and data theft using former staff credentials.\n\n**Marking:** two definitions (2), example (2).\n\n**Common mistake:** writing the effect as the cause (\"accounts remain active, so there is a risk\").\n<\/details>\n\n**Q7.** Explain why severity alone should not decide the order of remediation in a VAPT report.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** The importance of a weakness also depends on the asset's criticality and exposure. A high-severity flaw on an internal test machine may matter less than a high-severity flaw on an internet-facing core system, and a medium flaw on a critical system may outrank a high flaw on a low-value one. Prioritised remediation combines severity, business impact and exposure.\n\n**Common mistake:** ordering purely by the scanner's severity label.\n<\/details>\n\n**Q8.** What makes a recommendation actionable? Give four qualities and one example.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Specific; addresses the cause; owned; time-bound and realistic (also proportionate and measurable). Example: \"Set the Active Directory minimum password length to 8 characters within 30 days. Owner: Head of IT Security.\"\n\n**Common mistake:** writing \"management should consider improving\".\n<\/details>\n\n**Q9.** Describe what the executive summary of an audit report must contain and who it is for.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** It must give the overall opinion, the top findings and the high-level risk posture (and the key actions needed). It is for senior readers such as the board audit and risk committee, who may read nothing else, so it must stand alone in plain language.\n\n**Common mistake:** using it as a description of the audit procedures.\n<\/details>\n\n### Level 3 — Application\n\n**Q10.** (Calculation and writing) In testing tariff accuracy, you recomputed fees for 40,000 transactions. The approved fee is 1,500 plus excise duty of 15% of the fee. You find 800 transactions charged 1,500 only. Compute the correct charge, the exception rate and the shortfall, then write the condition and effect.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** *Correct charge:* excise duty = 15% × 1,500 = 225, so the total = 1,725. *Exception rate:* 800 ÷ 40,000 = 2.0%. *Shortfall:* 800 × 225 = 180,000. *Condition:* \"Recomputation of all 40,000 transactions showed 800 (2.0%) charged 1,500 instead of 1,725; excise duty of 225 was not applied. Shortfall: 180,000 (WP C1).\" *Effect:* under-collection of excise duty owed to the revenue authority, with risk of penalties and inconsistent customer charges.\n\n**Marking:** three computations (3), condition (1), effect (1), evidence reference (1).\n\n**Common mistake:** computing 15% of the total after adding it, or dividing the exceptions by something other than the population.\n<\/details>\n\n**Q11.** Rewrite this weak finding in the five-part format and add a rating: \"Password settings are weak and management does not care about security.\"\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer (example):**\n- *Condition:* AD allows a minimum length of 6 with no expiry; lockout after 10 attempts; MFA is not enabled for privileged accounts (WP B1).\n- *Criteria:* policy requires 8 characters, 90-day expiry, lockout after 5 attempts, MFA for privileged accounts.\n- *Cause:* defaults were never reconciled to the policy; no periodic configuration review.\n- *Effect:* increased risk of unauthorised access and fraud; weak compliance with the policy.\n- *Recommendation:* align settings within 30 days; enable MFA for privileged accounts within 60; quarterly configuration check. Owner: Head of IT Security.\n- *Rating:* High.\nThe unprofessional phrase \"management does not care\" is removed: criticise the control, not the people.\n\n**Marking:** five elements (5), rating (1), neutral tone (1).\n\n**Common mistake:** keeping blame language in a formal report.\n<\/details>\n\n**Q12.** A VA shows: (1) an unpatched server on the internet with a serious known flaw; (2) a default password on an internal printer; (3) a missing patch on an internal workstation used by one clerk; (4) weak encryption setting on the mobile banking gateway. Propose a priority order with reasons.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** (1) first: internet-facing and serious; (4) second: the mobile banking gateway handles customer transactions and weak encryption could expose data in transit; (3) third: single workstation, internal; (2) last: printer, internal and low impact (but still change the default). Give timelines such as 7, 14, 30 and 90 days.\n\n**Marking:** order (2), reasons referencing exposure and criticality (3), timelines (1).\n\n**Common mistake:** ranking only by \"who found it first\".\n<\/details>\n\n**Q13.** You must present the same finding on weak change management to (a) the board audit committee and (b) the IT operations manager. Write one or two sentences for each.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** (a) \"Changes to core banking systems are not consistently approved or tested, which creates a risk of outages and unauthorised changes. Management has committed to enforce approval in the change tool within 60 days.\" (b) \"7 of 25 sampled changes had no recorded CAB approval and 4 lacked test evidence. Enforce mandatory approval fields in the change tool, require attached test results before closure, and review emergency changes weekly. Owner: head of IT operations; 60 days.\"\n\n**Marking:** audience-appropriate tone and content for both (4).\n\n**Common mistake:** giving both audiences the technical version.\n<\/details>\n\n### Level 4 — Exam mastery\n\n**Q14.** Critically evaluate the claim: \"An audit report's value is in the number of findings it contains.\" (10 marks)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer outline:**\n1. *Position:* the claim is wrong; value lies in accuracy, significance and usefulness.\n2. *Why quantity misleads:* many trivial findings can hide the few that matter; padding reduces credibility; the notes' risk-based approach says to prioritise by exposure and likelihood.\n3. *What gives value:* accurate facts supported by evidence; clear criteria; root causes; effects tied to business risk; actionable recommendations with owners and dates; an executive summary that tells the reader what matters.\n4. *Where numbers do matter:* quantifying scope and results (for example, 12 of 480; 486,000 shortfall) makes a finding convincing; a long list of findings may be justified if the environment really is weak.\n5. *Follow-up:* value is realised only when actions are implemented and verified.\n6. *Conclusion:* a good report has the right findings, clearly written, ranked and actioned.\n\n**Marking criteria:** position (1), quantity problem (2), what gives value (3), nuance (2), conclusion (2).\n\n**Common mistake:** saying \"fewer findings is always better\".\n<\/details>\n\n**Q15.** Using the CW2 structure, outline an audit report for area (f) segregation of duties and access rights. Include the criteria you would use, the tests, the testing summary content, two findings in brief, and the management action plan entries. (14 marks)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer outline:**\n*Criteria:* the access control policy (joiner-mover-leaver timing, privileged access rules), the approved SoD conflict matrix, ISO/IEC 27001 access control good practice.\n*Tests:* (1) match HR leavers to active users (100% in Excel/IDEA); (2) sample joiners and movers: access request, approval, role fit; (3) compare the user-role matrix to the conflict matrix to find set-up and approve, or post and approve conflicts; (4) list privileged accounts and review ownership, justification and log review.\n*Testing summary:* basis of calculation (populations, sample sizes, comparison logic), reconciliation outcomes (counts matched, exceptions, rates) with reference to workpapers.\n*Findings:* (1) leavers' accounts active (12 of 480, 2.5%): cause no HR-IT link; effect fraud risk; recommendation automate within 60 days. (2) five users with conflicting rights (create supplier and approve payment): cause role design; effect fictitious supplier fraud; recommendation remove conflicting rights, add compensating review, owner head of IT/finance, 30 days.\n*Management action plan entries:* each action with owner, target date and status.\n*Executive summary mention:* these two findings in the top findings if rated High.\n\n**Marking criteria:** criteria (2), tests (4), testing summary (2), two findings with all five elements (4), action plan (2).\n\n**Common mistake:** describing procedures without explaining how the results were reconciled and referenced to workpapers.\n<\/details>\n\n\n---"};</script><script src="assets/app.js"></script><script src="assets/live.js"></script></html>
