<script src="assets/meta.js"></script><script src="assets/index.js"></script><script>window.PAGE={"id": "t1", "t": "TOPIC 1 — Introduction to Information Security", "s": "1 · Introduction to Information Security", "g": "Topics", "c": "#4f46e5", "k": "1", "f": "topic-1.html", "w": 5593, "md": "# TOPIC 1 — Introduction to Information Security\n\n**Classification:** Foundation, Core, Likely exam focus\n**Source:** Topic 1 deck (Dr. Mlay). CW1 tests this topic in Q27 to Q34, Q38, Q41 to Q45, Q48, Q49.\n**Outline items:** (a) CIA triad, (b) components of InfoSec, (c) controlling the IT environment, (d) Information Security Management System (ISMS), (e) steps for developing an ISMS.\n\n## PHASE 1 — UNDERSTANDING\n\n### 1.1 The big picture\n\n**Information security (InfoSec)** means protecting information from unauthorized access, use, disclosure, disruption, modification, or destruction. It covers digital data (a database) and physical data (a printed loan file in a cabinet).\n\nEvery other topic in this course answers one of four questions that start here:\n\n1. What are we protecting? (information assets)\n2. What can go wrong? (threats, Topic 2)\n3. What rules and controls stop or reduce it? (policy, Topic 3; domains, Topic 4; controls, Topic 7)\n4. How do we check it is working? (audit, Topics 6 to 9)\n\n**Where it connects.** Topic 1 gives you the vocabulary (CIA, authentication, ISMS). Topic 2 uses CIA to classify attacks. Topic 3 turns the ISMS \"Policy\" component into written rules. Topic 5 places the ISMS under governance. Topics 6 to 8 audit whether the ISMS controls work.\n\n### 1.2 Key terms\n\n| Term | Plain-English meaning | Notes' version |\n|---|---|---|\n| Information security | Keeping information safe from misuse, change, or loss | Protection from unauthorized access, use, disclosure, disruption, modification, destruction |\n| CIA triad | The three core goals: keep it secret, keep it correct, keep it reachable | Confidentiality, Integrity, Availability |\n| Confidentiality | Only the right people can see it | Sensitive information accessed only by authorized individuals |\n| Integrity | It is accurate and has not been changed improperly | Accuracy, completeness and reliability of data over its lifecycle |\n| Availability | Authorized people can use it when they need it | Information and resources accessible to authorized users when needed |\n| Authentication | Proving who you are | Verifying the identity of users or systems |\n| Authorization | What you are allowed to do once identified | Granting or denying permissions to access resources or perform actions |\n| Non-repudiation | You cannot later deny you did it | A party cannot deny the authenticity of their signature or the sending of a message |\n| Risk management | Finding, scoring and reducing risk | Identifying, assessing and mitigating risks to information assets |\n| Incident response | The plan for when something goes wrong | Preparing for and responding to breaches or attacks |\n| ISMS | A managed system of people, process and technology for security | A systematic approach to managing sensitive company information so it remains secure, applying a risk management process |\n| MFA | Two or more different proofs of identity | Multi-factor authentication |\n| RBAC / ACL | Permissions granted by job role / by a list attached to a resource | Role-based access control / access control lists |\n| Hash | A fixed-size fingerprint of data | Used for integrity (checksums, hash functions) |\n| Digital signature | A hash of a document signed with the sender's private key | Used for integrity and non-repudiation |\n| DLP | Software that stops sensitive data leaving | Data loss prevention |\n| IAM | Managing identities and what they can access | Identity and access management |\n| EDR | Continuous monitoring and response on laptops/servers | Endpoint detection and response |\n| IDS/IPS | Systems that detect / detect-and-block intrusions | Intrusion detection / prevention systems |\n| DRP | Plan to restore IT after a disaster | Disaster recovery plan |\n\n### 1.3 The CIA triad, step by step with one concrete case\n\n**Scenario (invented).** Mary uses a mobile banking app. Her account holds UGX 5,000,000.\n\n| Goal | What it means in Mary's case | A control from the notes | What a breach looks like |\n|---|---|---|---|\n| **Confidentiality** | Only Mary sees her balance and transactions | Encryption, access controls, authentication (password plus OTP), secure channels | An attacker reads her balance |\n| **Integrity** | The balance and transfer amounts cannot be changed without authority and trace | Hash functions, checksums, digital signatures, version control, audit trails | An attacker edits a transfer from 50,000 to 500,000, or changes her balance |\n| **Availability** | The app and her data work at 8 p.m. on payday | Redundant systems, backups, disaster recovery plans, firewalls and DDoS protection | A DDoS attack takes the app down, or ransomware encrypts the database |\n\n**Reading the table line by line:**\n\n- Line 1: the controls (encryption, MFA) stop strangers reading. If one fails, confidentiality is lost, even if nothing is changed or deleted.\n- Line 2: integrity is about *changes*. A stolen password that is used only to look is a confidentiality breach. The moment data is altered, integrity is breached too.\n- Line 3: availability is about *access*. If ransomware encrypts files and demands payment, nobody can use the data. This is mainly an availability breach (CW1 Q49), although the attacker also modified the files.\n\n### 1.4 The other components (pillars) of InfoSec\n\nBeyond CIA, your notes list these. Learn the definition and the technique for each.\n\n| # | Component | Definition (from the notes) | Techniques (from the notes) |\n|---|---|---|---|\n| 1 | Confidentiality | Only authorized individuals access sensitive information | Encryption, access controls, secure channels, authentication |\n| 2 | Integrity | Accuracy, completeness, reliability over the data lifecycle | Checksums, hash functions, digital signatures, version control, audit trails |\n| 3 | Availability | Accessible to authorized users when needed | Redundant systems, backups, DR plans, firewalls, DDoS protection |\n| 4 | Authentication | Verifying identity of users or systems | Passwords, biometrics, smart cards, MFA |\n| 5 | Authorization | Granting or denying permissions | RBAC, ACLs, policy enforcement |\n| 6 | Non-repudiation | Sender or signer cannot deny it | Digital signatures, cryptographic protocols, secure logging |\n| 7 | Risk management | Identify, assess, mitigate risks to assets | Risk assessments, threat modelling, controls, continuous monitoring |\n| 8 | Incident response | Prepare for and respond to breaches | IR plans, regular training, forensic analysis, post-incident reviews |\n| 9 | Security policies and procedures | Establish and enforce guidelines | Acceptable use, data classification, awareness training |\n| 10 | Compliance and legal requirements | Adhere to laws, regulations, standards | Compliance audits, legal assessments, GDPR, HIPAA, ISO/IEC 27001 |\n| 11 | Physical security | Protect infrastructure and hardware | Secure facilities, surveillance, badges and locks, fire suppression, climate control |\n| 12 | Network security | Protect CIA of data in transit | Firewalls, IDS/IPS, VPNs, secure network architecture |\n| 13 | Application security | Secure applications through their lifecycle | Secure coding, penetration testing, static code analysis, patching |\n| 14 | Data security | Protect data at rest, in transit, in use | Encryption, data masking, tokenization, secure storage |\n| 15 | User education and training | Raise awareness of good practice | Awareness programs, phishing simulations, regular training |\n\n> **Supplementary explanation: how to tell authentication, authorization and non-repudiation apart.** Walk through one login:\n> 1. Mary types her username. That is **identification** (the claim \"I am Mary\").\n> 2. She enters her password and an OTP. The system checks both. That is **authentication** (proof of the claim).\n> 3. She clicks \"Transfer\". The system checks her role: customers can move money out of their own account only. That is **authorization** (what Mary may do).\n> 4. The transfer is logged with her ID, time and a signed record. Later she cannot say \"I never made that transfer\". That is **non-repudiation**.\n> Authentication always comes before authorization. Authenticating proves *who*; authorizing decides *what*.\n\n### 1.5 How hashing differs from encryption (a frequent exam trap)\n\nThis is tested in CW1 Q29 and Q38.\n\n**Step by step, checking file integrity with a hash:**\n\n1. The sender runs the file through SHA-256. Output: a fixed-size string (256 bits, shown as 64 hex characters), e.g. `9f86d0...`.\n2. The sender sends the file and the string.\n3. The receiver runs the *received* file through SHA-256 and gets a string.\n4. The receiver compares the two strings. If they match, the file is unchanged. If they differ by even one character, the file was altered.\n\n**Why a hash is not encryption:**\n\n- A hash is **one-way**. You cannot reverse the string to get the file back.\n- The output is **always the same size** regardless of file size.\n- It proves **integrity**, not confidentiality. Anyone can still read the file.\n- Encryption is **two-way**: you can decrypt with the right key. It protects **confidentiality**.\n- A digital signature is *not* the same as a hash. It signs the hash with the sender's private key, which adds authenticity and non-repudiation (CW1 Q34: \"Integrity and Authenticity\").\n\n### 1.6 Controlling the IT environment\n\n**Purpose:** put practices, policies and technologies in place to manage and secure information systems, so IT is reliable, accurate and secure.\n\nThe notes list 14 areas. Here they are with one concrete example each:\n\n| # | Area | Key elements (notes) | Concrete example |\n|---|---|---|---|\n| 1 | Governance and policies | IT governance framework aligning IT with business objectives; roles and accountability; policies (acceptable use, data protection, incident response) | The board approves an acceptable use policy and names the CIO accountable for it |\n| 2 | Access control | IAM; RBAC; least privilege; strong authentication and clear authorization | A teller can post deposits but cannot approve loans |\n| 3 | Network security | Firewalls, IDS/IPS, VPN for remote access | Staff working from home connect through a VPN, not directly |\n| 4 | Endpoint security | Antivirus/antimalware kept updated; EDR | Every laptop runs EDR that flags unusual file encryption |\n| 5 | Data protection | Encrypt at rest and in transit; DLP | Customer files on laptops are encrypted; DLP blocks emailing the customer list to a personal address |\n| 6 | Backup and recovery | Regular backups; tested DRP | Nightly backup, with a restore test each quarter |\n| 7 | Monitoring and logging | Continuous monitoring; log collection, analysis, storage | Logs from servers and firewalls are collected so an investigator can reconstruct events |\n| 8 | Patch management | Regular updates; vulnerability assessments with prompt remediation | A critical server patch is applied within an agreed number of days |\n| 9 | Physical security | Secure facilities; hardware protection | Server room has a badge reader and CCTV |\n| 10 | User education and training | Awareness programs; policy enforcement through audits | Staff do phishing simulations; repeat clickers get extra training |\n| 11 | Incident response | IR plan with drills; forensic analysis | A tested plan says who isolates an infected laptop and who calls management |\n| 12 | Compliance and auditing | Compliance monitoring; regular internal and external audits | Annual audit checks controls against ISO/IEC 27001 |\n| 13 | Cloud security | Cloud governance; secure configuration and monitoring | Storage buckets are checked so none is public by mistake |\n| 14 | Change management | Formal change control (authorized, tested, documented); configuration management with an asset inventory | A server upgrade requires an approved change request and a rollback plan |\n\n### 1.7 The ISMS\n\n**Definition (notes).** An ISMS is a systematic approach to managing sensitive company information so that it remains secure. It covers **people, processes and IT systems** by applying a **risk management process**.\n\n**Key point for exams:** the ISMS is achieved primarily through a risk management process. It is not \"the latest firewall\" or \"a big security team\" (CW1 Q27).\n\n#### The 13 key components\n\n| # | Component | What it asks for |\n|---|---|---|\n| 1 | Policy | A security policy aligned with goals; a defined ISMS scope (boundaries and applicability) |\n| 2 | Risk assessment | Identify and assess risks; find likelihood and impact of threats |\n| 3 | Risk treatment | A risk treatment plan; controls to reduce identified risks |\n| 4 | Objectives and controls | Measurable, achievable objectives; controls (technical, organisational, procedural) to meet them |\n| 5 | Roles and responsibilities | Defined roles; top management support and commitment |\n| 6 | Asset management | Identify and classify information assets; protect by value and sensitivity |\n| 7 | Access control | Only authorized personnel reach sensitive information, using authentication and authorization |\n| 8 | Compliance and legal requirements | Meet laws, regulations, standards (GDPR, HIPAA, ISO/IEC 27001); review them regularly |\n| 9 | Incident management | A plan to detect, report and respond; post-incident reviews |\n| 10 | Business continuity management | BCP and DRP so critical systems stay available; test and update them |\n| 11 | Training and awareness | Regular sessions; everyone understands their role |\n| 12 | Monitoring and review | Monitor controls; run internal audits and reviews |\n| 13 | Continuous improvement | Use audit, incident and monitoring feedback to improve |\n\n#### The 9 steps to implement an ISMS (in order)\n\n| Step | Action | Detail from the notes |\n|---|---|---|\n| 1 | Initiate the ISMS project | Get management support; define project scope; make a plan; form a team |\n| 2 | Define ISMS scope and policy | Decide boundaries and applicability; write a policy reflecting objectives |\n| 3 | Perform a risk assessment | Identify assets; analyse threats, vulnerabilities and impacts to find risk levels |\n| 4 | Develop a risk treatment plan | Select controls; plan how to implement them |\n| 5 | Implement controls | Put the controls in place; document supporting procedures |\n| 6 | Establish ISMS documentation | Policies, procedures, records; accessible and kept current |\n| 7 | Conduct training and awareness | Train staff; raise awareness |\n| 8 | Monitor and review | Continuously monitor; run internal audits and management reviews |\n| 9 | Maintain and improve | Continual improvement based on audits, incidents and monitoring |\n\n**Why this order?** Each step needs the one before it. You cannot pick controls (step 4) until you know your risks (step 3). You cannot assess risks until you know what is in scope (step 2). You cannot do any of it without management support (step 1).\n\n#### Standards named in the notes\n\n| Standard | What it is |\n|---|---|\n| ISO/IEC 27001 | International standard for an ISMS: the framework for managing information security |\n| ISO/IEC 27002 | Code of practice for information security controls |\n| NIST SP 800-53 | A catalogue of security and privacy controls for federal information systems and organisations |\n\n#### Benefits of an ISMS (notes)\n\nEnhanced security, compliance, effective risk management, improved reputation (trust), business continuity.\n\n> **Supplementary explanation: PDCA and the ISMS.** CW1 Q42 tests the PDCA cycle (Plan-Do-Check-Act) as \"continuous improvement of the security management system\". The notes do not map PDCA onto the ISMS steps. One common mapping: **Plan** = steps 1 to 4 (scope, policy, risk assessment, treatment plan); **Do** = steps 5 to 7 (implement controls, document, train); **Check** = step 8 (monitor, audit, review); **Act** = step 9 (improve). Topic 3 covers PDCA in more detail.\n\n### 1.8 Worked example: setting up an ISMS for a small microfinance (invented)\n\n**Situation.** A microfinance with 40 staff, one head office and a rented server room, wants to implement an ISMS.\n\n**Step 1 (initiate).** The managing director agrees to sponsor it. A team of three is formed: the IT officer, the operations manager and the accountant.\n\n**Step 2 (scope and policy).** Scope: head office, the server room and the loan system. Branches are excluded for the first year. Policy statement: \"We protect customer and financial data from unauthorized access, loss and alteration.\"\n\n**Step 3 (risk assessment).** The team lists assets and scores each risk as Likelihood × Impact on a 1 to 3 scale (1 = low, 2 = medium, 3 = high).\n\n| Asset | Threat | Likelihood | Impact | Risk = L × I |\n|---|---|---|---|---|\n| Loan database | Ransomware | 2 | 3 | 6 |\n| Staff laptops | Theft | 3 | 2 | 6 |\n| Paper loan files | Fire | 1 | 3 | 3 |\n| Email | Phishing | 3 | 2 | 6 |\n\nReading it line by line: the loan database scores 2 × 3 = 6; the impact is high because everything stops without it. Laptop theft scores 3 × 2 = 6; likely but each laptop is replaceable, so medium impact. Fire scores 1 × 3 = 3: unlikely but severe.\n\n**Step 4 (risk treatment plan).** For each risk of 6, choose controls: offline backups plus EDR for ransomware; disk encryption for laptops; MFA plus phishing awareness for email.\n\n**Steps 5 to 9.** Controls are installed; procedures written down; staff trained; an internal audit after six months finds backups were never restore-tested; this is fixed and the plan updated.\n\n### 1.9 A text diagram: the ISMS loop\n\n```\n  [1 Get management support]\n            |\n            v\n  [2 Define scope + policy]\n            |\n            v\n  [3 Risk assessment] ---> [4 Risk treatment plan]\n                                     |\n                                     v\n                            [5 Implement controls]\n                                     |\n                                     v\n                  [6 Document] --> [7 Train staff]\n                                     |\n                                     v\n                           [8 Monitor + review]\n                                     |\n                                     v\n                       [9 Maintain + improve] --+\n                                                |\n        (findings feed back into step 3) <------+\n```\n\n### 1.10 Common misconceptions and exam traps\n\n| Trap | Truth |\n|---|---|\n| \"InfoSec is mainly technology\" | The ISMS covers people, processes and IT. Training, policy and management support are core components. |\n| \"The ISMS is a product we buy\" | It is a management system built around a risk management process. |\n| \"ISO 27001 and ISO 27002 are the same\" | 27001 is the ISMS framework. 27002 is the code of practice for controls. |\n| \"A hash encrypts data\" | A hash gives integrity only. It is one-way and fixed-size. |\n| \"A digital signature only proves integrity\" | It proves integrity and authenticity, and supports non-repudiation. |\n| \"Authentication and authorization are the same\" | Authentication is *who you are*. Authorization is *what you may do*. |\n| \"Ransomware attacks confidentiality\" | Its defining harm is availability (files locked until you pay). |\n| \"3 copies, 2 media, 1 offsite is about confidentiality\" | It is a backup rule: it protects availability (CW1 Q30). |\n| \"The ISMS goal is the latest firewall\" | The core mechanism is risk management (CW1 Q27). |\n\n### 1.11 Checklist to remember\n\nFor any security measure, ask four questions:\n\n1. **Which of C, I, A (and authentication/authorization/non-repudiation) does it protect?**\n2. **Which area of the IT environment is it in?** (access, network, endpoint, data, backup, physical, and so on)\n3. **Which ISMS step or component does it belong to?** (assessment, treatment, monitoring, and so on)\n4. **Who owns it, and how is it checked?**\n\nIf you can answer all four, you understand the control.\n\n### 1.12 Revision summary (Topic 1)\n\n- InfoSec protects information from unauthorized access, use, disclosure, disruption, modification and destruction.\n- CIA: confidentiality (encryption, access control), integrity (hashes, signatures, audit trails), availability (redundancy, backups, DR).\n- Also: authentication (passwords, biometrics, MFA), authorization (RBAC, ACLs), non-repudiation (digital signatures, logging).\n- 15 components: CIA plus authentication, authorization, non-repudiation, risk management, incident response, policies, compliance, physical, network, application, data security, user training.\n- Controlling the IT environment has 14 areas, ending with change management.\n- ISMS = people, processes and IT, run through a risk management process. 13 components. 9 implementation steps: initiate, scope and policy, risk assessment, treatment plan, implement controls, documentation, training, monitor and review, maintain and improve.\n- Standards: ISO/IEC 27001 (ISMS), ISO/IEC 27002 (controls), NIST SP 800-53 (control catalogue).\n\n---\n\n## PHASE 2 — COMPREHENSION CHECKS (Topic 1)\n\nAnswer each one in writing before opening the model answer.\n\n**C1. Explain the CIA triad in your own words, using an example that is not a bank.**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nConfidentiality means only the right people can see the information. Integrity means the information stays accurate and is changed only by those allowed to. Availability means the right people can use it when they need it.\n\n*Example (a hospital):* a patient record. Confidentiality: only the treating doctor and nurse can open it (access control). Integrity: nobody can quietly change a drug allergy entry; changes are logged (audit trail). Availability: the doctor can open it at 3 a.m. in an emergency (backups, redundant servers).\n\n**Check:** did you name all three, with a concrete control for each?\n<\/details>\n\n**C2. Why does authorization exist if the system has already authenticated the user?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nAuthentication only proves *who* the user is. It says nothing about what they should be allowed to do. If every authenticated user could do everything, a junior clerk could approve payments or open every customer file. Authorization limits each identity to what its role needs, which is the idea behind least privilege.\n\n**Check:** you should have said that authentication answers \"who?\" and authorization answers \"what may they do?\".\n<\/details>\n\n**C3. What would happen if the ISMS skipped the risk assessment step?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nThe organization would pick controls without knowing what it needs to protect or how serious each risk is. It might spend heavily on a firewall while the real risk is staff clicking phishing links, or leave the loan database unprotected because nobody ranked it as critical. The risk treatment plan (step 4) depends on the risk assessment (step 3). That is why the ISMS is described as applying a risk management process.\n\n**Check:** did you link the missing step to a wrong or wasted control choice?\n<\/details>\n\n**C4. Why is a hash value not the same as an encrypted file?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nA hash is a fixed-size fingerprint made by a one-way function. You cannot get the original file back from it. It is used to detect changes (integrity). Encryption transforms the data so only someone with the key can read it, and it can be reversed with that key. Encryption protects confidentiality.\n\n**Check:** one-way vs reversible, and integrity vs confidentiality.\n<\/details>\n\n**C5. How does \"Controlling the IT environment\" relate to the ISMS?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nControlling the IT environment is the list of practical measures (access control, network security, backups, patching, training, change management, and so on). The ISMS is the management system that decides which measures are needed (through risk assessment), puts them in place, monitors them and improves them. Put simply: the controls are the \"what we do\", and the ISMS is the \"how we manage that it is the right set and that it keeps working\".\n\n**Check:** controls are the content; the ISMS is the management cycle around them.\n<\/details>\n\n**C6. Give an original example showing a breach of integrity but not confidentiality.**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nA payroll clerk with edit rights changes his own salary from 1,200,000 to 2,200,000 in the payroll system. Nobody outside the authorized staff saw anything secret, but the data is now inaccurate and the change was not authorized. Integrity is breached, and confidentiality is not.\n\n**Check:** the data is changed improperly without anyone unauthorized reading it.\n<\/details>\n\n**C7. Which part of this topic would confuse someone seeing it for the first time?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nThe usual sticking points: (1) the notes list the \"components\" as 15 items that mix goals (CIA), security functions (authentication) and management items (policy, compliance); newcomers expect only technical items. (2) Authentication vs authorization. (3) The ISMS is a process, not a tool. (4) Hash vs encryption vs digital signature. Use the Section 1.10 table to clear all four.\n<\/details>\n\n---\n\n## PHASE 3 — ACTIVE RECALL BANK (Topic 1)\n\n### Level 1 — Basic recall\n\n**Q1.** State the three components of the CIA triad and give one technique for each, using your notes' terms.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Confidentiality: only authorized individuals access sensitive information (encryption, access controls, secure channels, authentication). Integrity: accuracy, completeness and reliability of data over its lifecycle (checksums, hash functions, digital signatures, version control, audit trails). Availability: information accessible to authorized users when needed (redundant systems, backups, DR plans, firewalls, DDoS protection).\n\n**Key points / marking criteria:** 3 correct names (1 mark), 3 correct definitions (3), 3 correct techniques (3).\n\n**Common mistake:** writing \"availability means no downtime\". The goal is access *for authorized users when needed*, and backups and DR are part of it, not only uptime.\n<\/details>\n\n**Q2.** List the nine ISMS implementation steps in order.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** 1 Initiate the ISMS project. 2 Define ISMS scope and policy. 3 Perform a risk assessment. 4 Develop a risk treatment plan. 5 Implement controls. 6 Establish ISMS documentation. 7 Conduct training and awareness. 8 Monitor and review. 9 Maintain and improve.\n\n**Key points:** correct order matters; the assessment comes before treatment and controls; monitoring comes after implementation.\n\n**Common mistake:** putting \"Implement controls\" before the risk assessment, or dropping documentation and training.\n<\/details>\n\n**Q3.** What are ISO/IEC 27001, ISO/IEC 27002 and NIST SP 800-53?\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** ISO/IEC 27001 is the international standard for an ISMS (the framework). ISO/IEC 27002 is a code of practice for information security controls. NIST SP 800-53 provides a catalogue of security and privacy controls for federal information systems and organisations.\n\n**Key points:** ISMS framework vs controls code vs control catalogue.\n\n**Common mistake:** swapping 27001 and 27002.\n<\/details>\n\n**Q4.** Define non-repudiation and name two techniques that provide it.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Non-repudiation ensures a party in a communication cannot deny the authenticity of their signature on a document or the sending of a message. Techniques: digital signatures, cryptographic protocols, secure logging.\n\n**Key points:** \"cannot deny\" + two named techniques.\n\n**Common mistake:** confusing it with authentication. Authentication proves identity at the time; non-repudiation stops later denial.\n<\/details>\n\n**Q5.** Match each technique to the pillar it mainly supports: (a) checksums (b) redundant systems (c) RBAC (d) encryption (e) phishing simulations.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** (a) Integrity. (b) Availability. (c) Authorization (and confidentiality through limiting access). (d) Confidentiality. (e) User education and training.\n\n**Common mistake:** putting RBAC under authentication. RBAC decides what a verified user can do, which is authorization.\n<\/details>\n\n### Level 2 — Understanding\n\n**Q6.** Distinguish authentication from authorization, with one example of each in the same login.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Authentication verifies who the user is (password plus OTP). Authorization decides what that verified user may do (a customer can view and transfer from their own account but not see others'). Authentication comes first; authorization uses its result.\n\n**Marking points:** two correct definitions (2), a shared example showing the sequence (2), link between them (1).\n\n**Common mistake:** treating them as one step called \"login\".\n<\/details>\n\n**Q7.** Explain why a hash proves integrity but not confidentiality. (CW1 Q29 and Q38 style)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** A hash is a fixed-size string produced by a one-way function. If the receiver recomputes the hash of the received file and it matches, the file is unchanged, which shows integrity. But the file itself is not scrambled, so anyone can read it. The hash cannot be reversed to recover the data, so it is not encryption.\n\n**Marking points:** fixed-size/one-way (1), recalculate and compare (2), no secrecy (1), contrast with encryption (1).\n\n**Common mistake:** saying \"hashing is a type of encryption\".\n<\/details>\n\n**Q8.** Why does an ISMS begin with a risk assessment rather than buying the latest security tools?\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Controls should match risks. A risk assessment finds assets, threats, vulnerabilities and impacts, so the organization knows what to protect first and how much to spend. Buying tools first risks wasted money and gaps. The notes describe the ISMS as protecting information through effective risk management.\n\n**Marking points:** link controls to risk (2), prioritisation (1), waste/gap (1), reference to risk management process (1).\n\n**Common mistake:** answering \"to be compliant\". Compliance is a component, but the reason here is choosing the right controls.\n<\/details>\n\n**Q9.** Classify each incident by the CIA goal mainly breached: (a) ransomware locks all files and demands payment; (b) an employee emails a client list to the wrong person; (c) a clerk changes a supplier's bank account number without approval.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** (a) Availability (data is inaccessible). (b) Confidentiality (unauthorized disclosure). (c) Integrity (unauthorized change). Note (a) also modifies files, but the defining harm is lost access.\n\n**Common mistake:** classifying ransomware as confidentiality because it is \"an attack on data\".\n<\/details>\n\n### Level 3 — Application\n\n**Q10.** A laptop containing unencrypted customer files is stolen from a car. The IT officer says backups exist, but a restore has never been tried. Patches on the finance server are six months behind. Name the failed areas of \"controlling the IT environment\" and which CIA goals are at risk.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:**\n- Stolen unencrypted laptop: **Data protection** (no encryption at rest) and **endpoint/physical security** (hardware protection). Goal at risk: **confidentiality**.\n- Backups never restore-tested: **Backup and recovery** (the notes call for a tested DRP). Goal at risk: **availability**.\n- Patches six months behind: **Patch management** and **vulnerability management**. Goals at risk: all three, since an exploited flaw can expose, alter or disable data.\n\n**Marking points:** three failed areas correctly named (3), correct CIA link for each (3).\n\n**Common mistake:** saying \"backups exist so availability is fine\". Untested backups are not a proven control.\n<\/details>\n\n**Q11.** Three risks were scored by likelihood (L) and impact (I) on a 1 to 3 scale. Compute Risk = L × I and rank: (A) phishing L3, I2; (B) server-room fire L1, I3; (C) ransomware L2, I3.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:**\n- A: 3 × 2 = 6\n- B: 1 × 3 = 3\n- C: 2 × 3 = 6\n\nRanking: A and C tie at 6 (highest), then B at 3. For the tie, treat C first if the question says impact outweighs likelihood. Otherwise show both at 6 and say the tie needs a judgement rule.\n\n**Marking points:** three correct products (3), correct ranking (1), noted tie handling (1).\n\n**Common mistake:** adding L + I instead of multiplying.\n\n> **Supplementary explanation.** Whether 6 is \"High\" or \"Medium\" depends on the organization's own risk matrix. On a 3 × 3 matrix, 6 is usually High and 9 is Critical. CW1 Q25 (High 3 × Medium 2) expects \"High\".\n<\/details>\n\n**Q12.** A 40-person microfinance wants an ISMS. Put these in order and justify the order: train staff, write the security policy, list and classify assets, install controls, get the managing director's support, perform a risk assessment.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** (1) Get management support, because without it there is no budget or authority. (2) Write the policy and define scope. (3) List and classify assets, as the base for the assessment. (4) Perform the risk assessment. (5) Install controls from the treatment plan. (6) Train staff on the new policy and controls.\n\n**Marking points:** correct order of at least the key sequence (3), a reason for each placement (3).\n\n**Common mistake:** installing controls first.\n<\/details>\n\n### Level 4 — Exam mastery\n\n**Q13.** \"A company with a top-of-the-range firewall does not need an ISMS.\" Evaluate this statement. (10 marks)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer outline:**\n1. *Position:* the statement is wrong.\n2. *What a firewall covers:* network security only, for traffic crossing the boundary. It does not address insiders, lost laptops, phishing, weak passwords, untested backups or poor policies.\n3. *What the ISMS adds:* people, processes and IT together; risk assessment and treatment so controls match risks; policy, roles, awareness training, incident management, business continuity, monitoring and continual improvement.\n4. *Link to CIA:* a firewall helps confidentiality and availability at the network edge. It does little for integrity of internal changes or for physical theft.\n5. *Link to the notes:* the core purpose of the ISMS is risk management, not any single product (CW1 Q27).\n6. *Counterpoint to acknowledge:* the firewall is still a valid control. The ISMS decides where it sits among others.\n7. *Conclusion.*\n\n**Marking criteria:** clear position (1), firewall scope (2), ISMS components (3), risk management link (2), balanced counterpoint (1), conclusion (1).\n\n**Common mistake:** attacking firewalls instead of explaining what a management system adds.\n<\/details>\n\n**Q14.** Using the microfinance scenario in Section 1.8, propose three measurable security objectives (an ISMS component), name the control that supports each, and say how each would be monitored.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer (example):**\n1. *Objective:* \"Restore the loan system within 4 hours.\" Control: offline backups plus a tested DRP. Monitoring: a restore test each quarter, with timings recorded.\n2. *Objective:* \"100% of laptops encrypted by month 3.\" Control: disk encryption policy enforced through endpoint tools. Monitoring: monthly inventory check against the asset list.\n3. *Objective:* \"Phishing click rate below 5% within 6 months.\" Control: awareness training and phishing simulations. Monitoring: simulation results each quarter.\n\n**Marking criteria:** each objective measurable and achievable (3), matched controls (3), monitoring method (3), link to monitoring and review step (1).\n\n**Common mistake:** vague objectives (\"improve security\") with no measure.\n<\/details>\n\n\n---"};</script><script src="assets/app.js"></script><script src="assets/live.js"></script></html>
