<script src="assets/meta.js"></script><script src="assets/index.js"></script><script>window.PAGE={"id": "p4", "t": "PHASE 4 — MIXED REVISION AND SPACED PRACTICE", "s": "Phase 4 · Mixed tests and plan", "g": "Practice", "c": "#db2777", "k": "P4", "f": "phase-4-tests.html", "w": 9753, "md": "# PHASE 4 — MIXED REVISION AND SPACED PRACTICE\n\nThis phase mixes topics on purpose. In the exam, questions do not arrive grouped by topic, so the real skill is recognising **which topic and which concept** a question is testing. Do these **without notes**, write each answer, then reveal.\n\n**Contents of Phase 4**\n1. 30-question mixed quiz (this section)\n2. 50-question cumulative exam-style test\n3. Final test on the hardest topics\n4. Spaced-repetition plan\n\n---\n\n## 4.1 THE 30-QUESTION MIXED QUIZ\n\n**Instructions:** short answers. Time: about 45 minutes. Total 60 marks (2 marks each unless shown). Topic tags are hidden in the questions on purpose; the answer shows the topic so you can log errors against it (Phase 5).\n\n**Q1.** A hospital clerk who is not authorised changes a patient's allergy record. Which goal of the CIA triad is breached, and why?\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Answer:** Integrity: data was changed by an unauthorised person, so it can no longer be trusted as accurate. *(Topic 1)*\n**Marking:** goal (1), reason (1).\n**Common mistake:** answering confidentiality because \"a record was touched\".\n<\/details>\n\n**Q2.** Which type of malware spreads across a network by itself and does not need to attach to a host file?\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Answer:** A worm. A virus needs a host file to run; a trojan disguises itself as useful software. *(Topic 2)*\n**Marking:** worm (1), contrast (1).\n<\/details>\n\n**Q3.** Three risks are scored on a 1 to 3 scale for likelihood (L) and impact (I): A (L2, I3), B (L3, I2), C (L1, I3). Compute each risk and say which rank highest.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Answer:** A = 2 × 3 = 6; B = 3 × 2 = 6; C = 1 × 3 = 3. A and B tie as highest; C is lowest. *(Topic 2)*\n**Marking:** three scores (1.5), ranking (0.5).\n**Common mistake:** adding instead of multiplying.\n<\/details>\n\n**Q4.** Name the three types of information security policy and classify this statement: \"Staff may not use personal USB drives on company computers.\"\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Answer:** EISP (enterprise), ISSP (issue-specific), SysSP (system-specific). The statement is an ISSP, since it governs the use of one technology or issue. *(Topic 3)*\n**Marking:** three types (1), classification with reason (1).\n<\/details>\n\n**Q5.** State the five core functions of the NIST Cybersecurity Framework, in order.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Answer:** Identify, Protect, Detect, Respond, Recover. *(Topic 3)*\n**Marking:** all five in order (2); 1 mark if the order is wrong.\n<\/details>\n\n**Q6.** In which access control model does the owner of an object decide who may access it?\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Answer:** Discretionary access control (DAC). In MAC and RBAC the system decides, using labels or roles. *(Topic 4)*\n**Marking:** DAC (1), contrast (1).\n<\/details>\n\n**Q7.** Explain in two or three sentences how a SYN flood denies service.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Answer:** The attacker sends many SYN requests (often with forged addresses) and never sends the final ACK of the three-way handshake. The server keeps each half-open connection in a limited waiting list until the list is full, so legitimate requests are dropped. It attacks availability. *(Topic 4)*\n**Marking:** handshake (0.5), never completes (0.5), list fills and legitimate users blocked (1).\n<\/details>\n\n**Q8.** Which firewall type tracks the state of connections and drops packets that do not fit the expected state?\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Answer:** Stateful inspection firewall (it keeps a state table; a plain packet filter does not). *(Topic 4)*\n**Marking:** correct type (1), state table (1).\n<\/details>\n\n**Q9.** In an intrusion detection system, what is a false negative?\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Answer:** The IDS raises no alert, but the traffic is actually an attack. It is the dangerous kind of error because the attack goes unnoticed. *(Topic 4)*\n**Marking:** definition (1.5), danger (0.5).\n**Common mistake:** swapping it with false positive.\n<\/details>\n\n**Q10.** List the five domains of IT governance given by the IT Governance Institute of ISACA.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Answer:** Strategic alignment, value delivery, risk management, resource management, performance management. *(Topic 5)*\n**Marking:** 0.4 each.\n<\/details>\n\n**Q11.** List the five stages of change management in order.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Answer:** Request submission; assessment and approval; planning and scheduling; implementation (with testing and validation); review and closure. *(Topic 5)*\n**Marking:** 0.4 each, order matters.\n<\/details>\n\n**Q12.** Distinguish exposure from likelihood in the language of IS audit.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Answer:** Exposure is the extent of loss the entity is likely to face if a risk materialises; likelihood is the estimated probability that a threat will attempt to exploit a vulnerability and succeed. One is \"how bad\", the other \"how probable\". *(Topic 6)*\n**Marking:** each definition (1).\n<\/details>\n\n**Q13.** Which category of IS audit review examines the input, processing and output controls of a specific application?\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Answer:** Application controls review (the others being general controls review and system development review). *(Topic 6)*\n**Marking:** correct category (2).\n<\/details>\n\n**Q14.** Using one supplier invoice as your example, distinguish completeness, accuracy and validity controls.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Answer:** Completeness: the invoice is input once and only once (sequence, count, duplicate checks). Accuracy: it is recorded with the correct amount and period (edit checks, check digits, batch totals). Validity: the invoice is real and approved (matching to a purchase order and goods received note). *(Topic 7)*\n**Marking:** three definitions with the example (2).\n<\/details>\n\n**Q15.** Classify as preventive, detective, corrective, directive or recovery: \"a weekly report listing payments with no matching purchase order\".\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Answer:** Detective: it detects and reports exceptions after they occur. *(Topic 7)*\n**Marking:** category (1), reason (1).\n<\/details>\n\n**Q16.** Name the five objective-based control categories given in the Topic 7 notes.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Answer:** Preventive, detective, corrective, directive, recovery. *(Topic 7)*\n**Marking:** 0.4 each.\n**Common mistake:** listing only three.\n<\/details>\n\n**Q17.** List the five elements of an audit finding in the CW2 format.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Answer:** Condition (with evidence); criteria; cause; effect; recommendation (with owner and timeline). *(Topic 8)*\n**Marking:** 0.4 each.\n<\/details>\n\n**Q18.** State the difference between a vulnerability assessment and a penetration test in one line each.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Answer:** A vulnerability assessment identifies and ranks weaknesses (broad, often automated); a penetration test is an authorised simulated attack that tries to exploit weaknesses to show real impact (deep). *(Topic 8)*\n**Marking:** one mark each.\n<\/details>\n\n**Q19.** According to CW1, what provision does the Uganda Data Protection and Privacy Act, 2019 emphasise before personal data is collected?\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Answer:** Explicit consent of the data subject. *(Topic 9)*\n**Marking:** consent (2).\n<\/details>\n\n**Q20.** Why must a penetration tester have written authorisation before starting?\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Answer:** Without authority, accessing systems is unauthorised access, which is unlawful and may disrupt services. Written authorisation sets the scope, timing and methods and protects both tester and client. *(Topic 9)*\n**Marking:** legality (1), scope or protection (1).\n<\/details>\n\n**Q21.** Which Excel function would you use to find each leaver's account status in a user list?\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Answer:** `XLOOKUP` (or `VLOOKUP` with exact match, or `COUNTIF` to test for presence). *(Practical Lab)*\n**Marking:** a valid lookup function (1), mention of exact match or key field (1).\n<\/details>\n\n**Q22.** Recompute interest for a balance of 4,000,000 at 9% per year for 30 days (days ÷ 365, round to the nearest shilling).\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Answer:** 4,000,000 × 9% = 360,000; × 30 ÷ 365 = 29,589.04 → **29,589**. *(Practical Lab)*\n**Marking:** method (1), result (1).\n<\/details>\n\n**Q23.** Cheque numbers sorted: 301, 302, 305. Write the gap formula for the third row and say what it shows.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Answer:** `=A4-A3-1` = 305 − 302 − 1 = **2**, meaning two cheque numbers (303 and 304) are missing. *(Practical Lab)*\n**Marking:** formula (1), meaning (1).\n<\/details>\n\n**Q24.** In one sentence, why is a hash not encryption?\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Answer:** A hash is a one-way, fixed-size fingerprint used to check integrity and cannot be reversed to recover the data, whereas encryption is reversible with a key and protects confidentiality. *(Topic 1)*\n**Marking:** one-way (1), purpose (1).\n<\/details>\n\n**Q25.** What is a phishing attack aimed at a company's CEO or CFO called?\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Answer:** Whaling. Spear phishing targets a specific person or group; whaling targets top management. *(Topic 2)*\n**Marking:** whaling (2).\n<\/details>\n\n**Q26.** At which OSI layer does a basic packet filtering firewall work, and what does it decide on?\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Answer:** The network layer; it decides on source and destination IP addresses, protocol, ports and the interface. *(Topic 4)*\n**Marking:** layer (1), fields (1).\n<\/details>\n\n**Q27.** Why do auditors usually test general controls before application controls?\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Answer:** Application controls depend on general controls. If general controls are weak (for example, uncontrolled program changes), application controls can be circumvented or modified, so they cannot be relied on. *(Topic 7)*\n**Marking:** dependence (1), consequence (1).\n<\/details>\n\n**Q28.** An auditor tests 50 access approvals and finds 4 exceptions; the tolerable deviation rate is 5%. Compute the deviation rate and state the conclusion.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Answer:** 4 ÷ 50 = 8%. Since 8% exceeds 5%, the control is not operating effectively. *(Topic 6 and Practical Lab)*\n**Marking:** rate (1), conclusion (1).\n<\/details>\n\n**Q29.** What is the difference between ISO/IEC 27001 and ISO/IEC 27002?\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Answer:** ISO/IEC 27001 is the ISMS standard against which organizations are certified; ISO/IEC 27002 is the code of practice with guidelines for security controls (derived from ISO/IEC 17799, originally BS 7799). *(Topics 1 and 3)*\n**Marking:** each role (1).\n<\/details>\n\n**Q30.** Why is \"Management should improve access control\" a weak audit recommendation? Rewrite it.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Answer:** It is vague, has no owner or deadline, and does not address the cause. Better: \"Automate leaver notification from HR to IT and reconcile leavers to active users monthly. Owner: Head of IT. Within 60 days.\" *(Topic 8)*\n**Marking:** weaknesses (1), rewrite with owner, timeline and specific action (1).\n<\/details>\n\n### Scoring the 30-question quiz\n\n| Score out of 60 | What it means | What to do |\n|---|---|---|\n| 54 to 60 | Strong | Move to the 50-question test |\n| 42 to 53 | Good, with gaps | Log every error (Phase 5) and re-study the sections in Phase 1 |\n| 30 to 41 | Needs repair | Re-read the Phase 1 sections for the wrong topics, redo comprehension checks, retest in 2 days |\n| Below 30 | Not ready | Return to Phase 1 for the weakest three topics and repeat Phase 2 before attempting more tests |\n\n\n---\n\n## 4.2 THE 50-QUESTION CUMULATIVE EXAM-STYLE TEST\n\n**Structure:** Section A: 30 multiple-choice questions (30 marks). Section B: 12 short-answer questions (36 marks). Section C: 8 structured scenario questions (48 marks). **Total: 114 marks. Suggested time: 3 hours.**\n**Rules:** no notes. Write answers on paper (or in a document) before you reveal. The questions are mixed across all topics and the Practical Lab. Use your Phase 5 error log afterwards.\n\n### SECTION A — Multiple choice (30 marks, 1 mark each)\n\n**1.** An organization encrypts laptops, restricts file shares by role, and uses TLS on its website. These controls mainly protect:\nA. Availability  B. Confidentiality  C. Non-repudiation  D. Accountability only\n\n**2.** When implementing an ISMS, which step comes immediately after performing a risk assessment?\nA. Define the scope  B. Develop a risk treatment plan  C. Train staff  D. Monitor and review\n\n**3.** A person who signed a digital contract cannot later deny having signed it. This property is:\nA. Authentication  B. Authorization  C. Non-repudiation  D. Availability\n\n**4.** An employee receives an SMS saying their mobile money account is locked, with a link to \"unlock\" it. This attack is called:\nA. Vishing  B. Smishing  C. Whaling  D. Pharming\n\n**5.** Infected USB drives labelled \"Staff Salaries\" are left in a car park for employees to find. This is:\nA. Tailgating  B. Baiting  C. Pretexting  D. Quid pro quo\n\n**6.** Malicious code that stays dormant until a particular date and then deletes files is a:\nA. Worm  B. Trojan horse  C. Logic bomb  D. Spyware\n\n**7.** The best technical control against a man-in-the-middle attack on public Wi-Fi is:\nA. Antivirus software  B. A VPN or HTTPS encryption  C. Disabling macros  D. A longer username\n\n**8.** An attacker exploits a flaw for which the vendor has not yet released a patch. This is a:\nA. Advanced persistent threat  B. Zero-day exploit  C. Brute force attack  D. Insider threat\n\n**9.** Which document sets out how employees may use email and the internet?\nA. Enterprise information security policy  B. Acceptable use policy  C. A firewall rule set  D. A business continuity plan\n\n**10.** In the NIST Cybersecurity Framework, which tier describes an organization with formally established risk management, implemented documented policy and a repeatable programme?\nA. Partial  B. Risk Informed  C. Repeatable  D. Adaptive\n\n**11.** The PDCA cycle in an ISMS is mainly used for:\nA. A one-time software installation  B. Continuous improvement  C. Calculating return on investment  D. Employee background checks\n\n**12.** Which access control model assigns permissions to job roles, so that a promotion is handled as a role change?\nA. DAC  B. MAC  C. RBAC  D. Capability lists only\n\n**13.** Forged ARP replies cause victims to send traffic meant for the gateway to the attacker. This attack is:\nA. SYN flood  B. ARP poisoning  C. DNS poisoning  D. Smurf attack\n\n**14.** Which firewall type inspects content and payload through a proxy agent and can require user authentication?\nA. Packet filtering  B. Circuit-level proxy  C. Application-level proxy  D. Stateful inspection\n\n**15.** An IDS raises an alert for a legitimate nightly backup job. This event is a:\nA. True positive  B. False positive  C. False negative  D. True negative\n\n**16.** The objective of ISO 27001 Annex A.11 is to:\nA. Secure software development  B. Prevent unauthorised physical access, damage and interference  C. Manage supplier relationships  D. Encrypt data in transit\n\n**17.** Which IT governance principle ensures that IT investments directly contribute to business objectives?\nA. Resource management  B. Strategic alignment  C. Transparency  D. Stakeholder engagement\n\n**18.** In configuration control, a baseline is:\nA. A backup copy of data  B. An approved reference configuration used to track changes  C. The change approval form  D. A performance indicator\n\n**19.** In change management, the post-implementation review takes place in which stage?\nA. Request submission  B. Assessment and approval  C. Implementation  D. Review and closure\n\n**20.** Which term asks \"is the system achieving its objectives?\"\nA. Efficiency  B. Effectiveness  C. Exposure  D. Likelihood\n\n**21.** An auditor compares inputs with outputs without testing the processing logic. This is auditing:\nA. Through the computer  B. Around the computer  C. With the computer  D. A system development review\n\n**22.** An IS auditor decides which controls to test first mainly according to:\nA. Ease of testing  B. Exposure and likelihood of failure  C. Order in the policy  D. Cost of testing\n\n**23.** A control that restores a system from backup after a disaster is:\nA. Directive  B. Detective  C. Recovery  D. Preventive\n\n**24.** Which application control objective ensures that recorded transactions are real and properly approved?\nA. Completeness  B. Accuracy  C. Validity  D. Confidentiality\n\n**25.** A batch of invoices is expected to total 1,000,000 but the system shows 630,000 after input. This control mainly supports:\nA. Confidentiality  B. Completeness and accuracy  C. Availability  D. Authorization only\n\n**26.** A programmer who can also deploy changes to the production system violates:\nA. Dual control  B. Segregation of duties  C. Sequential numbering  D. Cancellation of documents\n\n**27.** In the five-part audit finding, the \"cause\" is:\nA. What the auditor found  B. Why the condition exists  C. The benchmark used  D. The business risk\n\n**28.** Management asks the auditor to remove a valid, material finding from the report. The ethical response is to:\nA. Remove it  B. Re-check, keep it, record management's response and escalate if pressured  C. Quietly lower its rating  D. Delete the working papers\n\n**29.** In Excel, for `VLOOKUP` with approximate match to return the right fee band, the tariff table must be:\nA. Unsorted  B. Sorted ascending by lower bound  C. On the same sheet only  D. Converted to text\n\n**30.** A savings account with balance 2,000,000 at 12% for a 31-day month was credited 19,726 but recomputes to 20,384. The most likely cause is:\nA. A wrong interest rate  B. The system used 30 days for a 31-day month  C. Rounding  D. A duplicate posting\n\n<details>\n<summary>Reveal the answer key and explanations (Section A)<\/summary>\n\n| Q | Ans | Topic | Why |\n|---|---|---|---|\n| 1 | B | 1 | Encryption, role-based access and TLS keep information from unauthorised readers: confidentiality. |\n| 2 | B | 1 | After the risk assessment (step 3) comes the risk treatment plan (step 4). |\n| 3 | C | 1 | Non-repudiation: the signer cannot later deny signing. |\n| 4 | B | 2 | SMS-based phishing is smishing (vishing is voice; whaling targets executives; pharming redirects to fake sites). |\n| 5 | B | 2 | Baiting lures victims with something tempting; tailgating is following someone through a door. |\n| 6 | C | 2 | A logic bomb activates only when a condition (such as a date) is met. |\n| 7 | B | 2 | Encryption (VPN or HTTPS) makes intercepted traffic unreadable; the other options do not address interception. |\n| 8 | B | 2 | A zero-day exploits a flaw before a patch exists; an APT concerns duration and targeting. |\n| 9 | B | 3 | The acceptable use policy (an ISSP) governs email and internet use. |\n| 10 | C | 3 | Tier 3 (Repeatable): formal risk management, documented policy, repeatable programme. |\n| 11 | B | 3 | PDCA is the continuous improvement loop. |\n| 12 | C | 4 | RBAC attaches permissions to roles. |\n| 13 | B | 4 | Forged ARP replies poison the ARP cache (a LAN attack). |\n| 14 | C | 4 | The application-level proxy inspects content and can require authentication. |\n| 15 | B | 4 | Alert on normal traffic is a false positive. |\n| 16 | B | 4 | Annex A.11 covers physical and environmental security. |\n| 17 | B | 5 | Strategic alignment ties IT investment to business objectives. |\n| 18 | B | 5 | A baseline is the approved reference configuration. |\n| 19 | D | 5 | Review and closure includes the post-implementation review. |\n| 20 | B | 6 | Effectiveness is about achieving objectives; efficiency is about minimum resources. |\n| 21 | B | 6 | Around the computer compares inputs with outputs and treats the system as a black box. |\n| 22 | B | 6 | Auditors prioritise by exposure and likelihood of failure. |\n| 23 | C | 7 | Recovery controls restore systems and services after disruption. |\n| 24 | C | 7 | Validity: transactions are real and approved. |\n| 25 | B | 7 | A control total mismatch signals missing or wrong items: completeness and accuracy. |\n| 26 | B | 7 | Development and production duties must be segregated. |\n| 27 | B | 8 | Cause explains why the condition exists. |\n| 28 | B | 9 | The auditor must report all material facts, record management's view and escalate. |\n| 29 | B | Lab | Approximate match requires ascending order of the lookup column. |\n| 30 | B | Lab | The difference is about one day's interest, pointing to a 30-day count. |\n\n**Score:** ___ / 30. Log each wrong answer with its topic.\n<\/details>\n\n### SECTION B — Short answer (36 marks, 3 marks each)\n\n**B1.** Explain why an ISMS starts with defining scope and performing a risk assessment before any controls are chosen.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Scope sets the boundaries of what the ISMS covers; without it nobody knows which assets, people and systems are in or out. The risk assessment identifies assets, threats, vulnerabilities and impacts, so controls are chosen according to real risk rather than guesswork. Controls selected first risk wasted money on low risks and gaps on the serious ones; the treatment plan depends on the assessment.\n**Marking:** scope purpose (1), risk assessment purpose (1), consequence of reversing the order (1).\n<\/details>\n\n**B2.** Distinguish an advanced persistent threat from a zero-day exploit.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** An APT describes how the attack is carried out: prolonged, targeted, with the intruder staying undetected for a long time to gather data. A zero-day describes what flaw is used: one for which no patch exists yet. An APT may use a zero-day but need not; a zero-day may be used in a quick one-off attack.\n**Marking:** APT (1), zero-day (1), relationship (1).\n<\/details>\n\n**B3.** Using a login form, explain how SQL injection works and give one prevention.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** The application builds an SQL query by pasting typed text into it. An attacker types `admin' --` as the username; the quote closes the username value and `--` turns the rest of the query, including the password check, into a comment, so the database returns the admin record. Prevention: parameterised queries (typed text treated as data), input validation, or a web application firewall.\n**Marking:** mechanism (2), prevention (1).\n<\/details>\n\n**B4.** State the six guidelines for an effective policy.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Properly developed (industry-accepted practice); distributed by all appropriate methods; read or reviewed by all employees; understood by all employees; formally agreed to by act or assertion; uniformly applied and enforced.\n**Marking:** 0.5 each.\n<\/details>\n\n**B5.** Compare DAC and MAC by who decides, the basis of the decision, and typical use.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** DAC: the owner decides, based on identity and the owner's rules; used for ordinary file sharing. MAC: the system decides, based on sensitivity labels (a subject's clearance must dominate the object's classification); used for classified government and military data.\n**Marking:** who decides (1), basis (1), use (1).\n<\/details>\n\n**B6.** Name three hardware attack types or three hardware mitigations from the notes, with a line on each.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer (attacks):** Rowhammer (repeated access to DRAM flips neighbouring bits); evil maid (physical access to unattended devices to alter them); counterfeit hardware (fake devices sold through the supply chain). *(Mitigations alternative: investigate vendors; encrypt all devices; minimise the attack surface; strong physical security; real-time monitoring; update firmware.)*\n**Marking:** each correct item with description (1).\n<\/details>\n\n**B7.** Distinguish IT governance from IT management and operations and give one example of each.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** IT governance is the framework of processes, policies and decision structures that guide effective use of IT and the value gained from it (the board approves an IT project because it fits the strategy). IT management and operations plans, implements, maintains and supports IT systems (the IT team installs and supports the system).\n**Marking:** two definitions (2), examples (1).\n<\/details>\n\n**B8.** State any three of the nine objectives of an IS audit and give a test for each.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer (example):** (1) Assurance that IS assets are safeguarded: compare the asset register to a physical count. (2) Compliance with policies and law: compare password settings to policy. (3) Management takes corrective actions: follow up the status of prior findings.\n**Marking:** each objective with a sensible test (1).\n<\/details>\n\n**B9.** Name the three categories of IS audit and say what each reviews.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** General controls review: controls over development, operation, maintenance and security of application systems in the environment. Application controls review: controls for one application (input, processing, output). System development review: the development process and product of a new application.\n**Marking:** each (1).\n<\/details>\n\n**B10.** State two differences between general controls and application controls.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** (1) Scope: general controls apply to all or a large segment of systems; application controls apply to one application's transactions. (2) Purpose: general controls safeguard data and programs and keep operations continuing; application controls give reasonable assurance of completeness, accuracy, validity and confidentiality. Also: application controls rely on general controls.\n**Marking:** two differences with explanation (3).\n<\/details>\n\n**B11.** Explain how audit trails support security.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** In three ways: detecting unauthorised access (real time or after the fact); reconstructing events (how a failure or error happened, assigning responsibility); and promoting personal accountability (users know their actions are logged, which deters violations).\n**Marking:** one per way (3).\n<\/details>\n\n**B12.** Give three ethical issues an auditor faces when handling personal data in a practical test and how to manage each.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** (1) Privacy: use the minimum data needed and mask unnecessary personal details. (2) Confidentiality: store extracts encrypted with restricted access and do not discuss customer information outside the engagement. (3) Retention: delete or return extracts at the end according to the agreement. (Also: stay within authorised scope.)\n**Marking:** three issues with handling (3).\n<\/details>\n\n### SECTION C — Structured scenario questions (48 marks, 6 marks each)\n\n**C1.** A clinic's files are suddenly encrypted and a message demands payment. Staff say a colleague opened an email attachment an hour earlier. (a) Name the attack and the CIA goal most affected. (b) Name the likely entry method. (c) State two controls that would have limited the impact and one that would have helped prevent it.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** (a) Ransomware; availability is the goal most directly affected (files cannot be used), though confidentiality may also be threatened. (b) Phishing (a malicious attachment in an email). (c) *Limit impact:* tested offline backups with a restore plan; network segmentation and least privilege so malware cannot reach everything; an incident response plan. *Prevent:* staff awareness training and email scanning, or application controls such as blocking macros.\n**Marking:** (a) 2, (b) 1, (c) 3.\n<\/details>\n\n**C2.** A call centre finds staff regularly share passwords despite a policy forbidding it. (a) Using the six guidelines, explain why the policy may be failing. (b) Classify the policy and the related system setting by policy type. (c) Recommend two actions.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** (a) The policy may have been developed but not properly distributed, understood, formally agreed to, or uniformly enforced; if staff never signed it or are not disciplined, it is only a document. (b) The password-sharing rule is an ISSP (acceptable use); the technical setting (for example MFA or lockout) is a SysSP. (c) Training with signed acceptance and uniform enforcement; technical controls such as MFA and monitoring for simultaneous logins.\n**Marking:** (a) 2, (b) 2, (c) 2.\n<\/details>\n\n**C3.** A bank's server room is accessible with a badge, but staff often hold the door for colleagues, a delivery bay opens next to the room, and retired servers are thrown away without wiping. (a) Identify three failures using ISO 27001 Annex A.11. (b) Give one fix for each. (c) Name the Topic 2 attack the first failure enables.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** (a) Weak physical entry controls and working in secure areas (tailgating); delivery and loading area not isolated from information processing facilities; secure disposal or reuse of equipment not followed. (b) Mantrap or turnstile with in-and-out logging and staff challenge culture; move or separate the delivery area, add CCTV and procedures so internal and external doors are not open at once; verify wiping or physically destroy drives with records. (c) Tailgating (a social engineering attack).\n**Marking:** (a) 3, (b) 2, (c) 1.\n<\/details>\n\n**C4.** A change to the loan system was made on Friday evening without a CAB review, tested only on the live system, and with no back-out plan. The system failed for 8 hours. (a) Identify the change management stages that were weak. (b) State the consequence of each weakness. (c) Say which configuration control practice would have helped detect the unrecorded change.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** (a) Assessment and approval (no CAB), planning and scheduling (no back-out plan, poor timing), implementation (testing on live), review and closure (no review). (b) No independent risk assessment; no way to recover quickly; the failure hit production; lessons not captured. (c) Configuration status accounting and configuration auditing against the baseline would reveal a change not in the records.\n**Marking:** (a) 2, (b) 2, (c) 2.\n<\/details>\n\n**C5.** An auditor has four control areas with exposure (E) and likelihood of failure (L) scored 1 to 3: user access (E3, L3), backup restore (E3, L2), change management (E2, L3), visitor logbook (E1, L1). (a) Compute priority = E × L and rank. (b) For the top item choose the audit technique (around, through or with the computer) and explain. (c) Write the deviation rate if 6 of 40 sampled items fail and state the conclusion against a 5% tolerance.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** (a) 9, 6, 6, 1: user access first; backup restore and change management tie; visitor logbook last. (b) *With the computer:* load the user list and HR leavers list and test all records electronically, since data is electronic and the exposure is high. (c) 6 ÷ 40 = 15% > 5%, so the control is not operating effectively.\n**Marking:** (a) 2, (b) 2, (c) 2.\n<\/details>\n\n**C6.** A batch of 4 invoices should total 800,000. The clerk keys three of them, one with a missing zero, giving 410,000. Invoice numbers keyed are 501, 502 and 504. (a) Identify the controls that would detect each problem and the assertion each protects. (b) Which control would not catch the keying error alone? (c) State one corrective action.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** (a) Batch count (expected 4, keyed 3) and sequence check (gap at 503): completeness. Control total (expected 800,000, keyed 410,000): completeness and accuracy. (b) A range check would not necessarily catch a missing zero if the amount falls within the allowed range; the batch total does. (c) Locate invoice 503, key it, correct the mistyped amount, and re-run the batch totals.\n**Marking:** (a) 3, (b) 1, (c) 2.\n<\/details>\n\n**C7.** Test results: of 4,000 mobile transactions recomputed in Excel, 120 were charged without excise duty of 150 each. (a) Compute the exception rate and the shortfall. (b) Write the five-part finding. (c) State the working paper contents you would keep.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** (a) Rate = 120 ÷ 4,000 = 3%. Shortfall = 120 × 150 = 18,000. (b) *Condition:* recomputation of all 4,000 transactions shows 120 (3%) without excise duty of 150, a shortfall of 18,000 (WP C1). *Criteria:* the approved tariff guide requires excise duty on the fee. *Cause:* a product code was set up without the excise parameter. *Effect:* under-collection owed to the revenue authority and penalties. *Recommendation:* correct the setup in 14 days, recover or report the shortfall, add a pre-release tariff test; owner head of product. (c) Raw data, formulas, validation of counts and totals, population, results and exceptions list, investigation, conclusion, prepared by and reviewed by.\n**Marking:** (a) 2, (b) 3, (c) 1.\n<\/details>\n\n**C8.** Using the tariff (0 to 50,000 → fee 500; 50,001 to 200,000 → fee 1,000; above 200,000 → fee 2,000; excise 15% of fee), compute expected totals and differences for: (1) 20,000 charged 575; (2) 80,000 charged 1,150; (3) 210,000 charged 2,300; (4) 150,000 charged 1,000; (5) 45,000 charged 500; (6) 300,000 charged 2,600. Report gross under and over amounts and the net, and explain why the net misleads.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Expected: (1) 575; (2) 1,150; (3) 2,300; (4) 1,150; (5) 575; (6) 2,300. Differences (charged minus expected): (1) 0; (2) 0; (3) 0; (4) −150; (5) −75; (6) **+300**. Gross under-charged: −225 (items 4 and 5, excise duty omitted). Gross over-charged: +300 (item 6). Net: +75. The net looks like a small over-collection and hides that excise duty was missed on two transactions, so the bank has a regulatory exposure and a customer was over-charged; each needs its own finding and fix.\n**Marking:** six expected totals (3), gross and net (2), explanation (1).\n<\/details>\n\n### Scoring the 50-question test\n\n| Score out of 114 | Reading | Next step |\n|---|---|---|\n| 100 to 114 | Exam-ready | Attempt the hardest-topics test and past papers under time |\n| 80 to 99 | Solid, with gaps | Fix errors via the Phase 5 log; retest the weak topics in 3 days |\n| 60 to 79 | Needs repair | Re-study Phase 1 for weak topics, redo comprehension checks, retest in a week |\n| Below 60 | Not ready | Return to Phase 1 and the spaced-repetition plan; do not sit more full tests until Level 1 to 2 recall is solid |\n\n\n---\n\n## 4.3 FINAL TEST ON THE HARDEST TOPICS\n\n**Why these topics:** access control models and network security (Topic 4), application controls and the control classification schemes (Topic 7), the audit risk chain and testing techniques (Topic 6), standards and frameworks (Topic 3) and the numerical Practical Lab work. These are the areas where students most often lose marks: they need precise definitions **and** the ability to apply them.\n**Structure:** 10 multi-part questions, **88 marks**. Suggested time: 2 hours 15 minutes. No notes.\n\n**H1. Mandatory access control (8 marks).** Labels are ordered public < confidential < secret. A subject may read an object only if its level is **equal or higher** and its categories **include all** the object's categories.\n\nObjects: **R1** = (secret, {finance}); **R2** = (confidential, {finance, HR}).\nSubjects: **Ann** = (secret, {finance, HR}); **Ben** = (confidential, {finance}); **Cara** = (secret, {finance}); **Dan** = (public, {finance, HR}).\n\n(a) Complete the table of who can read what. (4)\n(b) The owner of R1 wants to give Ben access. Explain what happens under MAC and what would happen under DAC. (2)\n(c) Name one weakness of DAC that MAC removes and one weakness of MAC. (2)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**(a)**\n\n| | R1 (secret, {finance}) | R2 (confidential, {finance, HR}) |\n|---|---|---|\n| Ann (secret, {finance, HR}) | **Yes** (level equal, categories covered) | **Yes** (level higher, categories covered) |\n| Ben (confidential, {finance}) | No (level too low) | No (category HR missing) |\n| Cara (secret, {finance}) | **Yes** | No (category HR missing) |\n| Dan (public, {finance, HR}) | No (level too low) | No (level too low) |\n\n**(b)** Under MAC the system enforces the labels: Ben's clearance does not dominate R1's classification, so the owner cannot grant access; only a change of label by the authorised security administrator could. Under DAC the owner could simply grant Ben read access, whether or not that is appropriate.\n**(c)** DAC weakness removed: owner decisions and passing on of access can leak information (a program run by the owner might pass it on). MAC weakness: rigid and complex to administer; labels must be maintained for everything.\n\n**Marking:** (a) one mark per row pair correct (4); (b) MAC (1), DAC (1); (c) one each (2).\n**Common mistake:** ignoring the category rule and judging only by level (Cara reading R2).\n<\/details>\n\n**H2. Network attacks and firewall rules (10 marks).**\n\n(a) A server's half-open connection list holds 256 entries, each held for 30 seconds. An attacker sends 500 SYN packets per second without completing handshakes. How long until the list is full, and what is the effect on legitimate users? (3)\n(b) Computer A's ARP cache shows 192.168.1.1 at MAC AA:AA before an incident and EE:EE after, where EE:EE is the attacker's device. Explain what happened and two possible consequences. (3)\n(c) A firewall rule set reads: Rule 1: ALLOW any → 10.0.0.5 port 443. Rule 2: ALLOW any → 10.0.0.10 port 1433 (the database). Identify two problems and rewrite the rules. (4)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**(a)** 256 ÷ 500 = about **0.51 seconds**. After that the list is full, and new SYN requests, including from genuine customers, are dropped for as long as the flood continues. The attack denies **availability** without stealing any data.\n**(b)** The attacker sent forged ARP replies claiming the gateway's IP address belongs to EE:EE, so A's cache was poisoned. A's traffic to the gateway now goes to the attacker, who can **read and forward it** (man-in-the-middle, stealing data or session tokens) or **drop it** (denial of service).\n**(c)** *Problems:* (1) Rule 2 exposes the **database** to any source on the internet; (2) there is **no default deny rule**, so unlisted traffic may be allowed. *Rewrite:* Rule 1: ALLOW TCP any → 10.0.0.5 port 443. Rule 2: ALLOW TCP from 10.0.1.0/24 (the application servers only) → 10.0.0.10 port 1433. Rule 3: DENY all from any to any.\n\n**Marking:** (a) time (1), effect (1), availability (1); (b) mechanism (1), two consequences (2); (c) two problems (2), corrected rules (2).\n**Common mistake:** in (a) saying the attacker \"crashes the server\" rather than exhausting the waiting list.\n<\/details>\n\n**H3. IDS performance (6 marks).** In one day an IDS processes 20,000 events, of which 40 are real attacks. It raises 60 alerts, 30 of which relate to real attacks.\n(a) Compute true positives, false positives, false negatives and true negatives. (2)\n(b) What percentage of real attacks was detected, and what share of alerts were false alarms? (2)\n(c) Which error is more dangerous and why? Suggest one effect of tuning to reduce the other. (2)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**(a)** TP = 30; FP = 60 − 30 = 30; FN = 40 − 30 = **10**; TN = 20,000 − 40 − 30 = 19,930.\n**(b)** Detection rate = 30 ÷ 40 = **75%**. False alarm share = 30 ÷ 60 = **50%**.\n**(c)** The false negatives are more dangerous: 10 real attacks were not alerted on and may succeed unseen. False positives waste analysts' time and can lead to alert fatigue. Tightening the sensitivity reduces false positives but risks more false negatives, so tuning is a trade-off.\n\n**Marking:** (a) two correct sets (2); (b) (2); (c) reasoning (2).\n**Common mistake:** computing TN as 20,000 − 60.\n<\/details>\n\n**H4. Classifying controls (8 marks).** For each control give (i) the objective-based type (preventive, detective, corrective, directive, recovery) and (ii) the application assertion it mainly supports (completeness, accuracy, validity, confidentiality; or \"availability\" where relevant).\n1. The system rejects an invoice number that already exists.\n2. A monthly review of the manual-override report.\n3. A policy requiring a second approver above a limit.\n4. Restoring the database from last night's backup.\n5. A procedure to correct and reprocess rejected transactions.\n6. A check digit on account numbers.\n7. Menu options shown only to users in the right role.\n8. Matching each invoice to a purchase order and goods received note before payment.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n| # | Type | Assertion |\n|---|---|---|\n| 1 | Preventive | Completeness (duplicates rejected) |\n| 2 | Detective | Validity (were overrides approved?) |\n| 3 | Directive | Validity (transactions properly approved) |\n| 4 | Recovery | Availability (not a business process assertion in the notes; handled under application security) |\n| 5 | Corrective | Completeness (rejected items corrected and reprocessed) |\n| 6 | Preventive | Accuracy |\n| 7 | Preventive | Confidentiality |\n| 8 | Preventive (detective if performed after payment) | Validity |\n\n**Marking:** one mark per row (both parts right); accept reasoned alternatives.\n**Common mistake:** classifying 3 as preventive. A policy states management intent (directive); a system block would be preventive.\n<\/details>\n\n**H5. Segregation of duties in a small team (8 marks).** A small branch has three staff, Grace, Ibrahim and Sarah. Grace sets up customers and enters their loans; Ibrahim approves loans and releases funds; Sarah handles cash and posts the cash journal.\n(a) Identify the incompatible duties. (3)\n(b) Suggest three compensating controls given that more staff cannot be hired. (3)\n(c) Explain how you would test whether the compensating controls operate. (2)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**(a)** Grace sets up customers and enters their loans (risk of fictitious customers and loans). Ibrahim approves loans **and** releases funds (approve and pay by one person). Sarah handles cash **and** posts the cash journal (custody and record keeping combined: theft can be hidden).\n**(b)** An independent supervisor (branch manager or head office) reviews all new customers and loans created by Grace and all disbursements by Ibrahim; dual control over funds release (two signatories); daily independent reconciliation of cash and the cash journal by someone other than Sarah; detailed logging with a regular exception review; periodic rotation of duties or mandatory leave.\n**(c)** Inspect evidence of the reviews (signed reports, review dates) for a sample of days or items; re-perform a reconciliation; confirm that a dual-control or independent step was actually done; check logs for transactions that bypassed the review.\n\n**Marking:** (a) three conflicts (3); (b) three controls (3); (c) two test steps (2).\n**Common mistake:** recommending \"hire more staff\" when the question says it is not possible, or listing controls without explaining how to test them.\n<\/details>\n\n**H6. Audit techniques and evidence (8 marks).** You are auditing an inventory system that issues goods automatically when stock is requested.\n(a) Describe how you would audit it around, through and with the computer, and what each proves. (6)\n(b) Rank these four pieces of evidence from most to least reliable and justify: (i) the store manager's verbal assurance; (ii) a stock count observed by you; (iii) a system-generated stock report; (iv) a supplier's written confirmation of deliveries. (2)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**(a)** *Around:* trace a sample of stock requests (input documents) to the issue reports (output); proves input and output agree for the sample, not that processing logic is right. *Through:* process test requests (valid, over-stock, invalid item) in a test copy and check that issues, stock levels and rejections are correct; proves the programmed controls work. *With:* load all stock movements into Excel or IDEA to recompute balances, find negative stock, duplicates and unusual issues; tests 100% of the data, subject to complete and accurate extraction.\n**(b)** Most to least reliable: (ii) observed count (direct, obtained by the auditor); (iv) supplier's written confirmation (independent, external); (iii) system-generated report (reliable if general controls are effective, but internal); (i) verbal assurance (inquiry alone, weakest). Accept a reasoned alternative ordering of (iv) and (ii).\n\n**Marking:** (a) three techniques with what each proves (6); (b) ranking (1), justification (1).\n**Common mistake:** treating the system report as independent evidence.\n<\/details>\n\n**H7. The audit risk chain (8 marks).** A bank's customer portal lets users reuse weak passwords and has no lockout. Leaked password lists are widely available. The portal holds loan applications for 50,000 customers.\n(a) Identify the vulnerability, threat, likelihood, attack and exposure in the handout's sense. (5)\n(b) Score exposure (1 to 3) and likelihood (1 to 3), compute priority and state the testing consequence. (1)\n(c) Name two controls you would test first. (2)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**(a)** *Vulnerability:* weak password rules and no lockout (a design/implementation weakness). *Threat:* criminals with leaked password lists who could exploit it. *Likelihood:* high, since leaked lists are common and the safeguards are weak. *Attack:* the attempt to log in with many leaked credentials. *Exposure:* the extent of loss if it succeeds: exposure of applicants' personal data, fraud, regulatory penalties, loss of trust and business.\n**(b)** Exposure 3 × likelihood 3 = **9**: highest priority, to be tested first and thoroughly.\n**(c)** Password policy configuration and lockout settings; multi-factor authentication for customers; (also monitoring for repeated failed logins).\n\n**Marking:** (a) one mark each (5); (b) (1); (c) (2).\n**Common mistake:** defining exposure as \"likelihood of an attack\".\n<\/details>\n\n**H8. Standards and frameworks (10 marks).** A bank holds an ISO/IEC 27001 certificate but suffers a serious breach.\n(a) Explain how ISO/IEC 27001, ISO/IEC 27002, the PDCA cycle and the NIST CSF relate to one another. (5)\n(b) Give three reasons a certified organization can still be breached. (3)\n(c) State two actions that continuous improvement under PDCA would require. (2)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**(a)** ISO/IEC 27001 is the ISMS standard against which the bank is certified; ISO/IEC 27002 (derived from ISO 17799, originally BS 7799) is the code of practice for the controls the ISMS selects; PDCA is the continuous improvement cycle that runs through the ISMS (plan scope, policy and risk treatment; do implement; check monitor and audit; act improve); the NIST CSF is a voluntary framework (Identify, Protect, Detect, Respond, Recover; tiers; profile and gap analysis) used to assess and improve cybersecurity maturity and can complement ISO.\n**(b)** Certification shows an ISMS exists at a point in time, not that every control operates every day; threats evolve (zero-days, insiders, phishing); controls may be well designed but not operating effectively; scope may exclude the breached system; people may not follow policies.\n**(c)** Perform a post-incident review to find root causes and update the risk assessment and treatment plan; fix and retest the failed controls and retrain staff, then re-audit.\n\n**Marking:** (a) one mark per standard or framework correctly linked (5 including the relationship); (b) (3); (c) (2).\n**Common mistake:** saying certification guarantees security.\n<\/details>\n\n**H9. Interest recomputation (12 marks).** Savings interest is meant to equal balance × annual rate × days ÷ 365, rounded to the nearest shilling. Tolerance for rounding: ±1.\n\n| Account | Balance | Approved rate | Days | Posted |\n|---|---|---|---|---|\n| P | 3,000,000 | 12% | 31 | 30,575 |\n| Q | 4,500,000 | 8% | 30 | 30,000 |\n| R | 1,825,000 | 10% | 28 | 14,000 |\n| S | 6,000,000 | 6% | 30 | 24,658 |\n| T | 2,500,000 | 4% | 30 | 8,220 |\n\n(a) Recompute each, compute the variance and identify exceptions. (6)\n(b) Total recomputed vs posted and the net variance. (1)\n(c) Identify the likely cause of each exception. (3)\n(d) State the effect and write the condition for one finding. (2)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**(a)**\n\n| Account | Recomputed | Posted | Variance (posted − recomputed) | Result |\n|---|---|---|---|---|\n| P | 30,575 | 30,575 | 0 | OK |\n| Q | 29,589 | 30,000 | **+411** | EXCEPTION |\n| R | 14,000 | 14,000 | 0 | OK |\n| S | 29,589 | 24,658 | **−4,931** | EXCEPTION |\n| T | 8,219 | 8,220 | +1 | OK (within tolerance) |\n\n*(Working: Q: 4,500,000 × 8% = 360,000; × 30 ÷ 365 = 29,589.04. S: 6,000,000 × 6% = 360,000; × 30 ÷ 365 = 29,589.04. P: 360,000 × 31 ÷ 365 = 30,575.34. R: 182,500 × 28 ÷ 365 = 14,000. T: 100,000 × 30 ÷ 365 = 8,219.18.)*\n**(b)** Recomputed total 111,972; posted total 107,453; net variance **−4,519** (+411 − 4,931 + 1).\n**(c)** *Q:* the posted amount equals 4,500,000 × 8% × 30 ÷ **360** = 30,000, so the system used a **360-day basis** instead of 365. *S:* the posted amount equals the interest at **5%** (6,000,000 × 5% × 30 ÷ 365 = 24,658), so the **rate table was not updated** to 6%. *(T's +1 is rounding.)*\n**(d)** *Effect:* Q is over-credited (cost to the bank) and S is under-credited (customer detriment and complaints); the net hides both. *Condition example:* \"Recomputation of 5 accounts showed 2 exceptions: account Q was over-credited by 411 (360-day basis), and account S was under-credited by 4,931 (outdated rate), with a net variance of −4,519 (WP D2).\"\n\n**Marking:** (a) five recomputations and variances (5), exceptions Q and S identified with T treated as within tolerance (1); (b) totals and net variance (1); (c) cause of Q (1.5), cause of S (1.5); (d) effect (1), condition (1).\n**Common mistake:** treating T's +1 as an exception, or reporting only the net.\n<\/details>\n\n**H10. Reporting under pressure (10 marks).** You have found that 15% of sampled privileged-access changes had no approval. The head of IT asks you to describe it as \"minor documentation issues\" and remove the cause from the report because \"the vendor is a friend of the Board\".\n(a) Identify the ethical principles at stake. (3)\n(b) Describe your proper response, step by step. (3)\n(c) Write the five-part finding in a professional, neutral tone (using your own assumed details). (4)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**(a)** Integrity (honest reporting); objectivity (conclusions based on evidence, not pressure); independence (not influenced by relationships); full and accurate reporting of material facts; also confidentiality when handling the discussion.\n**(b)** (1) Re-check the evidence and rating. (2) Explain to management that the facts are material and will be reported. (3) Offer to include management's response and corrective actions. (4) If pressure continues, escalate to the audit committee or audit leadership and document the request. (5) Do not remove or soften the finding.\n**(c)** *Condition:* 6 of 40 sampled privileged-access changes (15%) had no approval recorded (WP F4). *Criteria:* the access control policy requires documented approval before privileged access changes. *Cause:* approvals were granted verbally and the system does not enforce a recorded approval. *Effect:* risk of unauthorised privileged access, fraud and data compromise. *Recommendation:* enforce mandatory recorded approval in the access management tool within 45 days; review the six changes; owner Head of IT Security. Neutral tone: no names or blame.\n\n**Marking:** (a) three principles (3); (b) three or more sensible steps (3); (c) five elements (4).\n**Common mistake:** softening the rating in exchange for a promise to fix.\n<\/details>\n\n### Scoring the hardest-topics test\n\n| Score out of 88 | Reading |\n|---|---|\n| 75 to 88 | Strong on the hardest material |\n| 60 to 74 | Good; repair the topics where you lost marks |\n| 45 to 59 | Needs targeted repair: re-study the matching Phase 1 sections and redo their Level 3 and 4 questions |\n| Below 45 | Return to Phase 1 for Topics 4 and 7 first, then 6; then retest in a week |\n\n\n---\n\n## 4.4 THE SPACED-REPETITION PLAN\n\n**Why spacing works.** You forget most of a new topic within days unless you retrieve it again. Each time you pull the material out of memory **just as it starts fading**, it sticks for longer. Re-reading feels easy but does not do this. **Answering from memory does.** That is why this plan is built around recall questions, not re-reading.\n\n### The rule: one topic, five touches\n\nFor each topic (or unit), do five sessions:\n\n| Day (relative to first study) | Session | What exactly to do | Time |\n|---|---|---|---|\n| **Day 1** | **Study and understand** | Read the Phase 1 section slowly. Do Phase 2 (comprehension checks) **with the notes open**. Write your own one-page summary | 2 to 3 hours |\n| **Day 2** | **Level 1 and 2 recall, no notes** | Answer the Level 1 and Level 2 questions on paper before revealing. Mark yourself. Log errors | 30 to 40 min |\n| **Day 4** | **Level 3 application + explain aloud** | Do the Level 3 questions. Then close the guide and explain the topic aloud for 5 minutes, as if teaching a friend; note where you got stuck | 40 to 50 min |\n| **Day 7** | **Mixed retrieval across earlier topics** | Pull questions from this topic **and** older ones (use the 30-question mixed quiz and the rapid recall sheets). Mix them in random order | 30 to 40 min |\n| **Day 14** | **Cumulative testing and error review** | Do items from the 50-question test and the hardest-topics test for this topic. Review every logged error and redo the follow-up questions | 40 to 60 min |\n\n**Final revision period** (the last 7 to 10 days before the exam): see 4.4.3.\n\n### 4.4.1 What each session looks like in practice\n\n**Study session (Day 1).**\n1. Read the Big picture and Key terms first. Do not skip straight to the questions.\n2. Work every worked example **with a pen**. Recompute the numbers yourself.\n3. Do the comprehension checks while the notes are open. If you cannot explain a check, re-read that part.\n4. Write your own one-page summary **in your own words**, then compare it with the revision summary in the guide.\n\n**Recall session (Days 2, 4).**\n1. Cover the answer. Write your attempt (even a bad one).\n2. Reveal. Mark with the key points. Give yourself marks honestly.\n3. For every point you missed, write it in your own words in the error log (Phase 5).\n4. Rate each question: **Easy / Hard / Failed**. \"Hard\" and \"Failed\" come back sooner.\n\n**Explaining aloud (Day 4).** Speak without notes for five minutes: what the topic is, why it matters, the key lists, one worked example. Where you stumble, you have found what you do not yet know. Check only those gaps.\n\n**Mixed retrieval (Day 7).** Do not group by topic. Use random questions. This builds the skill of **recognising what a question is about**, which the exam demands.\n\n**Cumulative test (Day 14).** Treat it as exam practice: timed, no notes. Afterwards, do the error review properly. This session is where weak areas become visible.\n\n### 4.4.2 A concrete calendar (one unit per day for 10 days)\n\nUnits: Topic 1 to 9 and the Practical Lab. Each unit is first studied on Day *n* and then revisited on Days *n+1*, *n+3*, *n+6* and *n+13*. Following this table, you are never more than 23 days from having every unit revisited five times.\n\n| Day | Tasks |\n|---|---|\n| 1 | **Study Topic 1** (Phase 1 and 2) |\n| 2 | Topic 1: Level 1-2 recall, no notes; **Study Topic 2** (Phase 1 and 2) |\n| 3 | Topic 2: Level 1-2 recall, no notes; **Study Topic 3** (Phase 1 and 2) |\n| 4 | Topic 1: Level 3 recall, explain aloud; Topic 3: Level 1-2 recall; **Study Topic 4** |\n| 5 | Topic 2: Level 3 recall, explain aloud; Topic 4: Level 1-2 recall; **Study Topic 5** |\n| 6 | Topic 3: Level 3 recall, explain aloud; Topic 5: Level 1-2 recall; **Study Topic 6** |\n| 7 | Topic 1: mixed retrieval; Topic 4: Level 3 recall, explain aloud; Topic 6: Level 1-2 recall; **Study Topic 7** |\n| 8 | Topic 2: mixed retrieval; Topic 5: Level 3 recall, explain aloud; Topic 7: Level 1-2 recall; **Study Topic 8** |\n| 9 | Topic 3: mixed retrieval; Topic 6: Level 3 recall, explain aloud; Topic 8: Level 1-2 recall; **Study Topic 9** |\n| 10 | Topic 4: mixed retrieval; Topic 7: Level 3 recall, explain aloud; Topic 9: Level 1-2 recall; **Study Practical Lab** |\n| 11 | Topic 5: mixed retrieval; Topic 8: Level 3 recall, explain aloud; Practical Lab: Level 1-2 recall |\n| 12 | Topic 6: mixed retrieval; Topic 9: Level 3 recall, explain aloud |\n| 13 | Topic 7: mixed retrieval; Practical Lab: Level 3 recall, explain aloud |\n| 14 | Topic 1: cumulative test items and error review; Topic 8: mixed retrieval |\n| 15 | Topic 2: cumulative test items and error review; Topic 9: mixed retrieval |\n| 16 | Topic 3: cumulative test items and error review; Practical Lab: mixed retrieval |\n| 17 | Topic 4: cumulative test items and error review |\n| 18 | Topic 5: cumulative test items and error review |\n| 19 | Topic 6: cumulative test items and error review |\n| 20 | Topic 7: cumulative test items and error review |\n| 21 | Topic 8: cumulative test items and error review |\n| 22 | Topic 9: cumulative test items and error review |\n| 23 | Practical Lab: cumulative test items and error review |\n\n**Where to fit the full tests in this calendar:**\n\n| Test | When | Why then |\n|---|---|---|\n| 30-question mixed quiz | Day 11 or 12 (after Topics 1 to 9 are first studied) | First mixed check across everything |\n| 50-question cumulative test | Day 17 or 18 | After most Day-14 reviews |\n| Hardest-topics test | Day 20 or 21 | When Topics 4, 6, 7 and the Lab have been revisited |\n| CW1 as a timed mock (50 MCQs) | Day 22 | Matches the real online test style |\n\n**If you have less time.** Keep the order of touches but compress: two units per day, keep the Day +1 and Day +3 reviews, and replace the Day +13 review with the full tests and the final revision period below. **Never skip the recall sessions** to make room for more reading.\n\n**If you miss a day.** Do not try to catch up on everything. Shift the plan by one day and do the **most overdue review first**: new study can wait, forgetting cannot.\n\n### 4.4.3 Final revision period (last 7 to 10 days)\n\n| Activity | What to do | How often |\n|---|---|---|\n| **Full mock exam** | The 50-question cumulative test and CW1, timed, no notes | Every 2 to 3 days |\n| **Weak-topic drills** | From your error log: the topics where you lost most marks. Redo the Level 3 and 4 questions and the follow-up questions you wrote | Daily, 45 minutes |\n| **Rapid recall sheets** | Read the sheet for a topic, close it, then write everything you remember, then check | Daily, rotate topics |\n| **Explain aloud** | Pick a random topic; speak for five minutes without notes | Daily |\n| **Practical rehearsal** | Redo the Practical Lab exercises from scratch in Excel (and IDEA if available) without looking at the formulas | Every 2 days |\n| **Rest** | Short sleep and breaks protect memory | The night before the exam, stop new material |\n\n**The day before the exam:** one light pass over the rapid recall sheets, one list of your top five repeated errors, then stop. New material at this point creates confusion, not marks.\n\n### 4.4.4 A weekly rhythm for a busy student (example)\n\n| Weekday | Focus |\n|---|---|\n| Monday | New topic (Phase 1 and 2) |\n| Tuesday | Recall: yesterday's topic Level 1-2; one older topic Level 3 |\n| Wednesday | New topic, plus a 20-minute mixed quiz |\n| Thursday | Recall: Wednesday's topic Level 1-2; explain aloud |\n| Friday | Error log review; redo follow-up questions |\n| Saturday | Practical Lab in Excel and a timed section from a test |\n| Sunday | Rest, or a short mixed retrieval session |\n\n\n---"};</script><script src="assets/app.js"></script><script src="assets/live.js"></script></html>
