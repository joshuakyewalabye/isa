<script src="assets/meta.js"></script><script src="assets/index.js"></script><script>window.PAGE={"id": "lab", "t": "PRACTICAL LAB — Testing Controls with Excel and IDEA", "s": "Practical Lab (Excel and IDEA)", "g": "Practice", "c": "#0d9488", "k": "Lab", "f": "practical-lab.html", "w": 7575, "md": "# PRACTICAL LAB — Testing Controls with Excel and IDEA\n\n**Classification:** Applied/Practical, Likely exam focus (the practical test, and the testing summaries in CW2)\n**Sources:** The outline lists a **practical test** (Assignment 3) and \"auditing tools\" (Topic 6e), but **your zip contains no practical notes**. The CW2 brief tells you *what* to test (areas b to f in particular) and what the testing summaries must show. **Everything in this lab is Supplementary explanation**: standard audit data analysis built from the concepts in Topics 6 and 7. You said the practical will probably use **both IDEA and Excel, leaning toward Excel**, so this lab teaches every test in Excel first, with the IDEA equivalent alongside.\n**Caution on tools:** formulas below work in current desktop Excel (Excel 2021 or Microsoft 365 for `XLOOKUP`; I give a `VLOOKUP` alternative). IDEA menu names change between versions, so I describe what each IDEA function **does** and leave exact click-paths to your lecturer's guide.\n\n## PHASE 1 — UNDERSTANDING\n\n### P.1 The big picture\n\nTopic 6 introduced auditing **with the computer**: loading the entity's data into a tool and testing **all** of it instead of a sample. Topic 7 gave you the controls to test (completeness, accuracy, validity, segregation of duties, access). The Practical Lab joins them: **take a control, turn it into a test on data, run it, investigate the exceptions, and write the result as a finding** (Topic 8).\n\n```\n CONTROL (Topic 7)  ->  TEST ON DATA  ->  EXCEPTIONS  ->  INVESTIGATE  ->  WORKING PAPER  ->  FINDING (Topic 8)\n e.g. \"leavers'          match HR list     list of active     real problem     record every      condition, criteria,\n accounts are            to user list      leavers            or data issue?   step              cause, effect, rec.\n disabled in 1 day\"\n```\n\n### P.2 The seven-step method for every practical task\n\nFollow this order every time. It is also how marks are earned.\n\n| # | Step | What to do | Why |\n|---|---|---|---|\n| 1 | **Define the objective, control and criteria** | State what you are testing and the benchmark (policy, tariff guide, rule) | Without criteria there is no \"exception\" |\n| 2 | **Obtain the data and note its source** | Record file name, source system, date extracted, who provided it | Evidence must be traceable |\n| 3 | **Validate the data (completeness and accuracy)** | Record count, control totals, blanks, data types, date ranges; compare to the source system totals | If the data is incomplete, every result is unreliable |\n| 4 | **Prepare the data** | Keep the **raw data untouched** on one sheet; work on a copy; clean text and dates | Protects evidence |\n| 5 | **Run the test** | Formulas, filters or the IDEA function | The core of the work |\n| 6 | **Investigate exceptions** | Is each exception a real control failure, a timing difference, or a data error? Find the cause | Not every flag is a finding |\n| 7 | **Document and conclude** | Working paper: objective, procedure, population, result, exceptions, conclusion, reference | The report and the oral defence depend on it |\n\n### P.3 Step 3 in practice: validating the data\n\n**Why it comes first.** Suppose the HR leavers file is meant to have 480 rows but your copy has 450 because of a failed export. Your leavers test would look cleaner than reality. Validation catches that.\n\n| Check | Excel | What it tells you |\n|---|---|---|\n| **Record count** | `=COUNTA(A2:A5000)` (counts non-blank cells in the ID column) | Does the number of rows match the source system's record count? |\n| **Control total** | `=SUM(D2:D5000)` | Does the sum of amounts match the source report or general ledger? |\n| **Blanks** | `=COUNTBLANK(D2:D5000)` | Missing values in a key field |\n| **Duplicate IDs** | `=SUMPRODUCT((COUNTIF(A2:A5000,A2:A5000)>1)*1)` | How many rows share an ID |\n| **Data types** | Click a cell; check whether dates are real dates (right-aligned) or text (left-aligned) | Dates stored as text break calculations |\n| **Date range** | `=MIN(E2:E5000)` and `=MAX(E2:E5000)` | Are all dates inside the period under review? |\n| **Extra spaces** | `=TRIM(A2)` and compare with `=A2` | Hidden spaces make matches fail |\n\n**Worked example (illustrative).** The source system says the payments file for September contains **1,250 payments totalling UGX 842,300,000**. Your file shows `COUNTA = 1,250` and `SUM = 842,300,000`. Both agree, so the data is **complete** for your purposes. If the count had been 1,198, you would stop, ask for a new extract and record the difference as a limitation.\n\n### P.4 The Excel toolkit: which tool for which test\n\nRead this table, then work through the labs. Every formula is explained line by line in the labs.\n\n| Test | Excel tool | IDEA equivalent (what it does) |\n|---|---|---|\n| Import and validate | Data > From Text/CSV; `COUNTA`, `SUM` | Import Assistant; field statistics to compare record counts and totals |\n| Find duplicates | `COUNTIF`, `COUNTIFS` | Duplicate Key Detection |\n| Find gaps in a sequence | Sort ascending, then `=A3-A2-1` | Gaps Detection |\n| Match two lists | `XLOOKUP`, `VLOOKUP`, `INDEX/MATCH`, `COUNTIF` | Join Databases (matches, non-matches) |\n| Recompute values | A formula column; difference column | Add a computed field with an equation |\n| Summarise | PivotTable, `SUMIFS`, `COUNTIFS` | Summarization |\n| Group into bands | `COUNTIFS` bands, histogram | Stratification, Aging |\n| Select exceptions | Filter, Advanced Filter | Extract with criteria |\n| Sample | `RAND`, `RANDBETWEEN`, `MOD` | Sampling (random, systematic, monetary unit, attribute) |\n| Test digit patterns | (not simple) | Benford's Law analysis |\n| Record the audit trail | Working paper tab | Step history recorded automatically |\n\n**Excel or IDEA?**\n\n| | **Excel** | **IDEA** |\n|---|---|---|\n| Strengths | Familiar; flexible; easy to show formulas and explain; good for files up to about one million rows | Handles very large files; works on a copy so the source stays unchanged; records every step automatically; built-in audit tests |\n| Limits | A worksheet has a row limit (1,048,576 rows); easy to overwrite data by accident; the auditor must document steps manually | Needs the software; less flexible for custom logic; requires learning menus |\n| When to choose | Small to medium data; logic you must explain line by line | Large data; need an automatic audit trail; standard audit tests |\n\n### P.5 Lab 1: Leavers still active (CW2 area f)\n\n**Objective.** Test the control \"accounts of staff who leave are disabled within one working day.\"\n**Criteria.** Access control policy: disable within 1 working day of exit.\n**Assertion.** Validity and confidentiality of access (only authorised people have access).\n**Data.** Two lists:\n\n*HR_Leavers sheet*\n\n| EmpID | Name | ExitDate |\n|---|---|---|\n| E101 | Agnes N. | 2026-06-30 |\n| E102 | Peter K. | 2026-07-15 |\n| E103 | Susan A. | 2026-07-31 |\n| E104 | Brian M. | 2026-08-10 |\n\n*Users sheet (system export)*\n\n| UserID | EmpID | Status | LastLogin |\n|---|---|---|---|\n| u201 | E101 | Active | 2026-07-12 |\n| u202 | E102 | Disabled | 2026-07-14 |\n| u203 | E103 | Disabled | 2026-07-31 |\n| u205 | E105 | Active | 2026-09-01 |\n\n(E104 has no user record. E105 is not a leaver.)\n\n**Steps, line by line.**\n\n1. **Validate.** Count rows in each sheet and agree to the source counts.\n2. **Look up each leaver's status.** In `HR_Leavers!D2`:\n `=XLOOKUP(A2, Users!B:B, Users!C:C, \"No account\")`\n - `A2` is the leaver's EmpID.\n - `Users!B:B` is where to look (EmpID column in Users).\n - `Users!C:C` is what to return (the Status).\n - `\"No account\"` is shown if no match is found.\n *If your Excel lacks XLOOKUP:* `=IFERROR(VLOOKUP(A2, Users!B:D, 2, FALSE), \"No account\")`. (`2` means the second column of `B:D`, which is Status; `FALSE` forces an exact match.)\n3. **Look up the last login.** In `E2`: `=XLOOKUP(A2, Users!B:B, Users!D:D, \"\")`\n4. **Flag active leavers.** In `F2`:\n `=IF(D2=\"Active\", \"EXCEPTION: active after exit\", \"OK\")`\n5. **Flag logins after exit.** In `G2`:\n `=IF(AND(D2=\"Active\", E2>C2), \"EXCEPTION: login after exit\", \"\")`\n - `AND(...)` requires both: the account is active and the last login date is later than the exit date.\n6. **Count and rate.** `=COUNTIF(F2:F5,\"EXCEPTION*\")` counts exceptions; divide by `=COUNTA(A2:A5)` for the rate. (`*` is a wildcard.)\n\n**Expected result.**\n\n| EmpID | Status | LastLogin | Exit | Result |\n|---|---|---|---|---|\n| E101 | Active | 2026-07-12 | 2026-06-30 | **Active after exit; login 12 days after exit** |\n| E102 | Disabled | 2026-07-14 | 2026-07-15 | OK |\n| E103 | Disabled | 2026-07-31 | 2026-07-31 | OK |\n| E104 | No account | | 2026-08-10 | OK (no account to disable; confirm none existed) |\n\nExceptions: 1 of 4 (25%) in this tiny sample; in a real file of 480 you would report counts and rates like \"12 of 480 (2.5%)\".\n\n**Investigate.** For E101: was there a documented reason (handover)? Was it a shared account? Who used it? For E104: confirm the person never had an account, or that it was deleted (not just missing from this export).\n\n**Finding.** See the finding in Topic 8 (8.3, finding 3).\n\n**IDEA equivalent.** *Join Databases* between the leavers file and the users file on EmpID, keeping matches only; then *extract* those with Status = Active.\n\n### P.6 Lab 2: Duplicate payments, gaps and unusual transactions (completeness and fraud risk)\n\n**Objective.** Test completeness and look for duplicate payments, missing document numbers and unusual patterns.\n**Criteria.** Duplicate payments should be rejected (completeness control); payment cheque numbers should be sequential; payments above the approval limit need a second approver.\n**Data (Payments sheet, sample):**\n\n| Row | Cheque | Supplier | Invoice | Amount | Date |\n|---|---|---|---|---|---|\n| 2 | 5001 | S01 | INV-203 | 450,000 | Mon |\n| 3 | 5002 | S02 | INV-118 | 1,200,000 | Mon |\n| 4 | 5004 | S01 | INV-203 | 450,000 | Tue |\n| 5 | 5005 | S03 | INV-331 | 4,800,000 | Sat |\n| 6 | 5009 | S04 | INV-402 | 300,000 | Wed |\n\n*(Column letters used in the formulas: A = Row, B = Cheque, C = Supplier, D = Invoice, E = Amount, F = Date. In your own file, put real dates in column F.)*\n\n**Test A: duplicates.** Same supplier, same invoice, same amount.\nIn `G2`: `=COUNTIFS($C$2:$C$6, C2, $D$2:$D$6, D2, $E$2:$E$6, E2)`\n- `COUNTIFS` counts rows where **all** the conditions are true.\n- `$C$2:$C$6` is the supplier column, locked with `$` so it does not move when you copy the formula down.\n- It counts how many rows share this row's supplier, invoice **and** amount.\nResult: rows 2 and 4 both give **2**, so they are **duplicate payment suspects** (INV-203 paid twice). Flag with `=IF(G2>1,\"DUPLICATE?\",\"\")`.\n\n> **Do not use \"Remove Duplicates\" on your original data.** It deletes rows, destroying evidence. Flag, do not delete.\n\n**Test B: gaps in the cheque sequence.** Sort the data by cheque number, ascending. In `H3`: `=B3-B2-1`\n- `B3-B2` is the difference between consecutive cheque numbers; subtracting 1 gives how many numbers are **missing** between them.\nResults: row 3: 5002 − 5001 − 1 = 0; row 4: 5004 − 5002 − 1 = **1** (5003 missing); row 5: 5005 − 5004 − 1 = 0; row 6: 5009 − 5005 − 1 = **3** (5006 to 5008 missing).\nShow the gap in words: `=IF(H4>0,\"GAP: \"&B3+1&\" to \"&B4-1,\"\")` gives \"GAP: 5003 to 5003\".\n**Total missing cheques:** 4. Investigate: voided, cancelled, or unrecorded payments?\n\n**Test C: near the approval limit.** Suppose payments above 5,000,000 need a second approver. In `I2`:\n`=IF(AND(E2>=0.9*5000000, E2<5000000), \"NEAR LIMIT\", \"\")`\n- It flags amounts from 90% of the limit up to just below it (4,500,000 to 4,999,999). This detects possible splitting to avoid approval.\nResult: 4,800,000 on row 5 is flagged.\n\n**Test D: weekend payments.** In `J2`: `=IF(WEEKDAY(F2,2)>5, \"WEEKEND\", \"\")`\n- `WEEKDAY(date, 2)` numbers Monday as 1 up to Sunday as 7, so `>5` means Saturday or Sunday. (Use real dates in column F.)\nResult: row 5 (Saturday) is also flagged: the same payment is near the limit **and** on a weekend. Two flags on one item raises priority.\n\n**Test E: round amounts.** `=IF(MOD(E2,100000)=0,\"ROUND\",\"\")` flags amounts that are exact multiples of 100,000. (`MOD` gives the remainder after division.)\n\n**IDEA equivalents.** *Duplicate Key Detection* (keys: supplier, invoice, amount); *Gaps Detection* (key: cheque number); *extract* with criteria for near-limit amounts.\n\n**Interpreting exceptions.** A duplicate may be a legitimate part-payment with the same amount; a gap may be a voided cheque. The test finds **candidates**; the auditor decides after checking documents.\n\n### P.7 Lab 3: Independent recomputation of interest (CW2 area d)\n\n**Objective.** Test whether interest credited to savings accounts was computed correctly (accuracy).\n**Criteria.** Product definition and approved rate table: interest = balance × annual rate × days in period ÷ 365.\n**Data (illustrative):**\n\n| Account | Balance | Approved rate | Days | Interest posted |\n|---|---|---|---|---|\n| A | 5,000,000 | 10% | 30 | 41,096 |\n| B | 2,000,000 | 12% | 31 | 19,726 |\n| C | 8,000,000 | 9% | 30 | 59,178 |\n| D | 1,500,000 | 15% | 30 | 17,260 |\n\n**Steps, line by line.**\n\n1. **Recompute.** In `F2`: `=ROUND(B2*C2*D2/365, 0)`\n - `B2*C2` is balance × rate (the annual interest).\n - `*D2/365` scales it to the number of days.\n - `ROUND(...,0)` rounds to the nearest whole shilling to match how the system posts.\n2. **Compute the difference.** In `G2`: `=E2-F2` (posted minus recomputed).\n3. **Flag differences beyond a tolerance for rounding.** In `H2`: `=IF(ABS(G2)>1, \"EXCEPTION\", \"OK\")` (`ABS` ignores the sign).\n\n**Results.**\n\n| Account | Recomputed | Posted | Difference | Result |\n|---|---|---|---|---|\n| A | 41,096 | 41,096 | 0 | OK |\n| B | 20,384 | 19,726 | **−658** | EXCEPTION |\n| C | 59,178 | 59,178 | 0 | OK |\n| D | 18,493 | 17,260 | **−1,233** | EXCEPTION |\n| **Total** | **139,151** | **137,260** | **−1,891** | |\n\n**Reconcile the totals.** `=SUM(F2:F5)` gives 139,151 (recomputed); `=SUM(E2:E5)` gives 137,260 (posted); the difference −1,891 equals the sum of the individual differences (−658 + −1,233), so the reconciliation closes. Also agree the posted total to the **general ledger** control account.\n\n**Investigate each exception, line by line.**\n\n- **Account B (−658).** One day's interest on this account is 2,000,000 × 12% ÷ 365 = **657.53 ≈ 658**. The difference is exactly one day. The system used **30** days for a 31-day month. *Cause:* the day-count parameter is fixed at 30 for the batch. *Effect:* customers under-credited; the pattern would repeat for every account in 31-day months.\n- **Account D (−1,233).** Recompute at 14%: 1,500,000 × 14% × 30 ÷ 365 = 17,260. The posted amount matches **14%**, but the approved product rate is **15%**. *Cause:* the rate table was not updated after a rate change (a master data or change management weakness). *Effect:* under-credited interest; possible customer complaints and regulatory exposure.\n\n**How this appears in the report.** In the **testing summary**: the basis of calculation (formula and parameters), population and results, reconciliation outcome. In the **findings**: two five-part findings (day-count error; rate table error), with the shortfall quantified. In the **working paper**: the sheet with formulas visible.\n\n**Note on direction.** Here the bank *under-credited* savers. In a loan product the same errors would mean the bank *under-charged* or *over-charged* borrowers. Always state the direction and who is affected.\n\n**IDEA equivalent.** Add a computed field with the same equation, then *extract* records where the absolute difference exceeds the tolerance.\n\n\n### P.8 Lab 4: Tariff accuracy and excise duty (CW2 area c)\n\n**Objective.** Test whether the correct fee and excise duty were charged on transactions (accuracy), and whether overrides were controlled.\n**Criteria.** Approved tariff guide (illustrative): fee by amount band; excise duty = 15% of the fee.\n\n*Tariff sheet (sorted ascending by the lower bound)*\n\n| LowerBound | Fee |\n|---|---|\n| 0 | 500 |\n| 50,001 | 1,000 |\n| 200,001 | 2,000 |\n\n*Transactions sheet*\n\n| TxnID | Amount | Charged |\n|---|---|---|\n| T1 | 30,000 | 575 |\n| T2 | 120,000 | 1,000 |\n| T3 | 250,000 | 2,500 |\n| T4 | 60,000 | 1,150 |\n| T5 | 40,000 | 500 |\n\n**Steps, line by line** (columns: A TxnID, B Amount, C Charged, D Fee, E Excise, F Expected, G Difference, H Result).\n\n1. **Find the fee from the band.** `D2`: `=VLOOKUP(B2, Tariff!$A$2:$B$4, 2, TRUE)`\n - The last argument `TRUE` means **approximate match**: Excel finds the **largest lower bound that is not greater than the amount**. For 120,000 it picks the row starting at 50,001, so the fee is 1,000.\n - **The tariff table must be sorted ascending** for approximate match to work.\n2. **Compute excise duty.** `E2`: `=ROUND(D2*0.15, 0)`\n3. **Expected total.** `F2`: `=D2+E2`\n4. **Difference.** `G2`: `=C2-F2` (charged minus expected: negative = under-charged)\n5. **Result.** `H2`: `=IF(G2<0,\"UNDER-CHARGED\",IF(G2>0,\"OVER-CHARGED\",\"OK\"))`\n\n**Results.**\n\n| TxnID | Amount | Fee | Excise | Expected | Charged | Difference | Result |\n|---|---|---|---|---|---|---|---|\n| T1 | 30,000 | 500 | 75 | 575 | 575 | 0 | OK |\n| T2 | 120,000 | 1,000 | 150 | 1,150 | 1,000 | **−150** | UNDER-CHARGED |\n| T3 | 250,000 | 2,000 | 300 | 2,300 | 2,500 | **+200** | OVER-CHARGED |\n| T4 | 60,000 | 1,000 | 150 | 1,150 | 1,150 | 0 | OK |\n| T5 | 40,000 | 500 | 75 | 575 | 500 | **−75** | UNDER-CHARGED |\n\n**Summarise gross, not only net.**\n- Under-charged total: `=SUMIF(G2:G6,\"<0\")` = **−225**.\n- Over-charged total: `=SUMIF(G2:G6,\">0\")` = **+200**.\n- Net: −25.\nThe net of −25 would look harmless, but it **hides offsetting errors**: the bank under-collected 225 (and the excise duty owed to the revenue authority) and over-charged a customer 200. Always report under and over separately.\n\n**Investigate.**\n- *T2 and T5:* the charge equals the fee alone (150 = 15% of 1,000; 75 = 15% of 500). **Excise duty was not applied** for these transactions. Look for what they have in common (channel? product code?).\n- *T3:* charged 2,500 where the approved total is 2,300. 2,500 is not a tariff value, so check for a **manual override** or a different tariff version.\n- **Override controls.** Filter on the override flag. For each override, check there is an **approver**, a **reason**, and that the approver is **not the same person** who made the override (segregation of duties).\n\n**IDEA equivalent.** Add a computed field using the tariff logic (or *Join* to the tariff table), compute the difference, *extract* non-zero differences, then *summarise* by product code or channel.\n\n### P.9 Lab 5: Product eligibility validation (CW2 area e)\n\n**Objective.** Test whether accounts were opened only for customers who meet the product rules (validity and accuracy).\n**Criteria (illustrative):** *Junior Savings:* customer must be **under 18** at account opening. *Fixed Deposit (FD):* minimum balance **1,000,000** and a mandatory fee of **5,000**.\n\n*Accounts sheet* (A Acct, B Product, C DOB, D OpenDate, E Balance, F Fee)\n\n| Acct | Product | DOB | OpenDate | Balance | Fee |\n|---|---|---|---|---|---|\n| 1 | Junior | 2005-03-10 | 2026-02-01 | 50,000 | 0 |\n| 2 | Junior | 2014-08-20 | 2026-02-05 | 30,000 | 0 |\n| 3 | FD | 1990-01-01 | 2026-03-01 | 800,000 | 5,000 |\n| 4 | FD | 1985-06-15 | 2026-03-02 | 2,000,000 | 0 |\n| 5 | FD | 1978-12-12 | 2026-03-03 | 1,500,000 | 5,000 |\n\n**Steps, line by line.**\n\n1. **Age at opening.** `G2`: `=DATEDIF(C2, D2, \"Y\")`\n - `DATEDIF(start, end, \"Y\")` returns **complete years** between the dates. For account 1: from 2005-03-10 to 2026-02-01 is 20 complete years (the 21st birthday had not yet arrived). Use age **at opening**, not today.\n2. **Junior age rule.** `H2`: `=IF(AND(B2=\"Junior\", G2>=18), \"EXCEPTION: not under 18\", \"\")`\n3. **FD minimum balance.** `I2`: `=IF(AND(B2=\"FD\", E2<1000000), \"EXCEPTION: below minimum\", \"\")`\n4. **FD mandatory fee.** `J2`: `=IF(AND(B2=\"FD\", F2<>5000), \"EXCEPTION: fee not charged\", \"\")` (`<>` means \"not equal\").\n\n**Results.**\n\n| Acct | Finding |\n|---|---|\n| 1 | Age 20 at opening on a Junior account: **ineligible** |\n| 2 | Age 11: OK |\n| 3 | Balance 800,000 is below the 1,000,000 minimum: **exception** |\n| 4 | Mandatory fee of 5,000 not charged: **exception** |\n| 5 | OK |\n\n3 exceptions of 5 accounts.\n\n**Investigate.** Is there a **documented, approved exception** (who approved, why)? Approved exceptions are not control failures if the process allows them and they are recorded. **Unapproved** ones show that the system does not enforce the rule. *Cause* might be: no validation in account opening, or staff overriding. *Effect:* customers on the wrong products; lost fee income (5,000 on account 4); regulatory or product risk.\n\n### P.10 Lab 6: Segregation of duties conflicts (CW2 area f)\n\n**Objective.** Find users who hold conflicting permissions.\n**Criteria (illustrative conflict matrix):** *Conflict 1:* Create Supplier and Approve Payment. *Conflict 2:* Enter Invoice and Approve Invoice.\n\n*Permissions sheet* (A User, B Permission), long format (one row per permission):\n\n| User | Permission |\n|---|---|\n| Agnes | Create Supplier |\n| Agnes | Approve Payment |\n| Peter | Enter Invoice |\n| Brian | Approve Payment |\n| Susan | Enter Invoice |\n| Susan | Approve Invoice |\n\n**Steps, line by line.**\n\n1. **Test conflict 1.** `C2`:\n `=IF(AND(COUNTIFS($A$2:$A$7,A2,$B$2:$B$7,\"Create Supplier\")>0, COUNTIFS($A$2:$A$7,A2,$B$2:$B$7,\"Approve Payment\")>0), \"CONFLICT 1\", \"\")`\n - The first `COUNTIFS` counts how many rows say *this user* has *Create Supplier*.\n - The second counts how many say *this user* has *Approve Payment*.\n - `AND(... >0, ... >0)` is true only when the user holds **both**.\n2. **Test conflict 2.** `D2`: the same pattern with \"Enter Invoice\" and \"Approve Invoice\".\n3. **List conflicted users.** Filter columns C and D for non-blank.\n\n**Results.** Agnes: conflict 1 (both her rows flag). Susan: conflict 2. Peter and Brian: none.\n\n**PivotTable alternative.** Insert a PivotTable: Rows = User, Columns = Permission, Values = Count of Permission. A user with a **1** under both conflicting permissions is a conflict. The pivot is easier to show in a report.\n\n**Investigate.** Is there a **compensating control** (a supervisor reviewing everything Agnes creates and approves)? Check the **access log** to see whether the conflict was ever **used** (for example, a supplier created and paid by the same user). *Movers:* compare current permissions to the user's new department: a person who moved from procurement to finance may keep old rights.\n\n**IDEA equivalent.** *Join* the permissions file with itself (or summarise by user and permission) to find users appearing in both conflicting permission groups.\n\n### P.11 Lab 7: Password configuration compliance (CW2 area b)\n\n**Objective.** Compare the system configuration to the policy parameter by parameter.\n\n| # | Parameter | Policy requires | System shows | Rule |\n|---|---|---|---|---|\n| 1 | Minimum length | 8 | 6 | actual **≥** policy |\n| 2 | Maximum age (days) | 90 | 0 | actual **> 0 and ≤** policy |\n| 3 | History remembered | 5 | 3 | actual **≥** policy |\n| 4 | Lockout threshold | 5 | 10 | actual **> 0 and ≤** policy |\n| 5 | Complexity | Enabled | Enabled | equal |\n| 6 | MFA for administrators | Required | Not enabled | equal |\n\n**Formulas (columns: B policy, C system, D result).**\n- Minimum length and history (higher is stricter): `=IF(C2>=B2,\"Compliant\",\"Non-compliant\")`\n- Maximum age and lockout (lower is stricter, but 0 usually means \"never\"): `=IF(AND(C3>0, C3<=B3),\"Compliant\",\"Non-compliant\")`\n- Text settings: `=IF(C6=B6,\"Compliant\",\"Non-compliant\")`\n\n**Why the direction matters.** For length, a bigger number is stricter. For lockout threshold, a **smaller** number is stricter (lock after 3 attempts is tighter than after 10). And in many systems **0 means \"never\"** (password never expires, account never locks out), which is the weakest setting, not the strictest. Always check what a setting's value means in the system's documentation.\n\n**Results.** Items 1, 2, 3, 4 and 6 are non-compliant; item 5 is compliant (1 of 6). Write the finding as in Topic 8 (8.3, finding 1).\n\n### P.12 Lab 8: Sampling in Excel, and evaluating the sample\n\n**When you cannot test everything** (for example, you must inspect paper approval forms), select a sample properly.\n\n**Random sample.**\n1. Add a helper column `=RAND()` next to each record (a random number between 0 and 1).\n2. Sort the data by the helper column.\n3. Take the first *n* rows as the sample.\n4. **Copy the helper column and Paste Special > Values** so the numbers stop changing (`RAND` recalculates every time the sheet changes).\n\n**Systematic sample.** Population N = 600; sample size 40.\n1. Interval = `INT(600/40)` = **15**.\n2. Random start between 1 and 15: `=RANDBETWEEN(1,15)`, say **7**.\n3. Item number *k* in the list is selected when `(k − 7)` is divisible by 15, so items 7, 22, 37, and so on. In Excel, with a running item number in column A: `=IF(MOD(A2-7,15)=0,\"SELECT\",\"\")`.\n\n**Evaluating results (as in Topic 6, 6.12.2).**\n- Deviation rate = exceptions ÷ sample size. If 6 of 40 forms lack approval: 6 ÷ 40 = **15%**.\n- Compare with the tolerable rate (say 5%). 15% > 5%, so the control is **not operating effectively**.\n- Note the limit: a sample result suggests a rate for the population but does not prove which items are wrong. If the data is electronic, test **all** of it instead.\n\n### P.13 Using IDEA: the workflow and what to remember\n\nThe functions differ in name between versions, so learn the **workflow** and check the exact menus in your practical guide:\n\n| Step | What you do in IDEA | Equivalent idea in Excel |\n|---|---|---|\n| 1 | **Import** the file (CSV, Excel, text) using the import assistant; define field names and types | Open the file; set data types |\n| 2 | **Validate**: compare the record count and control totals with the source | `COUNTA`, `SUM` |\n| 3 | **Analyse** with built-in tests: duplicate key detection, gaps detection, summarization, stratification, aging, join/compare databases, sampling, Benford's law | Formulas and PivotTables |\n| 4 | **Extract exceptions** into a new result file using criteria | Filter and copy |\n| 5 | **Document**: IDEA records each step in a history log you can cite | Working paper tab |\n| 6 | **Export** results to Excel or the report | Copy results |\n\n**Why IDEA suits audit work.** The imported source is treated as read-only; every result is a new file; every step is logged. That is a strong **audit trail** (Topic 7) for your own testing.\n\n**Benford's law (IDEA).** In many natural financial data sets, the first digits of numbers appear with a predictable pattern (1 is most common, 9 least). A strong deviation can indicate invented or manipulated figures and is a pointer for further testing, not proof.\n\n### P.14 Documenting your work: the working paper\n\nKeep **one workbook per test** with these tabs:\n\n| Tab | Contents |\n|---|---|\n| **Raw** | The original data, **never edited** |\n| **Work** | Your formulas and flag columns |\n| **Exceptions** | The filtered list of flagged items |\n| **Summary** | Counts, rates, amounts (for example, 12 of 480; total shortfall) |\n| **WP** | The documentation block below |\n\n**Working paper block (copy this):**\n\n| Field | Example |\n|---|---|\n| WP reference | WP D3 |\n| Objective | Test accuracy of savings interest credited for September |\n| Control and criteria | Interest = balance × rate × days ÷ 365 per approved rate table |\n| Data source | `Interest_Sept.xlsx` extracted from Core Banking on 2 Oct by IT; provided via MUBSEP |\n| Data validation | Record count 1,250 and total interest 842,300,000 agree to the GL report |\n| Population | All 1,250 savings accounts |\n| Procedure | Recomputed interest in column F; difference in column G; tolerance ±1 |\n| Results | 1,190 agree; 60 exceptions; total variance −1,891,000 |\n| Investigation | 41 caused by 30-day count in 31-day month; 19 by an outdated rate on product SAV02 |\n| Conclusion | Control not operating effectively; see finding 4 |\n| Prepared by / date | Name, date |\n| Reviewed by / date | Name, date |\n\n### P.15 Common errors and how to avoid them\n\n| Error | What happens | Fix |\n|---|---|---|\n| Numbers stored as text | Sums and comparisons give wrong results | Convert; use `VALUE`; check alignment |\n| Hidden leading or trailing spaces | Lookups return \"not found\" | `TRIM`, `CLEAN` |\n| Dates stored as text | Date formulas fail | Convert to real dates |\n| `VLOOKUP` approximate match on an unsorted table | Wrong values with no warning | Sort ascending, or use `FALSE` for exact match |\n| Forgetting `$` | Ranges shift when you copy a formula down | Lock with `$` |\n| `SUM` on a filtered list | Hidden rows are still added | Use `SUBTOTAL(109, range)` |\n| Using \"Remove Duplicates\" on evidence | Rows deleted forever | Flag with formulas; keep raw data |\n| `RAND` recalculating | The sample changes | Paste values |\n| Comparing different units | Thousands vs units mismatch | Check column headings and scale |\n| Reporting net only | Offsetting errors hidden | Report gross under and over separately |\n| Treating every flag as a finding | False conclusions | Investigate each exception first |\n| No evidence trail | You cannot defend your work | Keep the Raw tab, label sheets, reference WPs |\n\n### P.16 The practical test: approach and marking checklist\n\n**Approach in the time you have:**\n1. **Read all tasks first**; note which assertions and controls each tests.\n2. **Check the data** before any test (count, totals, blanks, dates).\n3. **Work each task with the seven steps** (P.2), writing formulas you can explain.\n4. **Label** columns and sheets; show the formulas (do not paste values only).\n5. **Summarise** each result in one or two lines (counts, rate, amount).\n6. **State the conclusion** and, if asked, a recommendation.\n7. **Save versions** as you go.\n\n**What an examiner is likely to look for:**\n\n| Element | What earns marks |\n|---|---|\n| Correct procedure | The right test for the control (duplicates, gaps, recomputation, join) |\n| Correct formulas | Right references, locked ranges, correct function |\n| Correct exceptions | Right items identified |\n| Interpretation | Cause identified (for example, \"30-day count\"), direction stated, amount quantified |\n| Evidence and documentation | Raw data intact, working paper, referenced results |\n| Conclusion | A clear statement on whether the control works, with a recommendation |\n\n### P.17 Common misconceptions and exam traps\n\n| Trap | Truth |\n|---|---|\n| \"The tool proves the control works\" | Tools find exceptions in the data provided; they cannot test controls that leave no data trail, and results depend on complete and accurate data. |\n| \"No exceptions means no problem\" | The data may be incomplete, the test may be wrongly designed, or the control may not be reflected in the data. |\n| \"Every exception is a finding\" | Each exception must be investigated; some are data errors or approved exceptions. |\n| \"Excel and IDEA give different answers\" | They should agree; differences point to data preparation or logic errors. |\n| \"Remove duplicates cleans the data for the audit\" | It destroys evidence. Flag, do not delete. |\n| \"Net variance is enough\" | Show gross under and over amounts. |\n| \"A sample result is the same as a full test\" | A sample estimates; a full test finds all exceptions. |\n\n### P.18 Revision summary (Practical Lab)\n\n- Seven steps: define objective and criteria; obtain data; validate (count, totals, blanks, dates); prepare (keep raw untouched); run the test; investigate exceptions; document and conclude.\n- Excel tools: `COUNTIFS` (duplicates), sorted difference (gaps), `XLOOKUP`/`VLOOKUP` (matching), formula columns (recomputation), PivotTables, `IF/AND`, `DATEDIF`, `WEEKDAY`, `MOD`, `RAND`.\n- IDEA: import, validate, duplicate key detection, gaps detection, join, summarization, stratification, sampling, Benford, automatic history log.\n- Lab results to remember: leavers still active; duplicate and gap detection; interest recomputation (day-count and rate table errors); tariff and excise (under and over); eligibility (age, minimum balance, fee); SoD (create and approve conflicts); password compliance (direction of each rule).\n- Report gross under and over amounts; reconcile totals; quantify the effect.\n- Document every test in a working paper with the Raw data untouched.\n\n---\n\n## PHASE 2 — COMPREHENSION CHECKS (Practical Lab)\n\n**C1. Why must you validate the data before running any test?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nBecause every result depends on the data being complete and accurate. If the extract is missing records or the totals do not agree with the source system, an apparently clean result may only mean that the problem rows were never loaded. Comparing record counts and control totals to the source shows whether the population you are testing is the real population. Without validation you could report a false assurance.\n\n**Check:** complete and accurate data first; otherwise results are unreliable.\n<\/details>\n\n**C2. Why should you flag duplicates with a formula instead of using \"Remove Duplicates\"?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\n\"Remove Duplicates\" deletes rows from the data, destroying audit evidence and leaving no record of what was removed. Flagging with a formula such as `COUNTIFS` keeps all the data, shows which rows are suspect and why, and lets you investigate each (a repeated amount may be a legitimate part-payment).\n\n**Check:** evidence must stay intact; duplicates are suspects, not automatically errors.\n<\/details>\n\n**C3. In Lab 3, why is the difference for account B exactly one day's interest, and what does that tell you?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nOne day's interest for account B is 2,000,000 × 12% ÷ 365 = 657.53, and the difference is 658. That pattern means the system used 30 days instead of 31. It points to a fixed day-count parameter rather than a random error, so other accounts in 31-day months are probably affected too, which turns a single exception into a systemic finding.\n\n**Check:** the size of the difference reveals the cause.\n<\/details>\n\n**C4. Why report both the under-charged and the over-charged totals in the tariff test, rather than just the net?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nThe net can hide offsetting errors: in Lab 4, −225 under-charged and +200 over-charged net to −25, which looks trivial. But the bank under-collected excise duty it owes to the revenue authority and over-charged a customer, so each error has its own consequence. Reporting gross amounts shows the full extent of control failure.\n\n**Check:** gross shows the real exposure; net can mislead.\n<\/details>\n\n**C5. What does a lockout threshold of 0 usually mean, and why does that matter for compliance testing?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nIn many systems 0 means \"disabled\" or \"never\", so an account is never locked out however many wrong passwords are entered. If your formula only checks \"value ≤ policy value\", 0 would look compliant, though it is the weakest setting. You must test for greater than 0 and no more than the policy value, and check the documentation for what the number means.\n\n**Check:** direction of the rule and the special meaning of 0.\n<\/details>\n\n**C6. Which part of this lab would confuse someone seeing it for the first time?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\n(1) Approximate vs exact match in `VLOOKUP`. (2) Why a duplicate flag is not a finding. (3) Anchoring ranges with `$`. (4) Which direction is \"stricter\" for each password parameter. (5) The difference between testing a sample and testing the whole population.\n<\/details>\n\n---\n\n## PHASE 3 — ACTIVE RECALL BANK (Practical Lab)\n\n### Level 1 — Basic recall\n\n**Q1.** List the seven steps for any practical data test.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** (1) Define objective, control and criteria; (2) obtain the data and note its source; (3) validate completeness and accuracy; (4) prepare the data, keeping raw data untouched; (5) run the test; (6) investigate exceptions; (7) document and conclude.\n\n**Common mistake:** skipping validation (step 3) or investigation (step 6).\n<\/details>\n\n**Q2.** Which Excel functions would you use to (a) find duplicate payments, (b) match leavers to users, (c) find the fee from an amount band, (d) detect weekend dates?\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** (a) `COUNTIFS` (with `IF` to flag counts above 1). (b) `XLOOKUP` or `VLOOKUP`/`COUNTIF`. (c) `VLOOKUP` with approximate match on a sorted tariff table. (d) `WEEKDAY(date,2)>5`.\n\n**Common mistake:** using `VLOOKUP` with `FALSE` for the tariff bands, which only matches exact amounts.\n<\/details>\n\n**Q3.** Name three IDEA analysis functions and what each does.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Duplicate key detection (finds records sharing the same key fields); gaps detection (finds missing numbers in a numeric sequence); summarization (totals by a field, like a PivotTable). Others: stratification, aging, join, compare, sampling, Benford's law.\n\n**Common mistake:** describing gaps detection as finding duplicates.\n<\/details>\n\n**Q4.** What is a control total, and how is it used in validating data?\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** A control total is a total of a numeric field (or a record count) that can be agreed to an independent source. After loading data, compare your record count and sum to the source system's report; if they agree, the data is complete for testing.\n\n**Common mistake:** thinking a control total is a type of formula only used in Excel.\n<\/details>\n\n### Level 2 — Understanding\n\n**Q5.** Explain the difference between testing a sample and testing the whole population using Excel or IDEA, and when each is appropriate.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** A sample tests selected items and estimates a population rate; it is used where data is not electronic or testing involves manual evidence (inspecting forms). A full population test examines every record, found by formulas or IDEA functions, and finds all exceptions; it is appropriate where data is electronic and complete. Full testing removes sampling risk but depends on data completeness and accuracy.\n\n**Marking:** two definitions (2), when to use each (2), data dependence (1).\n\n**Common mistake:** claiming a full test always replaces sampling.\n<\/details>\n\n**Q6.** Compare Excel and IDEA for audit data analysis.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Excel is familiar and flexible and shows formulas clearly, but has a row limit, can overwrite data accidentally, and needs manual documentation. IDEA handles very large files, treats the source as read-only, offers built-in audit tests and logs each step automatically, but needs the software and some training. Choose Excel for smaller data and custom logic, IDEA for large data and an automatic audit trail.\n\n**Common mistake:** saying one is \"better\" without conditions.\n<\/details>\n\n**Q7.** Explain why `VLOOKUP` with `TRUE` needs a sorted table and what goes wrong otherwise.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Approximate match assumes the first column is sorted ascending; Excel searches to find the largest value not greater than the lookup value. If the table is unsorted, it may stop at the wrong row and return a wrong fee without any error message, creating false exceptions or hiding real ones.\n\n**Common mistake:** assuming Excel will warn about the unsorted table.\n<\/details>\n\n### Level 3 — Application\n\n**Q8.** (Calculation) Recompute interest for these savings accounts using days ÷ 365, round to whole shillings, and compute the variance and total variance: (X) balance 3,650,000, rate 8%, 30 days, posted 24,000; (Y) balance 1,000,000, rate 10%, 31 days, posted 8,493; (Z) balance 6,000,000, rate 5%, 28 days, posted 23,014.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:**\n- X: 3,650,000 × 8% = 292,000; × 30 ÷ 365 = 24,000. Posted 24,000. Variance **0**.\n- Y: 1,000,000 × 10% = 100,000; × 31 ÷ 365 = 8,493.15 → 8,493. Posted 8,493. Variance **0**.\n- Z: 6,000,000 × 5% = 300,000; × 28 ÷ 365 = 23,013.70 → 23,014. Posted 23,014. Variance **0**.\nTotal variance: 0. All three agree, so no exception.\n\n**Marking:** three recomputations (3), variances (1), total (1), conclusion (1).\n\n**Common mistake:** dividing by 360 or forgetting to multiply by days. State your assumptions (365).\n<\/details>\n\n**Q9.** (Calculation) Using the Lab 4 tariff (fee bands 0 to 50,000 → 500; 50,001 to 200,000 → 1,000; above 200,000 → 2,000; excise 15% of the fee), compute the expected total and the difference for these transactions: (a) 45,000 charged 575; (b) 90,000 charged 1,000; (c) 300,000 charged 2,300; (d) 200,000 charged 1,150.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:**\n- (a) Fee 500; excise 75; expected 575; charged 575; difference 0.\n- (b) Fee 1,000; excise 150; expected 1,150; charged 1,000; difference **−150** (excise missing).\n- (c) Fee 2,000; excise 300; expected 2,300; charged 2,300; difference 0.\n- (d) 200,000 is in the 50,001 to 200,000 band; fee 1,000; excise 150; expected 1,150; charged 1,150; difference 0.\nOnly (b) is an exception.\n\n**Marking:** four correct bands and amounts (4), exception identified (1), reason (1).\n\n**Common mistake:** putting 200,000 in the top band (the top band starts at 200,001).\n<\/details>\n\n**Q10.** From this payments list, identify duplicates and gaps. Cheques sorted: 7001 (S1, INV-9, 100,000), 7002 (S2, INV-4, 250,000), 7003 (S1, INV-9, 100,000), 7007 (S3, INV-12, 80,000), 7008 (S2, INV-4, 250,000). State the Excel formulas you would use and the results.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** *Duplicates:* `=COUNTIFS(supplier, S, invoice, I, amount, A)` per row. S1/INV-9/100,000 appears twice (7001, 7003); S2/INV-4/250,000 appears twice (7002, 7008). Four rows flagged as two duplicate pairs. *Gaps:* `=B3-B2-1` on sorted cheque numbers: 7003 → 7007 gives 3 (7004, 7005, 7006 missing); others 0. *Next step:* investigate whether pairs are true duplicates or part-payments, and what happened to the three missing cheques.\n\n**Marking:** formulas (2), duplicates (2), gap (2), follow-up (1).\n\n**Common mistake:** deleting the duplicates.\n<\/details>\n\n**Q11.** From this permissions list, identify segregation of duties conflicts and say how you would show them in Excel: Jane: Create Supplier, Approve Payment, View Reports; Omar: Enter Invoice; Rita: Enter Invoice, Approve Invoice; Samuel: Approve Payment. (Conflicts: Create Supplier + Approve Payment; Enter Invoice + Approve Invoice.)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Jane: conflict 1 (create supplier and approve payment). Rita: conflict 2 (enter and approve invoice). Omar and Samuel: none. In Excel use `COUNTIFS` per user and permission with an `AND` test for each conflict pair, or a PivotTable of users by permission and look for users with counts in both conflicting columns. Then investigate whether compensating controls exist and whether the conflict was exercised in the logs.\n\n**Marking:** two conflicts (2), no false positives (1), Excel method (2), follow-up (1).\n\n**Common mistake:** flagging Samuel because \"Approve Payment\" appears in two users' lists.\n<\/details>\n\n### Level 4 — Exam mastery\n\n**Q12.** \"If the tool shows zero exceptions, the control is effective.\" Evaluate. (10 marks)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer outline:**\n1. *Position:* not necessarily; zero exceptions is a result of a particular test on particular data.\n2. *Data completeness and accuracy:* if the extract is incomplete or filtered, exceptions may have been excluded; validate counts and control totals.\n3. *Test design:* the test must match the control and the risk (for example, matching on the wrong field can hide problems; a wrong tolerance can mask differences).\n4. *Control scope:* some controls leave no data trail (physical access, approvals on paper, management review); the tool cannot test them.\n5. *Operating period and coverage:* data may cover only part of the period; the control may have failed outside it.\n6. *Evidence:* corroborate with other procedures (inspection, observation, inquiry, walk-through).\n7. *Link to Topics 6 and 7:* design, implementation and operating effectiveness; sufficient and appropriate evidence.\n8. *Conclusion:* zero exceptions is supportive evidence if the data and test are reliable, not proof by itself.\n\n**Marking criteria:** position (1), four reasons (4), corroboration (2), link (2), conclusion (1).\n\n**Common mistake:** assuming tools replace professional judgement.\n<\/details>\n\n**Q13.** You receive: (1) a 2,400-row HR leavers file, (2) a user list of 3,100 accounts, and (3) a system log. Design the audit test for \"leavers' accounts are disabled within one working day\", including data validation, Excel formulas, exception handling, sample or full test, the working paper contents and one finding. (14 marks)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer outline:**\n*Objective and criteria:* policy requires disabling within 1 working day; assertion: only authorised access.\n*Data validation:* record counts (2,400 and 3,100) agree to source reports; blank EmpIDs; date types; leavers' dates within the period; duplicate EmpIDs in the user list (shared accounts).\n*Test (full population, Excel or IDEA):* match leavers to users on EmpID (`XLOOKUP` or `VLOOKUP`; IDEA Join); flag Status = Active; compute days from exit date to disable date (`=DisableDate-ExitDate`, using `NETWORKDAYS` if needed) and flag more than 1 working day; use the log to find logins after exit.\n*Exception handling:* check for handovers, approved extensions, shared or service accounts; confirm \"no account\" cases; check whether leavers' accounts were deleted rather than disabled.\n*Sample vs full:* full test, since data is electronic.\n*Working paper contents:* reference, objective, data source and validation, population, procedure with formulas, results (counts, rates), investigation, conclusion, prepared by and reviewed by.\n*Finding:* e.g. 140 of 2,400 (5.8%) active after exit; 9 logged in afterwards; criteria policy; cause no HR-IT link; effect fraud and data theft risk; recommendation automate, reconcile monthly, investigate the 9; owner Head of IT/HR; 60 days.\n\n**Marking criteria:** validation (2), test design (4), exceptions (2), working paper (2), finding (4).\n\n**Common mistake:** testing only active users and ignoring \"no account\" or deleted accounts.\n<\/details>\n\n\n---"};</script><script src="assets/app.js"></script><script src="assets/live.js"></script></html>
