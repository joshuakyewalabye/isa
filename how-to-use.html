<script src="assets/meta.js"></script><script src="assets/index.js"></script><script>window.PAGE={"id": "intro", "t": "Information Security and Auditing (BUC3126) — Complete Study System", "s": "How to use this guide", "g": "Start", "c": "#4f46e5", "k": "i", "f": "how-to-use.html", "w": 1125, "md": "# Information Security and Auditing (BUC3126) — Complete Study System\n\n**Course:** Information Security and Auditing, Year 3, Bachelor of Business Computing, MUBS\n**Built from:** your course outline, the 10 slide decks, the Topic 6 PDF, the Topic 7 Word document and slides, CW1 (50 MCQs), the CW2 take-home brief (BBCBank), and the sample MCQ set.\n**Aim:** first understand every topic properly, then lock it in with active recall.\n\n---\n\n## How to use this guide\n\n### The three kinds of content (read this once)\n\n| Label | What it means |\n|---|---|\n| Plain text, tables, lists | Comes from your notes or outline. Definitions, lists, frameworks and steps match your lecturers' material. |\n| **Supplementary explanation** (in a quote block) | Added by me because the notes are thin, missing, or need a missing step explained. Sound academic reasoning, but not from your lecturers. Treat it as extra, and where it conflicts with what your lecturer said in class, your lecturer wins. |\n| **Worked example** / **Scenario** | Made-up situations I built to show how the official concept is applied. The numbers and names are invented. The concept is real. |\n\n### How each topic is organised\n\n1. **Phase 1 — Understanding.** Big picture, connections, key terms, step-by-step explanations, worked examples, a text diagram, traps, a checklist, and a revision summary.\n2. **Phase 2 — Comprehension checks.** Answer these with the notes open. Model answers follow each one.\n3. **Phase 3 — Active recall bank.** Level 1 to 4 questions. Cover the answer, write yours from memory, then reveal.\n\nAt the back: **Phase 4** (a 30-question mixed quiz, a 50-question cumulative test, a hardest-topics test, and the spaced-repetition plan), **Phase 5** (error log and weak-area repair), rapid-recall sheets, and an appendix with a self-check key for CW1.\n\n### Reveal blocks\n\nAnswers sit inside collapsible \"Reveal answer\" blocks. If your Markdown viewer does not collapse them, cover the answer with a sheet of paper and scroll slowly.\n\n### The one habit that matters most\n\nFor every question, **write your answer before you reveal**. Even a bad attempt makes the reveal stick. Reading the answer first feels productive but barely helps in the exam.\n\n---\n\n## Course map (as confirmed)\n\nTags: **F** Foundation, **C** Core, **D** Difficult/High-risk, **A** Applied/Practical, **E** Likely exam focus (directly tested in CW1, CW2 or the sample MCQs).\n\n| # | Topic | Hours | Notes source | Coverage in notes | Main tags |\n|---|---|---|---|---|---|\n| 1 | Introduction to Information Security | 6 | Topic 1 deck | Full | F, C, E |\n| 2 | Threats, risks and cyber crimes | 6 | Topic 2.1, 2.2 (Cyber Crimes), 2.2 (Cyber Security) decks | Full | E, C |\n| 3 | Information Security Policy and Standards | 6 | Info Sec Policy deck, Sec SDLC deck | Good; PDCA missing | F, C, D |\n| 4 | Domains of IT Security | 6 | Domains/Access/Telecom deck, Sec SDLC deck | Partial | D, C |\n| 5 | IT Governance and Management | 4 | Topic 5 deck | Full | C, D, A |\n| 6 | IS Auditing Concepts | 10 | Topic 6 PDF, IS Auditing and Cybersecurity deck | Good; tools and techniques missing | F, D, A |\n| 7 | Controls | 12 | Topic 7 Word doc and slides | Good; some outline items differ | F, C, D |\n| 8 | IS Audit Reporting and Communication | 4 | Only the CW2 brief | Thin | A, E |\n| 9 | Compliance and Ethics in IS Audit | 2 | Fragments only | Thin | C |\n| P | Practical Lab (Excel and IDEA) | n/a | Course outline (practical test), CW2 brief and Topics 6 and 7 | Not in notes; built by me | A, E |\n\n**Teaching hours signal emphasis.** Topics 6 and 7 together are 22 of the listed hours. Expect them to carry weight in the final exam. (The outline's topic rows add up to 56 hours although its total says 60; treat the hours as a guide to relative weight, not an exact count.)\n\n### Three gaps and traps to know now\n\n1. **Topic 7 categories mismatch.** The outline lists \"Administrative, Technical, Physical and Logical\" controls. Your Topic 7 notes classify controls as **General, Application (business process), Objective-based, and User** controls. The notes never use the first set. Learn both (Topic 7 covers both) and use the notes' version in answers unless the question uses the outline's words.\n2. **PDCA and the audit tools are tested or listed but not in the notes.** CW1 tests PDCA; the outline lists audit techniques and tools. These sections are marked Supplementary.\n3. **The sample MCQs overlap heavily with CW1.** Treat them as a guide to question style. Expect scenario-style MCQs with long wordy stems and four plausible options.\n\n---\n\n## What the assessments look like\n\n| Assessment | Weight | What it is | Which topics it hits |\n|---|---|---|---|\n| CW1 | Part of 30% coursework | 50 scenario-style MCQs, roughly 21 on threats (Topic 2), the rest on CIA, controls, policy, ISMS, data protection | Mostly Topics 1 to 3 |\n| CW2 | Part of 30% coursework | Group take-home: a 15 to 20 page IT and IS audit report for a fictional bank, BBCBank Ltd, plus an oral defence | Topics 4 to 8, plus the Practical Lab |\n| Practical test | Part of 30% coursework | Hands-on testing of data, using IDEA and/or Excel (you said probably both, leaning Excel) | Practical Lab, Topics 6 to 8 |\n| Final exam | 70% | Physical exam | All topics |\n\nPass mark is 50%. You must attempt all three assignments and the final exam.\n\n> **Supplementary explanation: how to read CW2.** The CW2 brief lists nine audit areas (policy review, password configuration, tariff accuracy, interest recomputation, product eligibility, segregation of duties, VAPT, ICT capability and operations, and AAA mechanisms). Each one is an application of a topic in this guide. The Practical Lab shows how to test them in Excel. Topic 8 shows how to write the finding up.\n\n---\n\n## Suggested order of study\n\n1. Topics 1 and 2 first (vocabulary and threats; everything else builds on them).\n2. Topic 3 (policy and standards), then Topic 4 (domains).\n3. Topic 5 (governance), then Topic 6 (what an audit is), then Topic 7 (controls, the heart of the course).\n4. Topics 8 and 9 (reporting, compliance and ethics), then the Practical Lab.\n5. Phase 4 mixed tests, then the error log.\n\nThe spaced-repetition schedule in Phase 4 tells you exactly which day to do what.\n\n\n---"};</script><script src="assets/app.js"></script><script src="assets/live.js"></script></html>
