<script src="assets/meta.js"></script><script src="assets/index.js"></script><script>window.PAGE={"id": "t4", "t": "TOPIC 4 — Domains of IT Security", "s": "4 · Domains of IT Security", "g": "Topics", "c": "#7c3aed", "k": "4", "f": "topic-4.html", "w": 8548, "md": "# TOPIC 4 — Domains of IT Security\n\n**Classification:** Difficult/High-risk (access control models, network attacks, firewalls), Core (application, hardware, physical security)\n**Sources:** Domains, access, Telecom deck; Sec SDLC deck (ISO 27001 Annex A.11, physical and environmental security).\n**Coverage warning:** the outline lists more domains than the notes cover. Access control, application security, hardware security, network and telecom security and physical security are covered. **Internet access, e-mail, outsourcing, software and hardware acquisition, BCP/DRP, security organization structure and the domain case studies have no dedicated notes**; I explain them in Section 4.9 as Supplementary explanation.\n**Outline items:** (a) user/accepted usage/access, data access, physical access; (b) Internet access, e-mail, digital signature; (c) outsourcing, software development and acquisition, hardware acquisition; (d) network and telecom, BCP and DRP, security organization structure; (e) domain-related case studies.\n**CW2 link:** areas (f) segregation of duties and access rights, (g) VAPT, (i) authentication, authorisation and accounting all use this topic.\n\n## PHASE 1 — UNDERSTANDING\n\n### 4.1 The big picture\n\nA \"domain\" is an area of the organization where security controls apply: who gets in (access), the software people run, the hardware it runs on, the network it travels across, the buildings it sits in. Topic 1 listed these areas briefly; Topic 4 shows how each works and fails.\n\n**Where it connects.** Backward: Topic 2's attacks (SQL injection, SYN flood, MitM) are explained here at the level where they actually happen. Topic 3's policy turns into ACLs and firewall rules here. Forward: Topic 7 classifies all of these as general controls and application controls; Topic 6 and CW2 audit them.\n\n### 4.2 Access control\n\n**Definition (notes).** Access control is a system that enables an authority to control access to areas and resources in a physical facility or computer-based information system. In computer security it includes **authentication, authorization and audit**. It also includes physical devices (biometric scans, metal locks), hidden paths, digital signatures, encryption, social barriers and monitoring by humans and automated systems.\n\n**Vocabulary:**\n\n| Term | Meaning | Example |\n|---|---|---|\n| **Subject** | An entity that performs actions: a user, owner or program (software or human) | Mary; a payroll program |\n| **Object** | A resource whose access is controlled: memory, file, directory, hardware, software | The loan table |\n| **Access mode** | The type of access: read, write, execute | Read |\n| **Access control policy** | Specifies the authorized accesses | \"Tellers may read customer balances\" |\n| **Access control mechanism** | Implements and enforces the policy | The ACL and the login system |\n\n**Why separate policy from mechanism?** (notes) You can define requirements independently of implementation, compare different policies, and build mechanisms that can enforce a wide range of policies.\n\n**Requirements (notes):** access control **cannot be bypassed**; it enforces **least privilege and need-to-know**; it enforces **organizational policy**. It protects against both accidental and malicious threats by regulating reading, writing and execution. It needs proper user identification and authentication, and the information specifying access rights must be protected from modification.\n\n#### 4.2.1 Identification, authentication, authorization and accountability, step by step\n\nAccess control systems provide the essential services of **identification and authentication (I&A)**, **authorization** and **accountability**.\n\n**Walk through one login to the core banking system:**\n\n1. **Identification.** Mary enters her user ID `mary.n`. The only requirement for an identifier is that it must be **unique within its security domain**.\n2. **Authentication.** She proves the claim. I&A verifies that an identity is **bound to the entity** making the claim. (The notes also say I&A assumes an earlier **identity proofing**, for example showing a government ID when the account was created.)\n3. **Authorization.** The system decides **what she can do**: for example, read customer balances and post deposits.\n4. **Accountability.** The system records **what she did**: \"mary.n posted deposit 150,000 to account 4471 at 10:42\". Later, an auditor can trace it.\n\n**Four authentication factors (notes):**\n\n| Factor | Meaning | Example |\n|---|---|---|\n| **Something you know** | Assumes only the owner knows it | Password, PIN |\n| **Something you have** | Assumes only the owner holds it | Smart card, security token |\n| **Something you are** | Biometrics | Fingerprint, voice, retina, iris |\n| **Where you are** | Location | Inside or outside the firewall; proximity to a personal GPS device |\n\n**Multi-factor authentication** combines two or more different factors (for example, password plus a phone code, CW1 Q31). Two passwords are not MFA; both are \"something you know\".\n\n**Authorization permission types (notes):** most operating systems build on three basic accesses:\n\n| Permission | The subject can |\n|---|---|\n| **Read (R)** | Read file contents; list directory contents |\n| **Write (W)** | Change contents of a file or directory: add, create, delete, rename |\n| **Execute (X)** | Run the file if it is a program (for a directory in Unix, \"traverse\" it) |\n\n#### 4.2.2 Two ways to store access rights: ACLs and capabilities\n\n| | **ACL-based** | **Capability-based** |\n|---|---|---|\n| Where the rights are kept | A list attached to the **object**: \"who may access me\" | A token held by the **subject**: \"what I may access\" |\n| How access is decided | Is the subject's identity on the object's list? | Does the subject hold an **unforgeable reference** to the object? |\n| Passing access on | Edit the list | Transmit the capability over a secure channel |\n\n**Concrete:** the ACL on the loan table lists `loan officers: read, create`. In a capability system, a program holds a token \"read loan table\" and can read it merely by presenting the token.\n\n#### 4.2.3 The three access control models\n\n**1. Discretionary Access Control (DAC).** The **owner** of an object decides who may access it and with what privileges. Every object has an owner (usually its creator). Access is based on the user's identity and access control rules.\n\n*Worked example:* Alice creates `budget.xlsx`. She is the owner. She grants Bob read and Chen read-write. Bob cannot change it. If Alice wants, she can also let Bob pass permission on to others.\n- *Advantages (notes):* intuitive, easy to implement.\n- *Disadvantages (notes):* inherent vulnerability (a user who has access might pass it on, or a program run by Alice might do so without her knowing); maintaining ACL or capability lists; maintaining grant/revoke; limited power of negative authorization.\n\n**2. Mandatory Access Control (MAC).** The **system**, not the owner, decides. Used in **multilevel systems** handling highly sensitive data, such as classified government and military information.\n\n- Every subject and object has a **label**. A subject's label is its **clearance** (level of trust). An object's label is its **classification** (level of trust required).\n- **Rule:** a subject can read an object only if the subject's label **dominates** the object's label (level equal or higher, and covers the required categories).\n- Import and export (for example to printers) must keep labels intact.\n\n*Worked example (from the notes' format).* The object `grades` has label `(confidential, {student-info})`.\n\n| Subject | Subject's label | Reads `grades`? | Why |\n|---|---|---|---|\n| Joe | (confidential, {student-info}) | **Yes** | Level equal, category covered |\n| Sue | (public, {student-info}) | No | Level too low |\n| Tom | (secret, {student-info}) | **Yes** | Level higher, category covered |\n| Ann | (confidential, {finance}) | No | Level equal but category not covered |\n\nNobody, including the owner of `grades`, can override the rule. That is what makes it \"mandatory\".\n\n**3. Role-Based Access Control (RBAC).** The **system** decides, and access is based on **roles**. Used in commercial applications and in military systems. A role is **a set of permissions** that can include complex operations (for example, an e-commerce transaction) or simple read or write. RBAC differs from DAC because users cannot control access to their own resources. It differs from MAC mainly in how permissions are handled: MAC compares clearance labels; RBAC assigns collections of permissions to roles.\n\n*Motivation (notes):* multi-user and multi-application systems; permissions attach to roles; role-permission assignments persist while users come and go; intuitive because it follows competence, authority and responsibility.\n\n**Three primary RBAC rules (notes):**\n\n1. **Role assignment:** a subject can execute a transaction only if it has selected or been assigned a role.\n2. **Role authorization:** a subject's active role must be authorized for that subject.\n3. **Transaction authorization:** a subject can execute a transaction only if the transaction is authorized for the subject's active role.\nRoles can form a **hierarchy**: higher-level roles inherit the permissions of sub-roles. Additional constraints may apply.\n\n*Worked example (invented): a bank.*\n\n| Role | Permissions |\n|---|---|\n| Teller | View balance; post deposit; post withdrawal up to limit |\n| Loan officer | Create loan; modify loan |\n| Branch manager | Approve loan; approve large withdrawals (inherits Teller permissions) |\n| Auditor | Read all; change nothing |\n\nApply the three rules to a new employee, Peter:\n1. Peter is assigned the Teller role. (Rule 1.)\n2. Peter's active role, Teller, is one he is authorized for. (Rule 2.) He cannot activate \"Branch manager\".\n3. He tries to approve a loan. That transaction is not authorized for Teller, so it is refused. (Rule 3.)\nWhen Peter is promoted, the administrator changes his role. Nobody edits individual permissions.\n\n**Comparison table (high-yield):**\n\n| | **DAC** | **MAC** | **RBAC** |\n|---|---|---|---|\n| Who sets the policy | **Owner** of the object | **System** | **System** (administrator) |\n| Based on | Identity and owner-defined rules | Labels: clearance vs classification | Roles (sets of permissions) |\n| Typical use | Ordinary file sharing | Government, military, multilevel systems | Commercial and business systems |\n| Strength | Flexible, easy | Strong control of flow of classified information | Simple to manage at scale; fits job structure |\n| Weakness | Owner mistakes, hard to maintain; inherent vulnerability | Rigid, complex to run | Role design and role \"creep\" need care |\n| Discretionary? | Yes | No | No (non-discretionary) |\n\n**Memory aid:** DAC = **D**ata owner **D**ecides. MAC = **M**achine/system **M**andates with labels. RBAC = **R**oles bundle the rights.\n\n### 4.3 Application and software security\n\n**Starting point (notes).** Any discussion of security should start with an inventory of the **stakeholders** (owners, companies), their **assets** (data, service, customer information), the **threats** to those assets (erase, steal) and the **attackers** (employees, clients, script kiddies, criminals). \"Any discussion of security without understanding these issues is meaningless.\"\n\n**Security goals (notes).** CIA, plus more concrete goals: **traceability and auditing** (forensics), **monitoring** (real-time auditing), **multilevel security**, **privacy and anonymity**, and the meta-property of **assurance** (that the goals are met).\n\n**How to realise the objectives: AAAA (notes):**\n\n| A | Meaning | Also called |\n|---|---|---|\n| Authentication | Who are you? | |\n| Access control / Authorization | Control who is allowed to do what (needs a specification) | |\n| Auditing | Check if anything went wrong | **Detection** |\n| Action | If so, take action | **Reaction** |\n\nThe notes also call the whole set **prevention, detection, reaction**: measures to **stop** breaches, to **detect** them, and to **recover assets, repair damage and prosecute offenders**. \"Good prevention does not make detection and reaction superfluous.\"\n\n**Threat to security requirement (notes):**\n\n| Threat | Requirement violated |\n|---|---|\n| Information disclosure | Confidentiality |\n| Tampering with information | Integrity |\n| Denial of service | Availability |\n| Spoofing | Authentication |\n| Unauthorized access | Access control |\n\n**Countermeasures can be non-IT (notes):** physical security of the building, screening of personnel, a legal framework to deter criminals, employee training.\n\n**Software security (notes).** Engineering software so that it **continues to function correctly under malicious attack**. Facets: security in the software development life cycle; engineering and design principles; security technologies; and also understanding the attacker's methods, tools and resources.\n\n**Three sources of software vulnerabilities (notes), with concrete cases:**\n\n| Source | Meaning | Concrete example |\n|---|---|---|\n| **Bugs** in the application or its infrastructure | It doesn't do what it should | An access flag (for example, `isAdmin=false`) can be changed by user input, so any user can make themselves an administrator |\n| **Inappropriate features** in the infrastructure | It does something it shouldn't | A search function that can display other users' information |\n| **Inappropriate use of features** provided by the infrastructure | The developer uses a feature unsafely | Building an SQL query by pasting user text into it (Topic 2) |\n\n**Main causes:** complexity of the features; functionality winning over security; ignorance of developers.\n\n### 4.4 Hardware security\n\n**Definition (notes).** Vulnerability protection that comes as a physical device rather than software (for example, **hardware firewalls and proxy servers**). It can provide stronger security than software and an extra layer for mission-critical systems. It also means protecting physical systems from harm, including equipment destruction attacks on computing devices and on networked non-computing devices such as IoT.\n\n**Types of hardware attacks (notes):**\n\n| Attack | How it works | Concrete case |\n|---|---|---|\n| **Rowhammer** | Repeated access (\"hammering\") of DRAM memory cells releases electrical charge that flips neighbouring bits | A program with no special rights alters memory it should not reach |\n| **Evil maid** | Physical access to an unattended device, which is altered stealthily | Someone inserts a USB with modification software into a powered-down laptop, or installs a keylogger, while you are out of the hotel room |\n| **Modification** | Overrides a device's restrictions, enabling man-in-the-middle | A tampered network device |\n| **Counterfeit hardware** | A supply chain attack where fake devices are sold to organizations | A router bought from an unknown reseller with a hidden backdoor |\n| **Eavesdropping** | Subtle interception while sensitive data (card numbers, passwords) moves between devices | A tap on a cable or wireless link |\n\n**Mitigation (notes):**\n\n1. **Investigate vendors and suppliers** (risk starts at inception; check the vendor's own suppliers and manufacturing).\n2. **Encrypt all devices**, including external flash storage and DRAM interfaces; especially portable devices.\n3. **Minimise the attack surface:** safely decommission unused hardware and disable debug ports.\n4. **Enforce strong physical security** in areas housing equipment; do not leave devices unattended.\n5. **Provide real-time monitoring** (including cloud-based tools that notify teams quickly).\n6. **Update firmware and upgrade old hardware** so it receives security patches.\n\n### 4.5 Physical access: ISO 27001 Annex A.11 (physical and environmental security)\n\n**Purpose (notes).** Ensure secure physical and environmental areas. The objective is to **prevent unauthorized physical access, damage and interference** to the organization's information and information processing facilities. Two objectives: **secure areas** and **equipment security**.\n\n| Control | What it requires (notes) | Concrete example |\n|---|---|---|\n| **Physical security perimeter** | Define perimeters and boundaries around areas with sensitive information and processing facilities; consider data centres, head office, home workers | A fence and guarded gate around the data centre |\n| **Physical entry controls** | Only authorized personnel enter; select controls by the nature and location of the area; grant, test, monitor and log access; control visitors; extra protection for key IT equipment | Badge reader plus PIN on the server room; visitor log; biometrics for the most sensitive areas |\n| **Securing offices, rooms and facilities** | Review who has access, when and how; consider who can see or hear in from outside; update access when staff leave or transfer; escort visitors; staff challenge unrecognised people | Frosted windows on the finance office; remove a leaver's badge on their last day |\n| **Protecting against external and environmental threats** | Protect against natural (floods, lightning) and man-made (water leakage, civil unrest) threats; identify, assess and treat risks | No server room in a basement on a flood plain; fire suppression |\n| **Working in secure areas** | Procedural controls inside the area: restricted awareness of location, restrictions on recording equipment, no unsupervised working where possible, in-and-out logging | No phones allowed in the vault |\n| **Delivery and loading areas** | Control, and if possible isolate from processing facilities | Delivery bay away from the server room; CCTV; do not open internal and external doors at the same time |\n| **Equipment siting and protection** | Site to reduce environmental risk and unauthorized access; restrict screen viewing angles; lock storage; keep food and drink away | Screens at the bank counter angled away from customers |\n| **Supporting utilities** | Protect from power failures: dual supplies, backup generators, regular testing; telecoms: dual routing, load balancing, redundancy | UPS and generator for the data centre |\n| **Cabling security** | Protect power and telecom cabling from interception, interference or damage; underground or protected; separate cables by data sensitivity; inspect termination points | Network cables in conduit, away from power cables |\n| **Equipment maintenance** | Maintain at suitable frequencies; keep maintenance schedules as evidence | Quarterly service log for the UPS |\n| **Securing equipment off-premises** | Protect equipment taken outside the organization | Laptop locked in the boot and encrypted |\n| **Secure disposal or reuse** | Verify that sensitive data and licensed software are removed or securely overwritten; physically destroy or securely wipe | Hard drives from retired servers are shredded |\n| **Clear desk and clear screen policy** | No sensitive papers or open sessions left unattended | Lock the screen when leaving; clear the desk at close |\n\n**Why some of these are exam favourites:** *tailgating* (Topic 2) is stopped by entry controls and by staff challenging strangers; *poor disposal* is \"another area of common vulnerability where many incidents have arisen\" (notes); *cabling* is often forgotten.\n\n\n### 4.6 Network and telecom security\n\n**Telecommunications (notes):** the electronic transmission of signals for communications (telephone, radio, television). The **telecommunication medium** is anything that carries an electronic signal and interfaces between a sending and receiving device.\n\n#### 4.6.1 The OSI reference model\n\nAdopted by ISO in 1984. It defines standard protocols for communication and interoperability using a **layered approach**.\n\n**Advantages (notes):** clarifies the functions of a communication process; reduces complex networking processes; promotes interoperability through standard interfaces; aids development; makes troubleshooting easier and more logical.\n\n| Layer | Name | What happens here (supplementary, for understanding) | Firewall/attack link |\n|---|---|---|---|\n| 7 | Application | The programs people use talk to the network (web, email) | Application-level proxy; XSS, SQLi |\n| 6 | Presentation | Format and encryption of data | |\n| 5 | Session | Starting, keeping and ending a conversation | Circuit-level proxy |\n| 4 | Transport | Reliable delivery, ports (TCP/UDP) | SYN flood; stateful inspection |\n| 3 | Network | Addressing and routing (IP addresses) | Packet filtering; IP spoofing |\n| 2 | Data link | Delivery inside a local network using MAC addresses | ARP poisoning |\n| 1 | Physical | Signals over cables or radio | Cable tapping |\n\n**Memory aid (top to bottom):** **A**ll **P**eople **S**eem **T**o **N**eed **D**ata **P**rocessing.\n\n#### 4.6.2 Network attacks (from the notes), step by step\n\n**A. SYN flood (a denial-of-service attack).**\n\nFirst, how a normal connection starts (the TCP three-way handshake):\n\n1. Client sends **SYN** (\"I want to connect\").\n2. Server replies **SYN-ACK** (\"OK\") and keeps a half-open entry in a waiting list.\n3. Client sends **ACK**. The connection is complete and the entry is removed from the waiting list.\n\n**The attack.** The attacker sends a succession of SYN requests, often with forged source addresses, and never sends the final ACK.\n\n*Illustrative numbers:* suppose the server's waiting list holds 128 half-open entries and each waits 60 seconds. The attacker sends 200 SYN packets per second.\n- In under one second, the list is full.\n- Every new SYN, including from real customers, is dropped.\n- The server is up but \"unresponsive to legitimate traffic\" (notes). This is an attack on **availability**.\n\n**B. ARP poisoning.** ARP maps an IP address to a MAC address on a local network.\n\n**Normal behaviour (illustrative):**\n\n| Computer A's ARP cache | |\n|---|---|\n| 192.168.1.1 (gateway) | MAC = **AA:AA** (the real router) |\n\n**The attack.** The attacker (MAC **EE:EE**) sends **forged ARP request and reply packets** claiming \"192.168.1.1 is at EE:EE\". Computer A updates its cache:\n\n| Computer A's ARP cache (after) | |\n|---|---|\n| 192.168.1.1 (gateway) | MAC = **EE:EE** (the attacker) |\n\nNow A's traffic to the internet goes to the attacker. The attacker can **read it and forward it** (man-in-the-middle, stealing data), or **drop it** (denial of service). The notes say ARP poisoning is very effective against both wireless and wired local networks.\n\n**C. DNS poisoning (spoofing).** The attacker exploits weaknesses in a domain name server to divert traffic from legitimate servers to fake ones. *Example:* a user types the bank's web address; the poisoned server returns the attacker's IP; the user lands on a look-alike site and enters credentials. Poisoning code is often spread through URLs in spam, banner ads and images on untrustworthy sites.\n\n**D. Network sniffing.** Software (or a hardware device) called a **sniffer** monitors data flowing over network links **in real time**, taking snapshot copies **without redirecting or altering it**. It is **passive**, which is why it is hard to detect. Defence: **encryption**, so captured data is unreadable.\n\n**E. IP spoofing.** The attacker impersonates another machine by modifying the packet header with a forged source IP address (and a checksum and order value). Used for denial of service and man-in-the-middle while hiding identity; also DDoS and Smurf attacks. The firewall defence in the notes is **ingress filtering** (see below).\n\n| Attack | Layer | Hits | One-line identifier |\n|---|---|---|---|\n| SYN flood | Transport | Availability | Many half-open connections |\n| ARP poisoning | Data link | Confidentiality, availability | Forged MAC mapping on a LAN |\n| DNS poisoning | Application (DNS) | Confidentiality, integrity | Right name, wrong destination |\n| Sniffing | Any | Confidentiality | Passive copy of traffic |\n| IP spoofing | Network | Authentication; enables DoS/MitM | Forged source address |\n\n#### 4.6.3 Virtual Private Networks (VPNs)\n\n**Definition (notes):** a private network that uses a public network to connect remote sites or users together.\n\n**Three concepts (notes):**\n\n| Concept | Meaning |\n|---|---|\n| **Encapsulation** | Inclusion of one data structure within another |\n| **Encryption** | Hiding of real information |\n| **Tunneling** | A virtual path that delivers a packet |\n\n**Walk-through (illustrative): a loan officer working from home.**\n1. Her laptop creates a normal packet for the loan system.\n2. The VPN software **encrypts** it so nobody on the café Wi-Fi can read it.\n3. It **encapsulates** the encrypted packet inside a new packet addressed to the bank's VPN gateway.\n4. The packet crosses the internet through the **tunnel**.\n5. The gateway removes the outer packet, decrypts and delivers the inner packet to the loan system.\nA VPN is therefore a defence against sniffing and man-in-the-middle on untrusted networks (CW1 Q3).\n\n**Features (notes):** security, reliability, scalability, network management, policy management. **Benefits (notes):** extends geographic connectivity, improves security, improves productivity, simplifies network topology, global networking opportunities, broadband compatibility, faster return on investment than a traditional WAN.\n\n#### 4.6.4 Firewalls\n\n**Definition (notes):** a system that prevents unauthorized access to or from a network and controls the flow of traffic.\n\n**Seven firewall types (notes):** packet filtering; proxy firewall; application-level proxy; circuit-level proxy; stateful inspection; dynamic packet filtering; kernel proxy.\n\n| Type | Works at | What it decides on | Strength / weakness |\n|---|---|---|---|\n| **Packet filtering** | Network layer | Source IP, destination IP, protocol, source and destination ports, interface | Fast and simple; does not understand connections or content |\n| **Application-level proxy** | Application layer | Inspects **content, payload and header**; no direct communication (a proxy agent sits between); can require user authentication | Deep inspection; slower |\n| **Circuit-level proxy** | Session layer | Creates a circuit between client and server; decides on header information (source and destination addresses) | Faster than application-level proxy; does not inspect content |\n| **Stateful inspection** | Network and transport layers | Like packet filtering but keeps a **state table**: tracks connection state and blocks packets that deviate from the expected state | Understands conversations |\n| **Dynamic packet filtering / kernel proxy** | Kernel level | Fifth-generation firewall; builds a **new virtual network stack** per packet containing only the protocol proxies needed to examine that packet; speed of packet filtering | Customised, fast |\n\n**Ingress vs egress filtering (notes):** **ingress** = blocking *inbound* traffic; **egress** = blocking *outbound* traffic.\n\n**Walk through the difference between a packet filter and a stateful firewall (illustrative):**\n\nA packet arrives from the internet: source 203.0.113.9 port 443, destination 10.0.1.20 port 51000.\n- **Packet filter:** checks the rule list. A rule says \"allow port 443 traffic\". It passes. It does not ask whether anyone inside asked for this.\n- **Stateful firewall:** looks in its state table. It finds no entry showing that 10.0.1.20 started a connection to 203.0.113.9. This looks like an unsolicited packet, **not the expected state**. It drops it.\n\n**Ingress filtering against IP spoofing (illustrative):** a packet arrives from the internet claiming source address 10.0.1.5, which is an **internal** address. No genuine external packet can have that source. The ingress rule drops it.\n\n#### 4.6.5 Intrusion detection systems (IDS)\n\n**Definition (notes):** a system that **detects and logs inappropriate, incorrect or anomalous activity.**\n\n**Types:** **network-based IDS** (watches network traffic) and **host-based IDS** (watches one computer).\n\n**Methods (notes):**\n\n| Method | How it detects |\n|---|---|\n| **Pattern matching / signature-based** | Compares activity to known attack patterns |\n| **Anomaly detection** | Flags any abnormality from normal behaviour |\n| **Protocol behaviour** | Checks correct usage of a protocol |\n\n**Four events (notes), with a worked count.**\n\n| | Attack traffic | Normal traffic |\n|---|---|---|\n| **Alert raised** | **True positive:** real attack, alert | **False positive:** normal traffic, alert |\n| **No alert** | **False negative:** real attack, no alert | **True negative:** normal traffic, no alert |\n\n*Illustrative day:* the IDS sees 10,000 events. 20 are real attacks and 9,980 are normal. It raises 25 alerts: 18 for real attacks and 7 for normal traffic.\n- True positives = 18; false negatives = 20 − 18 = **2** (the dangerous ones, attacks missed).\n- False positives = 7; true negatives = 9,980 − 7 = 9,973.\n\n**Which is worse?** A **false negative** lets an attack through silently. Too many **false positives** swamp analysts, who then start ignoring alerts. Tuning is a trade-off.\n\n> **Supplementary explanation: IDS vs IPS vs firewall.** A firewall **blocks or allows** traffic by rules. An IDS **detects and logs** (and alerts). An IPS (intrusion prevention system) detects **and blocks**. The notes use \"IDS/IPS\" together in Topic 1.\n\n### 4.7 Text diagram: where the domains sit\n\n```\n                  +---------------- PEOPLE & POLICY (Topic 3) ---------------+\n                  |                                                          |\n Physical access --+-- Access control (I&A, authorization, accountability) --+-- Application/software security\n (Annex A.11)      |    DAC / MAC / RBAC                                      |    (bugs, features, AAAA)\n                   |                                                          |\n                   +---------- Hardware security (devices, firmware) --------+\n                   |                                                          |\n                   +---------- Network and telecom security ------------------+\n                        OSI layers | firewalls | VPN | IDS | attacks\n```\n\n### 4.8 The access control decision, as a flowchart\n\n```\n Request: subject S wants mode M on object O\n        |\n        v\n [Identified and authenticated?] --no--> DENY (log the failure)\n        | yes\n        v\n [Which model applies?]\n   DAC : is S on O's access list (set by owner) with mode M?\n   MAC : does label(S) dominate label(O)?\n   RBAC: is M on O authorized for S's active role?\n        |\n        +-- no  --> DENY (log)\n        |\n        yes\n        v\n ALLOW  --> log the action (accountability)\n```\n\n### 4.9 Domains the notes do not cover (Supplementary explanation)\n\n> Everything in this section is **Supplementary explanation**. The outline lists these items but your decks contain no slides on them. Where your lecturer teaches them differently in class, follow the lecturer.\n\n#### 4.9.1 Internet access and e-mail\n\n**Purpose of controls:** the internet and email are the biggest everyday entry points for the threats in Topic 2 (phishing, malware, data leaks).\n\n| Control | What it does |\n|---|---|\n| Acceptable use policy (an ISSP, Topic 3) | States what staff may and may not do online |\n| Web filtering | Blocks categories of sites and known malicious sites |\n| Email gateway scanning | Scans attachments and links for malware and phishing |\n| Monitoring and logging | Records internet and email use for investigation (disclosed in the policy) |\n| Encryption for sensitive email | Protects confidentiality in transit |\n| Data loss prevention | Stops sensitive data being sent out |\n| Training | Staff recognise phishing and reporting routes |\n\n#### 4.9.2 Digital signatures, step by step (CW1 Q34, Q44)\n\nA digital signature proves **integrity** and **authenticity**, and supports **non-repudiation**.\n\n**Sender:**\n1. Compute a **hash** of the contract (a fixed-size fingerprint).\n2. **Sign** the hash with the sender's **private key**. The result is the digital signature.\n3. Send the contract plus the signature.\n\n**Receiver:**\n4. Compute a hash of the contract received.\n5. Use the sender's **public key** to open the signature and recover the hash the sender signed.\n6. **Compare:** if the two hashes match, the contract was not altered (integrity), it was signed by the holder of that private key (authenticity), and that holder cannot later deny it (non-repudiation), because only they hold the private key.\n\n**What a digital signature does not do:** it does not hide the contract. It is about proof, not secrecy.\n\n#### 4.9.3 Outsourcing\n\n**Idea:** buying a service or function from an external supplier. In your Sec SDLC notes, the decision to outsource is made in the **logical design** stage.\n\n**Risks:** supplier staff access your data; supplier breach affects you; unclear responsibility; supplier failure; lock-in; legal exposure.\n**Controls:** due diligence before choosing; a contract with **security requirements, a service level agreement and a right to audit**; data protection clauses; access limited by least privilege; monitoring and reporting; an **exit plan**.\n**Principle:** you can outsource the task but not the accountability.\n(CW1 Q27 lists \"outsourcing all IT operations\" as a wrong answer for how an ISMS achieves its objectives.)\n\n#### 4.9.4 Software development and acquisition, hardware acquisition\n\n- **Software development:** use the SecSDLC from Topic 3, so security is built in; test security; control changes (Topic 5).\n- **Software acquisition (buying):** define requirements including security; evaluate vendors; test before acceptance (acceptance testing); agree licensing and support; plan updates.\n- **Hardware acquisition:** your notes' hardware mitigation list applies: **investigate vendors and suppliers**, avoid counterfeit hardware, check delivery conditions, record assets in an inventory, and make sure firmware can be patched.\n\n#### 4.9.5 Business continuity (BCP) and disaster recovery (DRP)\n\n| | **BCP** | **DRP** |\n|---|---|---|\n| Focus | Keeping **critical business functions** running during and after a disruption | Restoring **IT systems and data** after a disaster |\n| Scope | Whole business (people, premises, processes, IT) | The IT part of continuity |\n| Example | Branches continue serving customers manually while systems are down | Core banking restored from backup at the recovery site |\n\n**Key ideas:**\n- **Business impact analysis (BIA):** identifies critical functions and the cost of losing them.\n- **RTO (recovery time objective):** how long a system can be down. **RPO (recovery point objective):** how much data loss is tolerable.\n *Worked example:* RPO = 1 hour means backups or replication must happen at least hourly. RTO = 4 hours means the system must be running again within 4 hours of the failure.\n- **Backups:** the **3-2-1 rule** is three copies of data, on two different media types, with one copy offsite. It protects **availability** (CW1 Q30).\n- **Alternate sites:** *hot* (ready, minutes), *warm* (partly ready, hours to days), *cold* (empty space, days to weeks).\n- **Testing:** an untested plan is not a control. Tests range from reading the plan through, to a table-top exercise, to simulation, to a full failover. Notes elsewhere stress \"develop **and test** a DRP\" (Topic 1) and an operational and tested IT continuity plan (Topic 7).\n\n#### 4.9.6 Security organization structure\n\n| Role | Responsibility |\n|---|---|\n| Board and senior management | Approve policy, set direction, provide resources |\n| IT steering committee | Users and IT together prioritise and oversee IT (Topic 7) |\n| Information security manager / CISO | Runs the security programme; reports to senior management |\n| Data owners | Decide classification and who may access their data |\n| Custodians (IT) | Operate the controls on the owners' behalf |\n| Users | Follow policy; report incidents |\n| Internal audit | Independently checks that all of the above works |\n\n**Principle:** security should report high enough in the organization to have authority and independence from the IT operations it oversees.\n\n#### 4.9.7 Domain-related case studies: a method and two small cases\n\n**Method for any domain case (four questions):**\n1. **Which domain failed?** (access, physical, network, application, hardware, outsourcing, continuity)\n2. **What was the weakness and what exploited it?**\n3. **Which control was missing or weak?**\n4. **What recommendation fixes it, and what evidence would an auditor want?**\n\n**Case A (invented). A contractor tailgates into a server room.** A contractor follows an employee through the badge door of the server room, plugs a device into an open network port, and leaves.\n1. *Domains:* physical access and network.\n2. *Weakness:* the entry control relied on staff behaviour (tailgating), and there was no monitoring or port security.\n3. *Missing controls:* anti-tailgating measures (a mantrap, staff challenge culture), visitor and contractor escorting, in-and-out logging (Annex A.11 working in secure areas), disabled unused network ports, network access control, CCTV review.\n4. *Evidence an auditor wants:* visitor logs, badge logs, CCTV, port configuration, awareness training records.\n\n**Case B (invented). An outsourced call centre leaks customer data.** A vendor's agents share one login, and customer files are downloaded to personal USB sticks. The bank has no right to audit in the contract.\n1. *Domains:* outsourcing, access control, data protection.\n2. *Weakness:* shared logins break accountability; USB sticks break confidentiality; no contractual oversight.\n3. *Missing controls:* unique IDs and MFA; endpoint control that blocks USB; DLP; a contract with security clauses, a right to audit and breach notification; periodic review of the vendor.\n4. *Evidence:* contract, access reviews, logs, vendor audit reports.\n\n### 4.10 Common misconceptions and exam traps\n\n| Trap | Truth |\n|---|---|\n| \"DAC, MAC and RBAC are all owner-controlled\" | Only **DAC** is owner-controlled. MAC and RBAC are system-controlled. |\n| \"RBAC = MAC\" | MAC uses **labels** (clearance vs classification); RBAC uses **roles** (sets of permissions). |\n| \"In MAC the owner can share if they want\" | No: the system enforces the labels regardless of ownership. |\n| \"Authentication and authorization are the same\" | Authentication verifies identity; authorization decides what that identity can do; accountability records what it did. |\n| \"Two passwords are MFA\" | MFA needs different **factors** (know, have, are, where). |\n| \"A firewall detects intrusions\" | A firewall blocks/allows by rules; an **IDS** detects and logs. |\n| \"A false positive means an attack was missed\" | That is a **false negative**. A false positive is an alert on normal traffic. |\n| \"Packet filtering tracks connections\" | **Stateful inspection** tracks connection state; packet filtering does not. |\n| \"SYN flood steals data\" | It exhausts server resources; it attacks **availability**. |\n| \"Sniffing alters traffic\" | Sniffing is passive: it copies without redirecting or altering. |\n| \"ARP poisoning works across the internet\" | It works on a **local network** (it forges MAC mappings). |\n| \"VPN = only encryption\" | VPN also uses **encapsulation and tunnelling**. |\n| \"Ingress and egress filtering are the same\" | Ingress blocks inbound traffic; egress blocks outbound. |\n| \"Good prevention removes the need for detection\" | The notes say prevention does not make detection and reaction superfluous. |\n\n### 4.11 Checklist: analysing any domain scenario\n\n1. **Which domain?** Access, application, hardware, network, physical, outsourcing, continuity?\n2. **Which A?** Authentication, authorization, audit/accountability, action?\n3. **Which goal fell?** C, I or A?\n4. **Which model or device?** DAC, MAC, RBAC; firewall type; IDS or VPN?\n5. **Prevention, detection or reaction?** Which was missing?\n6. **What evidence would show the control works?**\n\n### 4.12 Revision summary (Topic 4)\n\n- Access control = authentication, authorization and audit (I&A, authorization, accountability). Four factors: know, have, are, where. Permissions: R, W, X. ACL (on the object) vs capability (held by the subject).\n- DAC: owner decides; MAC: system decides with labels (subject label must dominate object label); RBAC: system decides by role; three rules (role assignment, role authorization, transaction authorization).\n- Application security: start with stakeholders, assets, threats, attackers; AAAA (authentication, authorization, auditing, action) = prevention, detection, reaction; vulnerabilities come from bugs, inappropriate features and inappropriate use of features.\n- Hardware security: attacks (Rowhammer, evil maid, modification, counterfeit, eavesdropping); six mitigations (vendors, encrypt, minimise attack surface, physical security, real-time monitoring, firmware and upgrades).\n- Physical access (Annex A.11): perimeter, entry controls, secure offices, environmental threats, secure areas, delivery areas, equipment siting, utilities, cabling, maintenance, off-premises, disposal, clear desk and screen.\n- Network: OSI seven layers; SYN flood, ARP poisoning, DNS poisoning, sniffing, IP spoofing; VPN (encapsulation, encryption, tunnelling); seven firewall types; IDS (network or host; signature, anomaly, protocol; TP, TN, FP, FN).\n- Supplementary: digital signature steps; outsourcing risks and controls; BCP vs DRP (BIA, RTO, RPO, 3-2-1, hot/warm/cold sites); security organization roles; case study method.\n\n\n---\n\n## PHASE 2 — COMPREHENSION CHECKS (Topic 4)\n\n**C1. Explain, in your own words, why DAC is considered weaker than MAC for protecting highly sensitive information.**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nIn DAC the **owner** decides who may access an object, so the protection depends on every owner making good decisions. An owner can share by mistake, or a program running under an owner's account (for example a trojan) can pass on access without the owner knowing. In MAC the **system** compares the subject's clearance label with the object's classification and enforces the result, whatever any individual wants. For classified information, it removes the dependence on individual choices.\n\n**Check:** owner-controlled and fallible vs system-controlled and enforced.\n<\/details>\n\n**C2. Why do access control systems need accountability as well as authentication and authorization?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nAuthentication and authorization prevent wrong access, but nothing is perfect. Accountability records **what each subject did**, so misuse can be detected, investigated and proven afterwards (the \"Auditing\" and \"Action\" of AAAA). Without it, a user who abuses legitimate access leaves no trace, and an investigator cannot say who changed the loan or when.\n\n**Check:** prevention is not enough; you need detection and evidence.\n<\/details>\n\n**C3. What would happen if a SYN flood hit a server that never times out half-open connections?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nThe waiting list of half-open connections would fill and stay full. Legitimate clients' SYN requests would be dropped, so nobody could connect until the server was restarted or the entries were cleared. The attack would succeed with far less traffic, because each fake request would hold a slot forever instead of for a short period.\n\n**Check:** limited waiting list; entries never free; legitimate users locked out.\n<\/details>\n\n**C4. Why is a stateful firewall better than a simple packet filter against a forged \"reply\" packet from the internet?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nA packet filter judges each packet on its own, using fields such as addresses and ports, so a forged packet that matches an allow rule passes. A stateful firewall keeps a **state table** of connections that insiders started. A \"reply\" with no matching entry deviates from the expected state and is dropped.\n\n**Check:** state table of expected connections.\n<\/details>\n\n**C5. How does ARP poisoning relate to man-in-the-middle attacks?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nARP poisoning is a **method** of achieving a man-in-the-middle position on a local network. By forging ARP replies, the attacker makes victims send traffic for the gateway to the attacker's MAC address. The attacker then reads or alters it and forwards it, so neither side notices. The notes say hackers use ARP poisoning to eavesdrop by means of man-in-the-middle techniques.\n\n**Check:** the poisoned ARP cache puts the attacker \"in the middle\".\n<\/details>\n\n**C6. Give an original example of a false positive and a false negative for a bank's IDS.**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\n*False positive:* an administrator runs a legitimate vulnerability scan on the network, and the IDS raises an \"attack\" alert. *False negative:* an attacker uses a slow, low-volume method that matches no signature and sits within normal behaviour, and no alert fires. The false negative is more dangerous because the attack succeeds unseen.\n\n**Check:** false positive = alert on normal; false negative = silence on attack.\n<\/details>\n\n**C7. Which part of this topic would confuse someone seeing it for the first time?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\n(1) DAC vs MAC vs RBAC: use the \"who decides, based on what\" table. (2) The seven firewall types: group them by layer (network, session, application) and by whether they track state. (3) The four IDS events: draw the 2 × 2 grid. (4) The OSI layers: use the mnemonic and the attack-to-layer table. (5) The \"domains\" the outline lists but the notes omit: use Section 4.9.\n<\/details>\n\n---\n\n## PHASE 3 — ACTIVE RECALL BANK (Topic 4)\n\n### Level 1 — Basic recall\n\n**Q1.** State the four authentication factors listed in the notes and give one example of each.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Something you know (password, PIN); something you have (smart card, security token); something you are (fingerprint, voice, retina, iris); where you are (inside or outside the company firewall, proximity to a personal GPS device).\n\n**Marking:** four factors (4), four examples (4).\n\n**Common mistake:** omitting \"where you are\".\n<\/details>\n\n**Q2.** Define DAC, MAC and RBAC in one sentence each.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** DAC: an access policy determined by the **owner** of an object. MAC: an access policy determined by the **system**, using sensitivity labels so that a subject's clearance must dominate the object's classification. RBAC: an access policy determined by the **system**, based on **roles**, where a role is a set of permissions.\n\n**Common mistake:** saying RBAC is owner-controlled.\n<\/details>\n\n**Q3.** List the seven layers of the OSI model, from application to physical.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Application, presentation, session, transport, network, data link, physical.\n\n**Marking:** order matters; one mark per layer.\n\n**Common mistake:** swapping session and transport, or network and data link.\n<\/details>\n\n**Q4.** Name the seven firewall types in the notes.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Packet filtering; proxy firewall; application-level proxy; circuit-level proxy; stateful inspection; dynamic packet filtering; kernel proxy firewall. (The notes describe dynamic packet filtering as the kernel proxy, or fifth-generation, firewall.)\n\n**Common mistake:** forgetting that \"proxy firewall\" is the umbrella for the application-level and circuit-level proxies.\n<\/details>\n\n**Q5.** State the four IDS events (true positive, true negative, false positive, false negative) in terms of alert and traffic type.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** True positive: alert, and it is a real attack. True negative: no alert, and traffic is normal. False positive: alert, but traffic is normal. False negative: no alert, but it is attack traffic.\n\n**Common mistake:** reversing false positive and false negative.\n<\/details>\n\n**Q6.** List six hardware attack types or hardware mitigations from the notes.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** *Attacks:* Rowhammer, evil maid, modification, counterfeit hardware, eavesdropping. *Mitigations:* investigate vendors and suppliers; encrypt all devices; minimise the attack surface; enforce strong physical security; provide real-time monitoring; update firmware and upgrade old hardware.\n\n**Marking:** one mark each, up to six (any mix).\n\n**Common mistake:** describing \"evil maid\" as a software attack; it requires physical access.\n<\/details>\n\n### Level 2 — Understanding\n\n**Q7.** Compare DAC, MAC and RBAC by who decides, the basis of the decision, typical use, and one weakness.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:**\n\n| | DAC | MAC | RBAC |\n|---|---|---|---|\n| Who decides | Owner | System | System |\n| Basis | Identity and owner-set rules | Labels (clearance vs classification) | Roles (sets of permissions) |\n| Typical use | General file sharing | Government and military, multilevel | Business and commercial systems |\n| Weakness | Inherent vulnerability; hard to maintain lists and grant/revoke | Rigid and complex | Needs careful role design |\n\n**Marking:** one mark per correct cell, up to 12 (capped at 8 for the answer).\n\n**Common mistake:** claiming MAC is \"more flexible\".\n<\/details>\n\n**Q8.** Explain how a SYN flood denies service. Include the three-way handshake.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** A normal connection is SYN, then SYN-ACK from the server (which keeps a half-open entry), then ACK from the client. In a SYN flood the attacker sends many SYN requests, often with forged addresses, and never sends the final ACK. The server's waiting list fills with half-open entries. When it is full, legitimate SYN requests are dropped and the server is unresponsive. It is an attack on availability.\n\n**Marking:** handshake (2), attack behaviour (2), result (1), availability (1).\n\n**Common mistake:** saying the attacker \"steals the server's data\".\n<\/details>\n\n**Q9.** Distinguish a packet filtering firewall from a stateful inspection firewall and from an application-level proxy.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** A packet filter works at the network layer and decides per packet using source and destination IP, protocol, ports and interface. A stateful firewall works like a packet filter but also keeps a state table, tracks connection state and blocks packets that deviate from the expected state. An application-level proxy works at the application layer, allows no direct communication, inspects content, payload and header and can require user authentication.\n\n**Marking:** three correct descriptions (6).\n\n**Common mistake:** putting the application-level proxy at the network layer.\n<\/details>\n\n**Q10.** Why do the notes say good prevention does not make detection and reaction superfluous?\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Prevention can fail or be bypassed (for example, an insider, a zero-day or a mistake). Detection tells you when it has failed; reaction limits damage, recovers assets, repairs and deters offenders. The notes' point is that all three (prevention, detection, reaction) are needed. In AAAA terms, Auditing detects and Action reacts.\n\n**Common mistake:** arguing that detection is unnecessary if prevention is strong.\n<\/details>\n\n### Level 3 — Application\n\n**Q11.** Choose the best access control model for each and justify: (a) a military base's intelligence documents; (b) a bank with 800 staff in 40 job types, with many promotions; (c) a small team sharing project files where each person owns what they create.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** (a) **MAC**: multilevel classified data needs system-enforced labels that owners cannot override. (b) **RBAC**: permissions attach to roles, so a promotion is a role change, and role design matches job structure. (c) **DAC**: owners decide, which is simple and adequate for low-sensitivity files.\n\n**Marking:** each model (1) plus a justification (1), total 6.\n\n**Common mistake:** choosing RBAC for everything because it is popular.\n<\/details>\n\n**Q12.** Computer A's ARP cache shows 192.168.1.1 now maps to an unfamiliar MAC address. Users complain of slow connections and some say their sessions were hijacked. Identify the attack, what it allows, and four controls.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** **ARP poisoning** (forged ARP replies altered the cache). It allows the attacker to sit between users and the gateway: eavesdropping, man-in-the-middle manipulation including session hijacking, and denial of service if traffic is dropped. Controls: use encryption (HTTPS, VPN) so intercepted data is useless; static ARP entries for critical hosts; switch features that validate ARP; network monitoring or IDS to spot duplicate MAC mappings; segment the network; train staff to avoid untrusted Wi-Fi.\n\n**Marking:** attack (2), effects (2), four controls (4).\n\n**Common mistake:** recommending a firewall as the main fix. ARP poisoning happens inside the local network, where a perimeter firewall does not see it.\n<\/details>\n\n**Q13.** A bank's data centre has a badge door, but staff routinely hold the door for colleagues, cabling runs through a shared corridor, and old servers are sold at auction without wiping. Using Annex A.11, identify three control failures and a fix for each.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** (1) *Physical entry controls / working in secure areas:* tailgating. Fix: a mantrap or turnstile, in-and-out logging, a culture of challenging strangers, CCTV review. (2) *Cabling security:* cables exposed to interception or damage. Fix: conduit, underground or protected routing, inspect termination points, separate power and data cables. (3) *Secure disposal or reuse:* sensitive data left on sold servers. Fix: verify data is removed, securely wipe or physically destroy drives, keep disposal records.\n\n**Marking:** three failures matched to controls (3), three fixes (3).\n\n**Common mistake:** naming only technical controls and ignoring procedures.\n<\/details>\n\n### Level 4 — Exam mastery\n\n**Q14.** A bank allows staff to work from home. Design the network and access security for remote work. Explain each control, say which attacks it counters, and explain which access control model supports it. (12 marks)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer outline:**\n1. *Secure channel:* a **VPN** (encapsulation, encryption, tunnelling). Counters sniffing and man-in-the-middle on public networks.\n2. *Authentication:* **MFA** (password plus token or phone) because passwords alone can be guessed, stolen or phished. Counters password attacks and phishing impact. Possibly use \"where you are\" as an extra factor.\n3. *Authorization:* **RBAC**: remote staff get the same role permissions as in the office, no more (least privilege); sensitive actions may require additional approval.\n4. *Network perimeter:* a **firewall** at the VPN gateway (stateful inspection, with ingress and egress filtering) and an **IDS** to detect anomalies. Counters IP spoofing and intrusion attempts.\n5. *Endpoint:* encrypted laptops (hardware security), patched firmware, antivirus/EDR. Counters theft and malware.\n6. *Accountability:* logging of remote sessions, review of unusual access. Supports detection and investigation.\n7. *Policy and training:* a policy for remote work (an ISSP) and awareness training (evil maid and phishing risks).\n8. *Continuity:* backups and a tested DR plan if the VPN or data centre fails.\n9. *Conclusion:* layered controls covering prevention, detection and reaction.\n\n**Marking criteria:** at least five distinct controls (5), each tied to an attack or risk (3), correct access model (2), prevention-detection-reaction balance (1), coherence (1).\n\n**Common mistake:** listing \"VPN and firewall\" only, without authentication, authorization or accountability.\n<\/details>\n\n**Q15.** Evaluate the statement: \"Our firewall is configured correctly, so network attacks are not a risk.\" Use at least four attacks from the notes. (10 marks)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer outline:**\n1. *Position:* false; a firewall is necessary but does not cover every attack.\n2. *SYN flood:* a stateful firewall can limit it, but a large enough flood still exhausts capacity; needs DDoS protection and timeouts.\n3. *ARP poisoning:* happens inside the LAN; a perimeter firewall does not see it.\n4. *Sniffing:* passive; a firewall does not stop internal or wireless sniffing. Encryption is the defence.\n5. *DNS poisoning:* misdirects users to fake sites, with traffic that looks like normal web traffic to the firewall.\n6. *IP spoofing:* ingress filtering helps, but other layers are still needed.\n7. *Configuration is not static:* rules age, exceptions accumulate, so audits and reviews are needed.\n8. *Link to notes:* detection and reaction (IDS, logging) remain necessary alongside prevention.\n9. *Conclusion:* the firewall reduces risk; it does not remove it.\n\n**Marking criteria:** position (1), four attacks with reasoning (4), additional layers (3), configuration drift (1), conclusion (1).\n\n**Common mistake:** stating each attack without linking it to what the firewall can or cannot see.\n<\/details>\n\n\n---"};</script><script src="assets/app.js"></script><script src="assets/live.js"></script></html>
