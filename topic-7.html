<script src="assets/meta.js"></script><script src="assets/index.js"></script><script>window.PAGE={"id": "t7", "t": "TOPIC 7 — Information Systems Controls and Control Objectives", "s": "7 · Information Systems Controls and Control Objectives", "g": "Topics", "c": "#2563eb", "k": "7", "f": "topic-7.html", "w": 10050, "md": "# TOPIC 7 — Information Systems Controls and Control Objectives\n\n**Classification:** Foundation (definition, objectives), Core (general controls, audit trail), Difficult/High-risk (application controls, classification schemes), Applied (testing controls)\n**Sources:** Topic 7 Word document (the full text) and Topic 7 slides (a 10-slide summary of the same material). 12 teaching hours, the **largest topic**. CW2 areas (b) passwords, (c) tariffs, (d) interest recomputation, (e) product eligibility and (f) segregation of duties are all controls testing.\n**Outline items:** (a) understanding security and IT audit controls; (b) categories of controls (administrative, technical, physical and logical); (c) input, process, validation, output, logical access, physical access; (d) classification of controls (preventive, detective and corrective); (e) database, network, environment, BCP, evidence collection, evaluation and reporting methodologies.\n\n> **Read this first: the notes and the outline use different classification schemes.**\n> - The **outline** lists categories **Administrative / Technical / Physical / Logical**, and classification **Preventive / Detective / Corrective**.\n> - Your **notes** classify controls as **General / Application (business process) / Objective-based / User**, and the objective-based class has **five** members: **Preventive, Detective, Corrective, Directive, Recovery**.\n> - Both are valid ways of slicing the same controls. This topic teaches the notes' scheme in full (7.5 to 7.11), then maps it to the outline's words in 7.5.2 so you can answer either.\n\n## PHASE 1 — UNDERSTANDING\n\n### 7.1 The big picture\n\nA **control** is a safeguard that makes a business objective more likely to be achieved and an undesired event less likely to happen unnoticed. Everything an IS auditor tests (Topic 6) is a control, or the absence of one. Topic 7 is the **catalogue** of controls and the **ways of grouping** them.\n\n**Where it connects.** Backward: Topic 2's threats and risks are what controls address; Topic 3's policies state the rules controls enforce; Topic 4's domains (access, network, physical, application, hardware) are where many controls sit; Topic 5's change management and configuration control are general controls; Topic 6's audit process tests them. Forward: Topic 8 reports on weak controls, and the Practical Lab tests application controls in Excel and IDEA.\n\n### 7.2 Key terms\n\n| Term | Meaning (notes unless marked) |\n|---|---|\n| Control | \"The policies, procedures, practices and organizational structures designed to provide **reasonable assurance** that business objectives will be achieved and that undesired events will be **prevented or detected and corrected**\" |\n| General controls | Policies and procedures that apply to **all or a large segment** of an organization's information systems and help ensure their proper operation |\n| Application (business process) controls | Automated and/or manual controls applied to **business transaction flows**, relating to completeness, accuracy, validity and confidentiality |\n| Objective-based controls | Controls classified by the **objective** they serve: preventive, detective, corrective, directive, recovery |\n| User controls | Controls performed by people interacting with information systems |\n| Completeness (C) | All transactions that occurred are input, accepted, processed **once and only once**, and included in output |\n| Accuracy (A) | Transactions recorded correctly, timely; data processed accurately |\n| Validity (V) | Recorded transactions actually occurred, relate to the organization and were properly approved |\n| Confidentiality (CF) | Application data and output are protected against unauthorized access |\n| Segregation of duties | Stages of a transaction are split between different people so that one person cannot process it from start to finish |\n| Audit trail | Logs that record activity at the system, application and user level |\n| Compensating control | An alternative control that reduces the risk of a weakness elsewhere (notes: considered for each potential weakness) |\n| Business rules | Input and processing controls implemented in data management systems (edit checks, existence checks, thresholds) |\n\n### 7.3 What a control is, and why \"reasonable assurance\"\n\n**Definition (notes).** Controls are \"the policies, procedures, practices and organizational structures designed to provide **reasonable assurance** that business objectives will be achieved and that undesired events will be prevented or detected and corrected\".\n\nThe basic purpose: ensure business objectives are achieved and undesired risk events are **prevented or detected and corrected**. This is achieved by designing an effective information control framework made of **policies, procedures, practices and organization structure**.\n\n**Four ingredients, with a concrete example each (illustrative):**\n\n| Ingredient | Example in a bank |\n|---|---|\n| Policy | \"All payments over 5,000,000 UGX require a second approver\" |\n| Procedure | The step-by-step payment approval workflow |\n| Practice | Approvers actually check the supporting invoice before approving |\n| Organization structure | Payments are prepared by Treasury but approved by Finance (separate people reporting to different managers) |\n\n> **Supplementary explanation: why \"reasonable\" and not \"absolute\".** No control gives a guarantee: controls can be bypassed by collusion, overridden by management, or fail through error, and perfect controls would cost more than the losses they prevent. The standard is therefore **reasonable assurance**: enough comfort, at justifiable cost, that objectives will be met. Exam answers that promise \"complete protection\" lose marks.\n\n### 7.4 Objectives of controls and the need for control and audit\n\n#### 7.4.1 Twelve objectives of controls (notes)\n\nThe control framework maintains or assures:\n\n| # | Objective | # | Objective |\n|---|---|---|---|\n| 1 | System **controllability** | 7 | **Safeguarding** information systems assets |\n| 2 | System **maintainability** | 8 | **Compliance** with corporate policies and regulatory and legal requirements |\n| 3 | System **usability** | 9 | System **reliability** |\n| 4 | System **effectiveness** | 10 | Data **integrity** |\n| 5 | System **economy and efficiency** | 11 | System **security** |\n| 6 | System **quality** | 12 | System **availability** |\n\n**Memory aid:** group them as **Run** (controllability, maintainability, usability, quality), **Perform** (effectiveness, economy and efficiency, reliability), **Protect** (safeguarding assets, integrity, security, availability) and **Comply** (policies and law).\n\n#### 7.4.2 Why organizations need control and audit of information systems (seven factors, notes)\n\nTechnology lets organizations capture, store, analyse and process huge amounts of data, which empowers decision makers. The factors pushing organizations toward control and audit:\n\n| # | Factor | Meaning (notes) | Concrete example |\n|---|---|---|---|\n| 1 | **Organizational costs of data loss** | Data is a critical resource for present and future processes and for survival | Losing a year of customer records |\n| 2 | **Incorrect decision making** | Managers need accurate data to make quality decisions | Credit decisions made on wrong income data |\n| 3 | **Costs of computer abuse** | Unauthorised access, viruses, unauthorised physical access and unauthorised copies of sensitive data can destroy assets | A virus wipes servers |\n| 4 | **Value of hardware, software and personnel** | Critical resources with a credible impact on infrastructure and competitiveness | Core banking platform worth billions |\n| 5 | **High costs of computer error** | A data entry or processing error in a computerised enterprise causes great damage | A wrong interest rate applied to all accounts |\n| 6 | **Maintenance of privacy** | Data holds personal details (medical, educational, employment, residence); fear that privacy has eroded | Customer ID and address leaks |\n| 7 | **Controlled evolution of computer use** | Reliability of complex systems cannot be guaranteed; unreliable systems can be destructive | A new system rolled out without testing |\n\n#### 7.4.3 IS auditing and four objectives (notes)\n\nIS auditing is the process of attesting to objectives: those of the **external auditor** (asset safeguarding and data integrity) and **management objectives** of the **internal auditor** (which include attest objectives plus effectiveness and efficiency).\n\n| Objective | Meaning (notes) |\n|---|---|\n| **Asset safeguarding** | IS assets (hardware, software, data files) must be protected by internal controls from unauthorised access |\n| **Data integrity** | A fundamental attribute of IS auditing; its importance depends on the value of the information, the extent of access to it, and its value to the business for decision makers, competition and the market |\n| **System effectiveness** | Evaluated by auditing the characteristics and objectives of the system to see whether it meets substantial user requirements |\n| **System efficiency** | Optimise the use of resources (machine time, peripherals, system software, labour) and the effect on the computing environment |\n\n### 7.5 Classifying controls\n\nThe notes: \"Controls are central to the idea of an information systems audit. They define a point of action in a work process wherein a decision to select the subsequent action arises.\" Information systems controls are classified as:\n\n1. **General controls**\n2. **Business process / application controls**\n3. **Objective-based controls**\n4. **User controls**\n\n#### 7.5.1 The notes' classification as a map\n\n```\n IS CONTROLS\n |\n +-- GENERAL (organization-wide; system level)\n |     +-- Organizational controls\n |     +-- Management controls\n |     +-- Financial control techniques\n |     +-- Systems development and documentation controls\n |     +-- Hardware and system software controls (incl. configuration management)\n |     +-- Business continuity controls\n |\n +-- APPLICATION / BUSINESS PROCESS (one application)\n |     +-- Application level general controls\n |     +-- Business process controls (input, processing, output, master data)\n |     +-- Interface controls\n |     +-- Data management system controls\n |\n +-- OBJECTIVE-BASED (what the control is *for*)\n |     +-- Preventive | Detective | Corrective | Directive | Recovery\n |\n +-- USER CONTROLS (done by people using the system)\n       +-- Boundary | Input | Processing | Output | Database\n```\n\n#### 7.5.2 Mapping the notes to the outline's words\n\n| Outline word | What it means | Where it sits in your notes |\n|---|---|---|\n| **Administrative** controls | Policies, procedures, organization and people-based controls | General controls: organizational, management and financial control techniques (segregation of duties, supervision, authorisation); also Topic 5's \"administrative controls (segregation of duties, user access management)\" |\n| **Technical** controls | Technology that enforces security | Access control software, encryption, logging, firewalls, programmed edit checks, automatic error detection (Topic 5: \"technical controls (access controls, encryption, logging)\") |\n| **Logical** controls | Technical controls on **access to data and systems** (often used as a synonym for technical controls) | Boundary controls (identification, authentication, authorization); application confidentiality controls (restricted logical access) |\n| **Physical** controls | Controls on facilities and equipment | Safekeeping; secure facility access (Topic 5); Annex A.11 (Topic 4); environmental controls in business continuity |\n| **Preventive / Detective / Corrective** | Classification by objective | Objective-based controls (the notes add **directive** and **recovery**) |\n| **Input, process, output** | Where in processing the control sits | Business process controls and user controls (7.7, 7.10) |\n| **Validation** | Checks that data is valid and reasonable | Accuracy and validity controls; programmed edit checks (7.7) |\n| **Logical access, physical access** | How people reach systems and facilities | Boundary controls; safekeeping and facility access |\n\n> **Supplementary explanation.** In a typical exam answer, \"administrative, technical, physical\" answers *what type of safeguard it is* (people/policy, technology, premises), while \"preventive, detective, corrective\" answers *when it acts relative to the event*. One control can be classified both ways: a **password** is a technical (logical) and preventive control; a **log review** is an administrative and detective control; a **backup restore procedure** is administrative and corrective/recovery; a **locked server room door** is physical and preventive.\n\n### 7.6 General controls (notes)\n\n**Definition.** Policies and procedures that apply to **all or a large segment** of an organization's information systems and help ensure their proper operation.\n**Primary objectives:** safeguard data, protect business process application programs, and ensure continued computer operations in case of unexpected interruption.\n**Levels:** organization-wide, system, and business process application levels.\n**Why they come first:** the effectiveness of general controls at the organization-wide and system levels is a significant factor in determining the effectiveness of application controls. **Without effective general controls, business process controls can generally be rendered ineffective by circumvention or modification.**\n\n*Concrete case:* a loan application has a perfect programmed check that rejects loans above a limit. If general controls over program changes are weak, a developer can switch off that check in production without approval. The application control exists but cannot be relied on. That is why an auditor tests general controls first.\n\n#### 7.6.1 Organizational controls\n\nConcerned with the **decision-making processes that lead to management authorisation of transactions**. Companies with large data processing facilities separate data processing from business units to control costly hardware, software and human resources. Techniques include **documentation of:**\n\n| Documentation | Purpose | Example |\n|---|---|---|\n| Reporting responsibility and authority of each function | Clear lines of authority | IT security manager reports to the CIO |\n| Definition of responsibilities and objectives of each function | No gaps or overlaps | Role statements for data entry, operations, programming |\n| Policies and procedures | Written rules | Change management policy |\n| Job descriptions | Defined duties for each person | The programmer's job description excludes production access |\n| **Segregation of duties** | One person cannot do a transaction start to finish | Programmers do not operate production |\n\n#### 7.6.2 Management controls\n\nAdopted by management so that information systems **function correctly and meet strategic business objectives**. Management determines whether controls are sufficient, frames high-level IT policies, procedures and standards, and establishes a sound internal controls framework. **Controls flow from the top down; responsibility still lies with senior management.**\n\nWhen reviewing organization and management controls, consider:\n\n1. **Responsibility:** a senior manager is responsible for IS within the overall structure.\n2. **An official IT structure:** a prescribed organization structure, with staff roles and responsibilities set out in written, agreed job descriptions.\n3. **An IT steering committee:** user representatives from all areas of the business plus IT personnel, responsible for the **overall direction of IT** (compare Topic 5).\n\n#### 7.6.3 Financial control techniques\n\nProcedures exercised by **system user personnel** over **source (transaction origination) documents before system input**. They use computer-generated reports showing unposted items, non-monetary changes, item counts and transaction amounts, and the reconciliation of the application (subsystem) to the general ledger. The notes list ten:\n\n| # | Technique | Meaning (notes) | Concrete example |\n|---|---|---|---|\n| 1 | **Authorization** | Obtaining authority to perform some act, typically to access assets such as accounting or application entries | A manager's approval before a refund is posted |\n| 2 | **Budgets** | Estimates of time or money over a period. **A budget alone is not an effective control**: it must be compared with actual performance, differences isolated and researched | Monthly IT budget vs actual report with variance explanations |\n| 3 | **Cancellation of documents** | Marking a document so it cannot be reused | Stamping an invoice \"PAID\" |\n| 4 | **Documentation** | Written explanations of actions taken, and written instructions explaining tasks | A note recording why a transaction was reversed |\n| 5 | **Dual control** | Two people access an asset together, but only one handles it | Two tellers open the vault; one removes the deposit envelopes |\n| 6 | **Input/output verification** | Comparing computer output to input documents; **expensive and tends to be over-recommended by auditors**; usually aimed at non-monetary and total counts | Check item counts and totals of a report to source batch |\n| 7 | **Safekeeping** | Physically securing assets under lock and key | Backup disks kept in a safe |\n| 8 | **Segregation of duties** | Stages of a transaction split between people | The person who sets up a supplier cannot also approve payments to them |\n| 9 | **Sequentially numbered documents** | Preprinted numbers let you detect missing documents | Cheque numbers 5001 to 5050: a gap shows a missing cheque |\n| 10 | **Supervisory review** | Supervisor reviews specific work | Supervisor reviews the daily exception report |\n\n#### 7.6.4 Systems development and documentation controls\n\nInclude:\n- A process of **review, testing and approval** of new and modified systems.\n- Control over **program and parameter changes**.\n- **Documentation procedures**.\n\n**Hardware and system software controls** include: automatic error detection features; periodic preventive maintenance; formal procedures to recover from hardware errors; adequate **authorization and control over implementation of and changes to operating systems software**.\n\n**Configuration management** prevents unauthorised changes to IS resources (software and hardware configurations) and gives reasonable assurance that systems are configured and operating securely and as intended. Four concepts: **configuration identification, configuration control, configuration status accounting, configuration auditing** (compare Topic 5).\n\n#### 7.6.5 Business continuity controls\n\nThese ensure an **operational and tested IT continuity plan**, in line with the overall business continuity plan and its business requirements, so that IT services are available as required and impact is minimal in a major disruption. The controls include (notes):\n\n| Element | Meaning (concrete) |\n|---|---|\n| Criticality classification | Rank systems by importance (core banking before the staff canteen system) |\n| Alternative procedures | Manual workarounds while systems are down |\n| Back-up and recovery | Copies and the way to restore them |\n| Systematic and regular testing and training | Test the plan; train staff |\n| Monitoring and escalation processes | Detect problems and pass them up quickly |\n| Internal and external organizational responsibilities | Who does what, including suppliers |\n| Business continuity activation | Who decides to invoke the plan, and how |\n| Fallback and resumption plans | How to switch to a fallback and later return |\n| Risk management activities | Identify what could disrupt the business |\n| Assessment of single points of failure | Find one component whose failure stops everything |\n| Problem management | Fix recurring causes of disruption |\n\n### 7.7 Application controls (business process application controls)\n\n**Overall objective (notes):** provide **reasonable assurance about the completeness, accuracy, validity and confidentiality of transactions and data during application processing.** Memory aid: **C-A-V-C** (or \"CAV + confidentiality\").\n\n#### 7.7.1 The four objectives, each with its typical controls\n\n| Objective | Reasonable assurance that (notes) | Typical controls (notes) |\n|---|---|---|\n| **Completeness (C)** | All transactions that occurred are input, accepted, **processed once and only once** and included in output: transactions completely input; valid transactions accepted; **duplicate postings rejected**; rejected transactions identified, corrected and reprocessed; all accepted transactions fully processed | Batch totals, sequence checking, matching, duplicate checking, reconciliations, control totals, exception reporting |\n| **Accuracy (A)** | Transactions recorded properly: correct amount/data, in the proper period; key data accurate; processed accurately; output accurate | **Programmed edit checks** (validations, reasonableness, dependency, existence, format, mathematical accuracy, range checks), batch totals, check digit verification |\n| **Validity (V)** | All recorded transactions **actually occurred (are real)**, relate to the organization and were **properly approved**; output contains only valid data. Includes **authenticity** | One-for-one checking, matching |\n| **Confidentiality (CF)** | Application data, reports and output are protected against unauthorised access | Restricted physical and logical access to sensitive applications, data files, transactions and output; segregation of duties; restricted access to data reporting/extraction tools and to copies or extractions of data files |\n\n**Availability** is not listed as a business process control: the notes say these controls are principally addressed in **application security controls (especially contingency planning)**.\n\n#### 7.7.2 Worked example: one batch of supplier invoices, line by line (illustrative)\n\n**Source documents.** A batch of five supplier invoices arrives for keying:\n\n| Invoice no. | Amount (UGX) |\n|---|---|\n| 1001 | 200,000 |\n| 1002 | 150,000 |\n| 1003 | 300,000 |\n| 1004 | 100,000 |\n| 1005 | 250,000 |\n\n**Batch control figures prepared before keying:** item count **5**; control total **1,000,000**; hash total of invoice numbers 1001 + 1002 + 1003 + 1004 + 1005 = **5,015**.\n\n**What the clerk actually keys (with two mistakes):** invoices 1001, 1002, 1003 (typed as **30,000** instead of 300,000), 1005. **Invoice 1004 is missed.**\n\n**What the system computes after input:** item count **4**; control total 200,000 + 150,000 + 30,000 + 250,000 = **630,000**.\n\n| Control | What it does here | Result |\n|---|---|---|\n| **Batch count check (completeness)** | Compare 5 expected with 4 entered | **Mismatch: an item is missing** |\n| **Sequence check (completeness)** | Look at invoice numbers in order | **Gap at 1004** |\n| **Batch control total (completeness and accuracy)** | Compare 1,000,000 expected with 630,000 | **Mismatch: amounts are wrong or missing** |\n| **Duplicate check (completeness)** | If 1002 were keyed twice, reject the second | Not triggered here |\n| **Range / reasonableness check (accuracy)** | Reject amounts outside a range, flag unusual ones | The 30,000 is within range, so **a range check alone would not catch it**; the batch total does |\n| **Matching / one-for-one checking (validity)** | Match each invoice to an approved purchase order and a goods received note | If 1005 has no matching order, it is **not a valid transaction** |\n| **Confidentiality** | Only accounts payable staff can view supplier bank details; extraction tools restricted | Prevents leakage |\n\n**Lessons:** controls work **together**. The sequence check finds the missing item; the batch total finds the typing error; matching tests whether the invoice is real. No single check does everything.\n\n**More edit checks, each with a concrete test (illustrative):**\n\n| Edit check | Example rule | What it catches |\n|---|---|---|\n| **Range** | Amount between 1 and 10,000,000 | An extra zero typed |\n| **Format** | Invoice number is exactly 4 digits | \"10O1\" with a letter O |\n| **Existence** | Supplier code must exist in the supplier master file | Payment to a non-existent supplier |\n| **Dependency** | If payment method is \"bank transfer\", bank account is required | A transfer with no account |\n| **Reasonableness** | Flag a salary more than 10 times the grade average | A salary typo |\n| **Mathematical accuracy** | Line total must equal quantity × unit price | A wrong line total |\n| **Check digit** | See below | Transposed or mistyped account numbers |\n\n**Check digit, step by step (invented rule: weights 1, 2, 3, 4 applied to the four digits, sum, take the last digit).**\n- Genuine account 4471: 4×1 + 4×2 + 7×3 + 1×4 = 4 + 8 + 21 + 4 = 37. The check digit is **7**, so the number as printed is **44717**.\n- A clerk transposes two digits and keys 4417 followed by 7 (**44177**). The system recomputes: 4×1 + 4×2 + 1×3 + 7×4 = 4 + 8 + 3 + 28 = 43. The expected check digit is **3**, but the entered one is 7. **Rejected.**\n\n#### 7.7.3 Application controls: the four categories (notes)\n\n| Category | What it is (notes) | Examples |\n|---|---|---|\n| **1. Application-level general controls** | General controls operating at the application level; they depend on general controls at the entity-wide and system levels; help assure confidentiality, integrity and availability and protect application resources and data against unauthorised **modification, disclosure, loss and impairment**; assessing them needs application-specific technical knowledge | Application access, application change control, application backups |\n| **2. Business process controls** | Automated and/or manual controls applied to transaction flows, relating to completeness, accuracy, validity and confidentiality; operate over individual transactions | See the four types below |\n| **3. Interface controls** | Ensure **timely, accurate and complete processing** of information between applications and feeder/receiving systems, and **complete and accurate migration of clean data** during conversion | Counts and totals matched at each interface; reject and fix interface errors |\n| **4. Data management system controls** | Specialised software: database management systems, middleware, cryptography used with data integrity controls, data warehouse software, reporting/extraction software. Input and processing controls implemented here are called **business rules** | Database constraints, thresholds |\n\n**Business process controls: the four types (notes):**\n\n| Type | Relates to | Example (notes) |\n|---|---|---|\n| **Transaction data input** | Data entering the application | Data validation and edit checks |\n| **Transaction data processing** | Data integrity within the application | Review of transaction processing logs |\n| **Transaction data output** | Output and distribution | Output reconciliation and review |\n| **Master data setup and maintenance** | Master data (key, relatively constant information shared across functions) | Vendor file changes need approval |\n\n**Interface control objectives (notes):** an effective interface strategy and design; effective interface processing procedures (processed completely, accurately and only once in the proper period; errors rejected, isolated and corrected in a timely manner; access to interface data and processes properly restricted; data reliable and from authorised sources).\n\n#### 7.7.4 Auditing application controls (notes)\n\nThe auditor assesses the effectiveness of controls in each of the four categories **to the extent significant to the audit objectives**, with two aspects: **testing the effectiveness of controls**, and **evaluating the results of testing**. Procedures:\n\n1. **Understand** the information systems relevant to the audit objectives, building on key areas of audit interest and **critical control points**.\n2. **Determine which IS control techniques are relevant** to the audit objectives. For each, decide whether it is **suitably designed** to achieve the critical activity and has been **implemented** (placed in operation).\n3. **Perform tests** to determine whether the techniques are **operating effectively**.\n4. **Identify potential weaknesses** (design weaknesses or operating weaknesses).\n5. For each potential weakness, consider the impact of **compensating controls** or other factors that mitigate the risk.\n\n**Design vs operating effectiveness: the key distinction.**\n- *Design* asks: \"If this control worked as written, would it address the risk?\" (Is it the right control?)\n- *Operating effectiveness* asks: \"Did it actually work, consistently, throughout the period?\"\nA control can be well designed but not operating (an approval step that staff skip), or operating but badly designed (a check that does not address the risk).\n\n\n### 7.8 Objective-based control classification (five categories, notes)\n\nThe classification of controls by the **objective with which they are designed or implemented**. The notes list **five**; the outline names only the first three.\n\n| Category | What it does (notes) | Characteristics (notes) | Concrete examples |\n|---|---|---|---|\n| **Preventive** | Designed to **prevent** an error, omission or malicious act from occurring | A clear understanding of the asset's vulnerabilities; understanding probable threats; provision of controls to stop probable threats materialising. Aims to establish a reliable system, based on standards, methods, practices, tools and techniques; addresses maintenance, security, usage and control features | Passwords to access a financial system (the notes' own example); segregation of duties; an edit check that rejects invalid data; a locked server room |\n| **Detective** | Designed to **detect** variation outside control limits, and errors, omissions or malicious acts that occur, and **report** them; assess whether other controls (directive or preventive) achieved their objectives | | Exception reports; log review; reconciliations; intrusion detection; sequence check that finds a gap |\n| **Corrective** | Designed to **reduce the impact or correct an error once detected**; continue from the detections made by detective controls with information, procedures and instructions to correct errors, omissions and non-compliance; can be manual or automated | Minimise the impact of the threat; identify the cause of the problem; remedy problems found by detective controls; get feedback from preventive and detective controls; correct errors; **modify processing systems to minimise future occurrences** | Re-processing a rejected transaction; applying a patch; correcting a wrong balance; investigating a root cause |\n| **Directive** | **Management actions, procedures, directives or guidelines** that facilitate the occurrence of a preferred event; influence the whole system or operation, covering usage, maintenance, audit, control and security, to ensure integrity, reliability and availability | | Policies, standards, job descriptions, security awareness training |\n| **Recovery** | Provide tools, techniques and procedures of **backup, restoration, recovery and restart** of an information resource; a formal structure to ensure the availability of resources needed for early recovery from disaster | Critical when exposed to events threatening disruption of services | Backups; disaster recovery plan; alternate site |\n\n**One scenario with all five (illustrative): paying a supplier invoice.**\n\n| Step | Control | Category |\n|---|---|---|\n| 1 | The policy says no payment without a matching purchase order and goods received note | **Directive** |\n| 2 | The system blocks payment if no matching purchase order exists | **Preventive** |\n| 3 | A weekly report lists any payments made without a match | **Detective** |\n| 4 | Finance reverses a wrongly made payment and recovers the money from the supplier | **Corrective** |\n| 5 | After a server crash, the payments system is restored from backup | **Recovery** |\n\n**The timeline view:**\n\n```\n DIRECTIVE ---> PREVENTIVE ---> DETECTIVE ---> CORRECTIVE ---> RECOVERY\n (set the       (stop it        (spot it       (fix it and     (restore normal\n  rules)         happening)      if it does)    learn)          operations)\n```\n\n**Corrective vs recovery:** *corrective* controls fix **errors and non-compliances found by detection** and prevent recurrence; *recovery* controls restore **services and resources after a disruption or disaster**. Restoring a corrupted file from backup sits at the boundary: the notes would call the backup procedure a recovery control.\n\n### 7.9 User controls (notes)\n\nControls performed by people interacting with information systems, used to ensure system **effectiveness and efficiency**. Five types:\n\n| Type | What it is (notes) | Concrete example |\n|---|---|---|\n| **Boundary controls** | The major controls of the boundary system are the **access control mechanisms**. They link authentic users to the authorised resources they may access, in **three steps: identification, authentication, authorization**, according to the access control policy | Login to the system with ID, password and OTP; role-based permissions (Topic 4) |\n| **Input controls** | Ensure the **accuracy and completeness of data and instructions** entered into an application. Important because much time is spent on input, which involves **human intervention** and is therefore **error and fraud prone** | Source document checks, batch totals, edit checks (7.7) |\n| **Processing controls** | **Validation checks** to identify errors during processing; ensure both completeness and accuracy of data being processed; normally enforced through the **database management system** that stores the data | Checks that a posted total equals the sum of its entries |\n| **Output controls** | Ensure data delivered to users is **presented, formatted and delivered** in a consistent and secured manner | Restricted report distribution lists; labelled reports; secure disposal of printouts |\n| **Database controls** | Protect the **integrity of a database** when application software acts as the interface between the user and the database | Restrict direct database access; integrity rules; activity logging |\n\n**How user controls link to the outline's items.** The outline's \"input, process, validation, output, logical access, physical access\" lines up like this: *input* = input controls; *process* = processing controls; *validation* = edit checks inside input and processing; *output* = output controls; *logical access* = boundary controls; *physical access* = safekeeping and facility controls (Topic 4, Annex A.11).\n\n### 7.10 Audit trail (notes)\n\n**Definition.** Audit trails are **logs designed to record activity at the system, application and user level**. When properly implemented, they provide an important **detective control** to help accomplish security policy objectives. An effective audit policy captures all significant events **without cluttering the log with trivial activity**.\n\n**Purpose of audit trail controls (notes):** ensure a **chronological record of all events** in a system is maintained, which is needed to answer queries, fulfil statutory requirements, detect the consequences of error, and allow system monitoring and tuning.\n\n| Type | What it shows (notes) |\n|---|---|\n| **Accounting audit trail** | The **source and nature of data and processes** that update the database |\n| **Operations audit trail** | A record of **attempted or actual resource consumption** within a system |\n\n**Three security objectives (notes):**\n\n| Objective | How it works (notes) |\n|---|---|\n| **Detecting unauthorised access** | *Real time:* protects against outsiders trying to breach controls; can also report performance changes that may indicate a virus or worm; can **degrade performance** if heavy. *After the fact:* logs stored and reviewed periodically or as needed; show whether unauthorised access was accomplished or attempted and failed |\n| **Reconstructing events** | Audit analysis reconstructs the steps behind system failures, security violations or processing errors; assigns responsibility and avoids repeats; a record of all changes to account balances can rebuild accounting files corrupted by a failure |\n| **Personal accountability** | Monitors user activity at the lowest level of detail. **This is a preventive control that influences behaviour**: people are less likely to violate policy if they know their actions are logged |\n\n**Implementing audit trails (notes):** the information helps accountants measure potential damage and financial loss from errors, abuse of authority or intruders, and is evidence of whether controls are adequate. But logs can produce overwhelming detail where important information is lost among the trivial; **poorly designed logs can be dysfunctional**.\n\n**Worked example: reconstructing an unauthorised change from a log (illustrative).**\n\n```\n2026-09-03 08:12:44  user=jmugisha  action=LOGIN   result=SUCCESS  ip=10.0.2.14\n2026-09-03 08:15:02  user=jmugisha  action=UPDATE  table=interest_rates  product=SAV01  old=3.0  new=13.0\n2026-09-03 08:15:30  user=jmugisha  action=LOGOUT\n2026-09-03 08:16:10  user=admin     action=LOGIN   result=FAIL     ip=203.0.113.50\n2026-09-03 08:16:12  user=admin     action=LOGIN   result=FAIL     ip=203.0.113.50\n```\n\nReading it line by line:\n- Line 1: jmugisha logs in successfully from an internal address.\n- Line 2: three minutes later the SAV01 savings interest rate is changed from 3.0 to 13.0. This is a **reconstruction** of what happened and **personal accountability**: the change is tied to one user and one time.\n- Line 3: the user logs out, so the rate stays changed.\n- Lines 4 and 5: two failed \"admin\" logins from an external address. This is **detecting unauthorised access attempts**.\n\nThe auditor then checks: is there an approved change request for the rate change? If not, there is an unauthorised change (a finding). Are failed logins monitored and followed up?\n\n### 7.11 The effect of computers on internal controls (seven areas, notes)\n\nIn a computerised environment, the major areas of impact on asset safeguarding, data integrity, system efficiency and effectiveness are:\n\n| # | Area | What changes (notes) | Concrete example |\n|---|---|---|---|\n| 1 | **Personnel** | Whether staff are trustworthy, know what they are doing and have appropriate skills and training | A junior operator with no training runs month-end |\n| 2 | **Segregation of duties** | A **key control** in an information system: stages of a transaction are split so one person cannot process it from start to finish | Different people create a supplier, enter an invoice and approve payment |\n| 3 | **Authorization procedures** | Ensure transactions are approved. In on-line systems, written evidence (a supervisor's signature) may be **replaced by automated controls** in programs | A programmed credit limit approval |\n| 4 | **Record keeping** | Controls over protection and storage of documents, transaction details and audit trails | Retention of logs and records |\n| 5 | **Access to assets and records** | Manual systems were protected by locked doors and cabinets; **wide area networks and the internet have increased the risk** of unauthorised access, so the controls have changed | Network access controls, authentication |\n| 6 | **Management supervision and review** | Helps deter and detect errors and fraud | Review of exception reports |\n| 7 | **Concentration of programs and data** | Transaction and master file data (pay rates, approved supplier lists) may sit on one or many computers, **with programs such as file editors in the same place**; without controls over these programs and utilities there is increased risk of unauthorised access to, and alteration of, financial data | A programmer's file editing tool that can change pay rates directly in the production file |\n\n### 7.12 The outline items your notes do not cover (Supplementary explanation)\n\n> The outline's item (e) lists \"database, network, environment, BCP, evidence collection, evaluation and reporting methodologies\". Your notes cover some of these (database controls under user controls; BCP under general controls; audit evidence in Topic 6). The rest follows. Where your lecturer teaches these differently, follow the lecturer.\n\n| Item | What it means | Where to find it |\n|---|---|---|\n| **Database controls** | Restrict direct access to the database; log and review administrator activity; enforce integrity rules (valid values, required fields, relationships between tables); separate test and production data; back up and test restores; encrypt sensitive fields | User controls (7.9); Topic 4 access control |\n| **Network controls** | Firewalls, network segmentation, VPN, encryption, IDS/IPS, monitoring, secure configuration of network devices | Topic 4 |\n| **Environment controls** | Fire detection and suppression, uninterruptible power supply and generators, air-conditioning and humidity, water leak detection, secure siting | Topic 4 (Annex A.11); BCP in 7.6.5 |\n| **Business continuity (BCP)** | Operational, tested continuity plan | 7.6.5; Topic 4 (4.9.5) |\n| **Evidence collection and evaluation** | Types of evidence, reliability, sufficiency and appropriateness | Topic 6 (6.13) |\n| **Reporting methodologies** | How to document and communicate findings (condition, criteria, cause, effect, recommendation) | Topic 8 |\n\n### 7.13 Testing controls: design, implementation and operation (supplementary, linking to 7.7.4)\n\nFor each control the auditor asks three questions in order:\n\n1. **Is it suitably designed?** (Would it address the risk if it worked?)\n2. **Was it implemented?** (Is it in place?)\n3. **Is it operating effectively?** (Did it work consistently through the period?)\n\n| Test method | Used for | Example |\n|---|---|---|\n| **Inquiry** | Understanding the control | Ask the supervisor how exceptions are reviewed |\n| **Walk-through** | Confirming design and implementation | Follow one transaction from start to finish and see each control act |\n| **Inspection** | Evidence of operation | Check for the signature on approved payment requests |\n| **Observation** | Controls performed at the time | Watch a restore from backup |\n| **Re-performance** | Operation of a control | Re-run the reconciliation |\n| **CAATs (Excel, IDEA)** | Testing the whole population | Test every payment for duplicates (Practical Lab) |\n\n**Worked example: testing a preventive application control (illustrative).** The control: \"the system rejects a payment to a supplier not in the supplier master file.\"\n1. *Design:* the rule addresses the risk of fictitious payments; suitable.\n2. *Implementation:* the auditor sees the rule is switched on in the configuration.\n3. *Operation:* the auditor attempts a test payment to a supplier code that does not exist, in a test environment. The system accepts it. **The control is not operating**; this is a finding even though the design is good.\n\n### 7.14 Segregation of duties (SoD): a deep dive (CW2 area (f))\n\n**What it is (notes):** the stages in processing a transaction are split between different people so that one person cannot process a transaction through from start to finish.\n\n**Why it matters:** if one person can create a supplier, approve invoices and release payments, that person can pay a fake supplier and nobody else sees it.\n\n**Incompatible duties (illustrative conflict matrix):**\n\n| Duty A | Should not be combined with | Risk if combined |\n|---|---|---|\n| Create or change supplier master data | Approve or release payments | Fictitious supplier fraud |\n| Enter a transaction | Approve the same transaction | Self-approved fraud or error |\n| Develop or change programs | Operate or deploy to production | Unauthorised changes |\n| Custody of assets | Record-keeping for those assets | Theft can be hidden |\n| Administer user accounts | Perform business transactions | A user can give themselves access |\n\n**How an auditor tests SoD (illustrative):**\n1. Obtain the **user-role matrix** (who has which permissions).\n2. Obtain the organization's **conflict matrix** (pairs of permissions that must not be held together).\n3. For each user, check whether they hold **both sides** of any conflict.\n4. Investigate each hit: is there a **compensating control** (for example, a supervisor reviews all payments created by that user)?\n\n| User | Permissions held | Conflict? |\n|---|---|---|\n| Agnes | Create supplier; Approve payment | **Yes** (fictitious supplier risk) |\n| Peter | Enter invoice | No |\n| Brian | Approve payment | No |\n| Susan | Enter invoice; Approve invoice | **Yes** (self-approval) |\n\n**Compensating controls (notes: considered for each potential weakness):** where SoD cannot be fully achieved (small teams), alternatives include supervisory review of all transactions, dual control, independent reconciliations and detailed logging with regular review.\n\n### 7.15 Text diagrams\n\n**How the control families fit together**\n\n```\n ORGANIZATION-WIDE LEVEL  --  GENERAL CONTROLS (management, organization, development,\n        |                      hardware/system software, continuity, access to systems)\n        v\n SYSTEM LEVEL            --  GENERAL CONTROLS (configuration, operating system, database)\n        v\n APPLICATION LEVEL       --  APPLICATION CONTROLS: application-level general, business process\n        |                      (input, processing, output, master data), interface, data management\n        v\n PEOPLE USING THE SYSTEM --  USER CONTROLS: boundary, input, processing, output, database\n        \n Across all levels: OBJECTIVE-BASED (directive, preventive, detective, corrective, recovery)\n Support: AUDIT TRAIL (detective; and preventive through accountability)\n```\n\n### 7.16 Common misconceptions and exam traps\n\n| Trap | Truth |\n|---|---|\n| \"General controls and application controls are the same\" | General controls apply to all or a large segment of systems; application controls apply to one application's transactions. Weak general controls can make application controls ineffective. |\n| \"There are only three objective-based categories\" | The notes list **five**: preventive, detective, corrective, directive, recovery. The outline names three. |\n| \"A log review is preventive\" | Reviewing logs is **detective**. (The notes call the *knowledge that actions are logged*, personal accountability, a preventive effect.) |\n| \"Corrective and recovery are the same\" | Corrective fixes detected errors and prevents recurrence; recovery restores services after disruption. |\n| \"Completeness, accuracy and validity are the same\" | Completeness = all transactions in, once only. Accuracy = right amounts and data. Validity = real and approved. |\n| \"A range check would catch a missing invoice\" | A missing item is caught by sequence or count checks and batch totals (completeness). |\n| \"A budget is a control by itself\" | Notes: a budget alone is not effective; it must be compared with actual performance, differences isolated and researched. |\n| \"Input/output verification should always be done\" | Notes: it is expensive and tends to be over-recommended by auditors. |\n| \"Availability is a business process control\" | Notes: it is mainly addressed in application security controls (contingency planning), not business process controls. |\n| \"Boundary controls are about input\" | Boundary controls are the **access control mechanisms** (identification, authentication, authorization). |\n| \"Segregation of duties is only needed in finance\" | It is a key control in any information system, including development vs operations. |\n| \"A well-designed control is an effective control\" | You must also show it is **implemented** and **operating**. |\n| \"Controls guarantee outcomes\" | They give **reasonable** assurance, not absolute. |\n\n### 7.17 Checklist: analysing any control in a scenario\n\n1. **Which family?** General, application, objective-based or user control?\n2. **Which objective?** Directive, preventive, detective, corrective or recovery?\n3. **Which assertion?** Completeness, accuracy, validity or confidentiality?\n4. **Which outline word?** Administrative, technical, physical or logical?\n5. **Design, implementation, operation:** which one failed?\n6. **Is there a compensating control?**\n7. **What evidence would prove it?**\n\n### 7.18 Revision summary (Topic 7)\n\n- A control is a policy, procedure, practice or organization structure designed to provide **reasonable assurance** that business objectives are achieved and undesired events are prevented or detected and corrected.\n- Twelve control objectives; seven factors driving the need for control and audit; four IS audit objectives (asset safeguarding, data integrity, system effectiveness, system efficiency).\n- Notes' classification: general, application (business process), objective-based, user. Outline's: administrative, technical, physical, logical; preventive, detective, corrective.\n- General controls: organizational, management, financial control techniques (authorization, budgets, cancellation of documents, documentation, dual control, input/output verification, safekeeping, segregation of duties, sequentially numbered documents, supervisory review), systems development and documentation, hardware and system software (including configuration management), business continuity.\n- Application controls: objectives are completeness, accuracy, validity and confidentiality (availability is handled by application security). Four categories: application-level general, business process (input, processing, output, master data), interface, data management system. Audit them by understanding the system, selecting techniques, testing design and operation, identifying weaknesses, considering compensating controls.\n- Objective-based: preventive, detective, corrective, directive, recovery.\n- User controls: boundary, input, processing, output, database.\n- Audit trail: accounting and operations; detect unauthorised access, reconstruct events, personal accountability.\n- Effect of computers: personnel, segregation of duties, authorization procedures, record keeping, access to assets and records, management supervision and review, concentration of programs and data.\n\n\n---\n\n## PHASE 2 — COMPREHENSION CHECKS (Topic 7)\n\n**C1. Explain, in your own words, why the notes say general controls must be effective for application controls to be reliable.**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nApplication controls (such as a programmed limit check) live inside programs and data. General controls protect those programs and the environment: who can change programs, who can access the database, whether the system is configured securely. If general controls are weak, someone can change or switch off an application control, or alter the data directly, so the application control can be circumvented or modified. The auditor therefore tests general controls first and relies on application controls only if the general controls are effective.\n\n**Check:** application controls depend on the environment that protects them.\n<\/details>\n\n**C2. Why does the definition of a control say \"reasonable assurance\" and not \"guarantee\"?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nBecause controls can fail: people make mistakes, collude, or management overrides them; and perfect controls would cost more than the risks they cover. Auditors and managers therefore aim for enough comfort at a justifiable cost, not a promise that nothing will go wrong.\n\n**Check:** controls limit risk; they do not eliminate it.\n<\/details>\n\n**C3. What would happen if a system had good preventive and detective controls but no corrective controls?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nErrors and malicious acts would be stopped or spotted, but nothing would reliably fix them. Detected exceptions might sit unresolved, rejected transactions would never be corrected and reprocessed, and the same problems would recur because nobody removed the cause. The notes describe corrective controls as minimising the impact, identifying the cause, remedying the problem and modifying the system to reduce future occurrences. Without them, detection produces reports but not improvement.\n\n**Check:** detection alone does not fix or prevent recurrence.\n<\/details>\n\n**C4. How do completeness, accuracy and validity differ? Give one failure of each in a payment system.**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\n*Completeness failure:* a supplier invoice is never entered, so it is never paid (a transaction that occurred is missing). *Accuracy failure:* an invoice for 300,000 is entered as 30,000 (the transaction is recorded with the wrong amount). *Validity failure:* a payment is made for an invoice that was never genuinely issued or was never approved (the transaction did not really occur or was not authorised).\n\n**Check:** missing, wrong, or not real/approved.\n<\/details>\n\n**C5. How are audit trails both a detective and a preventive control?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nThe notes call audit trails an important **detective** control because they record events so unauthorised access and errors can be detected and events reconstructed. The notes also say personal accountability is a **preventive** effect: when people know every action is recorded against their ID, they are less likely to violate policy. Same log, two roles: it detects after the fact and deters beforehand.\n\n**Check:** detective by recording; preventive through deterrence.\n<\/details>\n\n**C6. Give an original example of a control that is well designed but not operating effectively.**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nA company policy requires a second manager to approve any bank detail change for a supplier. The design is sound (it prevents a single person from redirecting payments). But in practice the approver clicks \"approve\" for every request without checking, or approvals are done by phone and never recorded. The control exists on paper and in the system, but it does not operate effectively, so fraud could still occur.\n\n**Check:** design is right; operation fails.\n<\/details>\n\n**C7. Which part of this topic would confuse someone seeing it for the first time?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\n(1) Two classification schemes (outline vs notes) and the five vs three objective-based categories. (2) General vs application vs user controls: they overlap in vocabulary (for example, \"input controls\" appear under business process controls and under user controls). (3) Completeness vs accuracy vs validity. (4) Corrective vs recovery. Use the maps in 7.5 and the invoice example in 7.7.2.\n<\/details>\n\n---\n\n## PHASE 3 — ACTIVE RECALL BANK (Topic 7)\n\n### Level 1 — Basic recall\n\n**Q1.** State the notes' definition of a control.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** \"The policies, procedures, practices and organizational structures designed to provide reasonable assurance that business objectives will be achieved and that undesired events will be prevented or detected and corrected.\"\n\n**Marking:** four ingredients (policies, procedures, practices, organizational structures) (2), reasonable assurance (1), prevented or detected and corrected (1).\n\n**Common mistake:** leaving out \"reasonable assurance\".\n<\/details>\n\n**Q2.** Name the four classes of controls in the notes and the five objective-based categories.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Classes: general controls; business process (application) controls; objective-based controls; user controls. Objective-based: preventive, detective, corrective, directive, recovery.\n\n**Marking:** four classes (4), five categories (5).\n\n**Common mistake:** listing only preventive, detective and corrective.\n<\/details>\n\n**Q3.** List the four objectives of application (business process) controls and two typical controls for each.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** *Completeness:* batch totals, sequence checking, matching, duplicate checking, reconciliations, control totals, exception reporting (any two). *Accuracy:* programmed edit checks (range, format, existence, dependency, reasonableness, mathematical accuracy), batch totals, check digit verification. *Validity:* one-for-one checking, matching. *Confidentiality:* restricted physical and logical access, segregation of duties, restricted access to reporting and extraction tools.\n\n**Marking:** four objectives (4), two controls each (4; validity may give one or two).\n\n**Common mistake:** adding \"availability\" as a business process objective; the notes say it is dealt with in application security (contingency planning).\n<\/details>\n\n**Q4.** List the four categories of application-level controls.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Application-level general controls; business process controls; interface controls; data management system controls.\n\n**Common mistake:** listing \"input, processing, output\" as the four; those are types within business process controls (with master data).\n<\/details>\n\n**Q5.** List the five user controls.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Boundary controls, input controls, processing controls, output controls, database controls.\n\n**Common mistake:** missing boundary or database.\n<\/details>\n\n**Q6.** Name the ten financial control techniques in the notes (any eight).\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Authorization; budgets; cancellation of documents; documentation; dual control; input/output verification; safekeeping; segregation of duties; sequentially numbered documents; supervisory review.\n\n**Common mistake:** confusing \"dual control\" (two people access together, one handles) with \"segregation of duties\" (stages split between people).\n<\/details>\n\n### Level 2 — Understanding\n\n**Q7.** Distinguish general controls from application controls and explain why auditors usually test general controls first.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** General controls apply to all or a large segment of an organization's information systems (organization-wide, system level) and help ensure proper operation: safeguarding data, protecting application programs and ensuring continued operations. Application controls apply to a specific application's transactions and data to ensure completeness, accuracy, validity and confidentiality. Auditors test general controls first because, without them, application controls can be circumvented or modified, so their results cannot be relied on.\n\n**Marking:** definitions (2+2), reason (2).\n\n**Common mistake:** saying general controls are \"less important\".\n<\/details>\n\n**Q8.** Define preventive, detective and corrective controls and give an example of each from an accounts payable system.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Preventive controls stop an error, omission or malicious act occurring (system blocks payment with no matching order). Detective controls detect and report errors or malicious acts that have occurred (weekly report of payments without a match). Corrective controls reduce the impact or correct an error once detected (reverse the payment, recover funds, fix the cause).\n\n**Marking:** three definitions (3), three examples (3).\n\n**Common mistake:** putting a log review under preventive.\n<\/details>\n\n**Q9.** Explain the difference between completeness, accuracy and validity controls using one transaction.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Using one supplier invoice of 300,000: completeness controls (sequence check, batch count, duplicate check) ensure it is input once and only once; accuracy controls (edit checks, batch totals, check digits) ensure it is recorded as 300,000 in the correct period; validity controls (matching to a purchase order and goods received note, approval check) ensure the invoice is real and authorised.\n\n**Marking:** three definitions with the same example (6).\n\n**Common mistake:** saying accuracy controls detect missing transactions.\n<\/details>\n\n**Q10.** Distinguish corrective controls from recovery controls. Give an example of each.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Corrective controls reduce the impact or correct an error once detected: investigate the cause, re-process rejected transactions, modify the system to reduce recurrence (example: correcting a mis-posted balance and fixing the validation rule). Recovery controls provide backup, restoration, recovery and restart of resources after a disruption or disaster (example: restoring the system from backup at the alternate site).\n\n**Common mistake:** treating any backup use as corrective.\n<\/details>\n\n**Q11.** State the three security objectives of audit trails and give one example of each.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** (1) Detecting unauthorised access (failed login attempts from an external address). (2) Reconstructing events (tracing who changed an interest rate and when, or rebuilding corrupted balances from the record of changes). (3) Promoting personal accountability (users know actions are logged under their ID, which deters violations).\n\n**Common mistake:** omitting accountability or calling it detective rather than preventive.\n<\/details>\n\n**Q12.** Using the outline's terms, classify these controls as administrative, technical or physical, and as preventive, detective or corrective: (a) password complexity setting; (b) monthly review of system access logs; (c) a locked server room; (d) procedure to reverse and reprocess rejected payments.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** (a) Technical (logical); preventive. (b) Administrative; detective. (c) Physical; preventive. (d) Administrative; corrective.\n\n**Marking:** one mark per correct label, 8 in total.\n\n**Common mistake:** calling the log review technical because logs are produced by the system. The review is a human procedure.\n<\/details>\n\n### Level 3 — Application\n\n**Q13.** A clerk keys a batch of 6 invoices totalling 2,400,000. The system shows 5 invoices keyed totalling 1,950,000, and the invoice numbers jump from 3071 to 3073. Identify which controls detect each problem, which assertion each protects, and what a corrective action would be.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** *Batch count check:* expected 6, keyed 5 (completeness). *Sequence check:* gap at 3072 (completeness). *Control total:* expected 2,400,000, keyed 1,950,000, difference 450,000 (completeness and accuracy). These are detective controls (and preventive if they stop the batch from posting). The difference may be the missing invoice, or the missing invoice plus a keying error; check by locating invoice 3072 and its amount. *Corrective action:* find the original invoice 3072, key it, and re-run the batch totals; investigate whether any amount was mistyped; record the exception.\n\n**Marking:** three controls (3), assertions (2), corrective actions (2), reasoning about the difference (1).\n\n**Common mistake:** assuming the control total difference must equal the missing invoice without checking.\n<\/details>\n\n**Q14.** An access report shows: Agnes can create suppliers and approve payments; Peter can enter invoices; Susan can enter and approve invoices; Brian can approve payments. Identify the segregation of duties conflicts, the risk of each, and a compensating control for one of them.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** *Agnes:* creating a supplier and approving payments (fictitious supplier fraud). *Susan:* entering and approving the same invoices (self-approval of fraud or errors). Peter and Brian have no conflict. *Compensating control for Agnes:* an independent manager reviews every supplier created by Agnes and all payments she approves, and reports are retained; better still, remove one of the two rights.\n\n**Marking:** two conflicts (2), two risks (2), compensating control (2).\n\n**Common mistake:** flagging Peter and Brian because they are both \"in payments\".\n<\/details>\n\n**Q15.** A control states: \"Interest rates in the loan system can only be changed after approval.\" Describe how you would test design, implementation and operating effectiveness.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** *Design:* check that the rule addresses the risk of unauthorised rate changes (approval by an independent person, recorded). *Implementation:* confirm the workflow is configured, for example by a walk-through of one rate change from request to approval. *Operating effectiveness:* obtain the list of rate changes for the period from the system log; select a sample (or test all with a tool); for each, trace to an approved request; also test that a change attempted without approval is rejected in a test environment; compute the exception rate and compare with tolerance.\n\n**Marking:** three tests (3), evidence for each (3).\n\n**Common mistake:** testing only the approval form and not whether the system enforces it.\n<\/details>\n\n**Q16.** For each situation, name the objective-based control type and one improvement: (a) a policy telling staff to lock screens; (b) a daily report listing failed logins; (c) automatic restoring of the database from backup after a crash; (d) a system that refuses a payment above the user's limit.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** (a) Directive; improve with awareness training and enforcement (automatic screen lock). (b) Detective; improve by assigning an owner who reviews it daily and follows up. (c) Recovery; improve by regular tested restores and defined recovery objectives. (d) Preventive; improve by logging overrides and requiring dual approval for limit changes.\n\n**Marking:** four categories (4), four sensible improvements (4).\n\n**Common mistake:** calling (a) preventive. A policy states management intent (directive); automatic locking would be preventive.\n<\/details>\n\n### Level 4 — Exam mastery\n\n**Q17.** \"Preventive controls are always better than detective controls.\" Discuss. (10 marks)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer outline:**\n1. *Position:* preventive controls are usually more valuable because they stop harm, but they are not always possible or sufficient; a balanced mix is best.\n2. *Why preventive is attractive:* stops the error or malicious act before loss (passwords, edit checks, segregation of duties).\n3. *Limits of preventive:* cannot anticipate everything; can be circumvented or bypassed (collusion, management override); can be costly or slow business; some events cannot be prevented (a power failure, a zero-day).\n4. *Role of detective controls:* assess whether preventive controls achieved their objective (notes); find what slipped through (exception reports, logs, reconciliations); allow response; provide evidence.\n5. *The chain:* detective controls feed corrective controls, which fix errors and modify the system to reduce recurrence; recovery controls restore operations; directive controls set the expectations that make all of them work.\n6. *Audit trails:* logging is detective, but personal accountability deters (preventive).\n7. *Link to Topic 4:* good prevention does not make detection and reaction superfluous.\n8. *Conclusion:* layer the controls; cost and risk decide the mix.\n\n**Marking criteria:** position (1), preventive strengths (2), limits (2), detective role (2), chain with corrective/recovery (2), conclusion (1).\n\n**Common mistake:** arguing that detective controls are \"weaker\" without explaining what prevention cannot do.\n<\/details>\n\n**Q18.** A bank's loan application is to be audited. (a) Say which general controls you would test first and why. (b) For the application, name controls for input, processing and output and state which of completeness, accuracy, validity and confidentiality each addresses. (c) State two audit trail requirements. (d) Write one possible finding (condition, criteria, cause, effect, recommendation). (14 marks)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer outline:**\n(a) *General controls first:* program change control and approval, access to the production environment and database, segregation between developers and operators, backup and recovery, configuration management. Why: if these are weak, application controls can be circumvented or altered, so reliance on them would be unsafe.\n(b) *Input:* edit checks (range, format, existence, dependency) and check digits on account numbers (accuracy); duplicate and sequence checks on application numbers (completeness); matching to customer ID and credit check and approval (validity). *Processing:* control totals and reconciliation of disbursements to postings (completeness and accuracy); review of processing logs. *Output:* output reconciliation to input, restricted distribution of loan reports and extracts (confidentiality). Master data: approval of changes to interest rate tables.\n(c) *Audit trail:* all loan changes and approvals logged with user ID, date and time, old and new values; logs protected from alteration and reviewed; retention per policy.\n(d) *Example finding:* *Condition:* 9 of 30 sampled loan approvals above the officer's limit were approved by the same officer who created them. *Criteria:* the policy requires independent approval above the limit. *Cause:* the system allows one user both create and approve rights. *Effect:* risk of fraudulent or inappropriate loans. *Recommendation:* remove the dual rights, add system enforcement of independent approval, review the 9 loans; owner head of credit; 45 days.\n\n**Marking criteria:** (a) 3, (b) 5, (c) 2, (d) 4.\n\n**Common mistake:** jumping to application controls without addressing general controls.\n<\/details>\n\n\n---"};</script><script src="assets/app.js"></script><script src="assets/live.js"></script></html>
