<script src="assets/meta.js"></script><script src="assets/index.js"></script><script>window.PAGE={"id": "ap", "t": "APPENDIX — CW1 SELF-CHECK KEY", "s": "CW1 self-check key", "g": "Reference", "c": "#16a34a", "k": "CW1", "f": "cw1-key.html", "w": 1144, "md": "# APPENDIX — CW1 SELF-CHECK KEY\n\nCW1 (50 MCQs) is in your zip with the answers removed. Use it as a **timed mock** (about 50 minutes, no notes). The key below is **my own derivation from your notes and the explanations in this guide**, not an official marking scheme. Where an answer relies on supplementary reasoning, I say so. If you disagree with an answer, check it against what your lecturer taught.\n\n| Q | Answer | Reason | Guide section |\n|---|---|---|---|\n| 1 | C. Virus | Hides in another file and runs when that file runs | 2.4.1 |\n| 2 | B. Boot sector virus | Infects the first section holding start-up instructions *(supplementary term)* | 2.4.1 |\n| 3 | B. Strong encryption (HTTPS/VPN) | Makes intercepted traffic unreadable | 2.4.4 |\n| 4 | C. Polymorphic virus | Changes its code to avoid detection *(supplementary term)* | 2.4.1 |\n| 5 | C. DDoS | Many machines flood a target to deny access | 2.4.5 |\n| 6 | C. Replicating across networks without a host file | Worm | 2.4.1 |\n| 7 | B. Phishing | Fake official email leading to a fake site | 2.4.10 |\n| 8 | A. Logic bomb | Activates only when a condition is met | 2.4.1 |\n| 9 | B. Stored XSS | Script saved in a comment runs for every visitor | 2.4.3 |\n| 10 | C. Out-of-band SQLi | Data retrieved through a separate channel such as DNS *(supplementary)* | 2.4.2 |\n| 11 | B. SQL injection | Crafted characters in a login form manipulate the query | 2.4.2 |\n| 12 | B. Negligent insider | No harm intended; careless exposure | 2.4.8 |\n| 13 | A. APT | Long-term, undetected, data-gathering | 2.4.7 |\n| 14 | A. Brute force vs dictionary | All combinations vs a list of likely words | 2.4.6 |\n| 15 | A. Zero-day exploit | Exploiting a flaw before a patch exists | 2.4.7 |\n| 16 | B. Encrypts files and demands payment | Defines ransomware | 2.4.1 |\n| 17 | A. Lightweight operating systems without discovery protocols | Why IoT can go undetected *(supplementary)* | 2.4.11 |\n| 18 | B. Misconfigured storage buckets or databases | Human error in cloud settings | 2.4.11 |\n| 19 | B. Baiting | A tempting item left to be picked up | 2.4.9 |\n| 20 | B. OTP interception and account takeover | SIM swap *(supplementary term)* | 2.7.2 |\n| 21 | B. Physically following someone into a secure area | Tailgating | 2.4.9 |\n| 22 | C. Accidentally spilling liquid on a workstation | Unintentional human action | 2.4.11 |\n| 23 | B. Intangible information asset | A unique workflow is knowledge, not a physical or tangible item *(supplementary)* | 6.9.7 |\n| 24 | C. An insider threat | Legitimate access misused for gain | 2.4.8 |\n| 25 | C. High | 3 × 2 = 6; on a 3 × 3 matrix 6 is usually High *(the band depends on the organization's matrix)* | 2.6 |\n| 26 | B. Explicit consent | The provision emphasised before collecting personal data | 9.3.1 |\n| 27 | B. Applying a risk management process | The ISMS works through risk management | 1.7 |\n| 28 | B. Data masking | Replaces sensitive data with realistic fake values in non-production | 9.3.3 |\n| 29 | B. Integrity | Recalculate and compare the hash | 1.5 |\n| 30 | C. Data availability | The 3-2-1 backup rule | 4.9.5 |\n| 31 | C. Multi-factor authentication | Know plus have | 4.2.1 |\n| 32 | B. Authorization | After authentication, decide what the user may do | 1.4, 4.2.1 |\n| 33 | B. Only collect and retain data that is necessary | Data minimisation | 9.3.3 |\n| 34 | B. Integrity and authenticity | A digital signature proves the content is unchanged and who signed it | 4.9.2 |\n| 35 | B. Network segmentation | Isolated segments limit malware spread | 2.10 |\n| 36 | C. Incident response | Detection, containment, recovery | 1.4, 2.10 |\n| 37 | C. Acceptable use policy | An ISSP on email and internet use
