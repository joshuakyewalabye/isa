<script src="assets/meta.js"></script><script src="assets/index.js"></script><script>window.PAGE={"id": "t3", "t": "TOPIC 3 — Information Security Policy and Standards", "s": "3 · Information Security Policy and Standards", "g": "Topics", "c": "#0891b2", "k": "3", "f": "topic-3.html", "w": 6743, "md": "# TOPIC 3 — Information Security Policy and Standards\n\n**Classification:** Foundation (policy basics), Core (policy types and development), Difficult/High-risk (ISO and NIST frameworks)\n**Sources:** Info Sec Policy deck; Sec SDLC deck (life cycle, ISO 27000 series, NIST models). CW1 tests this topic in Q37 (acceptable use policy), Q42 (PDCA), Q46 (compliance). CW2 area (a) is a policy review.\n**Outline items:** (a) information security principles, (b) policy definition and information security life cycle, (c) types of policies, (d) structure and framework of comprehensive security, (e) policy infrastructure, design life cycle and processes, PDCA model, (f) standards and practices: BS7799, ISO/IEC 17799, ISO 27001.\n\n## PHASE 1 — UNDERSTANDING\n\n### 3.1 The big picture\n\nA **policy** is a set of organizational guidelines that dictates certain behaviour within the organization. It is the written answer to: \"What is and is not acceptable here, and who is responsible for what?\"\n\nWhy it matters: the ISMS in Topic 1 has \"Policy\" as its first component, and every control in Topics 4 and 7 should trace back to a policy. When an auditor checks a password setting (CW2 area b), the thing they compare it with is a **policy**. When a court asks whether management exercised due diligence, the policy document is the evidence.\n\n**Where it connects.** Backward: Topic 2's threats are what policies try to control (for example, an acceptable use policy against phishing and malware). Forward: Topic 4 applies policy in specific domains (access, email, internet); Topic 5 asks how well policies are governed; Topic 7 turns policy into controls; Topics 6 and 8 audit compliance with policy.\n\n### 3.2 Key terms\n\n| Term | Meaning (notes unless marked) |\n|---|---|\n| Policy | A set of organizational guidelines that dictates certain behaviour within the organization |\n| EISP | Enterprise Information Security Policy (general program policy): strategic direction, scope and tone |\n| ISSP | Issue-specific security policy: detailed guidance on the use of a particular technology or issue |\n| SysSP | System-specific security policy: management guidance and technical specifications for a particular system |\n| ACL | Access control list: who may use a system, what they can access, when, where from and how |\n| Configuration rules | Specific codes or scripts entered into security systems that tell them what actions to perform on information they process |\n| Framework / security model | The theoretical foundation from which a blueprint is designed |\n| Blueprint | The basis for designing, selecting and implementing all later security controls (policies, training programmes, technical controls) |\n| Sec SDLC | The set of procedures run in sequence within the software development life cycle so that security risks are reduced from the start |\n| ISO/IEC 27001 | Standard for an ISMS; used for certification; \"serves better as an assessment tool than as an implementation framework\" |\n| ISO/IEC 27002 | Code of practice: guidelines and voluntary directions for information security management |\n| NIST CSF | NIST Cybersecurity Framework (2014): voluntary, vendor-neutral framework to manage cybersecurity risk |\n| Gap analysis | Comparing the current state with the desired state and planning how to close the difference |\n\n### 3.3 Information security principles\n\n> **Supplementary explanation.** The outline lists \"information security principles\" but your notes do not contain a separate list. Apart from CIA (Topic 1), the principles most often used in policies and audits are:\n> - **Least privilege:** give each user only the access needed for the job (CW1 Q48).\n> - **Need to know:** even with clearance, access only what the task requires.\n> - **Segregation of duties:** split steps of a sensitive task between people so no one person can complete and hide a fraud (it returns in Topic 7).\n> - **Defence in depth:** several layers of control, so one failure is not fatal.\n> - **Accountability:** every action can be traced to an individual (logging, unique IDs).\n> - **Default deny:** anything not explicitly allowed is blocked.\n> The NIST handbook \"Generally Accepted Principles and Practices for Securing IT Systems\" (SP 800-14), listed in your notes, is the formal source for such principles.\n\n### 3.4 Policy: what it is for and how it must be shaped\n\n**Objectives of policy (notes):** reduced risk; compliance with laws and regulations; assurance of operational continuity, information integrity and confidentiality. The policy maker sets the tone and emphasis on the importance of information security.\n\n**Why policy exists (notes):**\n\n- Policies are the **least expensive means of control** and often the **most difficult to implement**. (Writing a policy costs little; getting people to follow it is hard.)\n- They are important reference documents: for **internal audits** and for resolving **legal disputes about management's due diligence**.\n- They are a clear **statement of management's intent**.\n\n**Three basic rules for shaping a policy (notes):**\n\n1. It should **never conflict with law**.\n2. It must be able to **stand up in court** if challenged.\n3. It must be **properly supported and administered**.\n\n**Six guidelines for an effective policy (notes).** A policy must be properly:\n\n| # | Verb | In practice |\n|---|---|---|\n| 1 | **Developed** | Using industry-accepted practices |\n| 2 | **Distributed** | Through all appropriate methods (email, intranet, induction) |\n| 3 | **Read** (reviewed) | By all employees |\n| 4 | **Understood** | By all employees (a quiz or training confirms this) |\n| 5 | **Agreed to** | Formally, by act or assertion (a signature or click-to-accept) |\n| 6 | **Uniformly applied and enforced** | Same rules and penalties for the director and the intern |\n\n**Why the sequence matters.** If step 3 fails, nobody reads it. If step 5 fails, an employee can say \"I never agreed\". If step 6 fails, the policy loses credibility, and in a legal dispute it may not stand up. **A policy that is not enforced is just a document.**\n\n**Conclusion from the notes:** policies exist first and foremost to inform employees what is and is not acceptable behaviour; they also seek to improve productivity and avoid embarrassing situations.\n\n> **Supplementary explanation: policy vs standard vs procedure vs guideline.** These four words are often confused:\n> - **Policy:** the high-level mandatory statement of *what* and *why* (\"Passwords must protect access to company systems\").\n> - **Standard:** specific mandatory requirements that support the policy (\"Passwords: minimum 12 characters, changed every 90 days\").\n> - **Procedure:** the step-by-step *how* (\"To reset a password: 1. Verify the caller's identity. 2. ...\").\n> - **Guideline:** recommended, not mandatory, advice.\n> Your notes say system-specific policies \"may function as standards or procedures\". That is why the boundary blurs in practice.\n\n### 3.5 The three types of information security policy\n\n| | **EISP** (Enterprise / general program policy) | **ISSP** (Issue-specific) | **SysSP** (System-specific) |\n|---|---|---|---|\n| Level | Whole organization, strategic | A particular issue or technology | A particular system or device |\n| Purpose | Sets strategic direction, scope and tone; assigns responsibilities; guides development and management of the security programme | Detailed, targeted guidance on secure use of a technology; protects from inefficiency and ambiguity; indemnifies the organization against liability for employee misuse | Management guidance and technical specifications for configuring and maintaining a system |\n| Typical content | Statement of purpose; IT security elements; need for IT security; responsibilities and roles; references to other standards and guidelines | Email and internet use; minimum system configurations; prohibitions against hacking; home use of company equipment; use of personal equipment on company networks; telecoms; photocopy equipment | Firewall configuration policy; access control lists; configuration rules |\n| Who writes it | Senior management | Management with IT and legal | Management (guidance) and system administrators (technical) |\n| Example | \"XYZ Bank protects customer information and assigns the CIO accountability\" | Acceptable Use Policy for email and internet | The ACL on the loan database; the firewall rule set |\n\n#### 3.5.1 EISP: its five components (notes)\n\n1. Statement of purpose\n2. Information technology security elements\n3. Need for IT security\n4. IT security responsibilities and roles\n5. References to other IT standards and guidelines\n\n**Worked example (invented EISP outline for a bank):**\n\n- *Purpose:* \"To protect customer, financial and operational information of XYZ Bank from unauthorized access, loss or alteration.\"\n- *Elements:* access control, data protection, incident response, business continuity.\n- *Need:* regulation, customer trust, fraud risk.\n- *Roles:* Board approves; CIO owns; branch managers enforce; all staff comply.\n- *References:* ISO/IEC 27001, the data protection law, the bank's ISSPs.\n\n#### 3.5.2 ISSP: its components (notes)\n\n| Component | What it contains |\n|---|---|\n| **Statement of purpose** | Scope and applicability; definition of technology addressed; responsibilities |\n| **Authorized access and usage of equipment** | User access; fair and responsible use; protection of privacy |\n| **Prohibited usage of equipment** | Disruptive use or misuse; criminal use; offensive or harassing materials; copyrighted, licensed or other intellectual property; other restrictions |\n| **Systems management** | Management of stored materials; employer monitoring; virus protection; physical security; encryption |\n| **Violations of policy** | Procedures for reporting violations; penalties for violations |\n| **Policy review and modification** | Scheduled review of policy and procedures |\n| **Limitations of liability** | Statements of liability or disclaimers |\n\n**Worked example: an Acceptable Use Policy (AUP) for email and internet, line by line** (CW1 Q37: the AUP is where \"rules that define responsible use of company email and internet\" are found).\n\n| ISSP component | What the policy line says |\n|---|---|\n| Purpose, scope | \"This policy governs use of company email and internet by all employees and contractors.\" |\n| Authorized use | \"Email and internet are provided for business. Reasonable personal use is allowed outside working hours.\" |\n| Prohibited use | \"No sending of offensive or harassing material, downloading pirated software, or attempts to access systems without authority.\" |\n| Systems management | \"Email is scanned for viruses. The company may monitor email and web use.\" |\n| Violations | \"Report suspected misuse to IT security. Breaches may lead to disciplinary action.\" |\n| Review | \"This policy is reviewed every 12 months.\" |\n| Liability | \"The company is not liable for private use of company systems.\" |\n\nNotice the \"Systems management: employer monitoring\" line and the \"Limitations of liability\" line. They protect the organization legally (the notes say an ISSP *indemnifies the organization against liability for an employee's inappropriate or illegal system use*).\n\n#### 3.5.3 SysSP: managerial guidance and technical specifications\n\nThe notes split SysSPs into two parts, which can be combined in one document:\n\n- **Managerial guidance SysSP:** created by management to guide implementation and configuration of any technology that affects confidentiality, integrity or availability (for example, firewall configuration). It informs technologists of management's intent.\n- **Technical specifications SysSP:** system administrators' directions on implementing the managerial policy. Two main methods: **access control lists** and **configuration rules**.\n\n**Access control lists (ACLs).** They include user access lists, matrices and capability tables that govern rights and privileges. They regulate **who** can use the system, **what** authorized users can access, **when**, **where from**, and **how**. Typical privileges: read, write, create, modify, delete, compare, copy.\n\n**Worked example (invented): an ACL for a loan database, line by line.**\n\n| Subject (who) | Object (what) | Privileges | When | From where |\n|---|---|---|---|---|\n| Loan officers | Loan table | Read, create, modify | 07:00 to 19:00 | Branch network |\n| Branch manager | Loan table | Read, approve | 07:00 to 19:00 | Branch network |\n| Auditors | Loan table | Read only | Any time, with approval | Audit workstation |\n| Tellers | Loan table | None | n/a | n/a |\n\nReading it line by line: the loan officer can create and modify but not approve; the manager can approve but the table shows no create (so one person cannot both set up and approve a loan: segregation of duties); auditors read only (they must not change what they audit); tellers have no access at all (least privilege).\n\n**Configuration rules.** Specific codes entered into security systems that guide how the system acts on information passing through. A firewall rule set is the classic example:\n\n```\nRule 1: ALLOW  TCP  from ANY            to 10.0.0.5   port 443    (customers reach the web server over HTTPS)\nRule 2: ALLOW  TCP  from 10.0.1.0/24    to 10.0.0.10  port 1433   (only the app servers reach the database)\nRule 3: DENY   ALL  from ANY            to ANY                    (anything not allowed above is blocked)\n```\n\n- Rule 1 lets the public use the website and nothing else.\n- Rule 2 lets only the application subnet talk to the database. The internet cannot.\n- Rule 3 is the **default deny**, the safety net. If it were missing, any traffic not covered by rules 1 and 2 might pass.\n\nThis is the \"managerial guidance\" (management said: customers reach the web server only; only the application reaches the database) turned into \"technical specification\" (the exact rules).\n\n### 3.6 Policy design and development steps (notes)\n\n| Stage | What happens (notes) |\n|---|---|\n| **Investigation** | *Goals:* define specific objectives (protect sensitive data, ensure compliance). *Support:* get commitment from management, IT and legal for resources. *Participation:* engage a diverse group of staff and departments for input and ownership. |\n| **Analysis** | *Risk assessment:* evaluate threats and vulnerabilities to identify critical assets and prioritise measures by impact and likelihood. |\n| **Design** | *Components:* develop key policy elements (access controls, data classification, incident response procedures, employee responsibilities). *Dissemination:* plan communication (training sessions, workshops, written documentation). |\n| **Implement** | *Detailed specification:* a plan with specific actions, timelines, responsibilities and resources. |\n| **Maintenance** | Regular reviews of effectiveness; adapt to new threats; use feedback from users |\n| **Distribution** | Give the finalised policy to all employees and stakeholders; make it accessible; explain compliance and reporting mechanisms |\n\n**Why this order?** You cannot write good rules (design) until you know your risks (analysis), and you cannot know what to protect until you know your goals and have support (investigation). A policy nobody maintains goes stale.\n\n> **Supplementary explanation: the PDCA model (CW1 Q42).** PDCA means Plan, Do, Check, Act: a repeating cycle for **continuous improvement** of a management system, such as the ISMS. It is not a one-time tool installation, a financial return calculation, or a background check (the wrong options in Q42).\n> - **Plan:** set objectives and policy, assess risk, decide controls. (Policy development: investigation, analysis, design.)\n> - **Do:** implement and operate the controls; communicate the policy. (Implement, distribution.)\n> - **Check:** monitor, measure, audit against the policy. (Maintenance: review of effectiveness.)\n> - **Act:** correct problems and update the policy, then start Plan again. (Maintenance: adapt to new threats.)\n> The loop is the point. Findings from \"Check\" feed back into the next \"Plan\".\n\n### 3.7 The information security life cycle: Sec SDLC (notes)\n\n**Definition.** The Security System Development Life Cycle is the set of procedures executed in sequence within the software development life cycle (SDLC), designed to help developers build software that **reduces security risks from the start**. The ordinary SDLC focuses mainly on the design and implementation of an information system. SecSDLC adds identification of threats and risks and the controls to counter, remove and manage them.\n\n| Stage | What happens (notes) |\n|---|---|\n| **1. Investigation / planning** | Started by top management. Objectives and goals are set. An information security policy is defined, describing the security applications and programs. **Planning levels:** strategic, tactical, operational, contingency. |\n| **2. Analysis** | Documents from stage 1 are analysed; existing policies, applications and software are checked for flaws; upcoming threats analysed. **Risk management** sits here: risk identification, risk assessment, risk control, risk analysis. Includes **preliminary analysis**, **threat analysis** (which components to protect and from what), and **legal analysis** (policy vs law). Ends with documentation of system/user requirements and a feasibility report. |\n| **3. Design** | **Logical design:** blueprints for policies, applications and software; backup and recovery policies; business steps in a disaster; the decision whether to outsource. **Physical design:** technical teams acquire tools and blueprints; investigate solutions; document them to cover vulnerabilities missed in analysis. |\n| **4. Implementation** | The chosen solution (in-house or outsourced) is finalised, documented, integrated and aggressively tested against the requirements. |\n| **5. Maintenance** | Ensure the programme functions properly and is kept up to date against new threats. |\n\n**Advantages (notes):** improved security, compliance, risk management, better project management, increased efficiency.\n**Disadvantages (notes):** cost, time-consuming, complexity, inflexibility, limited adaptability to new technologies.\n\n**Worked example (invented): a bank builds a mobile loan app with SecSDLC.**\n\n1. *Investigation:* top management sets the goal \"customers apply for loans on their phones\". The security policy states that customer data must be encrypted.\n2. *Analysis:* the team lists threats (phishing, SIM swap, fake apps) and checks the law on data protection (legal analysis). Output: requirements and a feasibility report.\n3. *Design:* logical design: backup policy and the decision to use a vendor for the SMS gateway (outsourcing). Physical design: choose the encryption tools and servers.\n4. *Implementation:* build, integrate and test aggressively, including security tests.\n5. *Maintenance:* patch the app, review new threats each quarter.\n\n### 3.8 Frameworks and standards\n\n**Framework = security model = the theoretical foundation from which a blueprint is designed.** The **blueprint** is the basis for designing, selecting and implementing all later controls: policies, training, technology. The notes focus on **NIST** and **ISO** because they are the industry leaders.\n\n#### 3.8.1 The ISO/IEC 27000 series\n\n| Item | What the notes say |\n|---|---|\n| **ISO/IEC 27002:2013** | Derived from **ISO/IEC 17799**, which was originally **BS 7799**. One of the most widely referenced security models. Purpose: offer guidelines and voluntary directions for information security management; a high-level description of areas considered important. Its details are available only to those who purchase the standard. |\n| **ISO/IEC 27001:2013** | Provides information on how to implement ISO/IEC 27002 and set up an ISMS. Primary purpose: a standard organizations adopt to **obtain certification** and build an information security programme. Serves better as an **assessment tool** than as an implementation framework. |\n\n**The lineage in one line:** BS 7799 → ISO/IEC 17799 → ISO/IEC 27002 (the \"code of practice\"), with ISO/IEC 27001 as the ISMS standard you certify against.\n\n**One-line difference:** 27001 = *the system and the certificate* (what an ISMS must have); 27002 = *the menu of controls and guidance* (how to do the controls).\n\n> **Supplementary explanation.** BS 7799 was originally a British Standard. Part 1 became ISO/IEC 17799 and then ISO/IEC 27002; Part 2 (the management system requirements) became ISO/IEC 27001. Auditors use ISO 27001 to certify an ISMS and ISO 27002 to select and describe controls. Annex A of ISO 27001 lists control objectives (for example, A.11 on physical and environmental security, which Topic 4 covers).\n\n#### 3.8.2 NIST security models\n\nNIST has two advantages over ISO (notes): its documents are **publicly available at no charge** and have been **broadly reviewed** by government and industry professionals.\n\n| NIST document | Title (notes) |\n|---|---|\n| SP 800-12 | An Introduction to Computer Security: The NIST Handbook |\n| SP 800-14 | Generally Accepted Principles and Practices for Securing IT Systems |\n| SP 800-18 Rev. 1 | Guide for Developing Security Plans for Federal Information Systems |\n| SP 800-30 Rev. 1 | Guide for Conducting Risk Assessments |\n| SP 800-37 Rev. 1 | Guide for Applying the Risk Management Framework to Federal Information Systems |\n| SP 800-39 | Managing Information Security Risk |\n| SP 800-50 | Building an IT Security Awareness and Training Program |\n| SP 800-55 Rev. 1 | Performance Measurement Guide for Information Security |\n| SP 800-100 | Information Security Handbook: A Guide for Managers |\n| SP 800-53 (Topic 1) | Catalogue of security and privacy controls |\n\n**Memory aid:** link each number to one word: 12 intro, 14 principles, 18 plans, 30 risk assessments, 37 risk management framework, 39 managing risk, 50 awareness and training, 55 measurement, 100 managers.\n\n#### 3.8.3 The NIST Cybersecurity Framework (CSF)\n\n- **Published 2014** in response to an executive order (13636) on critical infrastructure. **Voluntary** and **vendor-neutral**.\n- **What it lets an organization do (5 points):** describe its current posture; describe its target state; identify and prioritise improvements in a continuous, repeatable process; assess progress; communicate about cybersecurity risk with internal and external stakeholders.\n\n**Three components:**\n\n1. **Framework core:** five functions.\n\n| Function | Meaning (notes) | Example |\n|---|---|---|\n| **Identify** | Understand the organization to manage cybersecurity risk to systems, assets, data and capabilities | Asset inventory; risk assessment |\n| **Protect** | Safeguards to ensure delivery of critical services | Access control, training, encryption |\n| **Detect** | Activities to identify a cybersecurity event | Monitoring, logging |\n| **Respond** | Take action about a detected event | Incident response plan |\n| **Recover** | Maintain resilience plans; restore impaired services | Backups, DR plan |\n\n2. **Framework tiers:** the maturity of a security programme.\n\n| Tier | Name | Meaning (notes) |\n|---|---|---|\n| 1 | **Partial** | No formal risk management; activities informal and ad hoc |\n| 2 | **Risk Informed** | Risk management developed but not fully implemented; formal programme just begun |\n| 3 | **Repeatable** | Risk management formally established; documented policy implemented; repeatable programme |\n| 4 | **Adaptive** | Most mature; can quickly adapt to new environments and threats |\n\n3. **Framework profile:** the organization picks the tier it most closely matches and uses the framework recommendations to improve. The profile supports a **gap analysis**: compare current state with desired state, identify the difference, plan the move.\n\n**The seven-step approach (notes):**\n\n| Step | Action |\n|---|---|\n| 1 | **Prioritise and scope:** identify business/mission objectives and priorities |\n| 2 | **Orient:** identify related systems, assets, regulatory requirements and risk approach; identify threats and vulnerabilities |\n| 3 | **Create a current profile:** which Framework outcomes are being achieved now |\n| 4 | **Conduct a risk assessment:** likelihood and impact of a cybersecurity event |\n| 5 | **Create a target profile:** desired cybersecurity outcomes |\n| 6 | **Determine, analyse and prioritise gaps:** compare current vs target; build a prioritised action plan using mission drivers, cost-benefit analysis and risk understanding; determine resources |\n| 7 | **Implement action plan:** act on the gaps; monitor practice against the target profile |\n\n**Worked example (invented): a small bank applies the CSF.**\n\n1. *Scope:* the mobile banking service.\n2. *Orient:* assets = app, servers, customer database; law = data protection act; threats = phishing, SIM swap, DDoS.\n3. *Current profile:* Identify: asset list exists (achieved). Protect: MFA on staff but not customers (partial). Detect: logs are collected but nobody reviews them (not achieved). Respond: no written plan (not achieved). Recover: backups exist, never restored (partial).\n4. *Risk assessment:* ransomware on the database scores 2 × 3 = 6.\n5. *Target profile:* review logs daily; written incident plan tested twice a year; restore test each quarter; MFA for customers.\n6. *Gap analysis:* the gaps are log review, incident plan, restore test, customer MFA. Prioritise by risk: restore test and incident plan first (they limit the ransomware impact), then log review, then customer MFA.\n7. *Implement and monitor.*\nTheir tier is probably **Tier 1 or 2** (informal, partly implemented), with a target of Tier 3 (Repeatable).\n\n### 3.9 Two text diagrams\n\n**Policy hierarchy**\n\n```\n  EISP  (whole organization, strategic: \"we protect information\")\n    |\n    +-- ISSP  (one issue: e-mail and internet use, personal devices ...)\n    |\n    +-- SysSP (one system)\n          +-- Managerial guidance   (\"only the app may reach the database\")\n          +-- Technical spec        (ACLs + firewall rules that do it)\n```\n\n**Policy life cycle (PDCA)**\n\n```\n   PLAN  ---> DO ---> CHECK ---> ACT\n    ^                             |\n    +-----------------------------+\n (Investigation,   (Implement,   (Review,    (Update,\n  analysis, design) distribute)   audit)      correct)\n```\n\n### 3.10 Common misconceptions and exam traps\n\n| Trap | Truth |\n|---|---|\n| \"AUP is a data classification or access policy\" | The **Acceptable Use Policy** defines responsible use of email and internet (an ISSP) (CW1 Q37). |\n| \"Policy writing is expensive\" | The notes say policies are the **least expensive** control but often the **hardest to implement**. |\n| \"A policy only needs management's signature\" | It must also be distributed, read, understood, agreed and uniformly enforced. |\n| \"ISO 27001 and 27002 are the same\" | 27001 = ISMS standard (certification); 27002 = code of practice for controls. |\n| \"BS 7799 is a different standard\" | 27002 derives from ISO 17799, originally BS 7799. |\n| \"NIST CSF is mandatory\" | It is **voluntary** and vendor-neutral. |\n| \"CSF tiers are risk levels\" | They measure **programme maturity** (Partial to Adaptive), not how risky you are. |\n| \"PDCA is a one-off project plan\" | PDCA is a **continuous improvement** cycle (CW1 Q42). |\n| \"EISP and ISSP are the same level\" | EISP is strategic and organization-wide; ISSP covers one issue. |\n| \"SecSDLC is the same as SDLC\" | SecSDLC adds threat and risk identification and the controls at every stage. |\n\n### 3.11 Checklist: reading or writing any policy\n\n1. **Level?** EISP, ISSP or SysSP?\n2. **Purpose and scope?** What and whom does it cover?\n3. **Responsibilities?** Who owns, who complies, who enforces?\n4. **Rules (allowed and prohibited)?**\n5. **Violations and penalties?**\n6. **Review cycle and approval?**\n7. **Does it conflict with law, and could it stand up in court?**\n8. **Was it distributed, read, understood, agreed and enforced?**\n\n### 3.12 Revision summary (Topic 3)\n\n- Policy = organizational guidelines dictating behaviour. Objectives: reduced risk, compliance, continuity/integrity/confidentiality. Least expensive control, often hardest to implement.\n- Rules: never conflict with law; stand up in court; properly supported and administered. Six guidelines: developed, distributed, read, understood, agreed, uniformly enforced.\n- Three types: EISP (strategic), ISSP (issue: email, internet, personal equipment; AUP), SysSP (managerial guidance plus technical specifications: ACLs and configuration rules).\n- Development steps: investigation, analysis, design, implement, maintenance, distribution. PDCA is the continuous improvement loop (supplementary).\n- SecSDLC: investigation/planning, analysis (with risk management), design (logical, physical), implementation, maintenance.\n- ISO: BS 7799 → ISO 17799 → ISO/IEC 27002 (controls guidance); ISO/IEC 27001 (ISMS, certification).\n- NIST: free, widely reviewed; SP 800 series; CSF = core (Identify, Protect, Detect, Respond, Recover), four tiers (Partial, Risk Informed, Repeatable, Adaptive), profile and gap analysis; seven-step approach.\n\n\n---\n\n## PHASE 2 — COMPREHENSION CHECKS (Topic 3)\n\n**C1. Explain, in your own words, why an information security policy is called \"the least expensive means of control but often the most difficult to implement\".**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nWriting a policy needs time and a few meetings, not equipment or licences, so it is cheap compared with a firewall or a monitoring system. It is hard to implement because it depends on **people** reading it, understanding it, agreeing to it and following it, and on management applying it uniformly. Changing behaviour is harder than installing software.\n\n**Check:** cheap to write, costly in effort to make people comply.\n<\/details>\n\n**C2. Why must a policy be able to \"stand up in court\"? What would happen if it could not?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nWhen an employee is disciplined or dismissed for breaching a policy, or when a customer sues after a breach, the policy is evidence of management's due diligence and of what staff were told. If the policy conflicts with the law, was never distributed, or was applied unevenly, the organization cannot rely on it. The employee may win, and the organization may be found negligent.\n\n**Check:** you should have mentioned due diligence, evidence and enforcement.\n<\/details>\n\n**C3. Why does the default-deny rule matter in a firewall rule set? What would happen if it were missing?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nDefault deny blocks everything that was not explicitly allowed. If it were missing, the firewall's behaviour for unlisted traffic would depend on its default setting, which on some devices is \"allow\". An attacker could then reach services nobody intended to expose. A system-specific policy depends on the final deny rule to make \"only what we allow\" true.\n\n**Check:** the final deny rule enforces \"only what is allowed\".\n<\/details>\n\n**C4. How does an ISSP differ from an EISP? Give an original example of each.**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nThe EISP is strategic and covers the whole organization: *\"The hospital protects patient information and assigns the director of IT responsibility for security.\"* The ISSP gives detailed guidance on one issue: *\"Staff may not use personal USB drives on hospital computers; lost drives must be reported within 24 hours.\"* The EISP sets direction; the ISSP gives rules for one technology or behaviour.\n\n**Check:** whole organization/strategic vs one issue/detailed.\n<\/details>\n\n**C5. What does a gap analysis do in the NIST Cybersecurity Framework, and why does the framework need both a current and a target profile?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nA gap analysis compares the current profile (what is achieved now) with the target profile (what the organization wants to achieve), identifies the difference, and produces a prioritised plan to close it. You need both because without a target you cannot say what \"better\" means, and without a current profile you do not know where you are starting.\n\n**Check:** current vs target, then prioritised action plan.\n<\/details>\n\n**C6. What would happen if the \"analysis\" (risk assessment) stage were skipped when developing a policy?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nThe policy would be written without knowing which assets and threats matter. It might regulate trivial things (for example, photocopier use) in detail but say nothing about the loan database or phishing. Resources would be spent on low-risk items, and the policy might fail to address the biggest threats. The notes say risk assessment identifies critical assets and prioritises measures by impact and likelihood.\n\n**Check:** the policy would not be risk-based.\n<\/details>\n\n**C7. Which part of this topic would confuse someone seeing it for the first time?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\n(1) The three policy types look similar until you ask \"how wide is it and who is it for?\". (2) The ISO numbers (BS 7799, 17799, 27001, 27002) because they are one family at different stages. (3) NIST's many SP numbers: learn them by one-word tags. (4) CSF **tiers** (maturity) vs **profile** (current vs target) vs **core** (the five functions). Use the tables in 3.8.\n<\/details>\n\n---\n\n## PHASE 3 — ACTIVE RECALL BANK (Topic 3)\n\n### Level 1 — Basic recall\n\n**Q1.** Define \"policy\" and name the three types of information security policy.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** A policy is a set of organizational guidelines that dictates certain behaviour within the organization. The three types are the enterprise information security policy (EISP, or general program policy), the issue-specific security policy (ISSP) and the system-specific security policy (SysSP).\n\n**Marking:** definition (1), three types (3).\n\n**Common mistake:** naming \"acceptable use policy\" as a type; it is an example of an ISSP.\n<\/details>\n\n**Q2.** List the six guidelines for an effective policy.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Properly developed (industry-accepted practices); distributed (all appropriate methods); read or reviewed by all employees; understood by all employees; formally agreed to by act or assertion; uniformly applied and enforced.\n\n**Marking:** one mark per guideline.\n\n**Common mistake:** listing \"approved by the board\" instead of \"agreed to\" by employees.\n<\/details>\n\n**Q3.** List the policy development steps in the notes, in order.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Investigation (goals, support, participation); analysis (risk assessment); design (components, dissemination); implement (detailed specification); maintenance (regular review); distribution.\n\n**Marking:** order and content (6).\n\n**Common mistake:** placing risk assessment after design.\n<\/details>\n\n**Q4.** Name the five core functions of the NIST Cybersecurity Framework and the four tiers.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Functions: Identify, Protect, Detect, Respond, Recover. Tiers: Partial, Risk Informed, Repeatable, Adaptive.\n\n**Common mistake:** treating the tiers as functions, or reversing Tier 3 and Tier 4.\n<\/details>\n\n**Q5.** List the components of an ISSP.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Statement of purpose (scope and applicability; technology addressed; responsibilities); authorized access and usage of equipment (user access, fair and responsible use, privacy); prohibited usage (disruptive, criminal, offensive material, copyrighted material, other); systems management (stored materials, monitoring, virus protection, physical security, encryption); violations of policy (reporting, penalties); policy review and modification; limitations of liability.\n\n**Marking:** seven headings (7), with sub-items for extra credit.\n\n**Common mistake:** forgetting \"limitations of liability\".\n<\/details>\n\n### Level 2 — Understanding\n\n**Q6.** Distinguish EISP, ISSP and SysSP by level, purpose and one example each.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** EISP: organization-wide, sets strategic direction, scope and tone, assigns responsibilities (example: the bank's overall information security policy). ISSP: one issue or technology, gives detailed guidance on secure use and indemnifies the organization against liability for misuse (example: acceptable use of email and internet). SysSP: one system, gives managerial guidance and technical specifications (example: the firewall rule set or the ACL on the loan database).\n\n**Marking:** three levels (3), three purposes (3), three examples (3).\n\n**Common mistake:** describing SysSP as another general policy; it often looks like a standard or procedure.\n<\/details>\n\n**Q7.** Explain the relationship between ISO/IEC 27001, ISO/IEC 27002, ISO/IEC 17799 and BS 7799.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** BS 7799 was the original British standard. It became ISO/IEC 17799, which was renumbered ISO/IEC 27002 (the code of practice with guidelines and voluntary directions for information security management). ISO/IEC 27001 provides information on how to set up an ISMS and is the standard against which organizations seek certification. It is better used as an assessment tool than an implementation framework.\n\n**Marking:** lineage (2), role of 27002 (1), role of 27001 (2), certification (1).\n\n**Common mistake:** saying 27002 is the certification standard.\n<\/details>\n\n**Q8.** Why do the notes say policies are important reference documents? Give two uses.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** For internal audits, where the auditor compares actual practice with the policy; and for resolving legal disputes about management's due diligence, where the policy shows management's intent and that staff were informed.\n\n**Common mistake:** giving only one use.\n<\/details>\n\n**Q9.** How does SecSDLC differ from the ordinary SDLC? Mention two advantages and two disadvantages.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** The ordinary SDLC focuses on the design and implementation of an information system. SecSDLC adds identification of threats and risks and the controls needed at every stage so security is built in from the start. Advantages: improved security, compliance, risk management, better project management, efficiency. Disadvantages: cost, time-consuming, complexity, inflexibility, limited adaptability to new technology.\n\n**Marking:** difference (2), two advantages (2), two disadvantages (2).\n\n**Common mistake:** saying SecSDLC replaces the SDLC; it runs within it.\n<\/details>\n\n### Level 3 — Application\n\n**Q10.** Classify each statement as EISP, ISSP or SysSP: (a) \"All staff must use only company-approved email for business.\" (b) \"The firewall shall deny all inbound traffic except HTTPS to 10.0.0.5.\" (c) \"The bank is committed to protecting customer data; the CIO is accountable.\" (d) \"Employees may not install personal software on company computers.\"\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** (a) ISSP (email use). (b) SysSP (firewall configuration). (c) EISP (strategic commitment and responsibility). (d) ISSP (use of technology, a prohibited-usage item).\n\n**Marking:** one mark each, one for reasoning.\n\n**Common mistake:** classifying (d) as EISP because it applies to everyone. Scope of people is not the test; the test is whether it is strategic or a rule for one issue.\n<\/details>\n\n**Q11.** A bank discovers that its call-centre staff sometimes share passwords. The policy forbids it. Management says \"We have a policy, so we are covered.\" Using the six guidelines, explain why that statement is weak and name two actions.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** The bank may have developed the policy, but may not have met distribution, understanding, agreement or uniform enforcement. If staff were never trained, never signed it, or are not disciplined when caught, the policy is not effective and may not stand up if challenged. Actions: (1) run training with a short test and require signed acceptance; (2) enforce penalties uniformly and monitor for sharing (for example, simultaneous logins); (3) add technical controls such as MFA so sharing becomes difficult.\n\n**Marking:** reference to the guidelines (2), explanation (2), two actions (2).\n\n**Common mistake:** answering \"write a stricter policy\". The issue is understanding and enforcement, not wording.\n<\/details>\n\n**Q12.** A microfinance has the following status against the CSF core: asset list kept (yes); MFA on staff (partial); logs collected but not reviewed (no); no written incident plan (no); backups made but never restored (partial). Identify the tier it probably sits in, list the gaps and propose a priority order.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Probably **Tier 1 (Partial)** or **Tier 2 (Risk Informed)**: some practices exist but are informal or incomplete. Gaps: Detect (log review), Respond (no incident plan), Recover (untested backups), Protect (MFA coverage). Priority: first the restore test and incident plan, because they limit the damage of the most likely severe event (ransomware); then log review; then extend MFA. Justify the order with likelihood × impact.\n\n**Marking:** tier with reason (2), gaps mapped to functions (3), prioritised plan with justification (3).\n\n**Common mistake:** saying \"Tier 4\" because the organization has some controls.\n<\/details>\n\n**Q13.** Draft an outline for an Acceptable Use Policy for a school's computer lab. Use the ISSP components.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer (outline):** Statement of purpose, scope (students and staff, lab computers), responsibilities. Authorized use (coursework, research, reasonable personal use at set times), privacy. Prohibited use (disruptive or criminal use, offensive material, pirated software, unauthorized access). Systems management (virus protection, monitoring of lab use, storage cleared weekly). Violations (how to report, penalties). Review (annually). Limitation of liability (school not responsible for personal data left on lab machines).\n\n**Marking:** each ISSP component addressed with a relevant line (7), clear and practical wording (1).\n\n**Common mistake:** writing a general mission statement instead of enforceable rules.\n<\/details>\n\n### Level 4 — Exam mastery\n\n**Q14.** \"A policy is only as good as its enforcement.\" Discuss with reference to the notes' guidelines for effective policy and the courts. (10 marks)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer outline:**\n1. *Position:* largely true, but enforcement is one of six conditions.\n2. *Notes' guidelines:* a policy must be developed properly, distributed, read, understood, agreed to and uniformly applied and enforced.\n3. *Why enforcement matters:* uneven enforcement undermines credibility and legal standing: a court asks whether the rule was known, agreed and applied consistently. Selective enforcement can be treated as evidence the rule was not real.\n4. *Why enforcement is not enough:* an enforced policy that is badly written, conflicts with law, or has never been communicated still fails the \"stand up in court\" test.\n5. *Link to cost:* policies are cheap to write but hard to implement, since the effort is in making compliance real.\n6. *Link to audit:* auditors test enforcement by sampling evidence (for example, signed acceptances, training records, sanctions).\n7. *Conclusion:* enforcement is necessary, not sufficient.\n\n**Marking criteria:** position (1), list of guidelines (2), enforcement reasoning (2), counter-argument (2), audit link (2), conclusion (1).\n\n**Common mistake:** discussing enforcement without mentioning communication or understanding.\n<\/details>\n\n**Q15.** A regional bank must create a policy framework and a plan to keep it current. Propose (a) the three policy types it needs with one example each, (b) the development steps it will follow, and (c) how PDCA keeps the policies up to date, including two measures of success. (12 marks)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer outline:**\n(a) *EISP:* bank-wide statement approved by the board with roles. *ISSP:* acceptable use of email and internet; use of personal devices. *SysSP:* firewall configuration and ACLs for the core banking system (managerial guidance plus technical specification).\n(b) *Steps:* investigation (set goals, secure board and IT support, include departments); analysis (risk assessment of threats and vulnerabilities); design (components such as access control, data classification, incident response, and a dissemination plan); implement (detailed plan with owners and timelines); distribution (to all staff, with acceptance); maintenance (review).\n(c) *PDCA:* Plan = objectives and risk-based policy design; Do = implement and communicate; Check = audits, spot checks, incident analysis; Act = update policy and retrain. *Measures of success:* percentage of staff with signed acceptance and passing the awareness quiz; number of policy violations and time to resolve; audit findings closed on time; policy reviewed within the agreed cycle.\n\n**Marking criteria:** three types with examples (3), development steps (3), PDCA mapping (3), two measures (2), coherence (1).\n\n**Common mistake:** treating the policy as finished at distribution, without a review cycle.\n<\/details>\n\n\n---"};</script><script src="assets/app.js"></script><script src="assets/live.js"></script></html>
