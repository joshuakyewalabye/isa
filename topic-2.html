<script src="assets/meta.js"></script><script src="assets/index.js"></script><script>window.PAGE={"id": "t2", "t": "TOPIC 2 — Information Security Threats, Risks and Cyber Crimes", "s": "2 · Information Security Threats, Risks and Cyber Crimes", "g": "Topics", "c": "#e11d48", "k": "2", "f": "topic-2.html", "w": 8415, "md": "# TOPIC 2 — Information Security Threats, Risks and Cyber Crimes\n\n**Classification:** Likely exam focus, Core\n**Sources:** Topic 2.1 (Threats and Risks), Topic 2.2 (Cyber Crimes), Topic 2.2 (Overview of Cyber Security). CW1 Q1 to Q25 and Q47, Q50 test this topic. About 20 of CW1's 50 questions come from here, so this is the highest-yield topic for MCQs.\n**Outline items:** (a) threats, (b) risks, (c) introduction to cyber crimes and attacks, (d) information security measures.\n\n## PHASE 1 — UNDERSTANDING\n\n### 2.1 The big picture\n\nTopic 1 told you what to protect (confidentiality, integrity, availability). Topic 2 tells you **what attacks them**, **how likely and how bad that is** (risk), and **what to do about it** (measures).\n\nThe best way to read this topic is as one chain:\n\n```\n ASSET  ->  has a  VULNERABILITY  ->  exploited by a  THREAT (actor + exploit)\n   |                                              |\n   |                                              v\n   +---------- if it happens ------------>  IMPACT on C, I or A\n                                                  |\n        Risk = Likelihood x Impact  <-------------+\n                                                  |\n                     MEASURES (prevent, detect, respond) reduce likelihood or impact\n```\n\n**Where it connects.** Back to Topic 1: every threat is a threat to C, I or A. Forward to Topic 3: policies define what staff must do about these threats. Forward to Topic 4: network and application attacks (SYN flood, ARP poisoning) are explained at packet level. Forward to Topic 7: controls are the answer to these risks.\n\n### 2.2 Key terms (the vocabulary the exam keeps reusing)\n\n| Term | Notes' definition | Plain-English check |\n|---|---|---|\n| Threat | A potential negative action or event, facilitated by a vulnerability, that can cause an unwanted impact. Also: the potential for a threat agent to exploit a vulnerability | Something that *could* hurt you |\n| Vulnerability | A weakness in a host or system that can be exploited. Types: network, operating system, human, process | The unlocked door |\n| Exploit | Code that takes advantage of a vulnerability to cause unintended behaviour. Can be known or unknown | The tool that opens the unlocked door |\n| Risk | Likelihood of a threat exploiting a vulnerability and causing harm; the potential for loss. Also: risk of financial loss, disruption or reputational damage from IT failure | Probability of the threat succeeding, combined with how bad it would be |\n| Attack | An attempt via cyberspace to disrupt, disable, destroy or maliciously control a computing environment, or destroy data integrity, or steal controlled information | The threat actually happening |\n| Attack vector | A method of gaining unauthorized access to a network or system | The route in (email, USB, open port) |\n| Attack surface | The total number of attack vectors an attacker can use | All the routes in, added up |\n| Exploitation | Monitoring, espionage and copying data on computer systems. Different from a cyber attack, which aims to affect normal functioning | Quiet copying vs loud breaking |\n| Hacker | Someone with technical skills, often used for those who breach defences | Skill, not necessarily crime |\n| Cyberspace | The global domain of interdependent IT infrastructures (internet, telecoms, computer systems, embedded processors). Three layers: physical, logical, persona | The environment attacks happen in |\n| Cybercrime | Any criminal activity involving a computer, networked device or network. The computer may be the tool or the target | |\n| Cyber security | The application of technologies, processes and controls to protect systems, networks, programs, devices and data from cyber attacks | |\n\n**One concrete chain showing all of these:**\n\n1. A bank's web server runs a version of software with a known flaw that has not been patched. That flaw is the **vulnerability** (an operating system or network vulnerability).\n2. Someone downloads code that uses the flaw to run commands on the server. That code is the **exploit**.\n3. The person, the **threat agent**, sends the exploit to the server's open web port. The open port is the **attack vector**. All the open ports and web forms together are the **attack surface**.\n4. The server executes the commands and the attacker copies customer data. This is the **attack** (and the copying is also **exploitation** in the notes' sense). The **impact** is a breach of confidentiality.\n5. The **risk** was the likelihood of step 3 succeeding times how bad step 4 would be. CW1 Q47 asks exactly this: \"a flaw that has not been fixed with a patch\" is a **vulnerability**, not a threat, risk or impact.\n\n### 2.3 The threat catalogue (16 types in your notes)\n\nFor each: what it is, the notes' examples, which of C, I, A it mainly hits.\n\n| # | Threat | Description (notes) | Examples (notes) | Mainly hits |\n|---|---|---|---|---|\n| 1 | Malware | Malicious software designed to harm, exploit or compromise systems | Viruses, worms, trojans, ransomware, spyware, adware | C, I, A |\n| 2 | Phishing | Fraudulent attempts to obtain sensitive information by pretending to be trustworthy | Email phishing, spear phishing, whaling, smishing | C |\n| 3 | DoS and DDoS | Make a machine or network resource unavailable by overwhelming it | Flood attacks, application-layer attacks, botnets | A |\n| 4 | Cross-site scripting (XSS) | Inject malicious scripts into content from otherwise trusted websites | Stored, reflected, DOM-based XSS | C |\n| 5 | Man-in-the-middle (MitM) | Attacker secretly intercepts and relays messages between two parties who think they talk directly | Eavesdropping, session hijacking, HTTPS spoofing | C, I |\n| 6 | SQL injection | Insert malicious SQL into a query to manipulate a database | Authentication bypass, data leakage, deletion or alteration | C, I, A |\n| 7 | Insider threats | Threats from within the organization | Data theft, sabotage, unintentional breaches through negligence | C, I, A |\n| 8 | APTs | Prolonged, targeted attacks to steal data or conduct surveillance over a long period | State-sponsored attacks, corporate espionage | C |\n| 9 | Password attacks | Attempts to obtain or bypass passwords | Brute force, dictionary, credential stuffing, keylogging | C |\n| 10 | Zero-day exploits | Attacks on previously unknown vulnerabilities | Exploitation before a patch is released | C, I, A |\n| 11 | Social engineering | Manipulating people into divulging information or acting insecurely | Pretexting, baiting, tailgating, quid pro quo | C |\n| 12 | Ransomware | Malware that encrypts files and demands payment for the key | Crypto-ransomware, locker ransomware | A |\n| 13 | Supply chain attacks | Target less secure elements in the supply chain to reach an organization | Software supply chain, hardware-based attacks | C, I, A |\n| 14 | IoT vulnerabilities | Weaknesses in internet-connected devices | Unauthorized access, data breaches, botnet formation | C, A |\n| 15 | Cloud security threats | Risks from using cloud services | Data breaches, insecure APIs, account hijacking, misconfiguration | C |\n| 16 | Physical security threats | Risks to the physical infrastructure | Theft of devices, destruction of hardware, unauthorized physical access | C, A |\n\n### 2.4 Threats explained step by step\n\n#### 2.4.1 Malware: telling the types apart (a heavy MCQ area)\n\n| Type | How it behaves | The key phrase that identifies it | CW1 link |\n|---|---|---|---|\n| **Virus** | Attaches itself to another file and runs only when that file is executed | \"hides within another file until that file is executed\" | Q1 |\n| **Worm** | Replicates by itself across networks, with no host file needed | \"spreads across networks without a host file\" | Q6 |\n| **Trojan horse** | Pretends to be a useful program | \"presenting itself as a seemingly useful application\" | Q1 (as a wrong option) |\n| **Logic bomb** | Code that stays dormant until a condition is met (a date, a file, an event) | \"only activates once a particular condition is satisfied\" | Q8 |\n| **Ransomware** | Encrypts files and demands payment for the key | \"encrypts critical files and demands payment\" | Q16, Q49 |\n| **Spyware** | Secretly monitors activity | | |\n| **Keylogger** | Records keystrokes to capture passwords | | Q8 (as a wrong option) |\n| **Adware** | Pushes unwanted adverts | | Q16 (wrong option: \"pop-up ads\") |\n\n> **Supplementary explanation: virus subtypes tested in CW1 but absent from the notes.**\n> - **Boot sector virus:** infects the very first section of a storage device (the boot sector, or Master Boot Record), so the computer cannot start. It can look like a hardware failure (CW1 Q2, and the sample MCQs).\n> - **File infector virus:** attaches to executable program files.\n> - **Macro virus:** hides in the macros of documents such as Word or Excel files. Disabling macros reduces the risk.\n> - **Polymorphic virus:** changes its own code each time it spreads so that signature-based antivirus does not recognise it (CW1 Q4).\n> - **Resident virus:** loads into memory and stays active.\n> - **Multipartite virus:** infects both boot sectors and files.\n> Quick memory aid: **polymorphic = shape-shifting to dodge detection**.\n\n#### 2.4.2 SQL injection: what actually happens, line by line\n\nA login page runs this query every time someone submits the form (this is a typical vulnerable pattern, shown for learning):\n\n```\nSELECT * FROM users WHERE username = '<typed username>' AND password = '<typed password>';\n```\n\n**Normal use.** Mary types `mary` and `pass123`. The database receives:\n\n```\nSELECT * FROM users WHERE username = 'mary' AND password = 'pass123';\n```\n\nIt returns Mary's row only if both match. Otherwise nothing comes back and the login fails.\n\n**Injection.** An attacker types `admin' --` as the username and anything as the password. Now the database receives:\n\n```\nSELECT * FROM users WHERE username = 'admin' --' AND password = 'x';\n```\n\nReading it line by line:\n\n- `username = 'admin'` is now closed by the attacker's own quote mark.\n- `--` starts a **comment** in SQL, so everything after it (the password check) is ignored.\n- The query becomes \"find the user called admin\", with no password test. The database returns the admin row and the application logs the attacker in.\n\nThe application *appears to work normally* while being \"secretly manipulated to bypass controls\" (the CW1 Q11 wording). This is why SQLi is an attack on **confidentiality** (data read), **integrity** (data altered or deleted) and sometimes **availability**.\n\n> **Supplementary explanation: types of SQL injection (CW1 Q10).**\n> - **In-band (classic):** the attacker gets results through the same channel used to attack (the web page).\n> - **Blind:** the page shows no data; the attacker infers answers from true/false behaviour or timing.\n> - **Out-of-band:** data is retrieved through a **separate channel such as DNS**. This is the answer to CW1 Q10.\n>\n> **How to stop it:** validate input, use parameterised queries (the typed text is treated as data, never as SQL), and place a Web Application Firewall (WAF) in front. A WAF is designed to protect against SQL injection and cross-site scripting (CW1 Q39).\n\n#### 2.4.3 Cross-site scripting (XSS): three variants\n\nAll three make a victim's browser run an attacker's script that appears to come from a trusted site.\n\n| Variant | Where the script lives | Walk-through |\n|---|---|---|\n| **Stored XSS** | Saved on the server | 1. An attacker posts a comment containing a script. 2. The site stores it in its database. 3. Every visitor who loads the page runs the script. 4. The script quietly sends each visitor's session token to the attacker. This is CW1 Q9: \"a script embedded in a comment section ... executes whenever another user loads the page\". |\n| **Reflected XSS** | In a crafted link, bounced back by the server | 1. The attacker builds a link with a script in it. 2. A victim clicks the link. 3. The server includes the script in its response page. 4. The browser runs it. Nothing is stored. |\n| **DOM-based XSS** | In the page's own client-side code | 1. The page's JavaScript reads part of the URL. 2. It writes that part into the page unsafely. 3. The attacker's script runs, without the server's response containing it. |\n\n**Memory aid:** stored = saved and hits everyone; reflected = one clicked link; DOM-based = the browser's own code is the culprit.\n\n#### 2.4.4 Man-in-the-middle (MitM)\n\n1. Two parties believe they are communicating directly, for example, a customer and a bank site over open Wi-Fi.\n2. An attacker positions themselves on the path (for example, by running a fake hotspot).\n3. The attacker receives each message, may read or **alter** it, and forwards it so neither side notices.\n4. Examples in the notes: eavesdropping, session hijacking, HTTPS spoofing.\n\n**Best prevention (CW1 Q3): strong encryption such as HTTPS or a VPN.** Ad-blockers, disabling macros, and running as administrator do nothing against MitM.\n\n#### 2.4.5 Denial of service and DDoS\n\n- **DoS:** one source floods a target so legitimate users are blocked.\n- **DDoS:** thousands of machines, often a **botnet** of infected devices whose owners do not know, send the flood together. It looks like network congestion (CW1 Q5).\n- The goal is not to steal or change data but to **deny access**, so it is an attack on **availability**.\n- Examples in the notes: flood attacks, application-layer attacks, botnets. Topic 4 covers the SYN flood in detail.\n\n#### 2.4.6 Password attacks\n\n| Attack | How it works | Difference |\n|---|---|---|\n| **Brute force** | Tries *every possible combination* until one works | Exhaustive, slow, no guessing logic |\n| **Dictionary** | Tries a *precompiled list* of likely words and common passwords | Faster; relies on people choosing predictable passwords (CW1 Q14) |\n| **Credential stuffing** | Takes usernames and passwords leaked from one site and tries them on others | Works because people reuse passwords |\n| **Keylogging** | Malware records what you type | Captures even strong passwords |\n\n**Mitigation:** strong password policy, MFA, account lockout after repeated failures, never reuse passwords.\n\n#### 2.4.7 APT and zero-day: two terms students mix up\n\n| | APT | Zero-day |\n|---|---|---|\n| Describes | **How long and how targeted** the attack is | **What kind of flaw** is exploited |\n| Key phrase | Intruder stays **undetected for months**, gathering data (CW1 Q13) | Flaw is exploited **before the vendor has a patch** (CW1 Q15) |\n| Relationship | An APT often *uses* a zero-day, but does not have to | A zero-day can be used in a quick, one-time attack |\n\n#### 2.4.8 Insider threats\n\nThe notes name three types: **malicious** (deliberate, such as a disgruntled employee copying customer data to sell, CW1 Q24), **accidental** and **negligent** (no harm intended, for example sending client data to the wrong recipient, CW1 Q12 \"Negligent insider\").\n\n> **Supplementary explanation.** CW1 Q12 also offers \"compromised insider\": an insider whose account or device has been taken over by an outsider. The employee did nothing wrong, but the insider access is being used by an attacker.\n\nInsiders include current and former employees, temporary workers and customers (notes, overview deck).\n\n#### 2.4.9 Social engineering: the main variants (CW1 Q19, Q21)\n\nSocial engineering attacks the *person*, not the computer.\n\n| Variant | What the attacker does | Spot it by |\n|---|---|---|\n| **Pretexting** | Creates a fake persona or misuses a real role | \"I'm from IT, I need your password to fix your account\" |\n| **Baiting** | Lures victims with something valuable, such as a USB labelled \"confidential\" or free downloads | Something tempting left to be picked up (CW1 Q19) |\n| **Tailgating / piggybacking** | Follows an authorized person into a restricted area | Physical following (CW1 Q21) |\n| **Quid pro quo** | Offers a service or favour in return for access or information | \"IT support\" offering to speed up your internet |\n| **Honeytrap** | Fake dating or social profiles to build a relationship | Romance scam |\n| **Scareware** | Frightens you with a fake virus warning | \"Your device is infected, click to clean\" |\n| **Watering hole** | Infects a site the target regularly visits | Drive-by download |\n| **Search engine phishing (SEO poisoning)** | Becomes the top search hit for a term | A search result that leads to a fake site |\n\n#### 2.4.10 The phishing family (the notes' list)\n\n| Name | Channel / target | Trick to remember |\n|---|---|---|\n| **Phishing** | Any communication, mostly email; mass | \"Fishing\" with a wide net |\n| **Spear phishing** | A specific person or group (for example, a system administrator) | Spear = one target |\n| **Whaling** | Top management (CEO, CFO) | Whale = big fish |\n| **Vishing** | Voice call | **V**oice |\n| **Smishing** | SMS text message | **SM**S |\n| **Business Email Compromise (BEC)** | Impersonation, account compromise, thread hijacking | Pretends to be a trusted business email |\n| **Pharming** | Redirects users to a fake website that looks real | Fake site, no click needed on a bait link |\n\n#### 2.4.11 Other threats in the catalogue\n\n- **Supply chain attacks:** the attacker compromises a weaker supplier or software update, then uses it to reach the real target.\n- **IoT vulnerabilities:** smart devices often have weak security and may become part of a botnet. Administrators sometimes fail to detect them because they run lightweight operating systems without discovery protocols (CW1 Q17, supplementary).\n- **Cloud threats:** data breaches, insecure APIs, account hijacking, misconfiguration. A very common one is a **misconfigured storage bucket or database** left public through human error rather than malware (CW1 Q18).\n- **Physical threats:** theft of devices, destruction of hardware, unauthorized physical access. An **accidental** spill on a workstation is an unintentional human action, not sabotage or a natural disaster (CW1 Q22).\n\n### 2.5 Who attacks: the nine attacker types (overview deck)\n\n| # | Attacker | Motive | Resources and notes |\n|---|---|---|---|\n| 1 | Recreational | Fame and notoriety | Limited resources; know which weakness to exploit |\n| 2 | Script kiddies | Curiosity, fun | Amateurs using ready-made tools; less skill, usually little damage |\n| 3 | Cyber criminals | Financial gain | Individuals or groups that capture systems or data to profit |\n| 4 | Hacktivists | A political agenda or cause | Not after money; may pair with malicious insiders |\n| 5 | State-sponsored | Political or military goals of a country | Very large resources; often cause APTs; cyberwar, industrial espionage |\n| 6 | Insiders | Grudge, carelessness | Disgruntled or former employees, temporary workers, customers; malicious, accidental or negligent |\n| 7 | Organized crime | Large-scale crime | Groups pooling hackers and programmers |\n| 8 | Hackers | Varies | **White hat** (ethical, find weaknesses to fix), **gray hat** (break in without harm, then tell the owner), **black hat** (unethical, for personal benefit) |\n| 9 | Nation-state actors / cyberterrorists | Steal secrets, damage facilities, create international incidents | Often target critical infrastructure such as power grids |\n\n### 2.6 Information security risks\n\n**Notes' definition:** \"the likelihood of a threat exploiting a vulnerability and causing harm\", and \"the potential for loss when the threat happens\".\n\nThe notes list 15 risks with their impacts. Learn the pairs:\n\n| Risk | Typical impacts (notes) |\n|---|---|\n| Data breaches | Loss of customer trust, legal consequences, financial loss, reputational damage |\n| Malware attacks | Data corruption, unauthorized access, downtime, financial loss |\n| Phishing | Credential theft, unauthorized access, financial loss, breaches |\n| Ransomware | Data loss, operational disruption, financial loss, reputational damage |\n| DoS / DDoS | Downtime, loss of revenue, reputational damage |\n| Insider threats | Data theft, sabotage, disruption, financial loss |\n| SQL injection | Unauthorized access to databases, data theft, data manipulation |\n| MitM | Data theft, data manipulation, unauthorized access |\n| Weak passwords | Unauthorized access, breaches, system compromise |\n| Unpatched software | Exploitation of known vulnerabilities, unauthorized access, breaches |\n| Social engineering | Credential theft, unauthorized access, breaches |\n| APTs | Data theft, espionage, operational disruption |\n| Physical security risks | Theft or damage of hardware, unauthorized data access |\n| Cloud security risks | Breaches, unauthorized access, data loss |\n| IoT vulnerabilities | Unauthorized access, breaches, system manipulation |\n\n#### Risk = Likelihood × Impact: worked, line by line (CW1 Q25)\n\n**Scenario.** Score each risk 1 (low), 2 (medium), 3 (high).\n\n1. Phishing: likelihood is **High (3)** because staff receive suspicious emails every week. Impact is **Medium (2)** because one stolen password gives limited access.\n2. Multiply: 3 × 2 = **6**.\n3. Compare with the organization's matrix. On a typical 3 × 3 scale: 1 to 2 Low, 3 to 4 Medium, 6 High, 9 Critical. So the answer is **High**.\n4. The risk is then prioritised against the others in the register.\n\n> **Supplementary explanation: the four standard responses to a risk.** Once scored, an organization can **reduce** it (apply controls), **avoid** it (stop the activity), **transfer** it (insurance or outsourcing; CW1 Q46 lists \"Risk Transfer\" as a wrong option for the definition of compliance) or **accept** it (knowingly live with it). Your notes focus on the first, which they call **mitigation**.\n\n### 2.7 Cyber crimes (Topic 2.2 deck)\n\n**Definition (notes):** any criminal activity that involves a computer, networked device or network. The computer may be the tool, or it may be the target. Harm can be to security, finances, reputation, or even mental health and life.\n\n#### 2.7.1 Crimes targeting computer systems\n\n| Crime | What it is (notes) |\n|---|---|\n| **Data diddling** | Deliberately entering wrong information into a system or document, by a person or a virus. (Link to Topic 7: input controls exist to catch this.) |\n| **Malware attacks** | Viruses, worms, trojans, logic bombs, spyware, ransomware |\n| **Data breaches** | Sensitive information copied, transmitted, viewed, stolen, altered or used without the owner's knowledge or authorization |\n| **APTs** | Prolonged, targeted attack; intruder remains undetected for a long time |\n| **DDoS** | Overwhelm a server, service or network with traffic |\n| **Spam and phishing** | Spam: unwanted notifications or ads. Phishing: attempts to get passwords or card numbers |\n| **Corporate Account Takeover (CATO)** | Criminals steal employee credentials to control systems and move information or money |\n| **ATM cash-out** | Criminals breach a bank or card processor, manipulate fraud controls and alter accounts so there is no withdrawal limit, then withdraw from many ATMs in a short time |\n\n#### 2.7.2 Crimes targeting mobiles\n\nMobile devices account for more than 60% of digital fraud (notes). The top smartphone threats listed:\n\n| Threat | Key idea |\n|---|---|\n| Data leaks | Apps collect names, birth dates, location, contacts; a breach at the app developer exposes them |\n| Poor password security | Reused or weak passwords, no multi-factor authentication |\n| Open Wi-Fi | Unencrypted networks; attackers may run fake hotspots |\n| Phishing | Tricks to give up a password, click a malware link, confirm a transaction |\n| Identity theft | Stolen identities used to open or hijack phone accounts |\n| Spyware | Software that monitors texts, location, conversations |\n| Malicious apps | Trojan-style apps that lock the phone or steal data and mobile money |\n| Apps with weak security | Weak encryption or leaked tokens that let hackers impersonate users |\n| Out-of-date devices | Phones that no longer receive security updates |\n\n> **Supplementary explanation: SIM swap (CW1 Q20).** An attacker convinces the mobile provider to move the victim's phone number onto the attacker's SIM card. Now text messages go to the attacker, including **one-time passwords** (OTPs). The attacker can reset passwords and take over accounts. The critical risk is OTP interception, not device damage.\n\n#### 2.7.3 Online scams and frauds\n\nEmail scams, phishing, vishing, smishing, whaling; online job or recruitment fraud; online sextortion; debit/credit card and online payment fraud; cyberbullying; website defacement (replacing a site's content); cybersquatting (registering domain names similar to trademarks or company names to profit); pharming (redirecting users to a fake look-alike site); cyber espionage (stealing classified or sensitive data or IP for advantage); cryptojacking (hijacking a computer to mine cryptocurrency without consent).\n\n#### 2.7.4 Social media scams and frauds\n\nImpersonation and identity theft; fake job offers; **misinformation** (false information spread, whether or not there is intent to mislead); **fake news** (false information or propaganda posed as news); cyber grooming; child sexual exploitation content; cyber stalking; cyberbullying; doxing (publishing someone's private information online).\n\n> **A fake social media account spreading misinformation during an election** is **cyber propaganda** (CW1 Q50), not sabotage, espionage or terrorism.\n\n### 2.8 Two case studies from your notes, made concrete\n\n#### Case Study I: Spear phishing (the email in your slides)\n\nThe slide shows an email from a \"Better Business Bureau\" claiming your company has been reported for violating the Fair Labor Standards Act. Work through it line by line:\n\n| Part of the email | Why it is a red flag |\n|---|---|\n| Looks like it comes from a person with a case number (\"Case:563121380649:307\") | A reference number makes it feel official and personal, which is typical of **spear** phishing (it targets a specific company) |\n| \"Better Business Bureau has received an abuse, claiming that your company is violating...\" | Authority impersonation plus an alarming legal claim. Note the odd wording (\"abuse\" instead of \"complaint\") |\n| \"Download the document ... by following the link\" `https://bit.ly/...` | A **shortened link** hides the real destination. The link likely leads to a malicious or credential-stealing site |\n| \"Please send a short reply within 24 hours\" | **Urgency** to stop you from thinking |\n| \"Keep the abuse ID unchanged in the subject\" | Makes the process seem bureaucratic and genuine |\n| Signed \"Compliant Department\" | A misspelling of \"Complaint Department\" |\n\n**What a careful employee does:** do not click; check the sender's real address; hover over or expand the link; contact the organisation through a known channel; report the email to IT.\n\n#### Case Study II: Cyber grooming (kept at the level of lessons)\n\nYour notes present a case in which an adult deceived a young person online about his age and identity, built an emotional hold on him and isolated him from his parents, and early warnings from the family were not acted on effectively. The details are distressing and you need not memorise them. What an exam will want:\n\n- **Definition (notes):** cyber grooming is when someone, often an adult, befriends a child online and builds an emotional connection with intent to sexually abuse, exploit or traffic them.\n- **Pattern-level warning signs:** an online contact who is secretive, much older than claimed, gives gifts or attention, pushes the child to hide the relationship, or urges a meeting alone.\n- **Lessons from the case:** take a family's early report seriously; preserve evidence; escalate beyond one police contact; platforms and gaming groups need reporting mechanisms; parents and schools need awareness.\n\n### 2.9 Cyber security overview, key points\n\n**Definition (notes).** Cyber security protects an organization, its employees and assets against cyber threats through technologies, processes and controls, reducing the risk of attacks and unauthorized exploitation.\n\n**Pillars (types) of cyber security:** network, cloud, endpoint, mobile, IoT, application, and **zero trust**. Zero trust replaces the perimeter-only model (\"walls around valuable assets\") because of insider threats, a broken-down perimeter and remote work.\n\n**How to deceive attackers (notes):** conceal valuable data among decoy files; camouflage infrastructure by changing addresses and topologies; give false information such as fake assets; use advisory insights; use IPS and firewalls.\n\n**Evolution of attacks:** five generations: Gen 1 late 1980s, Gen 2 mid-1990s, Gen 3 early 2000s, Gen 4 around 2010, Gen 5 around 2017.\n\n**Why the landscape is getting harder:** detection alone is no longer good enough; focus must shift to **prevention** and a consolidated architecture. Complex hybrid environments (on-premises plus several clouds), mixed endpoints including BYOD, and remote work widen the attack surface.\n\n#### Cyber warfare vs cyber terrorism\n\n| | Cyber warfare | Cyber terrorism |\n|---|---|---|\n| Who | A nation-state or international organization | Premeditated, politically motivated actors |\n| Aim | To \"weaken, disrupt or destroy\" another nation | To cause fear, threaten violence or result in violence |\n| Methods in the notes | Espionage, sabotage, DoS, power-grid attacks, propaganda, economic disruption, surprise attacks | Often ransomware and phishing |\n| Possible effects | Blackouts, military equipment failure, secrets stolen, network disruption, death | |\n\n**Case studies (as in the notes):** the 2017 attack in Ukraine and on the UK NHS (looked like ransomware but did large-scale damage; an example of economic disruption); **Stuxnet** (a worm spread through infected USB devices that targeted control systems in Iran's nuclear programme); the **Sony Pictures hack** (attributed to North Korean government hackers after a film release); the **Qatar emails** case (alleged theft and leak of a fundraiser's emails to discredit him).\n\n**Critical infrastructure.** Systems, networks and assets whose continuous operation is necessary for a nation's security, economy and public health or safety. The **protection process** has five steps: identify critical infrastructure; identify and assess vulnerabilities; analyse and prioritise infrastructure; implement protective programmes; measure effectiveness. **Cyber resilience** is the ability to keep operating and recover.\n\n### 2.10 Security measures (mitigation strategies in the notes)\n\n| Measure (notes) | Threats it mainly reduces |\n|---|---|\n| Firewalls and IDS/IPS | Network attacks, DoS, intrusion attempts |\n| Regular updates and patch management | Zero-day follow-ups, unpatched software, malware, SQLi |\n| Strong passwords, MFA | Password attacks, credential theft, phishing impact |\n| Employee training and awareness | Phishing, social engineering, insider negligence |\n| Encryption and secure protocols (data at rest and in transit) | MitM, eavesdropping, data theft |\n| Regular security audits and risk assessments | All, by finding weaknesses early |\n| Incident response and disaster recovery plans | Ransomware, outages, breaches (limits impact) |\n| Access controls and least privilege (RBAC) | Insider threats, account misuse |\n| Regular, secured and integrity-tested backups | Ransomware, data loss |\n| Physical security (surveillance, access control) | Theft, tailgating, unauthorized access |\n| Compliance with laws and regulations, with audits | Legal exposure |\n\n> **Supplementary explanation: other measures CW1 tests.** **Network segmentation** (dividing a network into isolated segments so malware cannot spread freely; CW1 Q35); **a Web Application Firewall** for SQLi and XSS (Q39); **patching** reduces the attack surface and helps availability (Q40); **incident response** as the structured process of detection, containment and recovery (Q36).\n\n### 2.11 A decision tree for scenario-style MCQs\n\nUse this to decode long, wordy stems:\n\n```\nQ: What is the attack described?\n |\n +-- Does it lock files and demand payment?  ---------------> RANSOMWARE (availability)\n +-- Does it flood a target from many machines? -----------> DDoS (availability)\n +-- Does it hide in a file and need that file to run? ----> VIRUS\n |      +-- affects the boot sector / MBR? ----------------> BOOT SECTOR VIRUS\n |      +-- changes its code to avoid detection? ----------> POLYMORPHIC VIRUS\n +-- Does it spread itself across a network, no host? ----> WORM\n +-- Does it look like useful software? -------------------> TROJAN\n +-- Does it wait for a date or condition? ----------------> LOGIC BOMB\n +-- Fake email/site to steal credentials? ----------------> PHISHING (spear / whaling / vishing / smishing)\n +-- Odd characters in a login form change the query? ----> SQL INJECTION\n +-- Script saved in a comment runs for every visitor? ---> STORED XSS\n +-- Someone secretly sits between two parties? ----------> MAN-IN-THE-MIDDLE (prevent with HTTPS/VPN)\n +-- Long-term, undetected, data-gathering intruder? -----> APT\n +-- Exploits a flaw before a patch exists? --------------> ZERO-DAY\n +-- Tries every combination / a word list? --------------> BRUTE FORCE / DICTIONARY\n +-- Employee with access misuses or leaks data? ---------> INSIDER (malicious / negligent)\n +-- Flash drive left lying around? ----------------------> BAITING\n +-- Follows someone through a secure door? --------------> TAILGATING\n +-- Fake accounts spreading false stories to sway opinion? -> CYBER PROPAGANDA\n```\n\n### 2.12 Common misconceptions and exam traps\n\n| Trap | Truth |\n|---|---|\n| \"A threat and a vulnerability are the same\" | The vulnerability is the weakness; the threat is the potential harm facilitated by it. An unpatched flaw is a **vulnerability** (CW1 Q47). |\n| \"A worm needs a host file\" | A worm replicates **without** a host; a virus needs one. |\n| \"Trojan and virus are the same\" | A trojan *pretends* to be useful; a virus *attaches* to a file. |\n| \"APT = zero-day\" | APT is about duration and targeting; zero-day is about an unpatched flaw. |\n| \"Ransomware attacks confidentiality\" | Mainly **availability**. |\n| \"DDoS steals data\" | It denies access. |\n| \"Phishing only happens by email\" | Also voice (vishing) and SMS (smishing). |\n| \"Spear phishing = whaling\" | Spear targets a specific person or group; whaling targets **top management**. |\n| \"Brute force and dictionary are the same\" | Brute force tries all combinations; dictionary uses a list of likely words. |\n| \"Misinformation requires intent to deceive\" | Per the notes, it is false information spread regardless of intent; fake news is false information posed as news. |\n| \"Exploitation = attack\" | In the notes, exploitation is monitoring and copying data; an attack aims to disrupt normal functioning. |\n| \"Insider threat always means malicious\" | Also accidental and negligent. |\n| \"Stronger encryption stops SQL injection\" | Input validation and parameterised queries do. MitM is what encryption stops. |\n\n### 2.13 Checklist: analysing any threat scenario\n\n1. **Asset?** What is being targeted?\n2. **Weakness?** Network, OS, human or process vulnerability?\n3. **Actor?** One of the nine attacker types?\n4. **Method?** Use the decision tree.\n5. **Goal hit?** Confidentiality, integrity or availability?\n6. **Risk?** How likely, and how bad? (L × I)\n7. **Measure?** What would have prevented, detected or limited it?\n\n### 2.14 Revision summary (Topic 2)\n\n- Vulnerability = weakness; threat = potential harm facilitated by it; exploit = code using it; risk = likelihood × impact; attack vector = route in; attack surface = all routes.\n- 16 threat types: malware, phishing, DoS/DDoS, XSS, MitM, SQLi, insiders, APTs, password attacks, zero-day, social engineering, ransomware, supply chain, IoT, cloud, physical.\n- Virus attaches to a file; worm spreads alone; trojan disguises; logic bomb waits for a condition; ransomware locks files for payment (availability).\n- SQLi alters the query using quote and comment characters; stored XSS hits every visitor; MitM is stopped by HTTPS/VPN.\n- Nine attacker types: recreational, script kiddies, criminals, hacktivists, state-sponsored, insiders, organized crime, hackers (white, gray, black), nation-state actors.\n- Cyber crime categories: against computer systems, mobiles, online scams, social media, social engineering.\n- Phishing family: phishing, spear (specific target), whaling (top management), vishing (voice), smishing (SMS), BEC.\n- Cyber warfare (nation-state, weaken or destroy) vs cyber terrorism (political, causes fear or violence). Critical infrastructure protection has five steps.\n- Measures: firewalls/IDS-IPS, patching, MFA, training, encryption, audits, incident response and DR, least privilege and RBAC, backups, physical security, compliance.\n\n\n---\n\n## PHASE 2 — COMPREHENSION CHECKS (Topic 2)\n\n**C1. Explain, in your own words, the difference between a threat, a vulnerability and a risk, using one example that is not from the notes.**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\n*Example: a clinic's reception computer.* The vulnerability is that Windows has not been updated for a year, so a known flaw is open. The threat is a criminal with code that exploits that flaw (or ransomware that spreads through it). The risk is the combination: how likely the criminal is to succeed, multiplied by how bad it would be if patient records were encrypted. The same flaw with no connection to any network and no valuable data would be a vulnerability with very low risk.\n\n**Check:** vulnerability = weakness, threat = potential harm that uses it, risk = likelihood × impact.\n<\/details>\n\n**C2. Why is ransomware classified mainly as an availability attack and not a confidentiality attack?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nBecause the defining harm is that authorized users can no longer use their data. Files are encrypted, so staff cannot open them until a key is bought. Nothing necessarily leaks. (Many modern ransomware gangs also steal data, which adds a confidentiality harm, but the label \"ransomware\" describes the lock-and-demand behaviour, and exam questions such as CW1 Q49 treat availability as the goal most directly violated.)\n\n**Check:** you should name availability and say why (access lost), not simply \"data is attacked\".\n<\/details>\n\n**C3. Why does an SQL injection like `admin' --` work? What would happen if the application used parameterised queries?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nIt works because the application pastes the typed text directly into the SQL string, so the attacker's quote mark ends the username field and the `--` turns the rest of the query, including the password check, into a comment. With parameterised queries the database receives the SQL command and the typed value separately. The text `admin' --` would be treated as a literal username that does not exist, so the login would fail.\n\n**Check:** mixing code and data is the root cause; separating them is the fix.\n<\/details>\n\n**C4. What would happen to an organization's defences if it relied only on detection and had no prevention? (Link to the notes' \"detection is no longer good enough\".)**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nIt would learn about attacks only after the damage began. With fast-moving threats such as ransomware, zero-day exploits and APTs, the data may already be encrypted, stolen or altered by the time an alert fires. The notes say focus must shift to prevention and a consolidated architecture, because sophisticated attacks are no longer caught by legacy approaches and need in-depth visibility. Prevention reduces the number of successful attacks; detection and response limit the damage of those that get through. You need both.\n\n**Check:** you should have argued for a combination, with prevention first.\n<\/details>\n\n**C5. How does phishing relate to social engineering? How does spear phishing differ from whaling?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nSocial engineering is the umbrella term: psychological deception to make people reveal information or act insecurely. Phishing is one form of it, done mostly through email and similar messages. Spear phishing is aimed at a specific person or group (for example a system administrator), using details that make the message believable. Whaling is spear phishing aimed at the very top (CEO, CFO), where one successful message can authorise large payments.\n\n**Check:** phishing ⊂ social engineering; spear = specific target; whaling = top management.\n<\/details>\n\n**C6. Give an original example of an accidental insider incident and say which CIA goal it breaches.**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nAn accountant attaches the wrong spreadsheet to an email to a supplier; it contains every client's bank details. No harm was intended, but the data is now with an unauthorized person: a **confidentiality** breach caused by a negligent or accidental insider (CW1 Q12's \"negligent insider\").\n\n**Check:** no intent, real exposure.\n<\/details>\n\n**C7. Which part of this topic would confuse someone seeing it for the first time?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\n(1) Many names for similar things: virus, worm, trojan, logic bomb. Use the decision tree and the \"key phrase\" column. (2) Threat vs vulnerability vs risk vs exploit. Use the one concrete chain in 2.2. (3) The phishing family (spear, whaling, vishing, smishing). Use the memory aids. (4) The word \"exploitation\" has a specific meaning in the notes. (5) APT vs zero-day.\n<\/details>\n\n---\n\n## PHASE 3 — ACTIVE RECALL BANK (Topic 2)\n\n### Level 1 — Basic recall\n\n**Q1.** List the 16 threat types named in the Topic 2.1 notes.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Malware; phishing; DoS/DDoS; cross-site scripting; man-in-the-middle; SQL injection; insider threats; APTs; password attacks; zero-day exploits; social engineering; ransomware; supply chain attacks; IoT vulnerabilities; cloud security threats; physical security threats.\n\n**Marking:** one mark per correct item, up to 16.\n\n**Common mistake:** forgetting the last four (supply chain, IoT, cloud, physical).\n<\/details>\n\n**Q2.** Define: vulnerability, exploit, attack vector, attack surface.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Vulnerability: a weakness in a host or system that can be exploited (network, operating system, human or process). Exploit: code that takes advantage of a vulnerability to cause unintended behaviour; known or unknown. Attack vector: a method of gaining unauthorized access to a network or system. Attack surface: the total number of attack vectors an attacker can use.\n\n**Marking:** one mark per definition, plus half a mark each for the types or examples.\n\n**Common mistake:** defining attack surface as \"the target\". It is the *sum of the routes in*.\n<\/details>\n\n**Q3.** Name the nine types of cyber attackers in the overview deck.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Recreational; script kiddies; cyber criminals; hacktivists; state-sponsored; insiders; organized crime; hackers (white, gray, black hat); nation-state actors or cyberterrorists.\n\n**Common mistake:** omitting organized crime or listing \"hacker\" without the three hat colours.\n<\/details>\n\n**Q4.** State what each of these identifies: (a) boot sector virus (b) polymorphic virus (c) logic bomb (d) worm (e) trojan horse.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** (a) A virus that infects the first section of a storage device (the MBR), preventing normal start-up. (b) A virus that changes its own code to avoid detection. (c) Code that activates only when a condition, such as a date, is met. (d) Malware that spreads across networks without a host file. (e) Malware disguised as a useful program.\n\n**Note:** (a) and (b) are CW1 topics that are supplementary to the notes.\n\n**Common mistake:** describing a worm as needing a host file.\n<\/details>\n\n**Q5.** Define an *attack* as the overview deck does, and give three examples.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** An attack is an attempt, via cyberspace, targeting an enterprise's use of cyberspace to disrupt, disable, destroy or maliciously control a computing environment or infrastructure, destroy data integrity, or steal controlled information. Examples (notes): identity theft, fraud, malware attack, phishing, password attack, man-in-the-middle, DoS.\n\n**Common mistake:** confusing attack with exploitation.\n<\/details>\n\n**Q6.** Name the five steps of the critical infrastructure protection process.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** (1) Identify critical infrastructure. (2) Identify and assess vulnerabilities. (3) Analyse and prioritise infrastructure. (4) Implement protective programmes. (5) Measure effectiveness.\n\n**Common mistake:** putting \"implement\" before \"assess\".\n<\/details>\n\n### Level 2 — Understanding\n\n**Q7.** Distinguish a virus from a worm and a trojan horse. Use one phrase to identify each.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** A virus attaches to another file and runs only when that file is executed (needs a host). A worm replicates by itself across networks and needs no host file. A trojan horse presents itself as a useful program but does something harmful. Key phrases: virus = \"hides within another file\"; worm = \"spreads without a host\"; trojan = \"looks useful\".\n\n**Marking:** three correct definitions (3), three distinguishing features (3).\n\n**Common mistake:** saying a trojan replicates itself. It does not; it relies on the user installing it.\n<\/details>\n\n**Q8.** Explain why a stored XSS attack is more dangerous than a reflected one.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** In stored XSS the script is saved on the server (for example in a comment), so it runs for every visitor who loads the page, without anyone needing to click a crafted link. In reflected XSS, the script travels in a link and affects only the person who clicks it. Stored XSS therefore reaches many more victims, for longer, from a single injection.\n\n**Marking:** stored mechanism (1), every visitor (1), reflected mechanism (1), contrast (1).\n\n**Common mistake:** saying reflected attacks are stored in the database.\n<\/details>\n\n**Q9.** Compare brute force, dictionary and credential stuffing attacks. Which is defeated best by \"never reuse passwords\"?\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Brute force tries every combination. Dictionary tries a prepared list of likely passwords. Credential stuffing takes credentials leaked from one site and tries them on others. Not reusing passwords defeats credential stuffing, because a leak from one site then gives nothing on the next.\n\n**Marking:** three correct descriptions (3), correct choice with reason (2).\n\n**Common mistake:** thinking longer passwords help against credential stuffing. They do not; uniqueness does.\n<\/details>\n\n**Q10.** Explain the difference between cyber warfare and cyber terrorism.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Cyber warfare is carried out by a nation-state or international organization to weaken, disrupt or destroy another nation's computers and networks, using methods such as espionage, sabotage, DoS, power-grid attacks, propaganda, economic disruption and surprise attacks. Cyber terrorism is a premeditated, politically motivated attack on information systems, programs and data that causes fear, threatens violence or results in violence, often through ransomware and phishing. The first is state action against another state; the second is political violence or intimidation, whoever the actor is.\n\n**Marking:** definition of each (2 + 2), examples (1), clear contrast (1).\n\n**Common mistake:** saying cyber terrorism is always done by a state.\n<\/details>\n\n### Level 3 — Application\n\n**Q11.** (CW1 style) After a staff member plugs in a flash drive labelled \"Salaries 2026 — confidential\" that was found in the car park, the company's servers start encrypting files. Identify the social engineering method, the malware type, the CIA goal most affected, and two controls that would have helped.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:**\n- *Social engineering method:* **baiting** (a tempting item left for someone to pick up).\n- *Malware type:* **ransomware** (files encrypted; payment will be demanded).\n- *CIA goal:* **availability** (files cannot be used).\n- *Controls:* staff awareness training (never plug in unknown media); disable USB ports or use endpoint controls; EDR and antivirus; tested offline backups so files can be restored; least privilege to limit what the infected account can reach.\n\n**Marking:** each of the four elements (1 each), two relevant controls (2).\n\n**Common mistake:** naming the method \"phishing\". There was no deceptive message.\n<\/details>\n\n**Q12.** (Calculation) A risk register scores likelihood (L) and impact (I) from 1 to 3. Compute the risk for each and rank them. (a) Cloud storage left public: L2, I3. (b) Phishing: L3, I2. (c) Fire in the server room: L1, I3. (d) Insider misuse of customer data: L2, I2.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** (a) 2 × 3 = 6. (b) 3 × 2 = 6. (c) 1 × 3 = 3. (d) 2 × 2 = 4. Ranking: (a) and (b) tied at 6, then (d) at 4, then (c) at 3. For the tie, justify the choice: for example, treat the public storage first because exposure is immediate and the fix is quick.\n\n**Marking:** four correct scores (4), correct ranking (1), reasoned tie-break (1).\n\n**Common mistake:** adding instead of multiplying (L + I would give 5, 5, 4, 4 and a different ranking).\n<\/details>\n\n**Q13.** An email arrives at the finance director: \"Our bank details have changed. Please pay today's invoice to the new account below. Reply only to this address.\" The domain differs from the real supplier by one letter. Name the attack and give four checks that expose it.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** This is **Business Email Compromise** (impersonation of a supplier) and a spear phish aimed at someone who can authorise payments. Checks: (1) look at the sender domain letter by letter; (2) confirm the change by calling the supplier on a number already on file; (3) require a second approver for any change of bank details (segregation of duties); (4) hold payment until verified; (5) report the email to IT.\n\n**Marking:** attack named (2), four checks (4).\n\n**Common mistake:** replying to the email to \"confirm\". That goes to the attacker.\n<\/details>\n\n### Level 4 — Exam mastery\n\n**Q14.** \"Detection is no longer good enough. Focus must shift to prevention.\" Discuss this statement using at least four threats from the topic. (12 marks)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer outline:**\n1. *Position:* largely agree, but both are required.\n2. *Why detection alone fails:* speed. Ransomware encrypts files in minutes; DDoS is already causing downtime when detected; zero-day exploits have no signature, so signature-based detection misses them; APTs are designed to stay hidden for months.\n3. *What prevention adds:* patching (reduces unpatched-software risk), MFA and least privilege (limit account misuse), training (reduces phishing success), encryption (makes MitM and stolen data useless), segmentation and firewalls (reduce attack surface).\n4. *Counterpoint:* prevention is never complete. Zero-days and insiders get through, so detection, incident response and resilience (tested backups, DR plans) remain essential.\n5. *Notes' support:* the overview deck says sophisticated attacks are not detected by legacy approaches and calls for a consolidated cyber security architecture with deeper visibility.\n6. *Conclusion:* prevent first, detect and respond to limit the impact of what slips through.\n\n**Marking criteria:** position (1), four threats with reasoning (4), prevention examples (3), counterpoint (2), conclusion (2).\n\n**Common mistake:** listing threats without linking each to why detection is too slow.\n<\/details>\n\n**Q15.** A regional bank's customers report being unable to use mobile banking for two hours. At the same time, three customers report SMS codes not arriving and money leaving their accounts. A staff member later reports a strange email asking him to confirm a \"system update\". (a) Identify two separate attacks and the CIA goal each affects. (b) Say which attacker types may be behind each. (c) Recommend three measures. (12 marks)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer outline:**\n(a) *Attack 1:* DDoS or similar flood on the mobile app: **availability**. *Attack 2:* **SIM swap** leading to OTP interception and account takeover: **confidentiality** (credentials) and **integrity** (unauthorized transfers). The strange email is likely **phishing/spear phishing** that may be a way in for either, so it is a third indicator.\n(b) *Attacker types:* the DDoS may be hacktivists, cyber criminals (as cover or extortion) or organized crime; the SIM swap and takeover point to cyber criminals or organized crime. Say why: financial gain, coordinated skill.\n(c) *Measures:* DDoS protection and capacity planning (firewalls, traffic filtering); stronger authentication than SMS alone, plus alerts on SIM change and a delay on new-device transfers; staff phishing training and email reporting; incident response and monitoring; liaison with the mobile operator.\n\n**Marking criteria:** two attacks correctly named (2), CIA goals (2), attacker types with reason (3), three well-chosen measures (3), coherent link between the events (2).\n\n**Common mistake:** treating the three events as one attack, instead of separating them by the goal each affects.\n<\/details>\n\n\n---"};</script><script src="assets/app.js"></script><script src="assets/live.js"></script></html>
