implement, review). Configuration control is about the **state of the items**: identifying them, setting a baseline, controlling changes to them, recording their history and auditing them against documentation. A change should update the configuration records, and the configuration baseline lets you tell whether any change was made without going through the process.\n\n**Check:** one controls the process of change; the other controls the state of what changes.\n<\/details>\n\n**C6. Give an original example of a change that bypassed the change process and its likely consequence.**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nA developer, under pressure, edits the interest rate table in the live loan system on Friday evening without a request or approval. The new rate is wrong for one product. Over the weekend, customers are overcharged. Nobody knows who changed it, because there is no change record; the baseline still lists the old rate; the error takes days to find. Consequences: financial loss, customer complaints, regulatory risk and an audit finding for unauthorized change.\n\n**Check:** no approval, no test, no record, and no way to trace.\n<\/details>\n\n**C7. Which part of this topic would confuse someone seeing it for the first time?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\n(1) Governance vs management. (2) Five domains vs ten principles. (3) The four similar-looking audit/assessment sequences (governance assessment, governance audit, policy and control evaluation, management and operations audit): note that they share a pattern of objectives, evidence, evaluation, findings, communication and follow-up. (4) Change management vs configuration control.\n<\/details>\n\n---\n\n## PHASE 3 — ACTIVE RECALL BANK (Topic 5)\n\n### Level 1 — Basic recall\n\n**Q1.** Name the five domains of IT governance given by the IT Governance Institute of ISACA.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Strategic alignment, value delivery, risk management, resource management, performance management.\n\n**Marking:** one mark each.\n\n**Common mistake:** adding \"compliance\" or \"security\" as domains; they are not in the notes' five.\n<\/details>\n\n**Q2.** List five IT governance frameworks or standards mentioned in the notes.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Any five of: ISO 38500; COBIT; ITIL; Calder-Moir; the King reports (I to IV); business continuity management and disaster recovery; programme and project governance (PRINCE2, PMBOK).\n\n**Common mistake:** listing ISO 27001 here, which is an information security standard, not an IT governance framework in this list.\n<\/details>\n\n**Q3.** List the five stages of change management in order.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Request submission; assessment and approval; planning and scheduling; implementation (with testing and validation); review and closure.\n\n**Common mistake:** placing \"approval\" after \"implementation\".\n<\/details>\n\n**Q4.** List the five components of configuration control.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Configuration identification; configuration baseline; configuration change control; configuration status accounting; configuration auditing and verification.\n\n**Common mistake:** naming \"approval\" or \"testing\", which belong to change management.\n<\/details>\n\n**Q5.** State the five benefits of IT governance in the notes.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Demonstrate measurable results against business strategies and goals; meet legal and regulatory obligations; assure stakeholders they can trust IT services; increase the return on IT investment; comply with corporate governance or public rules.\n\n**Marking:** one mark each.\n\n**Common mistake:** writing generic benefits such as \"saves money\".\n<\/details>\n\n### Level 2 — Understanding\n\n**Q6.** Distinguish IT governance from IT management and operations. Give one activity of each.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** IT governance is the framework of processes, policies and decision-making structures guiding effective use of IT and getting value from it (activity: the steering committee prioritises projects against strategy). IT management and operations is the planning, implementation, maintenance and support of IT systems (activity: administering the network or running backups). Governance is direction and oversight; management is delivery.\n\n**Marking:** two definitions (2), two activities (2), contrast (1).\n\n**Common mistake:** saying governance is \"more technical\".\n<\/details>\n\n**Q7.** Explain why the notes call for KPIs when assessing IT governance, and give two examples.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** KPIs turn objectives into measurable targets so that effectiveness can be judged objectively and compared over time. Examples: percentage of IT projects with an approved business case (value delivery and alignment); percentage of high risks with a mitigation plan (risk management); budget variance (resource management); percentage of required compliance reviews completed (compliance).\n\n**Marking:** purpose (2), two examples tied to domains (2).\n\n**Common mistake:** giving activities (such as \"hold meetings\") instead of measures.\n<\/details>\n\n**Q8.** Compare \"assess compliance\", \"evaluate implementation\" and \"test controls\" in the notes' evaluation of IT policies, procedures and controls.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** *Assess compliance:* compare practice with internal policies, standards and laws, using compliance audits to find gaps. *Evaluate implementation:* check whether staff know and follow the policies in daily work, using documents, training records, configurations and incident reports. *Test controls:* run tests (vulnerability assessments, penetration testing, security audits, compliance reviews) to confirm controls actually work, and find weaknesses.\n\n**Marking:** three distinct descriptions (3), evidence or method for each (3).\n\n**Common mistake:** treating them as one activity.\n<\/details>\n\n**Q9.** Why is a baseline needed in configuration control?\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** A baseline is the approved reference configuration. It lets the organization compare the current state with the approved state, track changes over time and detect unauthorized or unrecorded changes. Without it, nobody can say what the \"correct\" configuration is or what changed.\n\n**Common mistake:** describing a baseline as a backup.\n<\/details>\n\n### Level 3 — Application\n\n**Q10.** The board of a bank approved a new mobile app without a business case, the IT steering committee met once last year, and the risk register was last updated three years ago. Identify which governance domains and principles are weak, and give one recommendation for each weakness.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:**\n- *No business case:* **value delivery** and **strategic alignment** are weak. Recommendation: no funding without an approved business case linked to the strategy.\n- *Steering committee met once:* **decision-making structures**, **transparency and accountability** and **stakeholder engagement** are weak. Recommendation: quarterly meetings with a charter, minuted decisions and user representation.\n- *Outdated risk register:* **risk management** is weak. Recommendation: assign an owner and review the register at least quarterly and at every major project.\n\n**Marking:** three weaknesses with the correct domain or principle (3), three recommendations (3).\n\n**Common mistake:** listing weaknesses without naming the domain or principle.\n<\/details>\n\n**Q11.** A change request to upgrade the loan system was approved by the requester's own manager, tested on the live system, and had no back-out plan. The upgrade failed and the system was down for 9 hours. Identify the control failures in the change process and what each failure caused.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:**\n- *Approval by the requester's own manager (not an independent CAB):* weak **assessment and approval**; risks were not independently evaluated.\n- *Testing on the live system:* weak **implementation and testing**; testing should have been done in a test environment first, so the failure hit production.\n- *No back-out plan:* weak **planning**; recovery was slow because there was no prepared way to reverse the change, which led to the 9-hour outage.\n- Possibly no **review** that would capture lessons.\nRecommendations: independent CAB approval, a test environment and documented test results, a mandatory back-out plan for every change, and post-implementation reviews.\n\n**Marking:** three failures (3), consequences (3), recommendations (2).\n\n**Common mistake:** blaming the vendor instead of the process.\n<\/details>\n\n**Q12.** Using the notes' evaluation steps, outline how you would audit a bank's IT policy, in order. Include one piece of evidence for each step. (CW2 area (a))\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** (1) Review documentation: obtain the policy; check Board approval, date of last review, scope and coverage of data security, access control, operations, development and incident response. (2) Assess compliance: compare it with regulation and good practice (for example, ISO 27001) and find gaps. (3) Evaluate implementation: interview staff, inspect training records and system configurations. (4) Examine controls: list technical, administrative and physical controls that implement the policy. (5) Test controls: sample configurations, run tests. (6) Assess change management for the policy: version history, approvals, communications. (7) Review incident response: past incidents and how the policy was applied. (8) Report findings and recommend continuous improvement.\n\n**Marking:** at least six steps in a sensible order (6), evidence for each (2).\n\n**Common mistake:** stopping at \"read the policy\".\n<\/details>\n\n### Level 4 — Exam mastery\n\n**Q13.** \"Good IT governance guarantees good IT management.\" Discuss. (10 marks)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer outline:**\n1. *Position:* governance makes good management more likely, but it does not guarantee it.\n2. *What governance provides:* direction (alignment), risk appetite, resource decisions, accountability and measurement. It tells management what is needed and checks results.\n3. *Why it is not a guarantee:* management still has to execute: configure systems correctly, run change control, back up data, support users. Weak execution can exist under good governance; for example, a well-approved project can fail from poor change control.\n4. *The reverse:* strong operations without governance can deliver efficiently the wrong things.\n5. *Role of audit and assessment:* the notes' governance audit and management audit check both layers; follow-up audits verify that fixes work.\n6. *Link to continuous improvement:* governance should react to what operations reveal (KPIs, incidents) and adjust.\n7. *Conclusion:* complementary; neither guarantees the other.\n\n**Marking criteria:** position (1), governance role (2), management execution (2), counterpoint (2), audit link (2), conclusion (1).\n\n**Common mistake:** treating the terms as synonyms.\n<\/details>\n\n**Q14.** You are auditing a bank's change management for CW2. Describe the audit procedures, the evidence you would collect, three possible findings and how you would write one of them using condition, criteria, cause, effect and recommendation. (12 marks)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer outline:**\n*Procedures:* obtain the change management policy and the change log for the period; select a sample of changes (include emergency and high-risk ones); for each, trace to the request, approval by the CAB, test evidence, back-out plan, implementation record and post-implementation review; compare production configuration with the baseline to find changes missing from the log; check that people who implemented changes had appropriate rights and were not also the approvers (segregation of duties).\n*Evidence:* policy, change log extract, approval records, test results, system logs, configuration exports, access lists.\n*Possible findings:* (1) changes implemented without approval; (2) no evidence of testing for emergency changes; (3) approver and implementer the same person.\n*Written finding (example for 1):*\n- *Condition:* 7 of 25 sampled changes had no CAB approval recorded.\n- *Criteria:* the change management policy requires CAB approval before implementation.\n- *Cause:* approvals were obtained by phone and not recorded; no enforcement in the change tool.\n- *Effect:* risk of unauthorized or untested changes, outages and fraud; inability to prove accountability.\n- *Recommendation:* enforce mandatory approval in the change tool; retrospective review of the 7 changes; owner: head of IT; timeline: 60 days.\n\n**Marking criteria:** procedures (3), evidence (2), three findings (3), well-structured written finding with all five elements (4).\n\n**Common mistake:** omitting the comparison of live configuration to the baseline, which is what finds changes that bypassed the log.\n<\/details>\n\n\n---"}, {"id": "t6", "t": "TOPIC 6 — IS Auditing Concepts", "s": "6 · IS Auditing Concepts", "g": "Topics", "c": "#059669", "k": "6", "md": "# TOPIC 6 — IS Auditing Concepts\n\n**Classification:** Foundation (definitions, objectives, types), Difficult/High-risk (risk analysis, threat-vulnerability-exposure chain, around/through the computer), Applied (audit process, tools)\n**Sources:** Topic 6 PDF handout (BBC3 ISA, Information Systems Audit Concepts); IS Auditing and Cybersecurity deck (Ssendi). 10 teaching hours, the second largest topic.\n**Coverage warning:** the notes cover the overview, objectives, types, benefits, risk analysis and the threat vocabulary well. They give only a **one-slide** treatment of standards and frameworks and a **four-step** audit process. **Audit planning detail, the techniques \"around\" and \"through\" the computer, and audit tools are not in your notes.** I explain them as Supplementary explanation.\n**Outline items:** (a) overview of information systems audit; (b) IS audit standards and frameworks; (c) IS audit planning and management; (d) techniques, methodologies, around and through the computer, controls (concept, objectives, types, risk); (e) auditing tools.\n\n## PHASE 1 — UNDERSTANDING\n\n### 6.1 The big picture\n\nAn **audit** is an independent check that compares what an organization actually does with a set of criteria it should meet. An **IS (information systems) audit** does that for the computer systems and the controls around them.\n\nThink of every earlier topic as the \"criteria side\": Topic 1 (CIA, ISMS), Topic 3 (policies and standards), Topic 4 (access, network, physical), Topic 5 (governance, change management). Topics 6 to 8 are the \"checking side\": how an auditor plans, tests, concludes and reports.\n\n**Where it connects.** Backward: threats and vulnerabilities (Topic 2) are the vocabulary of audit risk analysis. Forward: Topic 7 explains the controls the auditor tests; Topic 8 explains how to report; Topic 9 covers the legal and ethical rules; the Practical Lab shows how to test with Excel and IDEA.\n\n### 6.2 Key terms\n\n| Term | Meaning (notes unless marked) |\n|---|---|\n| Audit | A systematic process by which a competent, independent person objectively obtains and evaluates evidence about assertions to form an opinion on how far they conform to identified standards. Also: a systematic, objective examination that compares what the organization does to a defined set of criteria |\n| IS/IT audit | A systematic and independent examination of the information systems environment to ascertain that the computer system safeguards assets, maintains data integrity, allows organizational goals to be achieved effectively and uses resources efficiently |\n| Audit evidence | The information collected to support the auditor's conclusion |\n| Threat | The potential event that could exploit a vulnerability, exposing the entity to possible loss |\n| Vulnerability | A weakness in the system that can potentially be exploited by threats (in design, technology, implementation or any other aspect) |\n| Exposure | The extent of loss an entity is likely to face when a risk materialises, now or in the long run |\n| Likelihood | An estimate of the probability that the threat will attempt to exploit the vulnerability and succeed in causing loss |\n| Attack | The act of the threat seeking to exploit the vulnerability through a set of actions to compromise confidentiality, integrity and availability |\n| Effectiveness | Whether the system is achieving its objectives |\n| Efficiency | Using the minimum resources to achieve the objectives |\n| General controls review | A review of controls governing the development, operation, maintenance and security of application systems in an environment |\n| Application controls review | A review of the controls for a specific application: input, processing, output, and so on |\n| ISACA | Information Systems Audit and Control Association; issues guidelines for auditors |\n\n### 6.3 What an IS audit is, and how it differs from a financial audit\n\nAn IT audit \"encompasses review and evaluation of automated information processing systems, related non-automated processes and the interfaces among them\". It examines processes, IT assets and controls at multiple levels to determine how far the organization adheres to applicable standards or requirements. It may be done with a financial statement audit, an internal audit or another attestation engagement.\n\n| | **Financial statement audit** | **IS audit** |\n|---|---|---|\n| Main focus | Whether financial statements are fairly stated | **Risks relevant to information assets**, and the controls that reduce or mitigate them |\n| Typical forms | n/a | **General control review** or **specific control review** |\n\n**The three questions an IS audit answers (notes):**\n\n1. Will the computerised systems be available for the business at all times when required? (**Availability**)\n2. Will the information in the systems be disclosed only to authorised users? (**Confidentiality**)\n3. Will the information the system provides always be accurate, reliable and timely? (**Integrity**)\n\n### 6.4 Information systems concepts (needed to audit one)\n\n**System (notes):** an orderly arrangement of interrelated and interdependent elements that operate together to accomplish a common purpose.\n**Computer-based information system (notes):** a collection of **people, hardware, software, data and procedures** that interact to provide timely information to authorised people who need it.\n**Classification parameters:** elements; interactive behaviour; degree of human intervention; working/output.\n**General model of a system:** **input, process, output.**\n**Five IS components:** hardware, software, procedures, data, people/users.\n\n**The system environment (notes), made concrete with a bank's loan system:**\n\n| Concept | Notes' definition | In the loan system example |\n|---|---|---|\n| **System boundary** | All systems function in an environment of elements surrounding the system that often interact with it | What is inside \"the loan system\" vs outside it (customers, the credit bureau, regulators) |\n| **Subsystem** | A part of a larger system; each system is made of subsystems; the interconnections are **interfaces** at the boundary, taking the form of inputs and outputs | Application intake, credit scoring, disbursement, repayment tracking |\n| **Supra-system** | The entity formed by a system and other equivalent systems it interacts with | The bank's whole banking platform: loans, deposits, payments together |\n\n**Why this matters to an auditor:** the **interfaces** (where subsystems or systems exchange data) are where data can be lost or altered, so they need their own controls (Topic 7: interface controls).\n\n**Role in management (notes):** information reduces uncertainty about an event or situation. A good IS helps managers decide effectively and at the right time, gives competitive edge, produces ideas for solving problems, supports unusual situations, and can be integrated into strategy. This is why an audit's conclusion on the reliability of the system matters to the whole organization.\n\n### 6.5 Purpose and goals of an IS audit\n\n**Purpose (notes):** to evaluate the system's internal control design and effectiveness, including efficiency and security protocols, development processes and IT governance or oversight. It is an **ongoing process** of:\n\na) evaluating controls;\nb) suggesting security measures to safeguard assets and maintain data integrity;\nc) improving system effectiveness and efficiency to attain organizational goals.\n\nIS auditing considers all potential hazards and controls and focuses on operations, data, integrity, software applications, security, privacy, budgets and expenditure, cost control and productivity.\n\n**Three goals (notes):**\n\n**(a) Safeguarding IS assets.** Protect the IS assets by a system of internal controls: hardware, software, facilities, people, data, technology, documentation and supplies. The five asset classes:\n\n| Asset class | Meaning (notes) | Example |\n|---|---|---|\n| **Data** | Data objects in the widest sense: external and internal, structured and unstructured, graphics, sound, documentation | Customer records, scanned IDs |\n| **Application systems** | The sum of manual and programmed procedures | The loan application system and its manual approval steps |\n| **Technology** | Hardware, operating systems, DBMS, networking, multimedia | Servers, switches |\n| **Facilities** | Resources to house and support information systems, supplies | Data centre, power |\n| **People** | Staff skills, awareness and productivity to plan, organise, acquire, deliver, support and monitor | The IT team |\n\n**(b) Ensuring data integrity.** Safeguard information against unauthorised addition, deletion, modification or alteration, and maintain these **attributes**:\n\n| # | Attribute | Meaning (notes) |\n|---|---|---|\n| 1 | **Effectiveness** | Information is relevant and pertinent to the business process and delivered timely, correct, consistent and usable |\n| 2 | **Efficiency** | Information provided through optimal (most productive and economical) use of resources |\n| 3 | **Confidentiality** | Protection of sensitive information from unauthorised disclosure |\n| 4 | **Integrity** | Accuracy and completeness of information, and validity per the business's values and expectations |\n| 5 | **Availability** | Available when required by the business process; safeguarding of resources |\n| 6 | **Compliance** | Complying with laws, regulations and contractual arrangements |\n| 7 | **Reliability of information** | Systems give management appropriate information to operate, to report financially and to report compliance to regulators |\n| 8 | **Accuracy** | Data should be accurate; inaccurate data leads to wrong decisions |\n| 9 | **Completeness** | Data should be complete |\n\n> **Supplementary explanation.** The first seven are the information criteria used in the COBIT framework (which Topic 5 listed). The handout adds accuracy and completeness. For exams, give the nine as listed here, and group them as \"business criteria (effectiveness, efficiency), security criteria (confidentiality, integrity, availability) and trust criteria (compliance, reliability)\". Note that \"reliability\" and \"accuracy\" are not the same: reliability is about management being able to *use* the information for operations and reporting.\n\n**(c) Achieve organizational goals effectively and consume resources efficiently.** Auditors follow guidance from ISACA.\n\n### 6.6 The nine objectives of an IS audit (notes), with a concrete test for each\n\nIS audit evaluates the adequacy of security controls and informs management with conclusions and recommendations.\n\n| # | Objective (notes) | Concrete test (illustrative) |\n|---|---|---|\n| 1 | Ensure **adequacy and effectiveness of internal controls** | Compare the control design with the risk, then test that it works |\n| 2 | Ensure resources are allocated to IS **efficiently and effectively** | Review capacity and utilisation: are servers 5% or 95% used? |\n| 3 | Provide assurance that **systems-related assets are safeguarded** | Check the asset register against a physical count |\n| 4 | Ensure information is **accurate, available on request and reliable** | Recompute totals; test report generation |\n| 5 | Provide reasonable assurance that **errors, omissions and irregularities are prevented, detected, corrected and reported** | Test input validation and exception reports |\n| 6 | Review systems for **compliance** with policies, procedures, standards and legal requirements | Compare password settings with policy |\n| 7 | Review application and operation systems to ensure **user needs are met, compliance achieved, audit trails incorporated, documentation complete, data integrity and security maintained** | Check that transactions leave a log with user ID and time |\n| 8 | **Identify potential threats** to confidentiality, integrity and availability | Run a risk analysis (6.9) |\n| 9 | Ensure **management takes appropriate detective, corrective and preventive actions** | Follow up on past findings: were they fixed? |\n\n### 6.7 Categories and types of IS audits\n\n**Three categories (notes):**\n\n| Category | What it reviews | Example |\n|---|---|---|\n| **General controls review** | Controls governing the development, operation, maintenance and security of application systems in an environment: a data centre, an operating system, a security software tool, or procedures such as controlling production program changes | Review how changes are moved into production |\n| **Application controls review** | Controls for a specific application: **input, processing and output**; also data communications, program and data security, system change control and data quality | Review the controls in the loan application |\n| **System development review** | The development of a **new** application system: the process and the product; general controls over a new application, especially if a new platform is used | Review the build of a new mobile banking app before go-live |\n\n**Five types (notes) and four in the slide deck:**\n\n| Type | What it does | Slide deck example |\n|---|---|---|\n| **System audit** | Audits controls designed into the system to ensure data integrity and proper functioning | |\n| **Application audit** | Audits controls over an enterprise application, to ensure effectiveness, efficiency, confidentiality, availability, reliability and compliance | |\n| **Compliance audit** | Gives management a tool for internal review of compliance in operating units; each area may apply to particular units depending on activities, funding, regulation | Compliance audits (for example GDPR, HIPAA) |\n| **Security audit** | Provides comprehensive, cost-effective network vulnerability assessments: runs vulnerability tests, reports weaknesses, suggests remedies and preventive measures; supports ongoing testing | Security audits (evaluating access controls) |\n| **Performance audit** | Objective, systematic examination of evidence to give an independent assessment of the performance and management of a programme against objective criteria | Operational audits (for example system efficiency) |\n| *(slide deck only)* **Financial audit** | | Financial data integrity |\n\n**Examples of IS audits (slide deck):** healthcare, HIPAA compliance audit; banking, cybersecurity audit for fraud prevention; e-commerce, PCI DSS audit for protecting payment data.\n\n**Category vs type:** the **categories** (general, application, system development) say *what part of the environment* you review; the **types** (system, application, compliance, security, performance) say *the purpose or angle*. A security audit of the general controls is possible.\n\n### 6.8 Benefits of IS auditing (notes)\n\n| Benefit group | Examples |\n|---|---|\n| **Strategic** | Integrity of data produced by the organization; enhanced customer confidence |\n| **Operational** | Increased employee productivity and morale; integrity of data lets management decide accurately |\n| **Financial** | Increased hardware performance; reduced cost of theft of IS assets |\n| **Technical** | Management decisions on computer-processed data are reliable; business partners trust the organization's management control and distribution of sensitive data |\n\n**Memory aid:** **S-O-F-T**: Strategic, Operational, Financial, Technical.\n\n### 6.9 IS audit requirements\n\n#### 6.9.1 Risk analysis: why the auditor needs it\n\nThe auditor cannot test every control, so **prioritising** is critical. Prioritisation depends on the **loss exposure** if a specific control fails. Because the likelihood of a control failing (and being triggered) is uncertain, the auditor does a **risk analysis**.\n\n**Nine business risk factors (notes):**\n\n| # | Risk | Meaning (notes) | Example |\n|---|---|---|---|\n| a | **Access risk** | An unauthorised user secures access to information assets | A former employee's account still works |\n| b | **Business disruption risk** | Non-availability of services from IS resources | Core banking is down for a day |\n| c | **Credit risk** | A counterparty fails to honour a payment obligation | A borrower defaults |\n| d | **Customer service risk** | Customers are deprived of services | Mobile app outage |\n| e | **Data integrity risk** | Possible compromise of data integrity, including through unauthorised access | Interest rates altered in a table |\n| f | **Financial/external report misstatement risk** | Reports contain misstatements and errors | A wrong total in a regulatory return |\n| g | **Fraud risk** | Losses from fraud using IS resources | A clerk redirects payments |\n| h | **Legal and regulatory risk** | Non-compliance with law and consequences | Breach of data protection law |\n| i | **Physical harm risk** | Suffering bodily harm | Failure of a safety system controlled by software |\n\n#### 6.9.2 Threat, vulnerability, exposure, likelihood, attack: one chain\n\n**Notes' definitions:** threat (potential event that could exploit a vulnerability), vulnerability (weakness), exposure (extent of loss when a risk materialises), likelihood (probability the threat tries and succeeds), attack (the actions by which the threat exploits the vulnerability to compromise C, I or A).\n\n**Worked example, line by line (illustrative): a bank's mobile loan app.**\n\n1. **Vulnerability:** the app lets users reuse the same weak password and does not lock accounts after repeated failures. (Weakness in design/implementation.)\n2. **Threat:** a criminal who obtains lists of leaked passwords and may try them on the app.\n3. **Likelihood:** *High*. Leaked password lists are common and many customers reuse passwords. The safeguards (no lockout) are weak, which raises the likelihood of success.\n4. **Attack:** the criminal tries thousands of leaked credentials; some work; the criminal logs in and applies for loans in other people's names.\n5. **Exposure:** the loss if it succeeds: fraudulent loans, customer compensation, reputation loss, regulatory penalties. The notes say the loss may extend into the long run (for example loss of business or reputation).\n6. **Auditor's decision:** because likelihood and exposure are both high, **test the authentication controls first**.\n\n**Notes' point on vulnerability:** the level of vulnerability is often determined by the extent of the **safeguards** implemented. Finding vulnerabilities involves security evaluation: inspecting safeguards, testing their response and conducting penetration analysis.\n\n#### 6.9.3 Prioritising controls to test (illustrative)\n\nThe auditor scores each control area for **exposure** (impact if it fails) and **likelihood** of failure, each 1 to 3, and tests highest first.\n\n| Control area | Exposure (1 to 3) | Likelihood of failure (1 to 3) | Priority = E × L |\n|---|---|---|---|\n| User access and leavers | 3 | 3 | **9** |\n| Change management | 3 | 2 | **6** |\n| Backup and restore | 3 | 2 | **6** |\n| Visitor logbook | 1 | 2 | **2** |\n\nReading it line by line: user access has high exposure and the highest chance of failing, so it is tested first and most thoroughly; the visitor logbook has low exposure so it gets a light check.\n\nThis is the **risk-based auditing approach** from the slide deck: it **identifies risks in IT systems** and **focuses on mitigating internal and external risks**. The deck's example is auditing financial institutions for phishing risks and fraud prevention.\n\n#### 6.9.4 Information system control objectives\n\nInformation assets have value and must be protected. Information security has three characteristics:\n\n- **Confidentiality:** accessibility only to those authorised.\n- **Integrity:** information accurate and complete throughout **input, processing and output**.\n- **Availability:** need-based access for all authorised users.\n\nThe use of IS assets and related processes, computerised or manual, must be governed by an **internal control system**. (Control objectives are discussed in Topic 7.)\n\n#### 6.9.5 System effectiveness and efficiency\n\n| | **Effectiveness** | **Efficiency** |\n|---|---|---|\n| Question | Is the system achieving its objectives? Should it be continued, modified, upgraded or scrapped? | Does it use the minimum resources (machine time, peripherals, system software, application software, human resources) to achieve them? |\n| When | May be done at the design stage to check user needs and implementation objectives | During operation |\n| Example | Loan approvals are still taking 10 days even though the system was meant to cut it to 2 | The system needs 12 staff to run a process that was designed for 4 |\n\n#### 6.9.6 Information systems abuse (six forms, notes)\n\n| # | Form | Meaning (notes) | Example |\n|---|---|---|---|\n| 1 | **Destruction of assets** | Hardware, software, network, data, facilities, documents destroyed | Deleting a database |\n| 2 | **Theft of assets** | Illegal removal of hardware, software, data, documentation or peripherals | Stealing a laptop |\n| 3 | **Modification of assets** | Unauthorised access and modification may lead to unknown incompatibility and compromise functionality | Changing a program without approval |\n| 4 | **Privacy violation** | Privacy of data about a person or organization compromised; far-reaching impact including loss of business | Leak of customer data |\n| 5 | **Disruption of operations** | Day-to-day IS operations disturbed, at the extreme the whole system | A flood of requests halting the system |\n| 6 | **Unauthorised use of assets** | Hardware, software, data or supplies used for unauthorised purposes causing losses | Staff running a private business on company servers |\n\n#### 6.9.7 Asset safeguarding objective and process (four areas, notes)\n\nThe main problem is **identifying** the assets, especially because many are **intangible**. The process has four areas:\n\n| # | Area | What it does |\n|---|---|---|\n| a | **Compile a functional IT asset list** | The starting inventory |\n| b | **IT systems detailing** | Names of hardware, software, network platform, applications with vendor details, installation location, year of installation, major upgrade history |\n| c | **Asset safeguarding** | Whether IS assets could be or have been used for unauthorised purposes, and the consequent losses |\n| d | **Assigning probabilities** | Assign probabilities to different losses arising from failure or compromise of safeguarding mechanisms |\n\n#### 6.9.8 Evidence collection and evaluation\n\nThe notes make one key point: auditors must **interact with the system to collect the evidence** of the existence and efficiency of internal controls. Section 6.13 explains the types of evidence in more detail.\n\n\n### 6.10 Systems environment and the IS audit: nine issues (notes)\n\nComputerisation helps organizations serve customers better and use resources optimally. To make sure it meets existing and emerging needs, nine issues must be considered, and each one raises the importance of an IS audit.\n\n| # | Issue (notes) | Why it matters to the audit | Concrete example |\n|---|---|---|---|\n| 1 | **Standardisation** of hardware, OS, system software and applications | Without it, technology management becomes complex; several systems are involved in one process instead of an integrated one, duplicating functions | Three different loan systems across branches |\n| 2 | **Software that facilitates interconnectivity** of systems | Intensifies the need for audit to ensure information flows smoothly and is not compromised | Interface between mobile money gateway and core banking |\n| 3 | **Need for high levels of security** | Needs technical competence and continuous testing, and a search for new vulnerabilities | Regular vulnerability assessments |\n| 4 | **Communication and networking** | Enables central databases and distributed processing but exposes the entity to breaches from multiple sources, so audit scope enlarges and testing becomes more complex | Branch networks linked to head office |\n| 5 | **Periodic upgrades and migration** | Audit must keep pace with technology and with the maturity of the organization; a more mature organization entrusts more critical resources to the system and becomes more susceptible to breach | Migrating to a new core banking system |\n| 6 | **Business process reengineering** | Evolution of business complexity enlarges the role of IS; reengineering challenges smooth migration and data integrity | Moving a paper loan process online |\n| 7 | **Human relations in a computerised environment** | Perhaps the greatest challenge: people are unpredictable but indispensable and define project success; assessing the adequacy of controls over people is difficult and subjective | Staff resisting a new procedure |\n| 8 | **Sharing of technology experiences** | Sharing between organizations and levels prevents repeating mistakes; the auditor's comfort is greater where internal learning exists | Lessons-learned reviews after incidents |\n| 9 | **Credit/debit cards and e-commerce** | Increased use needs closer monitoring and assurance that access and security aspects are well laid out | Card payment channels |\n\n**Exam tip:** the question \"why has computerisation increased the importance of IS audit?\" is answered with this list. Pick five and give a one-line reason for each.\n\n### 6.11 IS audit standards and frameworks\n\n**What the notes say.** The slide deck lists three: **COBIT** (IT governance framework), **ISO/IEC 27001** (information security management), **NIST** (cybersecurity risk management framework). The handout adds that guidelines are available from **ISACA**.\n\n**How an auditor uses them:** as the **criteria**, the \"defined set of criteria or requirements\" that the audit definition says the organization is compared against.\n\n| Standard or framework | What it is | Use in an audit (illustrative) |\n|---|---|---|\n| **COBIT** | IT governance framework (Topic 5) | Criteria for governance, risk and control objectives over IT |\n| **ISO/IEC 27001** | ISMS standard (Topics 1 and 3) | Criteria for an ISMS and its controls |\n| **NIST (for example the Cybersecurity Framework)** | Cybersecurity risk management framework (Topic 3) | Criteria for cybersecurity maturity and gaps |\n| **ISACA guidelines** | Guidance for IS auditors | How to plan, perform and report the audit |\n\n> **Supplementary explanation: standards for the audit itself.** There is a difference between the standards you audit **against** (COBIT, ISO 27001, NIST, the organization's own policies and the law) and the standards that govern **how the auditor works**. ISACA publishes IS audit and assurance standards, guidelines and a professional practices framework (ITAF), and a code of professional ethics (Topic 9). Internal auditors also work under the Institute of Internal Auditors' standards, and ISO 19011 gives guidelines for auditing management systems. The notes name only ISACA; your lecturer may cover others in class.\n\n### 6.12 IS audit planning, management and the audit process\n\n#### 6.12.1 The audit process (slide deck)\n\n| Step | What happens (deck) | Concrete example |\n|---|---|---|\n| **1. Planning** | Define scope and objectives | \"Assess access controls in the core banking system for the year to 30 June\" |\n| **2. Gathering information** | Review logs, policies and documents | Collect the access policy, user list, leavers report, system logs |\n| **3. Evaluating controls** | Assess the effectiveness of current security measures | Test whether leavers' accounts were disabled |\n| **4. Reporting findings** | Present recommendations for improvement | Report: 12 leaver accounts active; recommend automated revocation |\n\n> **Supplementary explanation: planning in more detail.** The outline lists \"IS auditing planning and management\" but your notes give only the four steps above. A fuller view, widely used in practice:\n>\n> **Planning an engagement**\n> 1. **Obtain authority and agree terms:** an audit charter or engagement letter states purpose, authority, scope and independence.\n> 2. **Understand the entity:** business, systems, past incidents, earlier audit reports.\n> 3. **Perform a preliminary risk assessment** (6.9) to decide where to focus.\n> 4. **Set objectives, scope and criteria:** what is in and out, which period, which standards.\n> 5. **Design the audit programme:** for each objective, list the control, the test procedure, the evidence needed, who does it and when.\n> 6. **Plan resources and timeline:** staff skills (including technical), tools, dates.\n> 7. **Communicate the plan to the auditee.**\n>\n> **Managing an engagement:** supervise the team; record all work in **working papers**; review them for quality; maintain **independence** (the auditor should not audit their own work); handle findings with the auditee; report; and **follow up** later. At organization level, internal audit prepares a **risk-based annual plan** by listing the systems and processes that could be audited (the audit universe) and ranking them by risk.\n\n**Worked example: a small audit programme extract (illustrative).**\n\n| Objective | Control to test | Test procedure | Evidence | Working paper ref |\n|---|---|---|---|---|\n| Only authorised people can access core banking | Leavers' accounts disabled within 1 day | Take HR leavers list for the year; match each name to the user list; check disable date | HR list, system user export | WP A1 |\n| Changes are authorised | Every production change has CAB approval | Sample 25 changes from the change log; trace to approval record | Change log, approvals | WP C2 |\n| Data is available after failure | Backups can be restored | Observe a restore of last night's backup | Restore log | WP D1 |\n\n#### 6.12.2 Sampling (supplementary)\n\nAuditors seldom test every item; they **sample**. *Judgemental* sampling uses the auditor's judgement on risk (for example, all emergency changes). *Statistical* sampling selects at random and lets the auditor measure the confidence in the result.\n\n**Worked example (illustrative).** Population: 400 production changes. Sample: 25. Exceptions found (no approval recorded): 3.\n- Deviation rate = 3 ÷ 25 = **12%**.\n- The auditor had decided that up to **5%** is tolerable.\n- 12% > 5%, so the control is **not operating effectively**, and the auditor reports a finding.\n(Where records are electronic, tools such as Excel and IDEA can test **all 400** instead of a sample, which is covered in the Practical Lab.)\n\n### 6.13 Audit evidence and its evaluation (supplementary)\n\n**Audit evidence** is the information the auditor uses to support the conclusion. It should be **sufficient** (enough of it) and **appropriate** (relevant and reliable).\n\n| Technique | What the auditor does | Example |\n|---|---|---|\n| **Inspection** | Examine records, documents or assets | Read the signed approval form |\n| **Observation** | Watch a process being performed | Watch staff lock the server room |\n| **Inquiry** | Ask knowledgeable people | Interview the system administrator |\n| **Confirmation** | Obtain direct confirmation from an independent party | Ask the vendor to confirm the patch level |\n| **Re-performance** | Repeat the control independently | Re-run the reconciliation |\n| **Recomputation** | Recalculate figures | Recompute interest on 50 accounts |\n| **Analytical procedures** | Compare data and look for unusual patterns | Compare monthly fee income to previous months |\n\n**Reliability rules of thumb:** evidence from an independent external source is more reliable than internal; evidence the auditor obtains directly is more reliable than information the auditee supplies; original documents are more reliable than copies; system-generated reports are more reliable than manual ones; **inquiry alone is the weakest** and should be supported by other evidence.\n\n### 6.14 Techniques and methodologies: around, through and with the computer (supplementary)\n\nThe outline lists \"around\" and \"through\" the computer. There are three common approaches.\n\n| Approach | What the auditor does | When it is suitable | Weakness |\n|---|---|---|---|\n| **Auditing around the computer** | Treats the system as a **black box**: compares **inputs** with **outputs**, without testing the internal processing | The system is simple, and source documents and output listings are available to trace transactions | Does not prove the processing logic is correct; poor where the audit trail is weak |\n| **Auditing through the computer** | Tests the **internal processing logic and controls** directly: for example **test data**, reviewing program logic, parallel simulation, embedded audit modules | Complex systems with little visible audit trail, or where controls are programmed | Needs technical skill; takes longer |\n| **Auditing with the computer** | Uses the computer as the audit **tool** to analyse the entity's data (generalised audit software such as IDEA, spreadsheets such as Excel) | Large volumes of data; testing 100% rather than a sample | Needs reliable data and correct extraction |\n\n**Worked example: auditing payroll three ways (illustrative).**\n\n*Around the computer.* Take 30 employee time sheets (input), find each person in the payroll register (output) and check that hours and pay agree. If all 30 match, the auditor concludes the output is consistent with the input. **But** the auditor never tested how the computer works out overtime.\n\n*Through the computer.* Prepare test records: Employee A with 40 hours (no overtime), Employee B with 48 hours (8 overtime hours), and Employee C with an invalid employee ID. Process them in a test copy of the system. Expected: A paid 40 hours; B paid 40 plus 8 at the overtime rate; C **rejected**. If C is accepted, the validation control is not working.\n\n*With the computer.* Load the full payroll file of 2,000 employees into Excel or IDEA. Recalculate gross pay for every line. Find duplicate employee IDs, payments to employees with no HR record, and amounts above a threshold. This examines **100%** of the data.\n\n**Which finds what?** *Around* proves input and output agree; *through* proves the **processing** and **controls** work; *with* analyses **all** the data for anomalies. A strong audit often combines them.\n\n### 6.15 Cybersecurity in IS auditing (slide deck)\n\nThe deck links IS auditing and cybersecurity: **cybersecurity** protects systems and networks from cyber threats and is critical to maintaining the confidentiality, integrity and availability of data; the auditor **evaluates the effectiveness of security measures**.\n\n| Common cyber threats (deck) | Key cybersecurity controls (deck) |\n|---|---|\n| **Phishing:** deceptive emails trick users | **Access control:** limit access to authorised users |\n| **Malware:** malicious software disrupts systems | **Encryption:** protect data in transit and at rest |\n| **DoS attacks:** flooding systems to cause downtime | **Firewalls:** block unauthorised network access |\n| **Insider threats:** misuse of access by employees | **Incident response plans:** procedures to follow in a breach |\n\n**Key takeaways (deck):** IS auditing ensures the reliability and security of IT systems; cybersecurity is essential in protecting systems from internal and external threats; auditors identify risks, assess controls and recommend improvements.\n\n### 6.16 Auditing tools (supplementary)\n\nThe outline lists \"auditing tools\"; your notes do not. In practice tools are grouped as **computer-assisted audit techniques (CAATs)** and supporting tools. The Practical Lab shows how to use the first two in detail.\n\n| Tool group | What it does | Examples |\n|---|---|---|\n| **Spreadsheets** | Sort, filter, recompute, compare lists, summarise | Microsoft Excel |\n| **Generalised audit software** | Imports data from many systems and runs standard tests (duplicates, gaps, summarisation, stratification, joins, sampling) | CaseWare IDEA, ACL |\n| **Test data and integrated test facility** | Feeds known test transactions through the system to see how it processes them | Test records, a dummy branch inside the live system |\n| **Embedded audit modules** | Code inside the application that records selected transactions for the auditor | Flags all payments above a limit |\n| **Vulnerability scanners and penetration testing tools** | Find known weaknesses and test whether they can be exploited (used under written authority) | Network and web vulnerability scanners |\n| **Network analysers and log analysis tools** | Examine traffic and logs for unusual activity | Log analysers |\n| **Documentation and working paper tools** | Record evidence and conclusions | Working paper templates |\n\n**A caution:** CAATs are only as good as the **data** loaded into them. The auditor must confirm the file is **complete** (control totals agree to the source system) and **accurate** before relying on results.\n\n### 6.17 Text diagrams\n\n**The IS audit life cycle**\n\n```\n PLAN ----> GATHER INFORMATION ----> EVALUATE / TEST CONTROLS ----> REPORT ----> FOLLOW UP\n  |              |                           |                          |            |\n scope,        policies, logs,          test design & operation,    findings,     were fixes\n objectives,   documents,               sample or 100% with         recommend-    made and\n risk          inquiry                  CAATs, evidence             ations        effective?\n```\n\n**From risk to test**\n\n```\n Risk factor (e.g., access risk)\n     -> Control that addresses it (e.g., leaver account removal)\n         -> Test procedure (match HR leavers list to user list)\n             -> Evidence (lists, system export)\n                 -> Conclusion (effective / exceptions found)\n```\n\n### 6.18 Common misconceptions and exam traps\n\n| Trap | Truth |\n|---|---|\n| \"An IS audit and a financial audit are the same\" | An IS audit focuses on risks to information assets and the controls over them (general or specific control review). |\n| \"General controls review and application controls review are the same\" | General controls cover the environment (development, operation, maintenance, security); application controls cover a specific system's input, processing and output. |\n| \"A threat, a vulnerability and an exposure are interchangeable\" | Threat = potential event; vulnerability = weakness; exposure = extent of loss; likelihood = probability; attack = the exploitation. |\n| \"Effectiveness and efficiency mean the same\" | Effectiveness: achieving objectives. Efficiency: using minimum resources. |\n| \"Auditors test everything\" | They prioritise by risk and exposure and usually sample (or test 100% with tools). |\n| \"The audit ends with the report\" | Follow-up to see whether recommendations were implemented is part of the process (objective 9). |\n| \"Auditing around the computer tests the program\" | It compares inputs with outputs and does not test the processing. |\n| \"Inquiry is enough evidence\" | Inquiry is the weakest evidence; corroborate it. |\n| \"Any IS audit is a security audit\" | A security audit is one type, focusing on vulnerability assessment. |\n| \"Data integrity means only accuracy\" | In the notes it covers unauthorised addition, deletion, modification or alteration, and nine attributes. |\n\n### 6.19 Checklist: planning and judging any audit task\n\n1. **Criteria?** Which policy, standard or law are we comparing against?\n2. **Risk and exposure?** What happens if this control fails, and how likely is that?\n3. **Which category and type of audit?** General, application or system development; system, application, compliance, security or performance.\n4. **What evidence?** Sufficient and appropriate, and how reliable is the source?\n5. **Which technique?** Around, through, with the computer, or a combination?\n6. **How will it be recorded and reported?** Working paper, finding, recommendation, follow-up.\n\n### 6.20 Revision summary (Topic 6)\n\n- Audit = systematic, independent, objective evaluation of evidence against criteria. IS audit = examination of the IS environment to confirm it safeguards assets, maintains data integrity, achieves goals effectively and uses resources efficiently.\n- IS audit answers three questions: availability, confidentiality, integrity.\n- IS components: hardware, software, procedures, data, people. Environment: system boundary, subsystem, supra-system. General model: input, process, output.\n- Goals: safeguard IS assets (data, application systems, technology, facilities, people); ensure data integrity (nine attributes); achieve organizational goals effectively and efficiently.\n- Nine audit objectives, from internal control adequacy to management action.\n- Categories: general controls review, application controls review, system development review. Types: system, application, compliance, security, performance audits.\n- Benefits: strategic, operational, financial, technical.\n- Risk analysis: nine risk factors; threat, vulnerability, exposure, likelihood, attack; prioritise controls by exposure and likelihood; risk-based approach.\n- Six forms of IS abuse; four areas of asset safeguarding.\n- Nine computerised environment issues.\n- Standards/frameworks (as criteria): COBIT, ISO/IEC 27001, NIST; ISACA guidelines.\n- Audit process: planning, gathering information, evaluating controls, reporting findings; plus follow-up.\n- Supplementary: evidence types, sampling, around/through/with the computer, CAATs.\n\n\n---\n\n## PHASE 2 — COMPREHENSION CHECKS (Topic 6)\n\n**C1. Explain, in your own words, what an IS audit is and why an organization needs it.**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nAn IS audit is an independent, systematic check of the computer systems and the controls around them, comparing what actually happens with what should happen (the criteria, such as policies, standards and law). Organizations need it because managers rely on systems for decisions, money and customer service, and they cannot be sure the systems safeguard assets, keep data accurate, achieve goals and use resources well unless someone independent tests them and reports. It gives management and stakeholders assurance, and it exposes weaknesses before an attacker or a failure does.\n\n**Check:** independent, systematic, criteria, assurance.\n<\/details>\n\n**C2. Why does the auditor need to prioritise controls to test? What would happen if every control were tested equally?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nTime and resources are limited, and controls differ in how much loss follows if they fail. If every control were tested equally, the auditor would spend as much effort on a visitor logbook as on user access to core banking. The important weaknesses might get too little testing, and the audit might miss serious risks. Prioritising by exposure and likelihood puts effort where failure would hurt most.\n\n**Check:** limited resources, different risk levels, focus on high exposure and likelihood.\n<\/details>\n\n**C3. What is the difference between a threat, a vulnerability and an exposure? Use one example that ties them together.**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\n*Example: a clinic's patient database.* The **vulnerability** is that it has no lockout after failed logins. The **threat** is a criminal with leaked passwords who could exploit that weakness. The **exposure** is the loss if it succeeds: exposure of patient records, legal penalties, loss of trust. Likelihood is how probable it is that the criminal tries and succeeds; the attack is the actual attempt.\n\n**Check:** weakness, potential event, extent of loss.\n<\/details>\n\n**C4. Why is auditing \"around the computer\" not enough for a system with complex programmed controls?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nBecause it only compares inputs with outputs and treats the system as a black box. If the inputs and outputs happen to agree, the auditor learns nothing about whether the processing and programmed controls work in all cases. For example, the sample may not contain a case that would trigger an error, and a control that should reject invalid data may never have been tested. Auditing *through* the computer, with test data, tests the logic directly.\n\n**Check:** black box vs testing the processing.\n<\/details>\n\n**C5. How do the audit objectives relate to the audit's three questions of availability, confidentiality and integrity?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nThe three questions are the core of what IS audit protects. The nine objectives spell out how to achieve this: for example objective 3 (assets safeguarded) and objective 8 (identifying threats) relate to all three; objective 4 (information accurate, available on request, reliable) relates to integrity and availability; objective 6 (compliance) and objective 7 (security maintained) relate to confidentiality and integrity. Objectives 1, 5 and 9 relate to controls and management actions that keep all three working.\n\n**Check:** objectives are the detailed form of the CIA questions plus governance elements.\n<\/details>\n\n**C6. Give an original example of auditing \"with the computer\" and explain what it can do that a sample cannot.**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\n*Example:* load the full list of supplier payments for the year into Excel or IDEA and test for duplicate invoice numbers, payments to suppliers not on the approved list, and payments just below the approval limit. A sample of 30 payments out of 20,000 might miss the three duplicates among them. Testing all 20,000 finds every duplicate and shows the full pattern.\n\n**Check:** 100% coverage rather than a sample.\n<\/details>\n\n**C7. Which part of this topic would confuse someone seeing it for the first time?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\n(1) Categories (general, application, system development) vs types (system, application, compliance, security, performance). (2) The threat, vulnerability, exposure, likelihood and attack vocabulary. (3) Effectiveness vs efficiency. (4) Around vs through vs with the computer. (5) The nine objectives and nine attributes, which look alike: objectives say what the audit must achieve; attributes are the qualities of information the audit protects.\n<\/details>\n\n---\n\n## PHASE 3 — ACTIVE RECALL BANK (Topic 6)\n\n### Level 1 — Basic recall\n\n**Q1.** Define an IS (or IT) audit using the handout's definition.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** A systematic and independent examination of the information systems environment to ascertain that the computer system safeguards assets, maintains data integrity, allows organizational goals to be achieved effectively and uses resources efficiently. (Also: an examination of the controls within an entity's IT infrastructure.)\n\n**Marking:** systematic and independent (1), the four purposes (4).\n\n**Common mistake:** defining it as \"checking computers for viruses\".\n<\/details>\n\n**Q2.** Name the three categories and five types of IS audit in the handout.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** *Categories:* general controls review; application controls review; system development review. *Types:* system audits; application audits; compliance audits; security audits; performance audits.\n\n**Common mistake:** mixing categories and types.\n<\/details>\n\n**Q3.** Define threat, vulnerability, exposure, likelihood and attack as in the handout.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Threat: the potential event that could exploit a vulnerability, leading to possible loss. Vulnerability: a weakness in the system that can potentially be exploited. Exposure: the extent of loss an entity is likely to face when a risk materialises. Likelihood: an estimate of the probability that the threat will attempt to exploit the vulnerability and succeed in causing loss. Attack: the act of the threat seeking to exploit the vulnerability through a set of actions to compromise confidentiality, integrity and availability.\n\n**Marking:** one mark each.\n\n**Common mistake:** defining exposure as \"the chance of attack\"; that is likelihood.\n<\/details>\n\n**Q4.** List any six of the nine objectives of an IS audit.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Any six of: adequacy and effectiveness of internal controls; efficient and effective allocation of resources; assurance that assets are safeguarded; information accurate, available and reliable; errors, omissions and irregularities prevented, detected, corrected and reported; compliance with policies, procedures, standards and law; applications and operations meet user needs, with audit trails, documentation, integrity and security; identification of threats to confidentiality, integrity and availability; management takes detective, corrective and preventive actions.\n\n**Common mistake:** listing audit steps (planning, reporting) instead of objectives.\n<\/details>\n\n**Q5.** List the nine business risk factors in the handout (any six).\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Access risk; business disruption risk; credit risk; customer service risk; data integrity risk; financial/external report misstatement risk; fraud risk; legal and regulatory risk; physical harm risk.\n\n**Common mistake:** adding \"malware risk\" or \"cyber risk\", which are not in the list.\n<\/details>\n\n**Q6.** Name the five IS components and the three parts of the IS environment.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** *Components:* hardware, software, procedures, data, people/users. *Environment:* system boundary, subsystem, supra-system.\n\n**Common mistake:** replacing \"procedures\" with \"network\".\n<\/details>\n\n### Level 2 — Understanding\n\n**Q7.** Distinguish an IS audit from a financial statement audit.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** A financial statement audit focuses on whether the financial statements are fairly stated. An IS audit focuses on risks relevant to information assets and on assessing the controls that reduce or mitigate those risks, answering whether systems will be available, information confidential and information accurate, reliable and timely. An IS audit may take the form of a general control review or a specific control review, and may be done together with a financial audit.\n\n**Marking:** two foci (2), the three questions (2), forms (1).\n\n**Common mistake:** claiming an IS audit \"has nothing to do with finance\". It often supports the financial audit.\n<\/details>\n\n**Q8.** Explain the difference between a general controls review and an application controls review, with an example of each.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** A general controls review looks at the controls governing the development, operation, maintenance and security of application systems in an environment (example: reviewing the procedure for moving program changes into production, or the data centre). An application controls review looks at the controls for one specific application, such as input, processing and output controls, data security and data quality (example: testing the validation checks in the loan application).\n\n**Common mistake:** saying general controls apply \"to the general public\".\n<\/details>\n\n**Q9.** Explain the difference between effectiveness and efficiency, using an example.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Effectiveness is whether the system achieves its objectives (and whether to continue, modify, upgrade or scrap it). Efficiency is using the minimum resources to achieve them. Example: a loan system that approves loans accurately in 2 days meets its objective (effective) but needs 12 staff to run when 4 should suffice (inefficient).\n\n**Marking:** two definitions (2), example showing both (2).\n\n**Common mistake:** treating them as synonyms for \"good\".\n<\/details>\n\n**Q10.** Explain the difference between auditing around and through the computer.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Around: treats the system as a black box and compares inputs with outputs without testing processing; suitable for simple systems with a visible audit trail. Through: tests the internal processing logic and controls directly, for example with test data or a review of program logic; needed when controls are programmed and the audit trail is weak. (Supplementary content.)\n\n**Common mistake:** saying \"through\" means going through the printouts.\n<\/details>\n\n### Level 3 — Application\n\n**Q11.** An auditor is considering four control areas: (A) user access and leavers: exposure 3, likelihood of failure 3; (B) backup and restore: exposure 3, likelihood 2; (C) change management: exposure 2, likelihood 3; (D) visitor logbook: exposure 1, likelihood 1. Compute the priority score (exposure × likelihood), rank them and say what extra effort each rank deserves.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** A = 3 × 3 = 9; B = 3 × 2 = 6; C = 2 × 3 = 6; D = 1 × 1 = 1. Rank: A first; B and C tied; D last. A deserves the most extensive testing (probably 100% of leavers using a tool). B and C deserve substantial testing (restore observation; sample of changes), and for the tie the auditor may choose B first because exposure is higher. D needs only a light check or none.\n\n**Marking:** four scores (4), ranking (1), effort reasoning (2), tie-break (1).\n\n**Common mistake:** adding exposure and likelihood.\n<\/details>\n\n**Q12.** Classify each audit by category and type: (a) a review of how program changes are moved into production; (b) a review of a new mobile app before go-live; (c) a test of whether the bank complies with the data protection law; (d) a vulnerability assessment of the bank's network.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** (a) General controls review; a system audit. (b) System development review. (c) Compliance audit (the category depends on scope; typically general controls). (d) Security audit (general controls).\n\n**Marking:** one mark per correct classification; accept reasoned alternatives for the second label.\n\n**Common mistake:** calling (a) an application controls review.\n<\/details>\n\n**Q13.** A payroll file of 2,000 employees must be audited. Describe how you would audit it around, through and with the computer, and say what each approach would and would not prove.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** *Around:* trace a sample of time sheets to the payroll register; proves input and output agree for the sample, not that processing is correct. *Through:* submit test records (no overtime, overtime, invalid ID) to a test copy of the system and check that the pay is computed correctly and the invalid ID is rejected; proves the processing and validation logic. *With:* load the full file into Excel or IDEA, recompute pay for all 2,000 lines, find duplicates and employees missing from HR records; proves results for 100% of the data, but only if the data extract is complete and accurate.\n\n**Marking:** three approaches (3), what each proves (3), limitation (1).\n\n**Common mistake:** saying \"with the computer\" does not need to check the data's completeness.\n<\/details>\n\n**Q14.** An auditor samples 40 of 600 system access requests and finds 6 without manager approval. The auditor's tolerable deviation rate is 5%. Compute the deviation rate, state the conclusion and suggest two follow-up actions.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Deviation rate = 6 ÷ 40 = 15%. This exceeds the tolerable 5%, so the control is not operating effectively. Follow-up: (1) report a finding with the effect (users may have inappropriate access); (2) extend testing to all 600 requests using a tool, or ask management to review the 6 exceptions and the process; recommend that the access system block activation without recorded approval.\n\n**Marking:** calculation (1), comparison (1), conclusion (1), two actions (2).\n\n**Common mistake:** dividing by 600 instead of the sample size of 40.\n<\/details>\n\n### Level 4 — Exam mastery\n\n**Q15.** \"With modern tools, IS auditors should test 100% of the data instead of sampling.\" Discuss. (10 marks)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer outline:**\n1. *Position:* testing all the data is often better where data is electronic and tools exist, but not always possible or sufficient.\n2. *Advantages:* a sample can miss rare but serious items (duplicates, fraud); a full test finds every exception and patterns (for example, repeated payments just under an approval limit); it is repeatable and quick once built.\n3. *Limits:* it needs complete and accurate data; if the extract is wrong, results mislead; it only tests what is in the data (it cannot check physical controls, approvals not recorded, or staff behaviour); it needs skills; and tools identify exceptions that still need human investigation.\n4. *Where sampling still fits:* manual or paper controls, observation of procedures, interviews, testing of processes without data trails.\n5. *Evidence view:* the best audit combines techniques so that evidence is sufficient and appropriate.\n6. *Link to the notes:* the audit must still follow risk-based prioritisation and gather evidence by interacting with the system.\n7. *Conclusion:* test 100% where data and tools allow, and use sampling and other techniques elsewhere.\n\n**Marking criteria:** position (1), advantages (2), limits (3), where sampling fits (2), conclusion (2).\n\n**Common mistake:** arguing that tools replace the auditor's judgement.\n<\/details>\n\n**Q16.** You are planning an IS audit of BBCBank's user access controls (CW2 area (f)). Produce the plan: objective, criteria, risks, four test procedures with the technique used (around, through or with), the evidence and one possible finding written in condition, criteria, cause, effect and recommendation form. (14 marks)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer outline:**\n*Objective:* assess whether access to core banking is granted, changed and removed only with authority, and whether segregation of duties is maintained.\n*Criteria:* the bank's access control policy, ICT security standard, good practice such as ISO/IEC 27001 access control requirements, regulatory expectations.\n*Risks:* access risk (unauthorised access), fraud risk (conflicting duties), data integrity risk, legal and regulatory risk. Exposure: high; likelihood: high where leavers are common.\n*Test procedures:*\n1. **Leavers:** match the HR leavers list to the user list and check disable dates. *With the computer* (100%).\n2. **Joiners and movers:** sample access requests; check approval and role fit. *Around the computer* (documents to system access) for the sample.\n3. **Segregation of duties:** compare the user-role matrix with a conflict matrix (for example, set up and approve). *With the computer*.\n4. **Privileged access:** review administrator accounts and their logs; test that attempts to perform a conflicting action are blocked. *Through the computer* (attempt a conflicting transaction in a test environment).\n*Evidence:* HR leavers list, user export, access request forms, role matrix, logs, test results.\n*Possible finding:*\n- *Condition:* 12 of 480 leavers' accounts remained active, two with recent logins.\n- *Criteria:* policy requires disabling accounts within one working day.\n- *Cause:* no link between HR and IT; manual process.\n- *Effect:* unauthorised access and fraud risk; non-compliance.\n- *Recommendation:* automate leaver notification; monthly reconciliation; owner head of IT; 60 days.\n\n**Marking criteria:** objective and criteria (2), risks (2), four procedures with techniques (4), evidence (2), finding structure (4).\n\n**Common mistake:** listing tests with no matching evidence or criteria.\n<\/details>\n\n\n---"}, {"id": "t7", "t": "TOPIC 7 — Information Systems Controls and Control Objectives", "s": "7 · Information Systems Controls and Control Objectives", "g": "Topics", "c": "#2563eb", "k": "7", "md": "# TOPIC 7 — Information Systems Controls and Control Objectives\n\n**Classification:** Foundation (definition, objectives), Core (general controls, audit trail), Difficult/High-risk (application controls, classification schemes), Applied (testing controls)\n**Sources:** Topic 7 Word document (the full text) and Topic 7 slides (a 10-slide summary of the same material). 12 teaching hours, the **largest topic**. CW2 areas (b) passwords, (c) tariffs, (d) interest recomputation, (e) product eligibility and (f) segregation of duties are all controls testing.\n**Outline items:** (a) understanding security and IT audit controls; (b) categories of controls (administrative, technical, physical and logical); (c) input, process, validation, output, logical access, physical access; (d) classification of controls (preventive, detective and corrective); (e) database, network, environment, BCP, evidence collection, evaluation and reporting methodologies.\n\n> **Read this first: the notes and the outline use different classification schemes.**\n> - The **outline** lists categories **Administrative / Technical / Physical / Logical**, and classification **Preventive / Detective / Corrective**.\n> - Your **notes** classify controls as **General / Application (business process) / Objective-based / User**, and the objective-based class has **five** members: **Preventive, Detective, Corrective, Directive, Recovery**.\n> - Both are valid ways of slicing the same controls. This topic teaches the notes' scheme in full (7.5 to 7.11), then maps it to the outline's words in 7.5.2 so you can answer either.\n\n## PHASE 1 — UNDERSTANDING\n\n### 7.1 The big picture\n\nA **control** is a safeguard that makes a business objective more likely to be achieved and an undesired event less likely to happen unnoticed. Everything an IS auditor tests (Topic 6) is a control, or the absence of one. Topic 7 is the **catalogue** of controls and the **ways of grouping** them.\n\n**Where it connects.** Backward: Topic 2's threats and risks are what controls address; Topic 3's policies state the rules controls enforce; Topic 4's domains (access, network, physical, application, hardware) are where many controls sit; Topic 5's change management and configuration control are general controls; Topic 6's audit process tests them. Forward: Topic 8 reports on weak controls, and the Practical Lab tests application controls in Excel and IDEA.\n\n### 7.2 Key terms\n\n| Term | Meaning (notes unless marked) |\n|---|---|\n| Control | \"The policies, procedures, practices and organizational structures designed to provide **reasonable assurance** that business objectives will be achieved and that undesired events will be **prevented or detected and corrected**\" |\n| General controls | Policies and procedures that apply to **all or a large segment** of an organization's information systems and help ensure their proper operation |\n| Application (business process) controls | Automated and/or manual controls applied to **business transaction flows**, relating to completeness, accuracy, validity and confidentiality |\n| Objective-based controls | Controls classified by the **objective** they serve: preventive, detective, corrective, directive, recovery |\n| User controls | Controls performed by people interacting with information systems |\n| Completeness (C) | All transactions that occurred are input, accepted, processed **once and only once**, and included in output |\n| Accuracy (A) | Transactions recorded correctly, timely; data processed accurately |\n| Validity (V) | Recorded transactions actually occurred, relate to the organization and were properly approved |\n| Confidentiality (CF) | Application data and output are protected against unauthorized access |\n| Segregation of duties | Stages of a transaction are split between different people so that one person cannot process it from start to finish |\n| Audit trail | Logs that record activity at the system, application and user level |\n| Compensating control | An alternative control that reduces the risk of a weakness elsewhere (notes: considered for each potential weakness) |\n| Business rules | Input and processing controls implemented in data management systems (edit checks, existence checks, thresholds) |\n\n### 7.3 What a control is, and why \"reasonable assurance\"\n\n**Definition (notes).** Controls are \"the policies, procedures, practices and organizational structures designed to provide **reasonable assurance** that business objectives will be achieved and that undesired events will be prevented or detected and corrected\".\n\nThe basic purpose: ensure business objectives are achieved and undesired risk events are **prevented or detected and corrected**. This is achieved by designing an effective information control framework made of **policies, procedures, practices and organization structure**.\n\n**Four ingredients, with a concrete example each (illustrative):**\n\n| Ingredient | Example in a bank |\n|---|---|\n| Policy | \"All payments over 5,000,000 UGX require a second approver\" |\n| Procedure | The step-by-step payment approval workflow |\n| Practice | Approvers actually check the supporting invoice before approving |\n| Organization structure | Payments are prepared by Treasury but approved by Finance (separate people reporting to different managers) |\n\n> **Supplementary explanation: why \"reasonable\" and not \"absolute\".** No control gives a guarantee: controls can be bypassed by collusion, overridden by management, or fail through error, and perfect controls would cost mor
