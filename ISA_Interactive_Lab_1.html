 | A trojan *pretends* to be useful; a virus *attaches* to a file. |\n| \"APT = zero-day\" | APT is about duration and targeting; zero-day is about an unpatched flaw. |\n| \"Ransomware attacks confidentiality\" | Mainly **availability**. |\n| \"DDoS steals data\" | It denies access. |\n| \"Phishing only happens by email\" | Also voice (vishing) and SMS (smishing). |\n| \"Spear phishing = whaling\" | Spear targets a specific person or group; whaling targets **top management**. |\n| \"Brute force and dictionary are the same\" | Brute force tries all combinations; dictionary uses a list of likely words. |\n| \"Misinformation requires intent to deceive\" | Per the notes, it is false information spread regardless of intent; fake news is false information posed as news. |\n| \"Exploitation = attack\" | In the notes, exploitation is monitoring and copying data; an attack aims to disrupt normal functioning. |\n| \"Insider threat always means malicious\" | Also accidental and negligent. |\n| \"Stronger encryption stops SQL injection\" | Input validation and parameterised queries do. MitM is what encryption stops. |\n\n### 2.13 Checklist: analysing any threat scenario\n\n1. **Asset?** What is being targeted?\n2. **Weakness?** Network, OS, human or process vulnerability?\n3. **Actor?** One of the nine attacker types?\n4. **Method?** Use the decision tree.\n5. **Goal hit?** Confidentiality, integrity or availability?\n6. **Risk?** How likely, and how bad? (L × I)\n7. **Measure?** What would have prevented, detected or limited it?\n\n### 2.14 Revision summary (Topic 2)\n\n- Vulnerability = weakness; threat = potential harm facilitated by it; exploit = code using it; risk = likelihood × impact; attack vector = route in; attack surface = all routes.\n- 16 threat types: malware, phishing, DoS/DDoS, XSS, MitM, SQLi, insiders, APTs, password attacks, zero-day, social engineering, ransomware, supply chain, IoT, cloud, physical.\n- Virus attaches to a file; worm spreads alone; trojan disguises; logic bomb waits for a condition; ransomware locks files for payment (availability).\n- SQLi alters the query using quote and comment characters; stored XSS hits every visitor; MitM is stopped by HTTPS/VPN.\n- Nine attacker types: recreational, script kiddies, criminals, hacktivists, state-sponsored, insiders, organized crime, hackers (white, gray, black), nation-state actors.\n- Cyber crime categories: against computer systems, mobiles, online scams, social media, social engineering.\n- Phishing family: phishing, spear (specific target), whaling (top management), vishing (voice), smishing (SMS), BEC.\n- Cyber warfare (nation-state, weaken or destroy) vs cyber terrorism (political, causes fear or violence). Critical infrastructure protection has five steps.\n- Measures: firewalls/IDS-IPS, patching, MFA, training, encryption, audits, incident response and DR, least privilege and RBAC, backups, physical security, compliance.\n\n\n---\n\n## PHASE 2 — COMPREHENSION CHECKS (Topic 2)\n\n**C1. Explain, in your own words, the difference between a threat, a vulnerability and a risk, using one example that is not from the notes.**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\n*Example: a clinic's reception computer.* The vulnerability is that Windows has not been updated for a year, so a known flaw is open. The threat is a criminal with code that exploits that flaw (or ransomware that spreads through it). The risk is the combination: how likely the criminal is to succeed, multiplied by how bad it would be if patient records were encrypted. The same flaw with no connection to any network and no valuable data would be a vulnerability with very low risk.\n\n**Check:** vulnerability = weakness, threat = potential harm that uses it, risk = likelihood × impact.\n<\/details>\n\n**C2. Why is ransomware classified mainly as an availability attack and not a confidentiality attack?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nBecause the defining harm is that authorized users can no longer use their data. Files are encrypted, so staff cannot open them until a key is bought. Nothing necessarily leaks. (Many modern ransomware gangs also steal data, which adds a confidentiality harm, but the label \"ransomware\" describes the lock-and-demand behaviour, and exam questions such as CW1 Q49 treat availability as the goal most directly violated.)\n\n**Check:** you should name availability and say why (access lost), not simply \"data is attacked\".\n<\/details>\n\n**C3. Why does an SQL injection like `admin' --` work? What would happen if the application used parameterised queries?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nIt works because the application pastes the typed text directly into the SQL string, so the attacker's quote mark ends the username field and the `--` turns the rest of the query, including the password check, into a comment. With parameterised queries the database receives the SQL command and the typed value separately. The text `admin' --` would be treated as a literal username that does not exist, so the login would fail.\n\n**Check:** mixing code and data is the root cause; separating them is the fix.\n<\/details>\n\n**C4. What would happen to an organization's defences if it relied only on detection and had no prevention? (Link to the notes' \"detection is no longer good enough\".)**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nIt would learn about attacks only after the damage began. With fast-moving threats such as ransomware, zero-day exploits and APTs, the data may already be encrypted, stolen or altered by the time an alert fires. The notes say focus must shift to prevention and a consolidated architecture, because sophisticated attacks are no longer caught by legacy approaches and need in-depth visibility. Prevention reduces the number of successful attacks; detection and response limit the damage of those that get through. You need both.\n\n**Check:** you should have argued for a combination, with prevention first.\n<\/details>\n\n**C5. How does phishing relate to social engineering? How does spear phishing differ from whaling?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nSocial engineering is the umbrella term: psychological deception to make people reveal information or act insecurely. Phishing is one form of it, done mostly through email and similar messages. Spear phishing is aimed at a specific person or group (for example a system administrator), using details that make the message believable. Whaling is spear phishing aimed at the very top (CEO, CFO), where one successful message can authorise large payments.\n\n**Check:** phishing ⊂ social engineering; spear = specific target; whaling = top management.\n<\/details>\n\n**C6. Give an original example of an accidental insider incident and say which CIA goal it breaches.**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nAn accountant attaches the wrong spreadsheet to an email to a supplier; it contains every client's bank details. No harm was intended, but the data is now with an unauthorized person: a **confidentiality** breach caused by a negligent or accidental insider (CW1 Q12's \"negligent insider\").\n\n**Check:** no intent, real exposure.\n<\/details>\n\n**C7. Which part of this topic would confuse someone seeing it for the first time?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\n(1) Many names for similar things: virus, worm, trojan, logic bomb. Use the decision tree and the \"key phrase\" column. (2) Threat vs vulnerability vs risk vs exploit. Use the one concrete chain in 2.2. (3) The phishing family (spear, whaling, vishing, smishing). Use the memory aids. (4) The word \"exploitation\" has a specific meaning in the notes. (5) APT vs zero-day.\n<\/details>\n\n---\n\n## PHASE 3 — ACTIVE RECALL BANK (Topic 2)\n\n### Level 1 — Basic recall\n\n**Q1.** List the 16 threat types named in the Topic 2.1 notes.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Malware; phishing; DoS/DDoS; cross-site scripting; man-in-the-middle; SQL injection; insider threats; APTs; password attacks; zero-day exploits; social engineering; ransomware; supply chain attacks; IoT vulnerabilities; cloud security threats; physical security threats.\n\n**Marking:** one mark per correct item, up to 16.\n\n**Common mistake:** forgetting the last four (supply chain, IoT, cloud, physical).\n<\/details>\n\n**Q2.** Define: vulnerability, exploit, attack vector, attack surface.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Vulnerability: a weakness in a host or system that can be exploited (network, operating system, human or process). Exploit: code that takes advantage of a vulnerability to cause unintended behaviour; known or unknown. Attack vector: a method of gaining unauthorized access to a network or system. Attack surface: the total number of attack vectors an attacker can use.\n\n**Marking:** one mark per definition, plus half a mark each for the types or examples.\n\n**Common mistake:** defining attack surface as \"the target\". It is the *sum of the routes in*.\n<\/details>\n\n**Q3.** Name the nine types of cyber attackers in the overview deck.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Recreational; script kiddies; cyber criminals; hacktivists; state-sponsored; insiders; organized crime; hackers (white, gray, black hat); nation-state actors or cyberterrorists.\n\n**Common mistake:** omitting organized crime or listing \"hacker\" without the three hat colours.\n<\/details>\n\n**Q4.** State what each of these identifies: (a) boot sector virus (b) polymorphic virus (c) logic bomb (d) worm (e) trojan horse.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** (a) A virus that infects the first section of a storage device (the MBR), preventing normal start-up. (b) A virus that changes its own code to avoid detection. (c) Code that activates only when a condition, such as a date, is met. (d) Malware that spreads across networks without a host file. (e) Malware disguised as a useful program.\n\n**Note:** (a) and (b) are CW1 topics that are supplementary to the notes.\n\n**Common mistake:** describing a worm as needing a host file.\n<\/details>\n\n**Q5.** Define an *attack* as the overview deck does, and give three examples.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** An attack is an attempt, via cyberspace, targeting an enterprise's use of cyberspace to disrupt, disable, destroy or maliciously control a computing environment or infrastructure, destroy data integrity, or steal controlled information. Examples (notes): identity theft, fraud, malware attack, phishing, password attack, man-in-the-middle, DoS.\n\n**Common mistake:** confusing attack with exploitation.\n<\/details>\n\n**Q6.** Name the five steps of the critical infrastructure protection process.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** (1) Identify critical infrastructure. (2) Identify and assess vulnerabilities. (3) Analyse and prioritise infrastructure. (4) Implement protective programmes. (5) Measure effectiveness.\n\n**Common mistake:** putting \"implement\" before \"assess\".\n<\/details>\n\n### Level 2 — Understanding\n\n**Q7.** Distinguish a virus from a worm and a trojan horse. Use one phrase to identify each.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** A virus attaches to another file and runs only when that file is executed (needs a host). A worm replicates by itself across networks and needs no host file. A trojan horse presents itself as a useful program but does something harmful. Key phrases: virus = \"hides within another file\"; worm = \"spreads without a host\"; trojan = \"looks useful\".\n\n**Marking:** three correct definitions (3), three distinguishing features (3).\n\n**Common mistake:** saying a trojan replicates itself. It does not; it relies on the user installing it.\n<\/details>\n\n**Q8.** Explain why a stored XSS attack is more dangerous than a reflected one.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** In stored XSS the script is saved on the server (for example in a comment), so it runs for every visitor who loads the page, without anyone needing to click a crafted link. In reflected XSS, the script travels in a link and affects only the person who clicks it. Stored XSS therefore reaches many more victims, for longer, from a single injection.\n\n**Marking:** stored mechanism (1), every visitor (1), reflected mechanism (1), contrast (1).\n\n**Common mistake:** saying reflected attacks are stored in the database.\n<\/details>\n\n**Q9.** Compare brute force, dictionary and credential stuffing attacks. Which is defeated best by \"never reuse passwords\"?\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Brute force tries every combination. Dictionary tries a prepared list of likely passwords. Credential stuffing takes credentials leaked from one site and tries them on others. Not reusing passwords defeats credential stuffing, because a leak from one site then gives nothing on the next.\n\n**Marking:** three correct descriptions (3), correct choice with reason (2).\n\n**Common mistake:** thinking longer passwords help against credential stuffing. They do not; uniqueness does.\n<\/details>\n\n**Q10.** Explain the difference between cyber warfare and cyber terrorism.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Cyber warfare is carried out by a nation-state or international organization to weaken, disrupt or destroy another nation's computers and networks, using methods such as espionage, sabotage, DoS, power-grid attacks, propaganda, economic disruption and surprise attacks. Cyber terrorism is a premeditated, politically motivated attack on information systems, programs and data that causes fear, threatens violence or results in violence, often through ransomware and phishing. The first is state action against another state; the second is political violence or intimidation, whoever the actor is.\n\n**Marking:** definition of each (2 + 2), examples (1), clear contrast (1).\n\n**Common mistake:** saying cyber terrorism is always done by a state.\n<\/details>\n\n### Level 3 — Application\n\n**Q11.** (CW1 style) After a staff member plugs in a flash drive labelled \"Salaries 2026 — confidential\" that was found in the car park, the company's servers start encrypting files. Identify the social engineering method, the malware type, the CIA goal most affected, and two controls that would have helped.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:**\n- *Social engineering method:* **baiting** (a tempting item left for someone to pick up).\n- *Malware type:* **ransomware** (files encrypted; payment will be demanded).\n- *CIA goal:* **availability** (files cannot be used).\n- *Controls:* staff awareness training (never plug in unknown media); disable USB ports or use endpoint controls; EDR and antivirus; tested offline backups so files can be restored; least privilege to limit what the infected account can reach.\n\n**Marking:** each of the four elements (1 each), two relevant controls (2).\n\n**Common mistake:** naming the method \"phishing\". There was no deceptive message.\n<\/details>\n\n**Q12.** (Calculation) A risk register scores likelihood (L) and impact (I) from 1 to 3. Compute the risk for each and rank them. (a) Cloud storage left public: L2, I3. (b) Phishing: L3, I2. (c) Fire in the server room: L1, I3. (d) Insider misuse of customer data: L2, I2.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** (a) 2 × 3 = 6. (b) 3 × 2 = 6. (c) 1 × 3 = 3. (d) 2 × 2 = 4. Ranking: (a) and (b) tied at 6, then (d) at 4, then (c) at 3. For the tie, justify the choice: for example, treat the public storage first because exposure is immediate and the fix is quick.\n\n**Marking:** four correct scores (4), correct ranking (1), reasoned tie-break (1).\n\n**Common mistake:** adding instead of multiplying (L + I would give 5, 5, 4, 4 and a different ranking).\n<\/details>\n\n**Q13.** An email arrives at the finance director: \"Our bank details have changed. Please pay today's invoice to the new account below. Reply only to this address.\" The domain differs from the real supplier by one letter. Name the attack and give four checks that expose it.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** This is **Business Email Compromise** (impersonation of a supplier) and a spear phish aimed at someone who can authorise payments. Checks: (1) look at the sender domain letter by letter; (2) confirm the change by calling the supplier on a number already on file; (3) require a second approver for any change of bank details (segregation of duties); (4) hold payment until verified; (5) report the email to IT.\n\n**Marking:** attack named (2), four checks (4).\n\n**Common mistake:** replying to the email to \"confirm\". That goes to the attacker.\n<\/details>\n\n### Level 4 — Exam mastery\n\n**Q14.** \"Detection is no longer good enough. Focus must shift to prevention.\" Discuss this statement using at least four threats from the topic. (12 marks)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer outline:**\n1. *Position:* largely agree, but both are required.\n2. *Why detection alone fails:* speed. Ransomware encrypts files in minutes; DDoS is already causing downtime when detected; zero-day exploits have no signature, so signature-based detection misses them; APTs are designed to stay hidden for months.\n3. *What prevention adds:* patching (reduces unpatched-software risk), MFA and least privilege (limit account misuse), training (reduces phishing success), encryption (makes MitM and stolen data useless), segmentation and firewalls (reduce attack surface).\n4. *Counterpoint:* prevention is never complete. Zero-days and insiders get through, so detection, incident response and resilience (tested backups, DR plans) remain essential.\n5. *Notes' support:* the overview deck says sophisticated attacks are not detected by legacy approaches and calls for a consolidated cyber security architecture with deeper visibility.\n6. *Conclusion:* prevent first, detect and respond to limit the impact of what slips through.\n\n**Marking criteria:** position (1), four threats with reasoning (4), prevention examples (3), counterpoint (2), conclusion (2).\n\n**Common mistake:** listing threats without linking each to why detection is too slow.\n<\/details>\n\n**Q15.** A regional bank's customers report being unable to use mobile banking for two hours. At the same time, three customers report SMS codes not arriving and money leaving their accounts. A staff member later reports a strange email asking him to confirm a \"system update\". (a) Identify two separate attacks and the CIA goal each affects. (b) Say which attacker types may be behind each. (c) Recommend three measures. (12 marks)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer outline:**\n(a) *Attack 1:* DDoS or similar flood on the mobile app: **availability**. *Attack 2:* **SIM swap** leading to OTP interception and account takeover: **confidentiality** (credentials) and **integrity** (unauthorized transfers). The strange email is likely **phishing/spear phishing** that may be a way in for either, so it is a third indicator.\n(b) *Attacker types:* the DDoS may be hacktivists, cyber criminals (as cover or extortion) or organized crime; the SIM swap and takeover point to cyber criminals or organized crime. Say why: financial gain, coordinated skill.\n(c) *Measures:* DDoS protection and capacity planning (firewalls, traffic filtering); stronger authentication than SMS alone, plus alerts on SIM change and a delay on new-device transfers; staff phishing training and email reporting; incident response and monitoring; liaison with the mobile operator.\n\n**Marking criteria:** two attacks correctly named (2), CIA goals (2), attacker types with reason (3), three well-chosen measures (3), coherent link between the events (2).\n\n**Common mistake:** treating the three events as one attack, instead of separating them by the goal each affects.\n<\/details>\n\n\n---"}, {"id": "t3", "t": "TOPIC 3 — Information Security Policy and Standards", "s": "3 · Information Security Policy and Standards", "g": "Topics", "c": "#0891b2", "k": "3", "md": "# TOPIC 3 — Information Security Policy and Standards\n\n**Classification:** Foundation (policy basics), Core (policy types and development), Difficult/High-risk (ISO and NIST frameworks)\n**Sources:** Info Sec Policy deck; Sec SDLC deck (life cycle, ISO 27000 series, NIST models). CW1 tests this topic in Q37 (acceptable use policy), Q42 (PDCA), Q46 (compliance). CW2 area (a) is a policy review.\n**Outline items:** (a) information security principles, (b) policy definition and information security life cycle, (c) types of policies, (d) structure and framework of comprehensive security, (e) policy infrastructure, design life cycle and processes, PDCA model, (f) standards and practices: BS7799, ISO/IEC 17799, ISO 27001.\n\n## PHASE 1 — UNDERSTANDING\n\n### 3.1 The big picture\n\nA **policy** is a set of organizational guidelines that dictates certain behaviour within the organization. It is the written answer to: \"What is and is not acceptable here, and who is responsible for what?\"\n\nWhy it matters: the ISMS in Topic 1 has \"Policy\" as its first component, and every control in Topics 4 and 7 should trace back to a policy. When an auditor checks a password setting (CW2 area b), the thing they compare it with is a **policy**. When a court asks whether management exercised due diligence, the policy document is the evidence.\n\n**Where it connects.** Backward: Topic 2's threats are what policies try to control (for example, an acceptable use policy against phishing and malware). Forward: Topic 4 applies policy in specific domains (access, email, internet); Topic 5 asks how well policies are governed; Topic 7 turns policy into controls; Topics 6 and 8 audit compliance with policy.\n\n### 3.2 Key terms\n\n| Term | Meaning (notes unless marked) |\n|---|---|\n| Policy | A set of organizational guidelines that dictates certain behaviour within the organization |\n| EISP | Enterprise Information Security Policy (general program policy): strategic direction, scope and tone |\n| ISSP | Issue-specific security policy: detailed guidance on the use of a particular technology or issue |\n| SysSP | System-specific security policy: management guidance and technical specifications for a particular system |\n| ACL | Access control list: who may use a system, what they can access, when, where from and how |\n| Configuration rules | Specific codes or scripts entered into security systems that tell them what actions to perform on information they process |\n| Framework / security model | The theoretical foundation from which a blueprint is designed |\n| Blueprint | The basis for designing, selecting and implementing all later security controls (policies, training programmes, technical controls) |\n| Sec SDLC | The set of procedures run in sequence within the software development life cycle so that security risks are reduced from the start |\n| ISO/IEC 27001 | Standard for an ISMS; used for certification; \"serves better as an assessment tool than as an implementation framework\" |\n| ISO/IEC 27002 | Code of practice: guidelines and voluntary directions for information security management |\n| NIST CSF | NIST Cybersecurity Framework (2014): voluntary, vendor-neutral framework to manage cybersecurity risk |\n| Gap analysis | Comparing the current state with the desired state and planning how to close the difference |\n\n### 3.3 Information security principles\n\n> **Supplementary explanation.** The outline lists \"information security principles\" but your notes do not contain a separate list. Apart from CIA (Topic 1), the principles most often used in policies and audits are:\n> - **Least privilege:** give each user only the access needed for the job (CW1 Q48).\n> - **Need to know:** even with clearance, access only what the task requires.\n> - **Segregation of duties:** split steps of a sensitive task between people so no one person can complete and hide a fraud (it returns in Topic 7).\n> - **Defence in depth:** several layers of control, so one failure is not fatal.\n> - **Accountability:** every action can be traced to an individual (logging, unique IDs).\n> - **Default deny:** anything not explicitly allowed is blocked.\n> The NIST handbook \"Generally Accepted Principles and Practices for Securing IT Systems\" (SP 800-14), listed in your notes, is the formal source for such principles.\n\n### 3.4 Policy: what it is for and how it must be shaped\n\n**Objectives of policy (notes):** reduced risk; compliance with laws and regulations; assurance of operational continuity, information integrity and confidentiality. The policy maker sets the tone and emphasis on the importance of information security.\n\n**Why policy exists (notes):**\n\n- Policies are the **least expensive means of control** and often the **most difficult to implement**. (Writing a policy costs little; getting people to follow it is hard.)\n- They are important reference documents: for **internal audits** and for resolving **legal disputes about management's due diligence**.\n- They are a clear **statement of management's intent**.\n\n**Three basic rules for shaping a policy (notes):**\n\n1. It should **never conflict with law**.\n2. It must be able to **stand up in court** if challenged.\n3. It must be **properly supported and administered**.\n\n**Six guidelines for an effective policy (notes).** A policy must be properly:\n\n| # | Verb | In practice |\n|---|---|---|\n| 1 | **Developed** | Using industry-accepted practices |\n| 2 | **Distributed** | Through all appropriate methods (email, intranet, induction) |\n| 3 | **Read** (reviewed) | By all employees |\n| 4 | **Understood** | By all employees (a quiz or training confirms this) |\n| 5 | **Agreed to** | Formally, by act or assertion (a signature or click-to-accept) |\n| 6 | **Uniformly applied and enforced** | Same rules and penalties for the director and the intern |\n\n**Why the sequence matters.** If step 3 fails, nobody reads it. If step 5 fails, an employee can say \"I never agreed\". If step 6 fails, the policy loses credibility, and in a legal dispute it may not stand up. **A policy that is not enforced is just a document.**\n\n**Conclusion from the notes:** policies exist first and foremost to inform employees what is and is not acceptable behaviour; they also seek to improve productivity and avoid embarrassing situations.\n\n> **Supplementary explanation: policy vs standard vs procedure vs guideline.** These four words are often confused:\n> - **Policy:** the high-level mandatory statement of *what* and *why* (\"Passwords must protect access to company systems\").\n> - **Standard:** specific mandatory requirements that support the policy (\"Passwords: minimum 12 characters, changed every 90 days\").\n> - **Procedure:** the step-by-step *how* (\"To reset a password: 1. Verify the caller's identity. 2. ...\").\n> - **Guideline:** recommended, not mandatory, advice.\n> Your notes say system-specific policies \"may function as standards or procedures\". That is why the boundary blurs in practice.\n\n### 3.5 The three types of information security policy\n\n| | **EISP** (Enterprise / general program policy) | **ISSP** (Issue-specific) | **SysSP** (System-specific) |\n|---|---|---|---|\n| Level | Whole organization, strategic | A particular issue or technology | A particular system or device |\n| Purpose | Sets strategic direction, scope and tone; assigns responsibilities; guides development and management of the security programme | Detailed, targeted guidance on secure use of a technology; protects from inefficiency and ambiguity; indemnifies the organization against liability for employee misuse | Management guidance and technical specifications for configuring and maintaining a system |\n| Typical content | Statement of purpose; IT security elements; need for IT security; responsibilities and roles; references to other standards and guidelines | Email and internet use; minimum system configurations; prohibitions against hacking; home use of company equipment; use of personal equipment on company networks; telecoms; photocopy equipment | Firewall configuration policy; access control lists; configuration rules |\n| Who writes it | Senior management | Management with IT and legal | Management (guidance) and system administrators (technical) |\n| Example | \"XYZ Bank protects customer information and assigns the CIO accountability\" | Acceptable Use Policy for email and internet | The ACL on the loan database; the firewall rule set |\n\n#### 3.5.1 EISP: its five components (notes)\n\n1. Statement of purpose\n2. Information technology security elements\n3. Need for IT security\n4. IT security responsibilities and roles\n5. References to other IT standards and guidelines\n\n**Worked example (invented EISP outline for a bank):**\n\n- *Purpose:* \"To protect customer, financial and operational information of XYZ Bank from unauthorized access, loss or alteration.\"\n- *Elements:* access control, data protection, incident response, business continuity.\n- *Need:* regulation, customer trust, fraud risk.\n- *Roles:* Board approves; CIO owns; branch managers enforce; all staff comply.\n- *References:* ISO/IEC 27001, the data protection law, the bank's ISSPs.\n\n#### 3.5.2 ISSP: its components (notes)\n\n| Component | What it contains |\n|---|---|\n| **Statement of purpose** | Scope and applicability; definition of technology addressed; responsibilities |\n| **Authorized access and usage of equipment** | User access; fair and responsible use; protection of privacy |\n| **Prohibited usage of equipment** | Disruptive use or misuse; criminal use; offensive or harassing materials; copyrighted, licensed or other intellectual property; other restrictions |\n| **Systems management** | Management of stored materials; employer monitoring; virus protection; physical security; encryption |\n| **Violations of policy** | Procedures for reporting violations; penalties for violations |\n| **Policy review and modification** | Scheduled review of policy and procedures |\n| **Limitations of liability** | Statements of liability or disclaimers |\n\n**Worked example: an Acceptable Use Policy (AUP) for email and internet, line by line** (CW1 Q37: the AUP is where \"rules that define responsible use of company email and internet\" are found).\n\n| ISSP component | What the policy line says |\n|---|---|\n| Purpose, scope | \"This policy governs use of company email and internet by all employees and contractors.\" |\n| Authorized use | \"Email and internet are provided for business. Reasonable personal use is allowed outside working hours.\" |\n| Prohibited use | \"No sending of offensive or harassing material, downloading pirated software, or attempts to access systems without authority.\" |\n| Systems management | \"Email is scanned for viruses. The company may monitor email and web use.\" |\n| Violations | \"Report suspected misuse to IT security. Breaches may lead to disciplinary action.\" |\n| Review | \"This policy is reviewed every 12 months.\" |\n| Liability | \"The company is not liable for private use of company systems.\" |\n\nNotice the \"Systems management: employer monitoring\" line and the \"Limitations of liability\" line. They protect the organization legally (the notes say an ISSP *indemnifies the organization against liability for an employee's inappropriate or illegal system use*).\n\n#### 3.5.3 SysSP: managerial guidance and technical specifications\n\nThe notes split SysSPs into two parts, which can be combined in one document:\n\n- **Managerial guidance SysSP:** created by management to guide implementation and configuration of any technology that affects confidentiality, integrity or availability (for example, firewall configuration). It informs technologists of management's intent.\n- **Technical specifications SysSP:** system administrators' directions on implementing the managerial policy. Two main methods: **access control lists** and **configuration rules**.\n\n**Access control lists (ACLs).** They include user access lists, matrices and capability tables that govern rights and privileges. They regulate **who** can use the system, **what** authorized users can access, **when**, **where from**, and **how**. Typical privileges: read, write, create, modify, delete, compare, copy.\n\n**Worked example (invented): an ACL for a loan database, line by line.**\n\n| Subject (who) | Object (what) | Privileges | When | From where |\n|---|---|---|---|---|\n| Loan officers | Loan table | Read, create, modify | 07:00 to 19:00 | Branch network |\n| Branch manager | Loan table | Read, approve | 07:00 to 19:00 | Branch network |\n| Auditors | Loan table | Read only | Any time, with approval | Audit workstation |\n| Tellers | Loan table | None | n/a | n/a |\n\nReading it line by line: the loan officer can create and modify but not approve; the manager can approve but the table shows no create (so one person cannot both set up and approve a loan: segregation of duties); auditors read only (they must not change what they audit); tellers have no access at all (least privilege).\n\n**Configuration rules.** Specific codes entered into security systems that guide how the system acts on information passing through. A firewall rule set is the classic example:\n\n```\nRule 1: ALLOW  TCP  from ANY            to 10.0.0.5   port 443    (customers reach the web server over HTTPS)\nRule 2: ALLOW  TCP  from 10.0.1.0/24    to 10.0.0.10  port 1433   (only the app servers reach the database)\nRule 3: DENY   ALL  from ANY            to ANY                    (anything not allowed above is blocked)\n```\n\n- Rule 1 lets the public use the website and nothing else.\n- Rule 2 lets only the application subnet talk to the database. The internet cannot.\n- Rule 3 is the **default deny**, the safety net. If it were missing, any traffic not covered by rules 1 and 2 might pass.\n\nThis is the \"managerial guidance\" (management said: customers reach the web server only; only the application reaches the database) turned into \"technical specification\" (the exact rules).\n\n### 3.6 Policy design and development steps (notes)\n\n| Stage | What happens (notes) |\n|---|---|\n| **Investigation** | *Goals:* define specific objectives (protect sensitive data, ensure compliance). *Support:* get commitment from management, IT and legal for resources. *Participation:* engage a diverse group of staff and departments for input and ownership. |\n| **Analysis** | *Risk assessment:* evaluate threats and vulnerabilities to identify critical assets and prioritise measures by impact and likelihood. |\n| **Design** | *Components:* develop key policy elements (access controls, data classification, incident response procedures, employee responsibilities). *Dissemination:* plan communication (training sessions, workshops, written documentation). |\n| **Implement** | *Detailed specification:* a plan with specific actions, timelines, responsibilities and resources. |\n| **Maintenance** | Regular reviews of effectiveness; adapt to new threats; use feedback from users |\n| **Distribution** | Give the finalised policy to all employees and stakeholders; make it accessible; explain compliance and reporting mechanisms |\n\n**Why this order?** You cannot write good rules (design) until you know your risks (analysis), and you cannot know what to protect until you know your goals and have support (investigation). A policy nobody maintains goes stale.\n\n> **Supplementary explanation: the PDCA model (CW1 Q42).** PDCA means Plan, Do, Check, Act: a repeating cycle for **continuous improvement** of a management system, such as the ISMS. It is not a one-time tool installation, a financial return calculation, or a background check (the wrong options in Q42).\n> - **Plan:** set objectives and policy, assess risk, decide controls. (Policy development: investigation, analysis, design.)\n> - **Do:** implement and operate the controls; communicate the policy. (Implement, distribution.)\n> - **Check:** monitor, measure, audit against the policy. (Maintenance: review of effectiveness.)\n> - **Act:** correct problems and update the policy, then start Plan again. (Maintenance: adapt to new threats.)\n> The loop is the point. Findings from \"Check\" feed back into the next \"Plan\".\n\n### 3.7 The information security life cycle: Sec SDLC (notes)\n\n**Definition.** The Security System Development Life Cycle is the set of procedures executed in sequence within the software development life cycle (SDLC), designed to help developers build software that **reduces security risks from the start**. The ordinary SDLC focuses mainly on the design and implementation of an information system. SecSDLC adds identification of threats and risks and the controls to counter, remove and manage them.\n\n| Stage | What happens (notes) |\n|---|---|\n| **1. Investigation / planning** | Started by top management. Objectives and goals are set. An information security policy is defined, describing the security applications and programs. **Planning levels:** strategic, tactical, operational, contingency. |\n| **2. Analysis** | Documents from stage 1 are analysed; existing policies, applications and software are checked for flaws; upcoming threats analysed. **Risk management** sits here: risk identification, risk assessment, risk control, risk analysis. Includes **preliminary analysis**, **threat analysis** (which components to protect and from what), and **legal analysis** (policy vs law). Ends with documentation of system/user requirements and a feasibility report. |\n| **3. Design** | **Logical design:** blueprints for policies, applications and software; backup and recovery policies; business steps in a disaster; the decision whether to outsource. **Physical design:** technical teams acquire tools and blueprints; investigate solutions; document them to cover vulnerabilities missed in analysis. |\n| **4. Implementation** | The chosen solution (in-house or outsourced) is finalised, documented, integrated and aggressively tested against the requirements. |\n| **5. Maintenance** | Ensure the programme functions properly and is kept up to date against new threats. |\n\n**Advantages (notes):** improved security, compliance, risk management, better project management, increased efficiency.\n**Disadvantages (notes):** cost, time-consuming, complexity, inflexibility, limited adaptability to new technologies.\n\n**Worked example (invented): a bank builds a mobile loan app with SecSDLC.**\n\n1. *Investigation:* top management sets the goal \"customers apply for loans on their phones\". The security policy states that customer data must be encrypted.\n2. *Analysis:* the team lists threats (phishing, SIM swap, fake apps) and checks the law on data protection (legal analysis). Output: requirements and a feasibility report.\n3. *Design:* logical design: backup policy and the decision to use a vendor for the SMS gateway (outsourcing). Physical design: choose the encryption tools and servers.\n4. *Implementation:* build, integrate and test aggressively, including security tests.\n5. *Maintenance:* patch the app, review new threats each quarter.\n\n### 3.8 Frameworks and standards\n\n**Framework = security model = the theoretical foundation from which a blueprint is designed.** The **blueprint** is the basis for designing, selecting and implementing all later controls: policies, training, technology. The notes focus on **NIST** and **ISO** because they are the industry leaders.\n\n#### 3.8.1 The ISO/IEC 27000 series\n\n| Item | What the notes say |\n|---|---|\n| **ISO/IEC 27002:2013** | Derived from **ISO/IEC 17799**, which was originally **BS 7799**. One of the most widely referenced security models. Purpose: offer guidelines and voluntary directions for information security management; a high-level description of areas considered important. Its details are available only to those who purchase the standard. |\n| **ISO/IEC 27001:2013** | Provides information on how to implement ISO/IEC 27002 and set up an ISMS. Primary purpose: a standard organizations adopt to **obtain certification** and build an information security programme. Serves better as an **assessment tool** than as an implementation framework. |\n\n**The lineage in one line:** BS 7799 → ISO/IEC 17799 → ISO/IEC 27002 (the \"code of practice\"), with ISO/IEC 27001 as the ISMS standard you certify against.\n\n**One-line difference:** 27001 = *the system and the certificate* (what an ISMS must have); 27002 = *the menu of controls and guidance* (how to do the controls).\n\n> **Supplementary explanation.** BS 7799 was originally a British Standard. Part 1 became ISO/IEC 17799 and then ISO/IEC 27002; Part 2 (the management system requirements) became ISO/IEC 27001. Auditors use ISO 27001 to certify an ISMS and ISO 27002 to select and describe controls. Annex A of ISO 27001 lists control objectives (for example, A.11 on physical and environmental security, which Topic 4 covers).\n\n#### 3.8.2 NIST security models\n\nNIST has two advantages over ISO (notes): its documents are **publicly available at no charge** and have been **broadly reviewed** by government and industry professionals.\n\n| NIST document | Title (notes) |\n|---|---|\n| SP 800-12 | An Introduction to Computer Security: The NIST Handbook |\n| SP 800-14 | Generally Accepted Principles and Practices for Securing IT Systems |\n| SP 800-18 Rev. 1 | Guide for Developing Security Plans for Federal Information Systems |\n| SP 800-30 Rev. 1 | Guide for Conducting Risk Assessments |\n| SP 800-37 Rev. 1 | Guide for Applying the Risk Management Framework to Federal Information Systems |\n| SP 800-39 | Managing Information Security Risk |\n| SP 800-50 | Building an IT Security Awareness and Training Program |\n| SP 800-55 Rev. 1 | Performance Measurement Guide for Information Security |\n| SP 800-100 | Information Security Handbook: A Guide for Managers |\n| SP 800-53 (Topic 1) | Catalogue of security and privacy controls |\n\n**Memory aid:** link each number to one word: 12 intro, 14 principles, 18 plans, 30 risk assessments, 37 risk management framework, 39 managing risk, 50 awareness and training, 55 measurement, 100 managers.\n\n#### 3.8.3 The NIST Cybersecurity Framework (CSF)\n\n- **Published 2014** in response to an executive order (13636) on critical infrastructure. **Voluntary** and **vendor-neutral**.\n- **What it lets an organization do (5 points):** describe its current posture; describe its target state; identify and prioritise improvements in a continuous, repeatable process; assess progress; communicate about cybersecurity risk with internal and external stakeholders.\n\n**Three components:**\n\n1. **Framework core:** five functions.\n\n| Function | Meaning (notes) | Example |\n|---|---|---|\n| **Identify** | Understand the organization to manage cybersecurity risk to systems, assets, data and capabilities | Asset inventory; risk assessment |\n| **Protect** | Safeguards to ensure delivery of critical services | Access control, training, encryption |\n| **Detect** | Activities to identify a cybersecurity event | Monitoring, logging |\n| **Respond** | Take action about a detected event | Incident response plan |\n| **Recover** | Maintain resilience plans; restore impaired services | Backups, DR plan |\n\n2. **Framework tiers:** the maturity of a security programme.\n\n| Tier | Name | Meaning (notes) |\n|---|---|---|\n| 1 | **Partial** | No formal risk management; activities informal and ad hoc |\n| 2 | **Risk Informed** | Risk management developed but not fully implemented; formal programme just begun |\n| 3 | **Repeatable** | Risk management formally established; documented policy implemented; repeatable programme |\n| 4 | **Adaptive** | Most mature; can quickly adapt to new environments and threats |\n\n3. **Framework profile:** the organization picks the tier it most closely matches and uses the framework recommendations to improve. The profile supports a **gap analysis**: compare current state with desired state, identify the difference, plan the move.\n\n**The seven-step approach (notes):**\n\n| Step | Action |\n|---|---|\n| 1 | **Prioritise and scope:** identify business/mission objectives and priorities |\n| 2 | **Orient:** identify related systems, assets, regulatory requirements and risk approach; identify threats and vulnerabilities |\n| 3 | **Create a current profile:** which Framework outcomes are being achieved now |\n| 4 | **Conduct a risk assessment:** likelihood and impact of a cybersecurity event |\n| 5 | **Create a target profile:** desired cybersecurity outcomes |\n| 6 | **Determine, analyse and prioritise gaps:** compare current vs target; build a prioritised action plan using mission drivers, cost-benefit analysis and risk understanding; determine resources |\n| 7 | **Implement action plan:** act on the gaps; monitor practice against the target profile |\n\n**Worked example (invented): a small bank applies the CSF.**\n\n1. *Scope:* the mobile banking service.\n2. *Orient:* assets = app, servers, customer database; law = data protection act; threats = phishing, SIM swap, DDoS.\n3. *Current profile:* Identify: asset list exists (achieved). Protect: MFA on staff but not customers (partial). Detect: logs are collected but nobody reviews them (not achieved). Respond: no written plan (not achieved). Recover: backups exist, never restored (partial).\n4. *Risk assessment:* ransomware on the database scores 2 × 3 = 6.\n5. *Target profile:* review logs daily; written incident plan tested twice a year; restore test each quarter; MFA for customers.\n6. *Gap analysis:* the gaps are log review, incident plan, restore test, customer MFA. Prioritise by risk: restore test and incident plan first (they limit the ransomware impact), then log review, then customer MFA.\n7. *Implement and monitor.*\nTheir tier is probably **Tier 1 or 2** (informal, partly implemented), with a target of Tier 3 (Repeatable).\n\n### 3.9 Two text diagrams\n\n**Policy hierarchy**\n\n```\n  EISP  (whole organization, strategic: \"we protect information\")\n    |\n    +-- ISSP  (one issue: e-mail and internet use, personal devices ...)\n    |\n    +-- SysSP (one system)\n          +-- Managerial guidance   (\"only the app may reach the database\")\n          +-- Technical spec        (ACLs + firewall rules that do it)\n```\n\n**Policy life cycle (PDCA)**\n\n```\n   PLAN  ---> DO ---> CHECK ---> ACT\n    ^                             |\n    +-----------------------------+\n (Investigation,   (Implement,   (Review,    (Update,\n  analysis, design) distribute)   audit)      correct)\n```\n\n### 3.10 Common misconceptions and exam traps\n\n| Trap | Truth |\n|---|---|\n| \"AUP is a data classification or access policy\" | The **Acceptable Use Policy** defines responsible use of email and internet (an ISSP) (CW1 Q37). |\n| \"Policy writing is expensive\" | The notes say policies are the **least expensive** control but often the **hardest to implement**. |\n| \"A policy only needs management's signature\" | It must also be distributed, read, understood, agreed and uniformly enforced. |\n| \"ISO 27001 and 27002 are the same\" | 27001 = ISMS standard (certification); 27002 = code of practice for controls. |\n| \"BS 7799 is a different standard\" | 27002 derives from ISO 17799, originally BS 7799. |\n| \"NIST CSF is mandatory\" | It is **voluntary** and vendor-neutral. |\n| \"CSF tiers are risk levels\" | They measure **programme maturity** (Partial to Adaptive), not how risky you are. |\n| \"PDCA is a one-off project plan\" | PDCA is a **continuous improvement** cycle (CW1 Q42). |\n| \"EISP and ISSP are the same level\" | EISP is strategic and organization-wide; ISSP covers one issue. |\n| \"SecSDLC is the same as SDLC\" | SecSDLC adds threat and risk identification and the controls at every stage. |\n\n### 3.11 Checklist: reading or writing any policy\n\n1. **Level?** EISP, ISSP or SysSP?\n2. **Purpose and scope?** What and whom does it cover?\n3. **Responsibilities?** Who owns, who complies, who enforces?\n4. **Rules (allowed and prohibited)?**\n5. **Violations and penalties?**\n6. **Review cycle and approval?**\n7. **Does it conflict with law, and could it stand up in court?**\n8. **Was it distributed, read, understood, agreed and enforced?**\n\n### 3.12 Revision summary (Topic 3)\n\n- Policy = organizational guidelines dictating behaviour. Objectives: reduced risk, compliance, continuity/integrity/confidentiality. Least expensive control, often hardest to implement.\n- Rules: never conflict with law; stand up in court; properly supported and administered. Six guidelines: developed, distributed, read, understood, agreed, uniformly enforced.\n- Three types: EISP (strategic), ISSP (issue: email, internet, personal equipment; AUP), SysSP (managerial guidance plus technical specifications: ACLs and configuration rules).\n- Development steps: investigation, analysis, design, implement, maintenance, distribution. PDCA is the continuous improvement loop (supplementary).\n- SecSDLC: investigation/planning, analysis (with risk management), design (logical, physical), implementation, maintenance.\n- ISO: BS 7799 → ISO 17799 → ISO/IEC 27002 (controls guidance); ISO/IEC 27001 (ISMS, certification).\n- NIST: free, widely reviewed; SP 800 series; CSF = core (Identify, Protect, Detect, Respond, Recover), four tiers (Partial, Risk Informed, Repeatable, Adaptive), profile and gap analysis; seven-step approach.\n\n\n---\n\n## PHASE 2 — COMPREHENSION CHECKS (Topic 3)\n\n**C1. Explain, in your own words, why an information security policy is called \"the least expensive means of control but often the most difficult to implement\".**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nWriting a policy needs time and a few meetings, not equipment or licences, so it is cheap compared with a firewall or a monitoring system. It is hard to implement because it depends on **people** reading it, understanding it, agreeing to it and following it, and on management applying it uniformly. Changing behaviour is harder than installing software.\n\n**Check:** cheap to write, costly in effort to make people comply.\n<\/details>\n\n**C2. Why must a policy be able to \"stand up in court\"? What would happen if it could not?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nWhen an employee is disciplined or dismissed for breaching a policy, or when a customer sues after a breach, the policy is evidence of management's due diligence and of what staff were told. If the policy conflicts with the law, was never distributed, or was applied unevenly, the organization cannot rely on it. The employee may win, and the organization may be found negligent.\n\n**Check:** you should have mentioned due diligence, evidence and enforcement.\n<\/details>\n\n**C3. Why does the default-deny rule matter in a firewall rule set? What would happen if it were missing?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nDefault deny blocks everything that was not explicitly allowed. If it were missing, the firewall's behaviour for unlisted traffic would depend on its default setting, which on some devices is \"allow\". An attacker could then reach services nobody intended to expose. A system-specific policy depends on the final deny rule to make \"only what we allow\" true.\n\n**Check:** the final deny rule enforces \"only what is allowed\".\n<\/details>\n\n**C4. How does an ISSP differ from an EISP? Give an original example of each.**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nThe EISP is strategic and covers the whole organization: *\"The hospital protects patient information and assigns the director of IT responsibility for security.\"* The ISSP gives detailed guidance on one issue: *\"Staff may not use personal USB drives on hospital computers; lost drives must be reported within 24 hours.\"* The EISP sets direction; the ISSP gives rules for one technology or behaviour.\n\n**Check:** whole organization/strategic vs one issue/detailed.\n<\/details>\n\n**C5. What does a gap analysis do in the NIST Cybersecurity Framework, and why does the framework need both a current and a target profile?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nA gap analysis compares the current profile (what is achieved now) with the target profile (what the organization wants to achieve), identifies the difference, and produces a prioritised plan to close it. You need both because without a target you cannot say what \"better\" means, and without a current profile you do not know where you are starting.\n\n**Check:** current vs target, then prioritised action plan.\n<\/details>\n\n**C6. What would happen if the \"analysis\" (risk assessment) stage were skipped when developing a policy?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nThe policy would be written without knowing which assets and threats matter. It might regulate trivial things (for example, photocopier use) in detail but say nothing about the loan database or phishing. Resources would be spent on low-risk items, and the policy might fail to address the biggest threats. The notes say risk assessment identifies critical assets and prioritises measures by impact and likelihood.\n\n**Check:** the policy would not be risk-based.\n<\/details>\n\n**C7. Which part of this topic would confuse someone seeing it for the first time?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\n(1) The three policy types look similar until you ask \"how wide is it and who is it for?\". (2) The ISO numbers (BS 7799, 17799, 27001, 27002) because they are one family at different stages. (3) NIST's many SP numbers: learn them by one-word tags. (4) CSF **tiers** (maturity) vs **profile** (current vs target) vs **core** (the five functions). Use the tables in 3.8.\n<\/details>\n\n---\n\n## PHASE 3 — ACTIVE RECALL BANK (Topic 3)\n\n### Level 1 — Basic recall\n\n**Q1.** Define \"policy\" and name the three types of information security policy.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** A policy is a set of organizational guidelines that dictates certain behaviour within the organization. The three types are the enterprise information security policy (EISP, or general program policy), the issue-specific security policy (ISSP) and the system-specific security policy (SysSP).\n\n**Marking:** definition (1), three types (3).\n\n**Common mistake:** naming \"acceptable use policy\" as a type; it is an example of an ISSP.\n<\/details>\n\n**Q2.** List the six guidelines for an effective policy.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Properly developed (industry-accepted practices); distributed (all appropriate methods); read or reviewed by all employees; understood by all employees; formally agreed to by act or assertion; uniformly applied and enforced.\n\n**Marking:** one mark per guideline.\n\n**Common mistake:** listing \"approved by the board\" instead of \"agreed to\" by employees.\n<\/details>\n\n**Q3.** List the policy development steps in the notes, in order.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Investigation (goals, support, participation); analysis (risk assessment); design (components, dissemination); implement (detailed specification); maintenance (regular review); distribution.\n\n**Marking:** order and content (6).\n\n**Common mistake:** placing risk assessment after design.\n<\/details>\n\n**Q4.** Name the five core functions of the NIST Cybersecurity Framework and the four tiers.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Functions: Identify, Protect, Detect, Respond, Recover. Tiers: Partial, Risk Informed, Repeatable, Adaptive.\n\n**Common mistake:** treating the tiers as functions, or reversing Tier 3 and Tier 4.\n<\/details>\n\n**Q5.** List the components of an ISSP.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Statement of purpose (scope and applicability; technology addressed; responsibilities); authorized access and usage of equipment (user access, fair and responsible use, privacy); prohibited usage (disruptive, criminal, offensive material, copyrighted material, other); systems management (stored materials, monitoring, virus protection, physical security, encryption); violations of policy (reporting, penalties); policy review and modification; limitations of liability.\n\n**Marking:** seven headings (7), with sub-items for extra credit.\n\n**Common mistake:** forgetting \"limitations of liability\".\n<\/details>\n\n### Level 2 — Understanding\n\n**Q6.** Distinguish EISP, ISSP and SysSP by level, purpose and one example each.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** EISP: organization-wide, sets strategic direction, scope and tone, assigns responsibilities (example: the bank's overall information security policy). ISSP: one issue or technology, gives detailed guidance on secure use and indemnifies the organization against liability for misuse (example: acceptable use of email and internet). SysSP: one system, gives managerial guidance and technical specifications (example: the firewall rule set or the ACL on the loan database).\n\n**Marking:** three levels (3), three purposes (3), three examples (3).\n\n**Common mistake:** describing SysSP as another general policy; it often looks like a standard or procedure.\n<\/details>\n\n**Q7.** Explain the relationship between ISO/IEC 27001, ISO/IEC 27002, ISO/IEC 17799 and BS 7799.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** BS 7799 was the original British standard. It became ISO/IEC 17799, which was renumbered ISO/IEC 27002 (the code of practice with guidelines and voluntary directions for information security management). ISO/IEC 27001 provides information on how to set up an ISMS and is the standard against which organizations seek certification. It is better used as an assessment tool than an implementation framework.\n\n**Marking:** lineage (2), role of 27002 (1), role of 27001 (2), certification (1).\n\n**Common mistake:** saying 27002 is the certification standard.\n<\/details>\n\n**Q8.** Why do the notes say policies are important reference documents? Give two uses.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** For internal audits, where the auditor compares actual practice with the policy; and for resolving legal disputes about management's due diligence, where the policy shows management's intent and that staff were informed.\n\n**Common mistake:** giving only one use.\n<\/details>\n\n**Q9.** How does SecSDLC differ from the ordinary SDLC? Mention two advantages and two disadvantages.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** The ordinary SDLC focuses on the design and implementation of an information system. SecSDLC adds identification of threats and risks and the controls needed at every stage so security is built in from the start. Advantages: improved security, compliance, risk management, better project management, efficiency. Disadvantages: cost, time-consuming, complexity, inflexibility, limited adaptability to new technology.\n\n**Marking:** difference (2), two advantages (2), two disadvantages (2).\n\n**Common mistake:** saying SecSDLC replaces the SDLC; it runs within it.\n<\/details>\n\n### Level 3 — Application\n\n**Q10.** Classify each statement as EISP, ISSP or SysSP: (a) \"All staff must use only company-approved email for business.\" (b) \"The firewall shall deny all inbound traffic except HTTPS to 10.0.0.5.\" (c) \"The bank is committed to protecting customer data; the CIO is accountable.\" (d) \"Employees may not install personal software on company computers.\"\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** (a) ISSP (email use). (b) SysSP (firewall configuration). (c) EISP (strategic commitment and responsibility). (d) ISSP (use of technology, a prohibited-usage item).\n\n**Marking:** one mark each, one for reasoning.\n\n**Common mistake:** classifying (d) as EISP because it applies to everyone. Scope of people is not the test; the test is whether it is strategic or a rule for one issue.\n<\/details>\n\n**Q11.** A bank discovers that its call-centre staff sometimes share passwords. The policy forbids it. Management says \"We have a policy, so we are covered.\" Using the six guidelines, explain why that statement is weak and name two actions.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** The bank may have developed the policy, but may not have met distribution, understanding, agreement or uniform enforcement. If staff were never trained, never signed it, or are not disciplined when caught, the policy is not effective and may not stand up if challenged. Actions: (1) run training with a short test and require signed acceptance; (2) enforce penalties uniformly and monitor for sharing (for example, simultaneous logins); (3) add technical controls such as MFA so sharing becomes difficult.\n\n**Marking:** reference to the guidelines (2), explanation (2), two actions (2).\n\n**Common mistake:** answering \"write a stricter policy\". The issue is understanding and enforcement, not wording.\n<\/details>\n\n**Q12.** A microfinance has the following status against the CSF core: asset list kept (yes); MFA on staff (partial); logs collected but not reviewed (no); no written incident plan (no); backups made but never restored (partial). Identify the tier it probably sits in, list the gaps and propose a priority order.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Probably **Tier 1 (Partial)** or **Tier 2 (Risk Informed)**: some practices exist but are informal or incomplete. Gaps: Detect (log review), Respond (no incident plan), Recover (untested backups), Protect (MFA coverage). Priority: first the restore test and incident plan, because they limit the damage of the most likely severe event (ransomware); then log review; then extend MFA. Justify the order with likelihood × impact.\n\n**Marking:** tier with reason (2), gaps mapped to functions (3), prioritised plan with justification (3).\n\n**Common mistake:** saying \"Tier 4\" because the organization has some controls.\n<\/details>\n\n**Q13.** Draft an outline for an Acceptable Use Policy for a school's computer lab. Use the ISSP components.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer (outline):** Statement of purpose, scope (students and staff, lab computers), responsibilities. Authorized use (coursework, research, reasonable personal use at set times), privacy. Prohibited use (disruptive or criminal use, offensive material, pirated software, unauthorized access). Systems management (virus protection, monitoring of lab use, storage cleared weekly). Violations (how to report, penalties). Review (annually). Limitation of liability (school not responsible for personal data left on lab machines).\n\n**Marking:** each ISSP component addressed with a relevant line (7), clear and practical wording (1).\n\n**Common mistake:** writing a general mission statement instead of enforceable rules.\n<\/details>\n\n### Level 4 — Exam mastery\n\n**Q14.** \"A policy is only as good as its enforcement.\" Discuss with reference to the notes' guidelines for effective policy and the courts. (10 marks)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer outline:**\n1. *Position:* largely true, but enforcement is one of six conditions.\n2. *Notes' guidelines:* a policy must be developed properly, distributed, read, understood, agreed to and uniformly applied and enforced.\n3. *Why enforcement matters:* uneven enforcement undermines credibility and legal standing: a court asks whether the rule was known, agreed and applied consistently. Selective enforcement can be treated as evidence the rule was not real.\n4. *Why enforcement is not enough:* an enforced policy that is badly written, conflicts with law, or has never been communicated still fails the \"stand up in court\" test.\n5. *Link to cost:* policies are cheap to write but hard to implement, since the effort is in making compliance real.\n6. *Link to audit:* auditors test enforcement by sampling evidence (for example, signed acceptances, training records, sanctions).\n7. *Conclusion:* enforcement is necessary, not sufficient.\n\n**Marking criteria:** position (1), list of guidelines (2), enforcement reasoning (2), counter-argument (2), audit link (2), conclusion (1).\n\n**Common mistake:** discussing enforcement without mentioning communication or understanding.\n<\/details>\n\n**Q15.** A regional bank must create a policy framework and a plan to keep it current. Propose (a) the three policy types it needs with one example each, (b) the development steps it will follow, and (c) how PDCA keeps the policies up to date, including two measures of success. (12 marks)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer outline:**\n(a) *EISP:* bank-wide statement approved by the board with roles. *ISSP:* acceptable use of email and internet; use of personal devices. *SysSP:* firewall configuration and ACLs for the core banking system (managerial guidance plus technical specification).\n(b) *Steps:* investigation (set goals, secure board and IT support, include departments); analysis (risk assessment of threats and vulnerabilities); design (components such as access control, data classification, incident response, and a dissemination plan); implement (detailed plan with owners and timelines); distribution (to all staff, with acceptance); maintenance (review).\n(c) *PDCA:* Plan = objectives and risk-based policy design; Do = implement and communicate; Check = audits, spot checks, incident analysis; Act = update policy and retrain. *Measures of success:* percentage of staff with signed acceptance and passing the awareness quiz; number of policy violations and time to resolve; audit findings closed on time; policy reviewed within the agreed cycle.\n\n**Marking criteria:** three types with examples (3), development steps (3), PDCA mapping (3), two measures (2), coherence (1).\n\n**Common mistake:** treating the policy as finished at distribution, without a review cycle.\n<\/details>\n\n\n---"}, {"id": "t4", "t": "TOPIC 4 — Domains of IT Security", "s": "4 · Domains of IT Security", "g": "Topics", "c": "#7c3aed", "k": "4", "md": "# TOPIC 4 — Domains of IT Security\n\n**Classification:** Difficult/High-risk (access control models, network attacks, firewalls), Core (application, hardware, physical security)\n**Sources:** Domains, access, Telecom deck; Sec SDLC deck (ISO 27001 Annex A.11, physical and environmental security).\n**Coverage warning:** the outline lists more domains than the notes cover. Access control, application security, hardware security, network and telecom security and physical security are covered. **Internet access, e-mail, outsourcing, software and hardware acquisition, BCP/DRP, security organization structure and the domain case studies have no dedicated notes**; I explain them in Section 4.9 as Supplementary explanation.\n**Outline items:** (a) user/accepted usage/access, data access, physical access; (b) Internet access, e-mail, digital signature; (c) outsourcing, software development and acquisition, hardware acquisition; (d) network and telecom, BCP and DRP, security organization structure; (e) domain-related case studies.\n**CW2 link:** areas (f) segregation of duties and access rights, (g) VAPT, (i) authentication, authorisation and accounting all use this topic.\n\n## PHASE 1 — UNDERSTANDING\n\n### 4.1 The big picture\n\nA \"domain\" is an area of the organization where security controls apply: who gets in (access), the software people run, the hardware it runs on, the network it travels across, the buildings it sits in. Topic 1 listed these areas briefly; Topic 4 shows how each works and fails.\n\n**Where it connects.** Backward: Topic 2's attacks (SQL injection, SYN flood, MitM) are explained here at the level where they actually happen. Topic 3's policy turns into ACLs and firewall rules here. Forward: Topic 7 classifies all of these as general controls and application controls; Topic 6 and CW2 audit them.\n\n### 4.2 Access control\n\n**Definition (notes).** Access control is a system that enables an authority to control access to areas and resources in a physical facility or computer-based information system. In computer security it includes **authentication, authorization and audit**. It also includes physical devices (biometric scans, metal locks), hidden paths, digital signatures, encryption, social barriers and monitoring by humans and automated systems.\n\n**Vocabulary:**\n\n| Term | Meaning | Example |\n|---|---|---|\n| **Subject** | An entity that performs actions: a user, owner or program (software or human) | Mary; a payroll program |\n| **Object** | A resource whose access is controlled: memory, file, directory, hardware, software | The loan table |\n| **Access mode** | The type of access: read, write, execute | Read |\n| **Access control policy** | Specifies the authorized accesses | \"Tellers may read customer balances\" |\n| **Access control mechanism** | Implements and enforces the policy | The ACL and the login system |\n\n**Why separate policy from mechanism?** (notes) You can define requirements independently of implementation, compare different policies, and build mechanisms that can enforce a wide range of policies.\n\n**Requirements (notes):** access control **cannot be bypassed**; it enforces **least privilege and need-to-know**; it enforces **organizational policy**. It protects against both accidental and malicious threats by regulating reading, writing and execution. It needs proper user identification and authentication, and the information specifying access rights must be protected from modification.\n\n#### 4.2.1 Identification, authentication, authorization and accountability, step by step\n\nAccess control systems provide the essential services of **identification and authentication (I&A)**, **authorization** and **accountability**.\n\n**Walk through one login to the core banking system:**\n\n1. **Identification.** Mary enters her user ID `mary.n`. The only requirement for an identifier is that it must be **unique within its security domain**.\n2. **Authentication.** She proves the claim. I&A verifies that an identity is **bound to the entity** making the claim. (The notes also say I&A assumes an earlier **identity proofing**, for example showing a government ID when the account was created.)\n3. **Authorization.** The system decides **what she can do**: for example, read customer balances and post deposits.\n4. **Accountability.** The system records **what she did**: \"mary.n posted deposit 150,000 to account 4471 at 10:42\". Later, an auditor can trace it.\n\n**Four authentication factors (notes):**\n\n| Factor | Meaning | Example |\n|---|---|---|\n| **Something you know** | Assumes only the owner knows it | Password, PIN |\n| **Something you have** | Assumes only the owner holds it | Smart card, security token |\n| **Something you are** | Biometrics | Fingerprint, voice, retina, iris |\n| **Where you are** | Location | Inside or outside the firewall; proximity to a personal GPS device |\n\n**Multi-factor authentication** combines two or more different factors (for example, password plus a phone code, CW1 Q31). Two passwords are not MFA; both are \"something you know\".\n\n**Authorization permission types (notes):** most operating systems build on three basic accesses:\n\n| Permission | The subject can |\n|---|---|\n| **Read (R)** | Read file contents; list directory contents |\n| **Write (W)** | Change contents of a file or directory: add, create, delete, rename |\n| **Execute (X)** | Run the file if it is a program (for a directory in Unix, \"traverse\" it) |\n\n#### 4.2.2 Two ways to store access rights: ACLs and capabilities\n\n| | **ACL-based** | **Capability-based** |\n|---|---|---|\n| Where the rights are kept | A list attached to the **object**: \"who may access me\" | A token held by the **subject**: \"what I may access\" |\n| How access is decided | Is the subject's identity on the object's list? | Does the subject hold an **unforgeable reference** to the object? |\n| Passing access on | Edit the list | Transmit the capability over a secure channel |\n\n**Concrete:** the ACL on the loan table lists `loan officers: read, create`. In a capability system, a program holds a token \"read loan table\" and can read it merely by presenting the token.\n\n#### 4.2.3 The three access control models\n\n**1. Discretionary Access Control (DAC).** The **owner** of an object decides who may access it and with what privileges. Every object has an owner (usually its creator). Access is based on the user's identity and access control rules.\n\n*Worked example:* Alice creates `budget.xlsx`. She is the owner. She grants Bob read and Chen read-write. Bob cannot change it. If Alice wants, she can also let Bob pass permission on to others.\n- *Advantages (notes):* intuitive, easy to implement.\n- *Disadvantages (notes):* inherent vulnerability (a user who has access might pass it on, or a program run by Alice might do so without her knowing); maintaining ACL or capability lists; maintaining grant/revoke; limited power of negative authorization.\n\n**2. Mandatory Access Control (MAC).** The **system**, not the owner, decides. Used in **multilevel systems** handling highly sensitive data, such as classified government and military information.\n\n- Every subject and object has a **label**. A subject's label is its **clearance** (level of trust). An object's label is its **classification** (level of trust required).\n- **Rule:** a subject can read an object only if the subject's label **dominates** the object's label (level equal or higher, and covers the required categories).\n- Import and export (for example to printers) must keep labels intact.\n\n*Worked example (from the notes' format).* The object `grades` has label `(confidential, {student-info})`.\n\n| Subject | Subject's label | Reads `grades`? | Why |\n|---|---|---|---|\n| Joe | (confidential, {student-info}) | **Yes** | Level equal, category covered |\n| Sue | (public, {student-info}) | No | Level too low |\n| Tom | (secret, {student-info}) | **Yes** | Level higher, category covered |\n| Ann | (confidential, {finance}) | No | Level equal but category not covered |\n\nNobody, including the owner of `grades`, can override the rule. That is what makes it \"mandatory\".\n\n**3. Role-Based Access Control (RBAC).** The **system** decides, and access is based on **roles**. Used in commercial applications and in military systems. A role is **a set of permissions** that can include complex operations (for example, an e-commerce transaction) or simple read or write. RBAC differs from DAC because users cannot control access to their own resources. It differs from MAC mainly in how permissions are handled: MAC compares clearance labels; RBAC assigns collections of permissions to roles.\n\n*Motivation (notes):* multi-user and multi-application systems; permissions attach to roles; role-permission assignments persist while users come and go; intuitive because it follows competence, authority and responsibility.\n\n**Three primary RBAC rules (notes):**\n\n1. **Role assignment:** a subject can execute a transaction only if it has selected or been assigned a role.\n2. **Role authorization:** a subject's active role must be authorized for that subject.\n3. **Transaction authorization:** a subject can execute a transaction only if the transaction is authorized for the subject's active role.\nRoles can form a **hierarchy**: higher-level roles inherit the permissions of sub-roles. Additional constraints may apply.\n\n*Worked example (invented): a bank.*\n\n| Role | Permissions |\n|---|---|\n| Teller | View balance; post deposit; post withdrawal up to limit |\n| Loan officer | Create loan; modify loan |\n| Branch manager | Approve loan; approve large withdrawals (inherits Teller permissions) |\n| Auditor | Read all; change nothing |\n\nApply the three rules to a new employee, Peter:\n1. Peter is assigned the Teller role. (Rule 1.)\n2. Peter's active role, Teller, is one he is authorized for. (Rule 2.) He cannot activate \"Branch manager\".\n3. He tries to approve a loan. That transaction is not authorized for Teller, so it is refused. (Rule 3.)\nWhen Peter is promoted, the administrator changes his role. Nobody edits individual permissions.\n\n**Comparison table (high-yield):**\n\n| | **DAC** | **MAC** | **RBAC** |\n|---|---|---|---|\n| Who sets the policy | **Owner** of the object | **System** | **System** (administrator) |\n| Based on | Identity and owner-defined rules | Labels: clearance vs classification | Roles (sets of permissions) |\n| Typical use | Ordinary file sharing | Government, military, multilevel systems | Commercial and business systems |\n| Strength | Flexible, easy | Strong control of flow of classified information | Simple to manage at scale; fits job structure |\n| Weakness | Owner mistakes, hard to maintain; inherent vulnerability | Rigid, complex to run | Role design and role \"creep\" need care |\n| Discretionary? | Yes | No | No (non-discretionary) |\n\n**Memory aid:** DAC = **D**ata owner **D**ecides. MAC = **M**achine/system **M**andates with labels. RBAC = **R**oles bundle the rights.\n\n### 4.3 Application and software security\n\n**Starting point (notes).** Any discussion of security should start with an inventory of the **stakeholders** (owners, companies), their **assets** (data, service, customer information), the **threats** to those assets (erase, steal) and the **attackers** (employees, clients, script kiddies, criminals). \"Any discussion of security without understanding these issues is meaningless.\"\n\n**Security goals (notes).** CIA, plus more concrete goals: **traceability and auditing** (forensics), **monitoring** (real-time auditing), **multilevel security**, **privacy and anonymity**, and the meta-property of **assurance** (that the goals are met).\n\n**How to realise the objectives: AAAA (notes):**\n\n| A | Meaning | Also called |\n|---|---|---|\n| Authentication | Who are you? | |\n| Access control / Authorization | Control who is allowed to do what (needs a specification) | |\n| Auditing | Check if anything went wrong | **Detection** |\n| Action | If so, take action | **Reaction** |\n\nThe notes also call the whole set **prevention, detection, reaction**: measures to **stop** breaches, to **detect** them, and to **recover assets, repair damage and prosecute offenders**. \"Good prevention does not make detection and reaction superfluous.\"\n\n**Threat to security requirement (notes):**\n\n| Threat | Requirement violated |\n|---|---|\n| Information disclosure | Confidentiality |\n| Tampering with information | Integrity |\n| Denial of service | Availability |\n| Spoofing | Authentication |\n| Unauthorized access | Access control |\n\n**Countermeasures can be non-IT (notes):** physical security of the building, screening of personnel, a legal framework to deter criminals, employee training.\n\n**Software security (notes).** Engineering software so that it **continues to function correctly under malicious attack**. Facets: security i
