n the software development life cycle; engineering and design principles; security technologies; and also understanding the attacker's methods, tools and resources.\n\n**Three sources of software vulnerabilities (notes), with concrete cases:**\n\n| Source | Meaning | Concrete example |\n|---|---|---|\n| **Bugs** in the application or its infrastructure | It doesn't do what it should | An access flag (for example, `isAdmin=false`) can be changed by user input, so any user can make themselves an administrator |\n| **Inappropriate features** in the infrastructure | It does something it shouldn't | A search function that can display other users' information |\n| **Inappropriate use of features** provided by the infrastructure | The developer uses a feature unsafely | Building an SQL query by pasting user text into it (Topic 2) |\n\n**Main causes:** complexity of the features; functionality winning over security; ignorance of developers.\n\n### 4.4 Hardware security\n\n**Definition (notes).** Vulnerability protection that comes as a physical device rather than software (for example, **hardware firewalls and proxy servers**). It can provide stronger security than software and an extra layer for mission-critical systems. It also means protecting physical systems from harm, including equipment destruction attacks on computing devices and on networked non-computing devices such as IoT.\n\n**Types of hardware attacks (notes):**\n\n| Attack | How it works | Concrete case |\n|---|---|---|\n| **Rowhammer** | Repeated access (\"hammering\") of DRAM memory cells releases electrical charge that flips neighbouring bits | A program with no special rights alters memory it should not reach |\n| **Evil maid** | Physical access to an unattended device, which is altered stealthily | Someone inserts a USB with modification software into a powered-down laptop, or installs a keylogger, while you are out of the hotel room |\n| **Modification** | Overrides a device's restrictions, enabling man-in-the-middle | A tampered network device |\n| **Counterfeit hardware** | A supply chain attack where fake devices are sold to organizations | A router bought from an unknown reseller with a hidden backdoor |\n| **Eavesdropping** | Subtle interception while sensitive data (card numbers, passwords) moves between devices | A tap on a cable or wireless link |\n\n**Mitigation (notes):**\n\n1. **Investigate vendors and suppliers** (risk starts at inception; check the vendor's own suppliers and manufacturing).\n2. **Encrypt all devices**, including external flash storage and DRAM interfaces; especially portable devices.\n3. **Minimise the attack surface:** safely decommission unused hardware and disable debug ports.\n4. **Enforce strong physical security** in areas housing equipment; do not leave devices unattended.\n5. **Provide real-time monitoring** (including cloud-based tools that notify teams quickly).\n6. **Update firmware and upgrade old hardware** so it receives security patches.\n\n### 4.5 Physical access: ISO 27001 Annex A.11 (physical and environmental security)\n\n**Purpose (notes).** Ensure secure physical and environmental areas. The objective is to **prevent unauthorized physical access, damage and interference** to the organization's information and information processing facilities. Two objectives: **secure areas** and **equipment security**.\n\n| Control | What it requires (notes) | Concrete example |\n|---|---|---|\n| **Physical security perimeter** | Define perimeters and boundaries around areas with sensitive information and processing facilities; consider data centres, head office, home workers | A fence and guarded gate around the data centre |\n| **Physical entry controls** | Only authorized personnel enter; select controls by the nature and location of the area; grant, test, monitor and log access; control visitors; extra protection for key IT equipment | Badge reader plus PIN on the server room; visitor log; biometrics for the most sensitive areas |\n| **Securing offices, rooms and facilities** | Review who has access, when and how; consider who can see or hear in from outside; update access when staff leave or transfer; escort visitors; staff challenge unrecognised people | Frosted windows on the finance office; remove a leaver's badge on their last day |\n| **Protecting against external and environmental threats** | Protect against natural (floods, lightning) and man-made (water leakage, civil unrest) threats; identify, assess and treat risks | No server room in a basement on a flood plain; fire suppression |\n| **Working in secure areas** | Procedural controls inside the area: restricted awareness of location, restrictions on recording equipment, no unsupervised working where possible, in-and-out logging | No phones allowed in the vault |\n| **Delivery and loading areas** | Control, and if possible isolate from processing facilities | Delivery bay away from the server room; CCTV; do not open internal and external doors at the same time |\n| **Equipment siting and protection** | Site to reduce environmental risk and unauthorized access; restrict screen viewing angles; lock storage; keep food and drink away | Screens at the bank counter angled away from customers |\n| **Supporting utilities** | Protect from power failures: dual supplies, backup generators, regular testing; telecoms: dual routing, load balancing, redundancy | UPS and generator for the data centre |\n| **Cabling security** | Protect power and telecom cabling from interception, interference or damage; underground or protected; separate cables by data sensitivity; inspect termination points | Network cables in conduit, away from power cables |\n| **Equipment maintenance** | Maintain at suitable frequencies; keep maintenance schedules as evidence | Quarterly service log for the UPS |\n| **Securing equipment off-premises** | Protect equipment taken outside the organization | Laptop locked in the boot and encrypted |\n| **Secure disposal or reuse** | Verify that sensitive data and licensed software are removed or securely overwritten; physically destroy or securely wipe | Hard drives from retired servers are shredded |\n| **Clear desk and clear screen policy** | No sensitive papers or open sessions left unattended | Lock the screen when leaving; clear the desk at close |\n\n**Why some of these are exam favourites:** *tailgating* (Topic 2) is stopped by entry controls and by staff challenging strangers; *poor disposal* is \"another area of common vulnerability where many incidents have arisen\" (notes); *cabling* is often forgotten.\n\n\n### 4.6 Network and telecom security\n\n**Telecommunications (notes):** the electronic transmission of signals for communications (telephone, radio, television). The **telecommunication medium** is anything that carries an electronic signal and interfaces between a sending and receiving device.\n\n#### 4.6.1 The OSI reference model\n\nAdopted by ISO in 1984. It defines standard protocols for communication and interoperability using a **layered approach**.\n\n**Advantages (notes):** clarifies the functions of a communication process; reduces complex networking processes; promotes interoperability through standard interfaces; aids development; makes troubleshooting easier and more logical.\n\n| Layer | Name | What happens here (supplementary, for understanding) | Firewall/attack link |\n|---|---|---|---|\n| 7 | Application | The programs people use talk to the network (web, email) | Application-level proxy; XSS, SQLi |\n| 6 | Presentation | Format and encryption of data | |\n| 5 | Session | Starting, keeping and ending a conversation | Circuit-level proxy |\n| 4 | Transport | Reliable delivery, ports (TCP/UDP) | SYN flood; stateful inspection |\n| 3 | Network | Addressing and routing (IP addresses) | Packet filtering; IP spoofing |\n| 2 | Data link | Delivery inside a local network using MAC addresses | ARP poisoning |\n| 1 | Physical | Signals over cables or radio | Cable tapping |\n\n**Memory aid (top to bottom):** **A**ll **P**eople **S**eem **T**o **N**eed **D**ata **P**rocessing.\n\n#### 4.6.2 Network attacks (from the notes), step by step\n\n**A. SYN flood (a denial-of-service attack).**\n\nFirst, how a normal connection starts (the TCP three-way handshake):\n\n1. Client sends **SYN** (\"I want to connect\").\n2. Server replies **SYN-ACK** (\"OK\") and keeps a half-open entry in a waiting list.\n3. Client sends **ACK**. The connection is complete and the entry is removed from the waiting list.\n\n**The attack.** The attacker sends a succession of SYN requests, often with forged source addresses, and never sends the final ACK.\n\n*Illustrative numbers:* suppose the server's waiting list holds 128 half-open entries and each waits 60 seconds. The attacker sends 200 SYN packets per second.\n- In under one second, the list is full.\n- Every new SYN, including from real customers, is dropped.\n- The server is up but \"unresponsive to legitimate traffic\" (notes). This is an attack on **availability**.\n\n**B. ARP poisoning.** ARP maps an IP address to a MAC address on a local network.\n\n**Normal behaviour (illustrative):**\n\n| Computer A's ARP cache | |\n|---|---|\n| 192.168.1.1 (gateway) | MAC = **AA:AA** (the real router) |\n\n**The attack.** The attacker (MAC **EE:EE**) sends **forged ARP request and reply packets** claiming \"192.168.1.1 is at EE:EE\". Computer A updates its cache:\n\n| Computer A's ARP cache (after) | |\n|---|---|\n| 192.168.1.1 (gateway) | MAC = **EE:EE** (the attacker) |\n\nNow A's traffic to the internet goes to the attacker. The attacker can **read it and forward it** (man-in-the-middle, stealing data), or **drop it** (denial of service). The notes say ARP poisoning is very effective against both wireless and wired local networks.\n\n**C. DNS poisoning (spoofing).** The attacker exploits weaknesses in a domain name server to divert traffic from legitimate servers to fake ones. *Example:* a user types the bank's web address; the poisoned server returns the attacker's IP; the user lands on a look-alike site and enters credentials. Poisoning code is often spread through URLs in spam, banner ads and images on untrustworthy sites.\n\n**D. Network sniffing.** Software (or a hardware device) called a **sniffer** monitors data flowing over network links **in real time**, taking snapshot copies **without redirecting or altering it**. It is **passive**, which is why it is hard to detect. Defence: **encryption**, so captured data is unreadable.\n\n**E. IP spoofing.** The attacker impersonates another machine by modifying the packet header with a forged source IP address (and a checksum and order value). Used for denial of service and man-in-the-middle while hiding identity; also DDoS and Smurf attacks. The firewall defence in the notes is **ingress filtering** (see below).\n\n| Attack | Layer | Hits | One-line identifier |\n|---|---|---|---|\n| SYN flood | Transport | Availability | Many half-open connections |\n| ARP poisoning | Data link | Confidentiality, availability | Forged MAC mapping on a LAN |\n| DNS poisoning | Application (DNS) | Confidentiality, integrity | Right name, wrong destination |\n| Sniffing | Any | Confidentiality | Passive copy of traffic |\n| IP spoofing | Network | Authentication; enables DoS/MitM | Forged source address |\n\n#### 4.6.3 Virtual Private Networks (VPNs)\n\n**Definition (notes):** a private network that uses a public network to connect remote sites or users together.\n\n**Three concepts (notes):**\n\n| Concept | Meaning |\n|---|---|\n| **Encapsulation** | Inclusion of one data structure within another |\n| **Encryption** | Hiding of real information |\n| **Tunneling** | A virtual path that delivers a packet |\n\n**Walk-through (illustrative): a loan officer working from home.**\n1. Her laptop creates a normal packet for the loan system.\n2. The VPN software **encrypts** it so nobody on the café Wi-Fi can read it.\n3. It **encapsulates** the encrypted packet inside a new packet addressed to the bank's VPN gateway.\n4. The packet crosses the internet through the **tunnel**.\n5. The gateway removes the outer packet, decrypts and delivers the inner packet to the loan system.\nA VPN is therefore a defence against sniffing and man-in-the-middle on untrusted networks (CW1 Q3).\n\n**Features (notes):** security, reliability, scalability, network management, policy management. **Benefits (notes):** extends geographic connectivity, improves security, improves productivity, simplifies network topology, global networking opportunities, broadband compatibility, faster return on investment than a traditional WAN.\n\n#### 4.6.4 Firewalls\n\n**Definition (notes):** a system that prevents unauthorized access to or from a network and controls the flow of traffic.\n\n**Seven firewall types (notes):** packet filtering; proxy firewall; application-level proxy; circuit-level proxy; stateful inspection; dynamic packet filtering; kernel proxy.\n\n| Type | Works at | What it decides on | Strength / weakness |\n|---|---|---|---|\n| **Packet filtering** | Network layer | Source IP, destination IP, protocol, source and destination ports, interface | Fast and simple; does not understand connections or content |\n| **Application-level proxy** | Application layer | Inspects **content, payload and header**; no direct communication (a proxy agent sits between); can require user authentication | Deep inspection; slower |\n| **Circuit-level proxy** | Session layer | Creates a circuit between client and server; decides on header information (source and destination addresses) | Faster than application-level proxy; does not inspect content |\n| **Stateful inspection** | Network and transport layers | Like packet filtering but keeps a **state table**: tracks connection state and blocks packets that deviate from the expected state | Understands conversations |\n| **Dynamic packet filtering / kernel proxy** | Kernel level | Fifth-generation firewall; builds a **new virtual network stack** per packet containing only the protocol proxies needed to examine that packet; speed of packet filtering | Customised, fast |\n\n**Ingress vs egress filtering (notes):** **ingress** = blocking *inbound* traffic; **egress** = blocking *outbound* traffic.\n\n**Walk through the difference between a packet filter and a stateful firewall (illustrative):**\n\nA packet arrives from the internet: source 203.0.113.9 port 443, destination 10.0.1.20 port 51000.\n- **Packet filter:** checks the rule list. A rule says \"allow port 443 traffic\". It passes. It does not ask whether anyone inside asked for this.\n- **Stateful firewall:** looks in its state table. It finds no entry showing that 10.0.1.20 started a connection to 203.0.113.9. This looks like an unsolicited packet, **not the expected state**. It drops it.\n\n**Ingress filtering against IP spoofing (illustrative):** a packet arrives from the internet claiming source address 10.0.1.5, which is an **internal** address. No genuine external packet can have that source. The ingress rule drops it.\n\n#### 4.6.5 Intrusion detection systems (IDS)\n\n**Definition (notes):** a system that **detects and logs inappropriate, incorrect or anomalous activity.**\n\n**Types:** **network-based IDS** (watches network traffic) and **host-based IDS** (watches one computer).\n\n**Methods (notes):**\n\n| Method | How it detects |\n|---|---|\n| **Pattern matching / signature-based** | Compares activity to known attack patterns |\n| **Anomaly detection** | Flags any abnormality from normal behaviour |\n| **Protocol behaviour** | Checks correct usage of a protocol |\n\n**Four events (notes), with a worked count.**\n\n| | Attack traffic | Normal traffic |\n|---|---|---|\n| **Alert raised** | **True positive:** real attack, alert | **False positive:** normal traffic, alert |\n| **No alert** | **False negative:** real attack, no alert | **True negative:** normal traffic, no alert |\n\n*Illustrative day:* the IDS sees 10,000 events. 20 are real attacks and 9,980 are normal. It raises 25 alerts: 18 for real attacks and 7 for normal traffic.\n- True positives = 18; false negatives = 20 − 18 = **2** (the dangerous ones, attacks missed).\n- False positives = 7; true negatives = 9,980 − 7 = 9,973.\n\n**Which is worse?** A **false negative** lets an attack through silently. Too many **false positives** swamp analysts, who then start ignoring alerts. Tuning is a trade-off.\n\n> **Supplementary explanation: IDS vs IPS vs firewall.** A firewall **blocks or allows** traffic by rules. An IDS **detects and logs** (and alerts). An IPS (intrusion prevention system) detects **and blocks**. The notes use \"IDS/IPS\" together in Topic 1.\n\n### 4.7 Text diagram: where the domains sit\n\n```\n                  +---------------- PEOPLE & POLICY (Topic 3) ---------------+\n                  |                                                          |\n Physical access --+-- Access control (I&A, authorization, accountability) --+-- Application/software security\n (Annex A.11)      |    DAC / MAC / RBAC                                      |    (bugs, features, AAAA)\n                   |                                                          |\n                   +---------- Hardware security (devices, firmware) --------+\n                   |                                                          |\n                   +---------- Network and telecom security ------------------+\n                        OSI layers | firewalls | VPN | IDS | attacks\n```\n\n### 4.8 The access control decision, as a flowchart\n\n```\n Request: subject S wants mode M on object O\n        |\n        v\n [Identified and authenticated?] --no--> DENY (log the failure)\n        | yes\n        v\n [Which model applies?]\n   DAC : is S on O's access list (set by owner) with mode M?\n   MAC : does label(S) dominate label(O)?\n   RBAC: is M on O authorized for S's active role?\n        |\n        +-- no  --> DENY (log)\n        |\n        yes\n        v\n ALLOW  --> log the action (accountability)\n```\n\n### 4.9 Domains the notes do not cover (Supplementary explanation)\n\n> Everything in this section is **Supplementary explanation**. The outline lists these items but your decks contain no slides on them. Where your lecturer teaches them differently in class, follow the lecturer.\n\n#### 4.9.1 Internet access and e-mail\n\n**Purpose of controls:** the internet and email are the biggest everyday entry points for the threats in Topic 2 (phishing, malware, data leaks).\n\n| Control | What it does |\n|---|---|\n| Acceptable use policy (an ISSP, Topic 3) | States what staff may and may not do online |\n| Web filtering | Blocks categories of sites and known malicious sites |\n| Email gateway scanning | Scans attachments and links for malware and phishing |\n| Monitoring and logging | Records internet and email use for investigation (disclosed in the policy) |\n| Encryption for sensitive email | Protects confidentiality in transit |\n| Data loss prevention | Stops sensitive data being sent out |\n| Training | Staff recognise phishing and reporting routes |\n\n#### 4.9.2 Digital signatures, step by step (CW1 Q34, Q44)\n\nA digital signature proves **integrity** and **authenticity**, and supports **non-repudiation**.\n\n**Sender:**\n1. Compute a **hash** of the contract (a fixed-size fingerprint).\n2. **Sign** the hash with the sender's **private key**. The result is the digital signature.\n3. Send the contract plus the signature.\n\n**Receiver:**\n4. Compute a hash of the contract received.\n5. Use the sender's **public key** to open the signature and recover the hash the sender signed.\n6. **Compare:** if the two hashes match, the contract was not altered (integrity), it was signed by the holder of that private key (authenticity), and that holder cannot later deny it (non-repudiation), because only they hold the private key.\n\n**What a digital signature does not do:** it does not hide the contract. It is about proof, not secrecy.\n\n#### 4.9.3 Outsourcing\n\n**Idea:** buying a service or function from an external supplier. In your Sec SDLC notes, the decision to outsource is made in the **logical design** stage.\n\n**Risks:** supplier staff access your data; supplier breach affects you; unclear responsibility; supplier failure; lock-in; legal exposure.\n**Controls:** due diligence before choosing; a contract with **security requirements, a service level agreement and a right to audit**; data protection clauses; access limited by least privilege; monitoring and reporting; an **exit plan**.\n**Principle:** you can outsource the task but not the accountability.\n(CW1 Q27 lists \"outsourcing all IT operations\" as a wrong answer for how an ISMS achieves its objectives.)\n\n#### 4.9.4 Software development and acquisition, hardware acquisition\n\n- **Software development:** use the SecSDLC from Topic 3, so security is built in; test security; control changes (Topic 5).\n- **Software acquisition (buying):** define requirements including security; evaluate vendors; test before acceptance (acceptance testing); agree licensing and support; plan updates.\n- **Hardware acquisition:** your notes' hardware mitigation list applies: **investigate vendors and suppliers**, avoid counterfeit hardware, check delivery conditions, record assets in an inventory, and make sure firmware can be patched.\n\n#### 4.9.5 Business continuity (BCP) and disaster recovery (DRP)\n\n| | **BCP** | **DRP** |\n|---|---|---|\n| Focus | Keeping **critical business functions** running during and after a disruption | Restoring **IT systems and data** after a disaster |\n| Scope | Whole business (people, premises, processes, IT) | The IT part of continuity |\n| Example | Branches continue serving customers manually while systems are down | Core banking restored from backup at the recovery site |\n\n**Key ideas:**\n- **Business impact analysis (BIA):** identifies critical functions and the cost of losing them.\n- **RTO (recovery time objective):** how long a system can be down. **RPO (recovery point objective):** how much data loss is tolerable.\n *Worked example:* RPO = 1 hour means backups or replication must happen at least hourly. RTO = 4 hours means the system must be running again within 4 hours of the failure.\n- **Backups:** the **3-2-1 rule** is three copies of data, on two different media types, with one copy offsite. It protects **availability** (CW1 Q30).\n- **Alternate sites:** *hot* (ready, minutes), *warm* (partly ready, hours to days), *cold* (empty space, days to weeks).\n- **Testing:** an untested plan is not a control. Tests range from reading the plan through, to a table-top exercise, to simulation, to a full failover. Notes elsewhere stress \"develop **and test** a DRP\" (Topic 1) and an operational and tested IT continuity plan (Topic 7).\n\n#### 4.9.6 Security organization structure\n\n| Role | Responsibility |\n|---|---|\n| Board and senior management | Approve policy, set direction, provide resources |\n| IT steering committee | Users and IT together prioritise and oversee IT (Topic 7) |\n| Information security manager / CISO | Runs the security programme; reports to senior management |\n| Data owners | Decide classification and who may access their data |\n| Custodians (IT) | Operate the controls on the owners' behalf |\n| Users | Follow policy; report incidents |\n| Internal audit | Independently checks that all of the above works |\n\n**Principle:** security should report high enough in the organization to have authority and independence from the IT operations it oversees.\n\n#### 4.9.7 Domain-related case studies: a method and two small cases\n\n**Method for any domain case (four questions):**\n1. **Which domain failed?** (access, physical, network, application, hardware, outsourcing, continuity)\n2. **What was the weakness and what exploited it?**\n3. **Which control was missing or weak?**\n4. **What recommendation fixes it, and what evidence would an auditor want?**\n\n**Case A (invented). A contractor tailgates into a server room.** A contractor follows an employee through the badge door of the server room, plugs a device into an open network port, and leaves.\n1. *Domains:* physical access and network.\n2. *Weakness:* the entry control relied on staff behaviour (tailgating), and there was no monitoring or port security.\n3. *Missing controls:* anti-tailgating measures (a mantrap, staff challenge culture), visitor and contractor escorting, in-and-out logging (Annex A.11 working in secure areas), disabled unused network ports, network access control, CCTV review.\n4. *Evidence an auditor wants:* visitor logs, badge logs, CCTV, port configuration, awareness training records.\n\n**Case B (invented). An outsourced call centre leaks customer data.** A vendor's agents share one login, and customer files are downloaded to personal USB sticks. The bank has no right to audit in the contract.\n1. *Domains:* outsourcing, access control, data protection.\n2. *Weakness:* shared logins break accountability; USB sticks break confidentiality; no contractual oversight.\n3. *Missing controls:* unique IDs and MFA; endpoint control that blocks USB; DLP; a contract with security clauses, a right to audit and breach notification; periodic review of the vendor.\n4. *Evidence:* contract, access reviews, logs, vendor audit reports.\n\n### 4.10 Common misconceptions and exam traps\n\n| Trap | Truth |\n|---|---|\n| \"DAC, MAC and RBAC are all owner-controlled\" | Only **DAC** is owner-controlled. MAC and RBAC are system-controlled. |\n| \"RBAC = MAC\" | MAC uses **labels** (clearance vs classification); RBAC uses **roles** (sets of permissions). |\n| \"In MAC the owner can share if they want\" | No: the system enforces the labels regardless of ownership. |\n| \"Authentication and authorization are the same\" | Authentication verifies identity; authorization decides what that identity can do; accountability records what it did. |\n| \"Two passwords are MFA\" | MFA needs different **factors** (know, have, are, where). |\n| \"A firewall detects intrusions\" | A firewall blocks/allows by rules; an **IDS** detects and logs. |\n| \"A false positive means an attack was missed\" | That is a **false negative**. A false positive is an alert on normal traffic. |\n| \"Packet filtering tracks connections\" | **Stateful inspection** tracks connection state; packet filtering does not. |\n| \"SYN flood steals data\" | It exhausts server resources; it attacks **availability**. |\n| \"Sniffing alters traffic\" | Sniffing is passive: it copies without redirecting or altering. |\n| \"ARP poisoning works across the internet\" | It works on a **local network** (it forges MAC mappings). |\n| \"VPN = only encryption\" | VPN also uses **encapsulation and tunnelling**. |\n| \"Ingress and egress filtering are the same\" | Ingress blocks inbound traffic; egress blocks outbound. |\n| \"Good prevention removes the need for detection\" | The notes say prevention does not make detection and reaction superfluous. |\n\n### 4.11 Checklist: analysing any domain scenario\n\n1. **Which domain?** Access, application, hardware, network, physical, outsourcing, continuity?\n2. **Which A?** Authentication, authorization, audit/accountability, action?\n3. **Which goal fell?** C, I or A?\n4. **Which model or device?** DAC, MAC, RBAC; firewall type; IDS or VPN?\n5. **Prevention, detection or reaction?** Which was missing?\n6. **What evidence would show the control works?**\n\n### 4.12 Revision summary (Topic 4)\n\n- Access control = authentication, authorization and audit (I&A, authorization, accountability). Four factors: know, have, are, where. Permissions: R, W, X. ACL (on the object) vs capability (held by the subject).\n- DAC: owner decides; MAC: system decides with labels (subject label must dominate object label); RBAC: system decides by role; three rules (role assignment, role authorization, transaction authorization).\n- Application security: start with stakeholders, assets, threats, attackers; AAAA (authentication, authorization, auditing, action) = prevention, detection, reaction; vulnerabilities come from bugs, inappropriate features and inappropriate use of features.\n- Hardware security: attacks (Rowhammer, evil maid, modification, counterfeit, eavesdropping); six mitigations (vendors, encrypt, minimise attack surface, physical security, real-time monitoring, firmware and upgrades).\n- Physical access (Annex A.11): perimeter, entry controls, secure offices, environmental threats, secure areas, delivery areas, equipment siting, utilities, cabling, maintenance, off-premises, disposal, clear desk and screen.\n- Network: OSI seven layers; SYN flood, ARP poisoning, DNS poisoning, sniffing, IP spoofing; VPN (encapsulation, encryption, tunnelling); seven firewall types; IDS (network or host; signature, anomaly, protocol; TP, TN, FP, FN).\n- Supplementary: digital signature steps; outsourcing risks and controls; BCP vs DRP (BIA, RTO, RPO, 3-2-1, hot/warm/cold sites); security organization roles; case study method.\n\n\n---\n\n## PHASE 2 — COMPREHENSION CHECKS (Topic 4)\n\n**C1. Explain, in your own words, why DAC is considered weaker than MAC for protecting highly sensitive information.**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nIn DAC the **owner** decides who may access an object, so the protection depends on every owner making good decisions. An owner can share by mistake, or a program running under an owner's account (for example a trojan) can pass on access without the owner knowing. In MAC the **system** compares the subject's clearance label with the object's classification and enforces the result, whatever any individual wants. For classified information, it removes the dependence on individual choices.\n\n**Check:** owner-controlled and fallible vs system-controlled and enforced.\n<\/details>\n\n**C2. Why do access control systems need accountability as well as authentication and authorization?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nAuthentication and authorization prevent wrong access, but nothing is perfect. Accountability records **what each subject did**, so misuse can be detected, investigated and proven afterwards (the \"Auditing\" and \"Action\" of AAAA). Without it, a user who abuses legitimate access leaves no trace, and an investigator cannot say who changed the loan or when.\n\n**Check:** prevention is not enough; you need detection and evidence.\n<\/details>\n\n**C3. What would happen if a SYN flood hit a server that never times out half-open connections?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nThe waiting list of half-open connections would fill and stay full. Legitimate clients' SYN requests would be dropped, so nobody could connect until the server was restarted or the entries were cleared. The attack would succeed with far less traffic, because each fake request would hold a slot forever instead of for a short period.\n\n**Check:** limited waiting list; entries never free; legitimate users locked out.\n<\/details>\n\n**C4. Why is a stateful firewall better than a simple packet filter against a forged \"reply\" packet from the internet?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nA packet filter judges each packet on its own, using fields such as addresses and ports, so a forged packet that matches an allow rule passes. A stateful firewall keeps a **state table** of connections that insiders started. A \"reply\" with no matching entry deviates from the expected state and is dropped.\n\n**Check:** state table of expected connections.\n<\/details>\n\n**C5. How does ARP poisoning relate to man-in-the-middle attacks?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nARP poisoning is a **method** of achieving a man-in-the-middle position on a local network. By forging ARP replies, the attacker makes victims send traffic for the gateway to the attacker's MAC address. The attacker then reads or alters it and forwards it, so neither side notices. The notes say hackers use ARP poisoning to eavesdrop by means of man-in-the-middle techniques.\n\n**Check:** the poisoned ARP cache puts the attacker \"in the middle\".\n<\/details>\n\n**C6. Give an original example of a false positive and a false negative for a bank's IDS.**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\n*False positive:* an administrator runs a legitimate vulnerability scan on the network, and the IDS raises an \"attack\" alert. *False negative:* an attacker uses a slow, low-volume method that matches no signature and sits within normal behaviour, and no alert fires. The false negative is more dangerous because the attack succeeds unseen.\n\n**Check:** false positive = alert on normal; false negative = silence on attack.\n<\/details>\n\n**C7. Which part of this topic would confuse someone seeing it for the first time?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\n(1) DAC vs MAC vs RBAC: use the \"who decides, based on what\" table. (2) The seven firewall types: group them by layer (network, session, application) and by whether they track state. (3) The four IDS events: draw the 2 × 2 grid. (4) The OSI layers: use the mnemonic and the attack-to-layer table. (5) The \"domains\" the outline lists but the notes omit: use Section 4.9.\n<\/details>\n\n---\n\n## PHASE 3 — ACTIVE RECALL BANK (Topic 4)\n\n### Level 1 — Basic recall\n\n**Q1.** State the four authentication factors listed in the notes and give one example of each.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Something you know (password, PIN); something you have (smart card, security token); something you are (fingerprint, voice, retina, iris); where you are (inside or outside the company firewall, proximity to a personal GPS device).\n\n**Marking:** four factors (4), four examples (4).\n\n**Common mistake:** omitting \"where you are\".\n<\/details>\n\n**Q2.** Define DAC, MAC and RBAC in one sentence each.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** DAC: an access policy determined by the **owner** of an object. MAC: an access policy determined by the **system**, using sensitivity labels so that a subject's clearance must dominate the object's classification. RBAC: an access policy determined by the **system**, based on **roles**, where a role is a set of permissions.\n\n**Common mistake:** saying RBAC is owner-controlled.\n<\/details>\n\n**Q3.** List the seven layers of the OSI model, from application to physical.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Application, presentation, session, transport, network, data link, physical.\n\n**Marking:** order matters; one mark per layer.\n\n**Common mistake:** swapping session and transport, or network and data link.\n<\/details>\n\n**Q4.** Name the seven firewall types in the notes.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Packet filtering; proxy firewall; application-level proxy; circuit-level proxy; stateful inspection; dynamic packet filtering; kernel proxy firewall. (The notes describe dynamic packet filtering as the kernel proxy, or fifth-generation, firewall.)\n\n**Common mistake:** forgetting that \"proxy firewall\" is the umbrella for the application-level and circuit-level proxies.\n<\/details>\n\n**Q5.** State the four IDS events (true positive, true negative, false positive, false negative) in terms of alert and traffic type.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** True positive: alert, and it is a real attack. True negative: no alert, and traffic is normal. False positive: alert, but traffic is normal. False negative: no alert, but it is attack traffic.\n\n**Common mistake:** reversing false positive and false negative.\n<\/details>\n\n**Q6.** List six hardware attack types or hardware mitigations from the notes.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** *Attacks:* Rowhammer, evil maid, modification, counterfeit hardware, eavesdropping. *Mitigations:* investigate vendors and suppliers; encrypt all devices; minimise the attack surface; enforce strong physical security; provide real-time monitoring; update firmware and upgrade old hardware.\n\n**Marking:** one mark each, up to six (any mix).\n\n**Common mistake:** describing \"evil maid\" as a software attack; it requires physical access.\n<\/details>\n\n### Level 2 — Understanding\n\n**Q7.** Compare DAC, MAC and RBAC by who decides, the basis of the decision, typical use, and one weakness.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:**\n\n| | DAC | MAC | RBAC |\n|---|---|---|---|\n| Who decides | Owner | System | System |\n| Basis | Identity and owner-set rules | Labels (clearance vs classification) | Roles (sets of permissions) |\n| Typical use | General file sharing | Government and military, multilevel | Business and commercial systems |\n| Weakness | Inherent vulnerability; hard to maintain lists and grant/revoke | Rigid and complex | Needs careful role design |\n\n**Marking:** one mark per correct cell, up to 12 (capped at 8 for the answer).\n\n**Common mistake:** claiming MAC is \"more flexible\".\n<\/details>\n\n**Q8.** Explain how a SYN flood denies service. Include the three-way handshake.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** A normal connection is SYN, then SYN-ACK from the server (which keeps a half-open entry), then ACK from the client. In a SYN flood the attacker sends many SYN requests, often with forged addresses, and never sends the final ACK. The server's waiting list fills with half-open entries. When it is full, legitimate SYN requests are dropped and the server is unresponsive. It is an attack on availability.\n\n**Marking:** handshake (2), attack behaviour (2), result (1), availability (1).\n\n**Common mistake:** saying the attacker \"steals the server's data\".\n<\/details>\n\n**Q9.** Distinguish a packet filtering firewall from a stateful inspection firewall and from an application-level proxy.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** A packet filter works at the network layer and decides per packet using source and destination IP, protocol, ports and interface. A stateful firewall works like a packet filter but also keeps a state table, tracks connection state and blocks packets that deviate from the expected state. An application-level proxy works at the application layer, allows no direct communication, inspects content, payload and header and can require user authentication.\n\n**Marking:** three correct descriptions (6).\n\n**Common mistake:** putting the application-level proxy at the network layer.\n<\/details>\n\n**Q10.** Why do the notes say good prevention does not make detection and reaction superfluous?\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Prevention can fail or be bypassed (for example, an insider, a zero-day or a mistake). Detection tells you when it has failed; reaction limits damage, recovers assets, repairs and deters offenders. The notes' point is that all three (prevention, detection, reaction) are needed. In AAAA terms, Auditing detects and Action reacts.\n\n**Common mistake:** arguing that detection is unnecessary if prevention is strong.\n<\/details>\n\n### Level 3 — Application\n\n**Q11.** Choose the best access control model for each and justify: (a) a military base's intelligence documents; (b) a bank with 800 staff in 40 job types, with many promotions; (c) a small team sharing project files where each person owns what they create.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** (a) **MAC**: multilevel classified data needs system-enforced labels that owners cannot override. (b) **RBAC**: permissions attach to roles, so a promotion is a role change, and role design matches job structure. (c) **DAC**: owners decide, which is simple and adequate for low-sensitivity files.\n\n**Marking:** each model (1) plus a justification (1), total 6.\n\n**Common mistake:** choosing RBAC for everything because it is popular.\n<\/details>\n\n**Q12.** Computer A's ARP cache shows 192.168.1.1 now maps to an unfamiliar MAC address. Users complain of slow connections and some say their sessions were hijacked. Identify the attack, what it allows, and four controls.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** **ARP poisoning** (forged ARP replies altered the cache). It allows the attacker to sit between users and the gateway: eavesdropping, man-in-the-middle manipulation including session hijacking, and denial of service if traffic is dropped. Controls: use encryption (HTTPS, VPN) so intercepted data is useless; static ARP entries for critical hosts; switch features that validate ARP; network monitoring or IDS to spot duplicate MAC mappings; segment the network; train staff to avoid untrusted Wi-Fi.\n\n**Marking:** attack (2), effects (2), four controls (4).\n\n**Common mistake:** recommending a firewall as the main fix. ARP poisoning happens inside the local network, where a perimeter firewall does not see it.\n<\/details>\n\n**Q13.** A bank's data centre has a badge door, but staff routinely hold the door for colleagues, cabling runs through a shared corridor, and old servers are sold at auction without wiping. Using Annex A.11, identify three control failures and a fix for each.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** (1) *Physical entry controls / working in secure areas:* tailgating. Fix: a mantrap or turnstile, in-and-out logging, a culture of challenging strangers, CCTV review. (2) *Cabling security:* cables exposed to interception or damage. Fix: conduit, underground or protected routing, inspect termination points, separate power and data cables. (3) *Secure disposal or reuse:* sensitive data left on sold servers. Fix: verify data is removed, securely wipe or physically destroy drives, keep disposal records.\n\n**Marking:** three failures matched to controls (3), three fixes (3).\n\n**Common mistake:** naming only technical controls and ignoring procedures.\n<\/details>\n\n### Level 4 — Exam mastery\n\n**Q14.** A bank allows staff to work from home. Design the network and access security for remote work. Explain each control, say which attacks it counters, and explain which access control model supports it. (12 marks)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer outline:**\n1. *Secure channel:* a **VPN** (encapsulation, encryption, tunnelling). Counters sniffing and man-in-the-middle on public networks.\n2. *Authentication:* **MFA** (password plus token or phone) because passwords alone can be guessed, stolen or phished. Counters password attacks and phishing impact. Possibly use \"where you are\" as an extra factor.\n3. *Authorization:* **RBAC**: remote staff get the same role permissions as in the office, no more (least privilege); sensitive actions may require additional approval.\n4. *Network perimeter:* a **firewall** at the VPN gateway (stateful inspection, with ingress and egress filtering) and an **IDS** to detect anomalies. Counters IP spoofing and intrusion attempts.\n5. *Endpoint:* encrypted laptops (hardware security), patched firmware, antivirus/EDR. Counters theft and malware.\n6. *Accountability:* logging of remote sessions, review of unusual access. Supports detection and investigation.\n7. *Policy and training:* a policy for remote work (an ISSP) and awareness training (evil maid and phishing risks).\n8. *Continuity:* backups and a tested DR plan if the VPN or data centre fails.\n9. *Conclusion:* layered controls covering prevention, detection and reaction.\n\n**Marking criteria:** at least five distinct controls (5), each tied to an attack or risk (3), correct access model (2), prevention-detection-reaction balance (1), coherence (1).\n\n**Common mistake:** listing \"VPN and firewall\" only, without authentication, authorization or accountability.\n<\/details>\n\n**Q15.** Evaluate the statement: \"Our firewall is configured correctly, so network attacks are not a risk.\" Use at least four attacks from the notes. (10 marks)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer outline:**\n1. *Position:* false; a firewall is necessary but does not cover every attack.\n2. *SYN flood:* a stateful firewall can limit it, but a large enough flood still exhausts capacity; needs DDoS protection and timeouts.\n3. *ARP poisoning:* happens inside the LAN; a perimeter firewall does not see it.\n4. *Sniffing:* passive; a firewall does not stop internal or wireless sniffing. Encryption is the defence.\n5. *DNS poisoning:* misdirects users to fake sites, with traffic that looks like normal web traffic to the firewall.\n6. *IP spoofing:* ingress filtering helps, but other layers are still needed.\n7. *Configuration is not static:* rules age, exceptions accumulate, so audits and reviews are needed.\n8. *Link to notes:* detection and reaction (IDS, logging) remain necessary alongside prevention.\n9. *Conclusion:* the firewall reduces risk; it does not remove it.\n\n**Marking criteria:** position (1), four attacks with reasoning (4), additional layers (3), configuration drift (1), conclusion (1).\n\n**Common mistake:** stating each attack without linking it to what the firewall can or cannot see.\n<\/details>\n\n\n---"}, {"id": "t5", "t": "TOPIC 5 — IT Governance and Management", "s": "5 · IT Governance and Management", "g": "Topics", "c": "#ea580c", "k": "5", "md": "# TOPIC 5 — IT Governance and Management\n\n**Classification:** Core (governance principles, IT management), Difficult/High-risk (assessing governance effectiveness, governance audit), Applied (management and operations audit, change management)\n**Source:** Topic 5 deck (the title slide says \"CISA Domain 2\"). CW2 areas (a) IT policy review and (h) ICT capability and operations use this topic directly. Change management reappears in the practical (change logs).\n**Outline items:** (a) IT governance: principles of IT governance; assessing the effectiveness of IT governance frameworks. (b) IT management and operations: evaluating IT policies, procedures and controls; change management and configuration control.\n\n## PHASE 1 — UNDERSTANDING\n\n### 5.1 The big picture\n\nTwo words get mixed up all the time. Learn them first.\n\n| | **IT governance** | **IT management and operations** |\n|---|---|---|\n| What it is (notes) | An element of corporate governance aimed at improving the overall management of IT and deriving improved value from investment in IT. The framework of processes, policies and decision-making structures that guide the effective and efficient use of IT | The planning, implementation, maintenance and support of an organization's IT systems and infrastructure to meet business objectives |\n| Concern | **Direction and oversight**: are we doing the right things, with the right risk, for the right value? | **Delivery**: running the systems, networks, applications, data, security and user support day to day |\n| Who mainly | Board, senior management, steering committees | IT managers and operational teams |\n\n> **Supplementary explanation: a way to keep them apart.** Governance sets direction and checks results; management plans, builds and runs. If the board approves a new core banking system because it supports the bank's strategy and the business case is sound, that is **governance**. If the IT team installs, configures and supports it, that is **management and operations**. An auditor looks at both: do the decision structures work, and are the daily processes controlled?\n\n**Where it connects.** Backward: Topic 1 listed \"governance and policies\" and \"change management\" under controlling the IT environment; Topic 3's policies are one governance tool. Forward: Topic 7's organizational and management controls (steering committee, defined IT structure, responsibility) are governance made concrete; Topics 6 and 8 audit governance and operations.\n\n### 5.2 Key terms\n\n| Term | Meaning |\n|---|---|\n| IT governance | The framework of processes, policies and decision-making structures guiding effective and efficient use of IT |\n| Corporate governance | How an organization is directed and controlled; IT governance is one element of it |\n| COBIT | Control Objectives for Information and Related Technology |\n| ISO 38500 | The international IT governance standard |\n| ITIL | IT service management framework |\n| KPI | Key performance indicator: a specific measure of how well a process performs |\n| Gap analysis | Comparing the current state with standards or best practice to find gaps |\n| Steering committee | A group of business and IT leaders giving oversight and decision-making authority |\n| ITSM | IT Service Management: managing delivery of IT services to users |\n| Change advisory board (CAB) | A group that assesses and authorizes changes |\n| Configuration item | A hardware, software, documentation or dependency item whose configuration is tracked |\n| Baseline | A reference configuration against which changes are tracked and compared |\n| SLA | Service level agreement: the agreed service standard between provider and customer |\n\n### 5.3 Why IT governance is important (notes)\n\nIt enables an organization to:\n\n1. Demonstrate **measurable results** against broader business strategies and goals.\n2. Meet relevant **legal and regulatory obligations**.\n3. **Assure stakeholders** that they can have confidence in the organization's IT services.\n4. **Increase the return on IT investment**.\n5. **Comply with corporate governance** or public rules or requirements.\n\nIT governance frameworks let organizations manage IT risks effectively and ensure IT is aligned with business objectives.\n\n### 5.4 IT governance frameworks (notes)\n\n| Framework | What the notes say | Supplementary one-liner |\n|---|---|---|\n| **ISO 38500** | The international IT governance standard | The standard for the corporate governance of IT |\n| **COBIT** | Control Objectives for Information and Related Technology | A framework from ISACA with control objectives for governing and managing IT (the course is aligned to CISA, ISACA's certification) |\n| **ITIL** | IT service management | Best-practice processes for delivering IT services |\n| **Calder-Moir** | Listed | An IT governance framework that organises several standards together |\n| **King reports** (I to IV) | Corporate governance | South African corporate governance reports, versions I to IV |\n| **Business continuity management and disaster recovery** | Listed | Keeps critical services available (Topic 4, Topic 7) |\n| **Programme and project governance (PRINCE2, PMBOK)** | Listed | Project management methods |\n\n### 5.5 The five domains of IT governance (ISACA/ITGI)\n\nThe IT Governance Institute of ISACA breaks IT governance into five domains:\n\n| Domain | What it asks | Concrete example |\n|---|---|---|\n| **1. Strategic alignment** | Does IT support the business strategy? | The bank's strategy is digital channels; IT prioritises mobile banking over a new back-office printer |\n| **2. Value delivery** | Do IT investments deliver the promised benefits? | A new system must show reduced transaction cost in the business case and afterwards |\n| **3. Risk management** | Are IT risks identified, assessed, mitigated, monitored? | A risk register for the core banking migration |\n| **4. Resource management** | Are finances, people and infrastructure used optimally? | Skilled staff are not all tied to routine support while a project lacks engineers |\n| **5. Performance management** | Are results measured against metrics? | Uptime, incident resolution time and project delivery are reported monthly |\n\n**Worked example: a bank proposes to replace its core banking system (illustrative).**\n\n| Domain | Question the board should ask | Evidence it expects |\n|---|---|---|\n| Strategic alignment | Does this support our digital channels strategy? | Strategy document linked to the project |\n| Value delivery | What benefits, and when? | Business case with benefits and cost |\n| Risk management | What could go wrong in migration or with the vendor? | Risk register, mitigation plans |\n| Resource management | Do we have the budget and skills? | Budget approval, staffing plan |\n| Performance management | How will we know it worked? | KPIs such as transaction success rate and uptime |\n\n### 5.6 The ten principles of IT governance (notes)\n\nPrinciples are the guiding concepts that underpin the design, implementation and operation of IT governance frameworks.\n\n| # | Principle | What the notes say | Concrete example |\n|---|---|---|---|\n| 1 | **Strategic alignment** | IT initiatives and investments should directly contribute to business performance and competitiveness | Every IT project names the business objective it serves |\n| 2 | **Value delivery** | Deliver measurable value; prioritise investments by potential benefit | Projects ranked by expected benefit per cost |\n| 3 | **Risk management** | Identify, assess, mitigate and monitor IT risks | Quarterly IT risk review |\n| 4 | **Resource management** | Optimise allocation and use of finances, personnel, infrastructure, by business priority | Budget follows the approved priority list |\n| 5 | **Performance measurement** | Metrics and benchmarks to evaluate effectiveness and efficiency of IT processes and investments | Service desk resolution-time target |\n| 6 | **Transparency and accountability** | Clear roles, responsibilities and decision authority; people held accountable | A named owner for each system, decisions minuted |\n| 7 | **Compliance and legal requirements** | Comply with laws and standards, including data protection and cybersecurity | Annual compliance review |\n| 8 | **Continuous improvement** | Dynamic and adaptable to changing needs, technology and risks | Governance framework reviewed yearly |\n| 9 | **Stakeholder engagement** | Involve executives, IT leaders, employees, customers, partners | User representatives sit on the steering committee |\n| 10 | **Decision-making structures** | Define roles, responsibilities and decision processes | A charter for the IT steering committee |\n\n**Domains vs principles.** The five **domains** are the *focus areas* (strategic alignment, value delivery, risk, resource, performance). The ten **principles** include those five plus transparency and accountability, compliance, continuous improvement, stakeholder engagement and decision-making structures. If a question asks for \"the five domains\", give the five; if it asks for \"principles\", give the longer list.\n\n### 5.7 Assessing the effectiveness of IT governance frameworks (notes)\n\n**What it is:** evaluating **how well governance practices and processes are meeting the five domains**.\n\nThe notes give nine activities. Read them as a sequence:\n\n| # | Activity | What is done (notes) | Concrete example |\n|---|---|---|---|\n| 1 | **Define objectives and KPIs** | Objectives aligned with strategy; KPIs for alignment, risk mitigation, resource optimisation, compliance adherence, value delivery | KPI: % of IT projects with an approved business case; target 100% |\n| 2 | **Conduct gap analysis** | Compare current governance practice with standards, best practices and regulation; identify gaps | Standard expects a risk register; none exists: gap |\n| 3 | **Review governance documentation and artifacts** | Are frameworks, policies, procedures and guidelines comprehensive, up to date, aligned, clear, consistent? | IT policy last reviewed four years ago: out of date |\n| 4 | **Assess governance structures and processes** | Do committees, boards and steering groups give oversight and authority? Are planning, risk, resource and performance processes efficient? | Steering committee met once in a year |\n| 5 | **Review risk management practices** | Identification, assessment, mitigation, monitoring; integrated into governance decisions | Risks logged but not used in project decisions |\n| 6 | **Measure resource allocation and utilisation** | Finances, staff, infrastructure aligned with priorities | 70% of budget on keeping old systems running |\n| 7 | **Monitor compliance adherence** | Laws, regulations, standards, internal policies; effectiveness of compliance controls | No evidence of data protection compliance review |\n| 8 | **Solicit stakeholder feedback** | Executives, IT leaders, employees, customers, partners | Survey shows business does not trust IT delivery dates |\n| 9 | **Continuous improvement** | Process for improvement from findings and feedback; implement corrective actions | Action plan with owners and dates |\n\n**Worked example: scoring one KPI (illustrative).**\n- KPI: \"IT projects started with an approved business case\", target 100%.\n- Evidence: 10 projects started this year; 6 had approved business cases.\n- Result: 6/10 = **60%**. Gap = 40 percentage points.\n- Interpretation: weak **value delivery** and **strategic alignment** governance. Recommendation: no project funding without an approved business case.\n\n### 5.8 The IT governance audit (notes)\n\n**What it is:** assessing the **effectiveness, efficiency and compliance** of an organization's IT governance practices.\n\n> **Supplementary explanation: assessment vs audit.** The notes list the assessment (5.7) and the audit (this section) separately. In practice, an *assessment* evaluates how well the framework meets the five domains (often internal, ongoing). An *audit* is a formal, objective-driven and evidence-based examination that ends in a report and follow-up. The two share many steps.\n\n**The audit sequence (notes):**\n\n| # | Step | What happens |\n|---|---|---|\n| 1 | **Define audit objectives** | Objectives and scope, including which governance areas (for example, strategic alignment, resource management) |\n| 2 | **Gather audit evidence** | Interviews with key stakeholders; documents such as governance policies, procedures, frameworks, organizational charts, strategic plans, risk registers, compliance reports, earlier audit findings |\n| 3 | **Assess governance structures** | Committees, boards, steering groups, decision mechanisms; clarity of roles, responsibilities, reporting lines |\n| 4 | **Review policies and procedures** | Comprehensive, clear, relevant, aligned to objectives and standards; effective in guiding decisions |\n| 5 | **Evaluate risk management practices** | Identification, assessment, mitigation, monitoring; integration |\n| 6 | **Assess resource management** | Allocation and use of IT resources; effectiveness of processes |\n| 7 | **Review compliance adherence** | Laws, regulations, standards, internal policies; evidence such as audit reports, compliance assessments, regulatory filings |\n| 8 | **Assess performance measurement** | Metrics, KPIs and performance reports used to monitor governance outcomes |\n| 9 | **Identify findings and recommendations** | Document strengths, weaknesses, areas for improvement; actionable recommendations |\n| 10 | **Communicate audit results** | Reports to senior management, governance committees and stakeholders; present findings, recommendations and proposed action plans |\n| 11 | **Monitor and follow up** | Track implementation of recommendations; follow-up audits to verify corrective actions work |\n\n**Worked example: one finding, line by line (illustrative).**\n- *Objective:* assess whether IT strategy is aligned to the business strategy.\n- *Evidence gathered:* the strategic plan, steering committee minutes, interviews with the CIO and two business heads.\n- *What was found:* the IT steering committee met once in the last 12 months. No minutes show prioritisation of projects.\n- *Criteria:* the governance framework says it should meet quarterly.\n- *Effect:* projects were chosen informally, so spending may not follow business priorities.\n- *Recommendation:* hold quarterly meetings with minuted priorities; report attendance to the board; follow up in six months.\n\n### 5.9 IT management and operations (notes)\n\n**Definition:** the planning, implementation, maintenance and support of IT systems and infrastructure to meet business objectives. It covers hardware and software management, network administration, cybersecurity, data management and user support, and it needs strategic planning, technical expertise, operational excellence and continuous improvement.\n\n**Ten aspects (notes), with concrete examples for a bank:**\n\n| # | Aspect | What it means (notes) | Concrete example |\n|---|---|---|---|\n| 1 | **Strategic planning** | Align IT strategies with business objectives for competitive advantage | A three-year IT plan supporting digital channels |\n| 2 | **Infrastructure management** | Hardware, software, networks and other resources: procurement, installation, configuration, maintenance | Buying, configuring and servicing servers and switches |\n| 3 | **Application management** | Lifecycle: development, deployment, integration, maintenance, retirement | Retiring an old loan application after migration |\n| 4 | **Data management** | Integrity, security, availability and usability of data: storage, backup, recovery, data governance, data quality | Nightly backups and a data quality check on customer records |\n| 5 | **Cybersecurity** | Protect systems, networks and data from threats: firewalls, antivirus, IDS, encryption | Topics 1 to 4 |\n| 6 | **IT service management (ITSM)** | Delivery of IT services: incident, problem, change, service request and service level management | A service desk ticket system |\n| 7 | **IT governance** | Frameworks, policies and procedures so IT aligns with business objectives, complies, manages risk and delivers value | Section 5.1 to 5.8 |\n| 8 | **Vendor management** | Selection, contract negotiation, performance monitoring and relationship management | Monitoring the SMS gateway supplier against its SLA |\n| 9 | **User support and training** | Troubleshooting, answering queries, training programmes | Helpdesk and onboarding training |\n| 10 | **Performance monitoring and improvement** | Collect and analyse performance data, find bottlenecks and improve | A dashboard of response times and capacity |\n\n> **Supplementary explanation: the ITSM processes.** *Incident management* restores service quickly (one ATM is down: get it working). *Problem management* finds and fixes the **root cause** of recurring incidents (why does this ATM keep failing?). *Change management* controls modifications (5.11). *Service request management* handles routine asks (a new user account). *Service level management* sets and measures the standards agreed in SLAs.\n\n### 5.10 Evaluating IT policies, procedures and controls (notes)\n\n**Why:** it ensures IT practices align with objectives, comply with regulations, manage risks and safeguard assets.\n\n**The eight activities (notes):**\n\n| # | Activity | What the auditor does | Evidence |\n|---|---|---|---|\n| 1 | **Review documentation** | Check policies, procedures and control documents are comprehensive, clear, relevant; cover data security, access control, IT operations, software development, incident response | The documents themselves |\n| 2 | **Assess compliance** | Compare practice with internal policies, standards and regulation (GDPR, HIPAA, PCI DSS); run compliance audits and assessments | Compliance reports |\n| 3 | **Evaluate implementation** | Are people aware of and following the policies in daily work? | Documentation, training records, system configurations, incident reports |\n| 4 | **Examine controls** | Review **technical** (access controls, encryption, logging), **administrative** (segregation of duties, user access management) and **physical** (secure facility access) controls; assess effectiveness | Control descriptions, configurations |\n| 5 | **Test controls** | Test effectiveness: vulnerability assessments, penetration testing, security audits, compliance reviews; identify weaknesses and recommend corrective action | Test results |\n| 6 | **Assess change management** | Are changes to policies, procedures and controls authorized, documented, tested, communicated? Impact on operations, security, compliance? | Change records |\n| 7 | **Review incident response** | Procedures for incidents, breaches and disruptions; review past incidents and the detection, containment, eradication, recovery response | Incident reports |\n| 8 | **Continuous improvement** | Opportunities to update policies, strengthen controls, enhance training, invest; ongoing monitoring and review | Action plans |\n\n**Worked example: auditing the password policy (this is CW2 area (b), line by line).**\n\n1. **Document:** the IT security policy says \"minimum password length 8 characters, 90-day expiry, lock out after 5 failed attempts\".\n2. **Implementation evidence:** the Active Directory configuration export shows minimum length **6**, no expiry, lockout after **10** attempts.\n3. **Compare (compliance assessment):**\n\n| Parameter | Policy requires | System is set to | Result |\n|---|---|---|---|\n| Minimum length | 8 | 6 | Non-compliant |\n| Expiry | 90 days | None | Non-compliant |\n| Lockout threshold | 5 attempts | 10 | Non-compliant |\n\n4. **Finding:** the control is documented but is not implemented as the policy requires.\n5. **Recommendation:** align the configuration to policy and add a periodic configuration check.\n\nNote the three layers an auditor separates: *what the policy says*, *what the system actually does*, and *whether people follow it*.\n\n**Technical, administrative and physical controls (notes)** are the same three categories that the outline names for Topic 7 (together with logical). See Topic 7.\n\n### 5.11 Change management and configuration control (notes)\n\nBoth are critical processes within IT governance, ensuring changes to IT systems and configurations are managed in a **controlled and systematic** manner to minimise risk and maintain stability. They are intertwined because changes often modify configuration items. Effective implementation needs clear policies, defined roles, standardised procedures, tools and ongoing improvement.\n\n#### 5.11.1 Change management\n\n**Definition (notes):** the process of **planning, scheduling, approving, implementing and reviewing** changes to IT systems, applications, infrastructure and services, designed to minimise disruption.\n\n| # | Component | What happens (notes) |\n|---|---|---|\n| 1 | **Request submission** | The request states the nature of the change, its purpose and potential impacts |\n| 2 | **Assessment and approval** | Feasibility, risks and impacts are assessed; authorization from appropriate stakeholders, such as **change advisory boards (CABs)** |\n| 3 | **Planning and scheduling** | Timelines, resources, dependencies; coordinated schedules to minimise service disruption |\n| 4 | **Implementation** | Deployed per the approved plan; testing and validation confirm requirements are met without adverse effects |\n| 5 | **Review and closure** | Post-implementation review of success, issues, lessons learned; close once validated |\n\n**Worked example: patching the core banking database, line by line (illustrative).**\n\n1. *Request:* \"Apply vendor security patch 4.2.1 to the core banking database. Purpose: fix a known vulnerability. Impact: 30 minutes downtime.\"\n2. *Assessment and approval:* the CAB reviews risk (patch could fail), checks the test results from the test environment, and approves. The approver's name and date are recorded.\n3. *Planning and scheduling:* Saturday 22:00, outside business hours, with the back-out plan (restore from the pre-change backup) and a named team.\n4. *Implementation:* the patch is applied, then tested: logins, a test deposit, a balance check.\n5. *Review and closure:* all tests passed; the change record is closed with notes. If the patch had failed, the back-out plan would restore service.\n\n**What would happen if a step were missing?**\n\n| Missing step | Consequence |\n|---|---|\n| No approval | Unauthorized changes, possible fraud or outages with nobody accountable |\n| No testing | The change may break the system in production |\n| No back-out plan | No way to recover quickly from a failed change |\n| No review | Lessons are not learned; issues go unrecorded |\n| No documentation | Cannot later explain what changed, or audit it |\n\n#### 5.11.2 Configuration control\n\n**Definition (notes):** controlling modifications to **hardware, firmware, software and documentation** to protect the information system against **improper modifications** before, during and after system implementation.\n\n| # | Component | What happens (notes) | Concrete example |\n|---|---|---|---|\n| 1 | **Configuration identification** | Identify and document configuration items: hardware, software, documentation and dependencies | An inventory listing each server, its OS and database version |\n| 2 | **Configuration baseline** | Establish baselines as reference points for tracking and comparing changes | \"Baseline v3.2: OS 2019, database 4.2.0, firewall rules revision 14\" |\n| 3 | **Configuration change control** | Control changes through formal processes: evaluate, approve, implement while keeping integrity and consistency | The 4.2.1 patch goes through the change process above |\n| 4 | **Configuration status accounting** | Record and report status and history of items: changes, versions, relationships | Log: \"v3.2 → v3.3, patch 4.2.1, 14 Mar, change #118\" |\n| 5 | **Configuration auditing and verification** | Periodically audit configurations against standards and policies; verify they match their documentation | Compare the live server to baseline v3.3 and investigate differences |\n\n**How an auditor tests this (supplementary, linking to CW2 and the practical):** take the **change log** and the **list of production changes**. For a sample of changes, check there is an approved request, test evidence and a back-out plan. Look for **emergency changes** with no later approval, and for changes made by users who should not have change rights. Compare live configurations with the baseline to find **unrecorded changes**.\n\n### 5.12 IT management and operations audit (notes)\n\n**What it is:** evaluating the effectiveness, efficiency and compliance of IT management practices and operational processes.\n\n| # | Step | What happens (notes) | Typical evidence |\n|---|---|---|---|\n| 1 | **Define objectives and scope** | Areas to assess (infrastructure management, application management, cybersecurity, ITSM) | Audit plan |\n| 2 | **Gather evidence** | Policies, procedures, guidelines, organizational charts, **SLAs**, incident reports, compliance documentation; interviews | Documents and interview notes |\n| 3 | **Assess infrastructure management** | Hardware, software, networks, data centres; procurement, installation, configuration, maintenance, **disposal** of assets; capacity planning, performance monitoring, optimisation | Asset register, capacity reports |\n| 4 | **Review application management** | Development, deployment, integration, maintenance, retirement; change management for applications: version control, testing, deployment | Change records, release notes |\n| 5 | **Evaluate cybersecurity practices** | Access controls, encryption, IDS/IPS, patch management; incident response | Configuration exports, patch reports |\n| 6 | **Assess ITSM** | Incident, problem, change, service request, service level management; service desk responsiveness, resolution times, customer satisfaction | Ticket data, SLA reports |\n| 7 | **Review compliance adherence** | Laws, regulations, standards, internal policies; audit reports, assessments, filings | Compliance reports |\n| 8 | **Assess resource management** | Allocation and utilisation of finances, personnel, infrastructure; planning, budgeting, procurement, vendor management | Budgets, staffing plans, contracts |\n| 9 | **Identify findings and recommendations** | Strengths, weaknesses, areas for improvement; actionable recommendations | Draft findings |\n| 10 | **Communicate results** | Present reports to senior management, IT leaders and stakeholders | Audit report |\n| 11 | **Monitor and follow up** | Track recommendations; follow-up audits | Action tracker |\n\n### 5.13 Text diagrams\n\n**Governance and management together**\n\n```\n  BOARD / SENIOR MANAGEMENT   ---- IT GOVERNANCE ---->  direction, oversight, accountability\n        |   (5 domains: alignment, value, risk, resources, performance)\n        v\n  IT MANAGEMENT AND OPERATIONS ---- delivery ------->  infrastructure, applications, data,\n        |                                              security, ITSM, vendors, support\n        v\n  IT AUDIT (Topics 6-8)  <---- independent check that both work and are controlled\n```\n\n**The change flow**\n\n```\n REQUEST --> ASSESS & APPROVE (CAB) --> PLAN & SCHEDULE --> IMPLEMENT + TEST --> REVIEW & CLOSE\n    |                  |                       |                    |                   |\n [what, why,     [risk, authority,      [time, resources,     [back-out plan     [lessons, record\n  impact]         recorded approver]     dependencies]         ready]             closed]\n```\n\n### 5.14 Common misconceptions and exam traps\n\n| Trap | Truth |\n|---|---|\n| \"IT governance and IT management are the same\" | Governance = direction and oversight; management = planning and running IT. |\n| \"The five domains and the ten principles are the same list\" | The five domains are the focus areas; the principles list is longer and adds transparency, compliance, improvement, stakeholders, decision structures. |\n| \"Governance is the IT department's job\" | It involves the board and senior management; it is part of corporate governance. |\n| \"Change management is just about approval\" | It has five stages: request, assessment and approval, planning and scheduling, implementation, review and closure. |\n| \"Change management and configuration control are the same\" | Change management controls the *process of changes*; configuration control controls the *state of items* (identification, baseline, change control, status accounting, auditing). |\n| \"A documented policy means a control exists\" | Evaluation separates documentation, implementation and testing. |\n| \"Gap analysis is only used in NIST CSF\" | It also appears in governance assessment (compare current practice with standards). |\n| \"An IT audit ends with the report\" | The notes include monitoring and follow-up audits to verify corrective actions. |\n\n### 5.15 Checklist: assessing governance, management or change in any scenario\n\n1. **Is it governance (direction) or management (delivery)?**\n2. **Which of the five domains does it touch?**\n3. **What does the policy say, what does the system do, and what evidence proves it?**\n4. **Is there an owner, an approval and a record?**\n5. **Was the change tested and was there a back-out plan?**\n6. **Who follows up and when?**\n\n### 5.16 Revision summary (Topic 5)\n\n- IT governance = element of corporate governance; the framework of processes, policies and decision structures guiding IT use. Benefits: measurable results, legal compliance, stakeholder assurance, higher return on IT investment, compliance with governance rules.\n- Frameworks: ISO 38500, COBIT, ITIL, Calder-Moir, King reports, BCM/DR, PRINCE2/PMBOK.\n- Five domains (ISACA/ITGI): strategic alignment, value delivery, risk management, resource management, performance management.\n- Ten principles: strategic alignment, value delivery, risk management, resource management, performance measurement, transparency and accountability, compliance, continuous improvement, stakeholder engagement, decision-making structures.\n- Assessing effectiveness: define objectives and KPIs, gap analysis, review documentation, assess structures, review risk practice, measure resources, monitor compliance, solicit feedback, continuous improvement.\n- Governance audit: objectives, evidence, structures, policies, risk, resources, compliance, performance measurement, findings, communication, follow-up.\n- IT management and operations: ten aspects (strategic planning, infrastructure, applications, data, cybersecurity, ITSM, governance, vendors, user support, performance monitoring).\n- Evaluating policies and controls: documentation, compliance, implementation, examine controls (technical, administrative, physical), test controls, change management, incident response, improvement.\n- Change management: request, assessment and approval (CAB), planning and scheduling, implementation, review and closure. Configuration control: identification, baseline, change control, status accounting, auditing and verification.\n\n\n---\n\n## PHASE 2 — COMPREHENSION CHECKS (Topic 5)\n\n**C1. Explain the difference between IT governance and IT management in your own words, using an example that is not in the notes.**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\n*Example: a hospital.* **Governance:** the board decides that the hospital will adopt electronic patient records because it supports the strategy of faster care, approves the budget, requires a risk assessment and asks for quarterly results against agreed targets. **Management:** the IT department selects the system, installs it, backs it up, supports the nurses and fixes faults. Governance sets direction and checks outcomes; management plans and runs the work.\n\n**Check:** direction and oversight vs delivery.\n<\/details>\n\n**C2. Why does the notes' list of governance principles include \"transparency and accountability\"?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nBecause governance only works if people know who is responsible for what and can be held to account. If nobody owns an IT decision, nobody can be questioned when it goes wrong, and stakeholders cannot trust the process. Transparency (decisions and reasons visible) and accountability (named roles, authority and responsibility) make oversight possible.\n\n**Check:** clear roles plus visible decisions.\n<\/details>\n\n**C3. What would happen to an organization's IT governance if it skipped the gap analysis during an assessment?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nIt would not know where its practices differ from standards, best practice and regulation. Improvements would be guesses, resources might go to areas that were already fine, and real weaknesses (for example, no risk register) might never be found. The gap analysis is what turns \"how well are we doing?\" into a specific list of things to fix.\n\n**Check:** you need the gaps before you can prioritise improvements.\n<\/details>\n\n**C4. Why is it not enough for an auditor to read the IT security policy when evaluating password controls?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nThe policy shows what the organization *intends*. The system configuration shows what is *actually* enforced, and the records show whether people follow it. The notes tell auditors to evaluate implementation using evidence such as system configurations, training records and incident reports, and to test controls. A policy requiring 8-character passwords is worthless as assurance if the system accepts 6.\n\n**Check:** documented intent vs actual configuration vs behaviour.\n<\/details>\n\n**C5. How do change management and configuration control relate to each other?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nThey are intertwined: changes often modify configuration items. Change management is the **process** that decides whether and how a change happens (request, approval, schedule,
