<script>
const D={"pages": [{"id": "intro", "t": "Information Security and Auditing (BUC3126) — Complete Study System", "s": "How to use this guide", "g": "Start", "c": "#4f46e5", "k": "i", "md": "# Information Security and Auditing (BUC3126) — Complete Study System\n\n**Course:** Information Security and Auditing, Year 3, Bachelor of Business Computing, MUBS\n**Built from:** your course outline, the 10 slide decks, the Topic 6 PDF, the Topic 7 Word document and slides, CW1 (50 MCQs), the CW2 take-home brief (BBCBank), and the sample MCQ set.\n**Aim:** first understand every topic properly, then lock it in with active recall.\n\n---\n\n## How to use this guide\n\n### The three kinds of content (read this once)\n\n| Label | What it means |\n|---|---|\n| Plain text, tables, lists | Comes from your notes or outline. Definitions, lists, frameworks and steps match your lecturers' material. |\n| **Supplementary explanation** (in a quote block) | Added by me because the notes are thin, missing, or need a missing step explained. Sound academic reasoning, but not from your lecturers. Treat it as extra, and where it conflicts with what your lecturer said in class, your lecturer wins. |\n| **Worked example** / **Scenario** | Made-up situations I built to show how the official concept is applied. The numbers and names are invented. The concept is real. |\n\n### How each topic is organised\n\n1. **Phase 1 — Understanding.** Big picture, connections, key terms, step-by-step explanations, worked examples, a text diagram, traps, a checklist, and a revision summary.\n2. **Phase 2 — Comprehension checks.** Answer these with the notes open. Model answers follow each one.\n3. **Phase 3 — Active recall bank.** Level 1 to 4 questions. Cover the answer, write yours from memory, then reveal.\n\nAt the back: **Phase 4** (a 30-question mixed quiz, a 50-question cumulative test, a hardest-topics test, and the spaced-repetition plan), **Phase 5** (error log and weak-area repair), rapid-recall sheets, and an appendix with a self-check key for CW1.\n\n### Reveal blocks\n\nAnswers sit inside collapsible \"Reveal answer\" blocks. If your Markdown viewer does not collapse them, cover the answer with a sheet of paper and scroll slowly.\n\n### The one habit that matters most\n\nFor every question, **write your answer before you reveal**. Even a bad attempt makes the reveal stick. Reading the answer first feels productive but barely helps in the exam.\n\n---\n\n## Course map (as confirmed)\n\nTags: **F** Foundation, **C** Core, **D** Difficult/High-risk, **A** Applied/Practical, **E** Likely exam focus (directly tested in CW1, CW2 or the sample MCQs).\n\n| # | Topic | Hours | Notes source | Coverage in notes | Main tags |\n|---|---|---|---|---|---|\n| 1 | Introduction to Information Security | 6 | Topic 1 deck | Full | F, C, E |\n| 2 | Threats, risks and cyber crimes | 6 | Topic 2.1, 2.2 (Cyber Crimes), 2.2 (Cyber Security) decks | Full | E, C |\n| 3 | Information Security Policy and Standards | 6 | Info Sec Policy deck, Sec SDLC deck | Good; PDCA missing | F, C, D |\n| 4 | Domains of IT Security | 6 | Domains/Access/Telecom deck, Sec SDLC deck | Partial | D, C |\n| 5 | IT Governance and Management | 4 | Topic 5 deck | Full | C, D, A |\n| 6 | IS Auditing Concepts | 10 | Topic 6 PDF, IS Auditing and Cybersecurity deck | Good; tools and techniques missing | F, D, A |\n| 7 | Controls | 12 | Topic 7 Word doc and slides | Good; some outline items differ | F, C, D |\n| 8 | IS Audit Reporting and Communication | 4 | Only the CW2 brief | Thin | A, E |\n| 9 | Compliance and Ethics in IS Audit | 2 | Fragments only | Thin | C |\n| P | Practical Lab (Excel and IDEA) | n/a | Course outline (practical test), CW2 brief and Topics 6 and 7 | Not in notes; built by me | A, E |\n\n**Teaching hours signal emphasis.** Topics 6 and 7 together are 22 of the listed hours. Expect them to carry weight in the final exam. (The outline's topic rows add up to 56 hours although its total says 60; treat the hours as a guide to relative weight, not an exact count.)\n\n### Three gaps and traps to know now\n\n1. **Topic 7 categories mismatch.** The outline lists \"Administrative, Technical, Physical and Logical\" controls. Your Topic 7 notes classify controls as **General, Application (business process), Objective-based, and User** controls. The notes never use the first set. Learn both (Topic 7 covers both) and use the notes' version in answers unless the question uses the outline's words.\n2. **PDCA and the audit tools are tested or listed but not in the notes.** CW1 tests PDCA; the outline lists audit techniques and tools. These sections are marked Supplementary.\n3. **The sample MCQs overlap heavily with CW1.** Treat them as a guide to question style. Expect scenario-style MCQs with long wordy stems and four plausible options.\n\n---\n\n## What the assessments look like\n\n| Assessment | Weight | What it is | Which topics it hits |\n|---|---|---|---|\n| CW1 | Part of 30% coursework | 50 scenario-style MCQs, roughly 21 on threats (Topic 2), the rest on CIA, controls, policy, ISMS, data protection | Mostly Topics 1 to 3 |\n| CW2 | Part of 30% coursework | Group take-home: a 15 to 20 page IT and IS audit report for a fictional bank, BBCBank Ltd, plus an oral defence | Topics 4 to 8, plus the Practical Lab |\n| Practical test | Part of 30% coursework | Hands-on testing of data, using IDEA and/or Excel (you said probably both, leaning Excel) | Practical Lab, Topics 6 to 8 |\n| Final exam | 70% | Physical exam | All topics |\n\nPass mark is 50%. You must attempt all three assignments and the final exam.\n\n> **Supplementary explanation: how to read CW2.** The CW2 brief lists nine audit areas (policy review, password configuration, tariff accuracy, interest recomputation, product eligibility, segregation of duties, VAPT, ICT capability and operations, and AAA mechanisms). Each one is an application of a topic in this guide. The Practical Lab shows how to test them in Excel. Topic 8 shows how to write the finding up.\n\n---\n\n## Suggested order of study\n\n1. Topics 1 and 2 first (vocabulary and threats; everything else builds on them).\n2. Topic 3 (policy and standards), then Topic 4 (domains).\n3. Topic 5 (governance), then Topic 6 (what an audit is), then Topic 7 (controls, the heart of the course).\n4. Topics 8 and 9 (reporting, compliance and ethics), then the Practical Lab.\n5. Phase 4 mixed tests, then the error log.\n\nThe spaced-repetition schedule in Phase 4 tells you exactly which day to do what.\n\n\n---"}, {"id": "t1", "t": "TOPIC 1 — Introduction to Information Security", "s": "1 · Introduction to Information Security", "g": "Topics", "c": "#4f46e5", "k": "1", "md": "# TOPIC 1 — Introduction to Information Security\n\n**Classification:** Foundation, Core, Likely exam focus\n**Source:** Topic 1 deck (Dr. Mlay). CW1 tests this topic in Q27 to Q34, Q38, Q41 to Q45, Q48, Q49.\n**Outline items:** (a) CIA triad, (b) components of InfoSec, (c) controlling the IT environment, (d) Information Security Management System (ISMS), (e) steps for developing an ISMS.\n\n## PHASE 1 — UNDERSTANDING\n\n### 1.1 The big picture\n\n**Information security (InfoSec)** means protecting information from unauthorized access, use, disclosure, disruption, modification, or destruction. It covers digital data (a database) and physical data (a printed loan file in a cabinet).\n\nEvery other topic in this course answers one of four questions that start here:\n\n1. What are we protecting? (information assets)\n2. What can go wrong? (threats, Topic 2)\n3. What rules and controls stop or reduce it? (policy, Topic 3; domains, Topic 4; controls, Topic 7)\n4. How do we check it is working? (audit, Topics 6 to 9)\n\n**Where it connects.** Topic 1 gives you the vocabulary (CIA, authentication, ISMS). Topic 2 uses CIA to classify attacks. Topic 3 turns the ISMS \"Policy\" component into written rules. Topic 5 places the ISMS under governance. Topics 6 to 8 audit whether the ISMS controls work.\n\n### 1.2 Key terms\n\n| Term | Plain-English meaning | Notes' version |\n|---|---|---|\n| Information security | Keeping information safe from misuse, change, or loss | Protection from unauthorized access, use, disclosure, disruption, modification, destruction |\n| CIA triad | The three core goals: keep it secret, keep it correct, keep it reachable | Confidentiality, Integrity, Availability |\n| Confidentiality | Only the right people can see it | Sensitive information accessed only by authorized individuals |\n| Integrity | It is accurate and has not been changed improperly | Accuracy, completeness and reliability of data over its lifecycle |\n| Availability | Authorized people can use it when they need it | Information and resources accessible to authorized users when needed |\n| Authentication | Proving who you are | Verifying the identity of users or systems |\n| Authorization | What you are allowed to do once identified | Granting or denying permissions to access resources or perform actions |\n| Non-repudiation | You cannot later deny you did it | A party cannot deny the authenticity of their signature or the sending of a message |\n| Risk management | Finding, scoring and reducing risk | Identifying, assessing and mitigating risks to information assets |\n| Incident response | The plan for when something goes wrong | Preparing for and responding to breaches or attacks |\n| ISMS | A managed system of people, process and technology for security | A systematic approach to managing sensitive company information so it remains secure, applying a risk management process |\n| MFA | Two or more different proofs of identity | Multi-factor authentication |\n| RBAC / ACL | Permissions granted by job role / by a list attached to a resource | Role-based access control / access control lists |\n| Hash | A fixed-size fingerprint of data | Used for integrity (checksums, hash functions) |\n| Digital signature | A hash of a document signed with the sender's private key | Used for integrity and non-repudiation |\n| DLP | Software that stops sensitive data leaving | Data loss prevention |\n| IAM | Managing identities and what they can access | Identity and access management |\n| EDR | Continuous monitoring and response on laptops/servers | Endpoint detection and response |\n| IDS/IPS | Systems that detect / detect-and-block intrusions | Intrusion detection / prevention systems |\n| DRP | Plan to restore IT after a disaster | Disaster recovery plan |\n\n### 1.3 The CIA triad, step by step with one concrete case\n\n**Scenario (invented).** Mary uses a mobile banking app. Her account holds UGX 5,000,000.\n\n| Goal | What it means in Mary's case | A control from the notes | What a breach looks like |\n|---|---|---|---|\n| **Confidentiality** | Only Mary sees her balance and transactions | Encryption, access controls, authentication (password plus OTP), secure channels | An attacker reads her balance |\n| **Integrity** | The balance and transfer amounts cannot be changed without authority and trace | Hash functions, checksums, digital signatures, version control, audit trails | An attacker edits a transfer from 50,000 to 500,000, or changes her balance |\n| **Availability** | The app and her data work at 8 p.m. on payday | Redundant systems, backups, disaster recovery plans, firewalls and DDoS protection | A DDoS attack takes the app down, or ransomware encrypts the database |\n\n**Reading the table line by line:**\n\n- Line 1: the controls (encryption, MFA) stop strangers reading. If one fails, confidentiality is lost, even if nothing is changed or deleted.\n- Line 2: integrity is about *changes*. A stolen password that is used only to look is a confidentiality breach. The moment data is altered, integrity is breached too.\n- Line 3: availability is about *access*. If ransomware encrypts files and demands payment, nobody can use the data. This is mainly an availability breach (CW1 Q49), although the attacker also modified the files.\n\n### 1.4 The other components (pillars) of InfoSec\n\nBeyond CIA, your notes list these. Learn the definition and the technique for each.\n\n| # | Component | Definition (from the notes) | Techniques (from the notes) |\n|---|---|---|---|\n| 1 | Confidentiality | Only authorized individuals access sensitive information | Encryption, access controls, secure channels, authentication |\n| 2 | Integrity | Accuracy, completeness, reliability over the data lifecycle | Checksums, hash functions, digital signatures, version control, audit trails |\n| 3 | Availability | Accessible to authorized users when needed | Redundant systems, backups, DR plans, firewalls, DDoS protection |\n| 4 | Authentication | Verifying identity of users or systems | Passwords, biometrics, smart cards, MFA |\n| 5 | Authorization | Granting or denying permissions | RBAC, ACLs, policy enforcement |\n| 6 | Non-repudiation | Sender or signer cannot deny it | Digital signatures, cryptographic protocols, secure logging |\n| 7 | Risk management | Identify, assess, mitigate risks to assets | Risk assessments, threat modelling, controls, continuous monitoring |\n| 8 | Incident response | Prepare for and respond to breaches | IR plans, regular training, forensic analysis, post-incident reviews |\n| 9 | Security policies and procedures | Establish and enforce guidelines | Acceptable use, data classification, awareness training |\n| 10 | Compliance and legal requirements | Adhere to laws, regulations, standards | Compliance audits, legal assessments, GDPR, HIPAA, ISO/IEC 27001 |\n| 11 | Physical security | Protect infrastructure and hardware | Secure facilities, surveillance, badges and locks, fire suppression, climate control |\n| 12 | Network security | Protect CIA of data in transit | Firewalls, IDS/IPS, VPNs, secure network architecture |\n| 13 | Application security | Secure applications through their lifecycle | Secure coding, penetration testing, static code analysis, patching |\n| 14 | Data security | Protect data at rest, in transit, in use | Encryption, data masking, tokenization, secure storage |\n| 15 | User education and training | Raise awareness of good practice | Awareness programs, phishing simulations, regular training |\n\n> **Supplementary explanation: how to tell authentication, authorization and non-repudiation apart.** Walk through one login:\n> 1. Mary types her username. That is **identification** (the claim \"I am Mary\").\n> 2. She enters her password and an OTP. The system checks both. That is **authentication** (proof of the claim).\n> 3. She clicks \"Transfer\". The system checks her role: customers can move money out of their own account only. That is **authorization** (what Mary may do).\n> 4. The transfer is logged with her ID, time and a signed record. Later she cannot say \"I never made that transfer\". That is **non-repudiation**.\n> Authentication always comes before authorization. Authenticating proves *who*; authorizing decides *what*.\n\n### 1.5 How hashing differs from encryption (a frequent exam trap)\n\nThis is tested in CW1 Q29 and Q38.\n\n**Step by step, checking file integrity with a hash:**\n\n1. The sender runs the file through SHA-256. Output: a fixed-size string (256 bits, shown as 64 hex characters), e.g. `9f86d0...`.\n2. The sender sends the file and the string.\n3. The receiver runs the *received* file through SHA-256 and gets a string.\n4. The receiver compares the two strings. If they match, the file is unchanged. If they differ by even one character, the file was altered.\n\n**Why a hash is not encryption:**\n\n- A hash is **one-way**. You cannot reverse the string to get the file back.\n- The output is **always the same size** regardless of file size.\n- It proves **integrity**, not confidentiality. Anyone can still read the file.\n- Encryption is **two-way**: you can decrypt with the right key. It protects **confidentiality**.\n- A digital signature is *not* the same as a hash. It signs the hash with the sender's private key, which adds authenticity and non-repudiation (CW1 Q34: \"Integrity and Authenticity\").\n\n### 1.6 Controlling the IT environment\n\n**Purpose:** put practices, policies and technologies in place to manage and secure information systems, so IT is reliable, accurate and secure.\n\nThe notes list 14 areas. Here they are with one concrete example each:\n\n| # | Area | Key elements (notes) | Concrete example |\n|---|---|---|---|\n| 1 | Governance and policies | IT governance framework aligning IT with business objectives; roles and accountability; policies (acceptable use, data protection, incident response) | The board approves an acceptable use policy and names the CIO accountable for it |\n| 2 | Access control | IAM; RBAC; least privilege; strong authentication and clear authorization | A teller can post deposits but cannot approve loans |\n| 3 | Network security | Firewalls, IDS/IPS, VPN for remote access | Staff working from home connect through a VPN, not directly |\n| 4 | Endpoint security | Antivirus/antimalware kept updated; EDR | Every laptop runs EDR that flags unusual file encryption |\n| 5 | Data protection | Encrypt at rest and in transit; DLP | Customer files on laptops are encrypted; DLP blocks emailing the customer list to a personal address |\n| 6 | Backup and recovery | Regular backups; tested DRP | Nightly backup, with a restore test each quarter |\n| 7 | Monitoring and logging | Continuous monitoring; log collection, analysis, storage | Logs from servers and firewalls are collected so an investigator can reconstruct events |\n| 8 | Patch management | Regular updates; vulnerability assessments with prompt remediation | A critical server patch is applied within an agreed number of days |\n| 9 | Physical security | Secure facilities; hardware protection | Server room has a badge reader and CCTV |\n| 10 | User education and training | Awareness programs; policy enforcement through audits | Staff do phishing simulations; repeat clickers get extra training |\n| 11 | Incident response | IR plan with drills; forensic analysis | A tested plan says who isolates an infected laptop and who calls management |\n| 12 | Compliance and auditing | Compliance monitoring; regular internal and external audits | Annual audit checks controls against ISO/IEC 27001 |\n| 13 | Cloud security | Cloud governance; secure configuration and monitoring | Storage buckets are checked so none is public by mistake |\n| 14 | Change management | Formal change control (authorized, tested, documented); configuration management with an asset inventory | A server upgrade requires an approved change request and a rollback plan |\n\n### 1.7 The ISMS\n\n**Definition (notes).** An ISMS is a systematic approach to managing sensitive company information so that it remains secure. It covers **people, processes and IT systems** by applying a **risk management process**.\n\n**Key point for exams:** the ISMS is achieved primarily through a risk management process. It is not \"the latest firewall\" or \"a big security team\" (CW1 Q27).\n\n#### The 13 key components\n\n| # | Component | What it asks for |\n|---|---|---|\n| 1 | Policy | A security policy aligned with goals; a defined ISMS scope (boundaries and applicability) |\n| 2 | Risk assessment | Identify and assess risks; find likelihood and impact of threats |\n| 3 | Risk treatment | A risk treatment plan; controls to reduce identified risks |\n| 4 | Objectives and controls | Measurable, achievable objectives; controls (technical, organisational, procedural) to meet them |\n| 5 | Roles and responsibilities | Defined roles; top management support and commitment |\n| 6 | Asset management | Identify and classify information assets; protect by value and sensitivity |\n| 7 | Access control | Only authorized personnel reach sensitive information, using authentication and authorization |\n| 8 | Compliance and legal requirements | Meet laws, regulations, standards (GDPR, HIPAA, ISO/IEC 27001); review them regularly |\n| 9 | Incident management | A plan to detect, report and respond; post-incident reviews |\n| 10 | Business continuity management | BCP and DRP so critical systems stay available; test and update them |\n| 11 | Training and awareness | Regular sessions; everyone understands their role |\n| 12 | Monitoring and review | Monitor controls; run internal audits and reviews |\n| 13 | Continuous improvement | Use audit, incident and monitoring feedback to improve |\n\n#### The 9 steps to implement an ISMS (in order)\n\n| Step | Action | Detail from the notes |\n|---|---|---|\n| 1 | Initiate the ISMS project | Get management support; define project scope; make a plan; form a team |\n| 2 | Define ISMS scope and policy | Decide boundaries and applicability; write a policy reflecting objectives |\n| 3 | Perform a risk assessment | Identify assets; analyse threats, vulnerabilities and impacts to find risk levels |\n| 4 | Develop a risk treatment plan | Select controls; plan how to implement them |\n| 5 | Implement controls | Put the controls in place; document supporting procedures |\n| 6 | Establish ISMS documentation | Policies, procedures, records; accessible and kept current |\n| 7 | Conduct training and awareness | Train staff; raise awareness |\n| 8 | Monitor and review | Continuously monitor; run internal audits and management reviews |\n| 9 | Maintain and improve | Continual improvement based on audits, incidents and monitoring |\n\n**Why this order?** Each step needs the one before it. You cannot pick controls (step 4) until you know your risks (step 3). You cannot assess risks until you know what is in scope (step 2). You cannot do any of it without management support (step 1).\n\n#### Standards named in the notes\n\n| Standard | What it is |\n|---|---|\n| ISO/IEC 27001 | International standard for an ISMS: the framework for managing information security |\n| ISO/IEC 27002 | Code of practice for information security controls |\n| NIST SP 800-53 | A catalogue of security and privacy controls for federal information systems and organisations |\n\n#### Benefits of an ISMS (notes)\n\nEnhanced security, compliance, effective risk management, improved reputation (trust), business continuity.\n\n> **Supplementary explanation: PDCA and the ISMS.** CW1 Q42 tests the PDCA cycle (Plan-Do-Check-Act) as \"continuous improvement of the security management system\". The notes do not map PDCA onto the ISMS steps. One common mapping: **Plan** = steps 1 to 4 (scope, policy, risk assessment, treatment plan); **Do** = steps 5 to 7 (implement controls, document, train); **Check** = step 8 (monitor, audit, review); **Act** = step 9 (improve). Topic 3 covers PDCA in more detail.\n\n### 1.8 Worked example: setting up an ISMS for a small microfinance (invented)\n\n**Situation.** A microfinance with 40 staff, one head office and a rented server room, wants to implement an ISMS.\n\n**Step 1 (initiate).** The managing director agrees to sponsor it. A team of three is formed: the IT officer, the operations manager and the accountant.\n\n**Step 2 (scope and policy).** Scope: head office, the server room and the loan system. Branches are excluded for the first year. Policy statement: \"We protect customer and financial data from unauthorized access, loss and alteration.\"\n\n**Step 3 (risk assessment).** The team lists assets and scores each risk as Likelihood × Impact on a 1 to 3 scale (1 = low, 2 = medium, 3 = high).\n\n| Asset | Threat | Likelihood | Impact | Risk = L × I |\n|---|---|---|---|---|\n| Loan database | Ransomware | 2 | 3 | 6 |\n| Staff laptops | Theft | 3 | 2 | 6 |\n| Paper loan files | Fire | 1 | 3 | 3 |\n| Email | Phishing | 3 | 2 | 6 |\n\nReading it line by line: the loan database scores 2 × 3 = 6; the impact is high because everything stops without it. Laptop theft scores 3 × 2 = 6; likely but each laptop is replaceable, so medium impact. Fire scores 1 × 3 = 3: unlikely but severe.\n\n**Step 4 (risk treatment plan).** For each risk of 6, choose controls: offline backups plus EDR for ransomware; disk encryption for laptops; MFA plus phishing awareness for email.\n\n**Steps 5 to 9.** Controls are installed; procedures written down; staff trained; an internal audit after six months finds backups were never restore-tested; this is fixed and the plan updated.\n\n### 1.9 A text diagram: the ISMS loop\n\n```\n  [1 Get management support]\n            |\n            v\n  [2 Define scope + policy]\n            |\n            v\n  [3 Risk assessment] ---> [4 Risk treatment plan]\n                                     |\n                                     v\n                            [5 Implement controls]\n                                     |\n                                     v\n                  [6 Document] --> [7 Train staff]\n                                     |\n                                     v\n                           [8 Monitor + review]\n                                     |\n                                     v\n                       [9 Maintain + improve] --+\n                                                |\n        (findings feed back into step 3) <------+\n```\n\n### 1.10 Common misconceptions and exam traps\n\n| Trap | Truth |\n|---|---|\n| \"InfoSec is mainly technology\" | The ISMS covers people, processes and IT. Training, policy and management support are core components. |\n| \"The ISMS is a product we buy\" | It is a management system built around a risk management process. |\n| \"ISO 27001 and ISO 27002 are the same\" | 27001 is the ISMS framework. 27002 is the code of practice for controls. |\n| \"A hash encrypts data\" | A hash gives integrity only. It is one-way and fixed-size. |\n| \"A digital signature only proves integrity\" | It proves integrity and authenticity, and supports non-repudiation. |\n| \"Authentication and authorization are the same\" | Authentication is *who you are*. Authorization is *what you may do*. |\n| \"Ransomware attacks confidentiality\" | Its defining harm is availability (files locked until you pay). |\n| \"3 copies, 2 media, 1 offsite is about confidentiality\" | It is a backup rule: it protects availability (CW1 Q30). |\n| \"The ISMS goal is the latest firewall\" | The core mechanism is risk management (CW1 Q27). |\n\n### 1.11 Checklist to remember\n\nFor any security measure, ask four questions:\n\n1. **Which of C, I, A (and authentication/authorization/non-repudiation) does it protect?**\n2. **Which area of the IT environment is it in?** (access, network, endpoint, data, backup, physical, and so on)\n3. **Which ISMS step or component does it belong to?** (assessment, treatment, monitoring, and so on)\n4. **Who owns it, and how is it checked?**\n\nIf you can answer all four, you understand the control.\n\n### 1.12 Revision summary (Topic 1)\n\n- InfoSec protects information from unauthorized access, use, disclosure, disruption, modification and destruction.\n- CIA: confidentiality (encryption, access control), integrity (hashes, signatures, audit trails), availability (redundancy, backups, DR).\n- Also: authentication (passwords, biometrics, MFA), authorization (RBAC, ACLs), non-repudiation (digital signatures, logging).\n- 15 components: CIA plus authentication, authorization, non-repudiation, risk management, incident response, policies, compliance, physical, network, application, data security, user training.\n- Controlling the IT environment has 14 areas, ending with change management.\n- ISMS = people, processes and IT, run through a risk management process. 13 components. 9 implementation steps: initiate, scope and policy, risk assessment, treatment plan, implement controls, documentation, training, monitor and review, maintain and improve.\n- Standards: ISO/IEC 27001 (ISMS), ISO/IEC 27002 (controls), NIST SP 800-53 (control catalogue).\n\n---\n\n## PHASE 2 — COMPREHENSION CHECKS (Topic 1)\n\nAnswer each one in writing before opening the model answer.\n\n**C1. Explain the CIA triad in your own words, using an example that is not a bank.**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nConfidentiality means only the right people can see the information. Integrity means the information stays accurate and is changed only by those allowed to. Availability means the right people can use it when they need it.\n\n*Example (a hospital):* a patient record. Confidentiality: only the treating doctor and nurse can open it (access control). Integrity: nobody can quietly change a drug allergy entry; changes are logged (audit trail). Availability: the doctor can open it at 3 a.m. in an emergency (backups, redundant servers).\n\n**Check:** did you name all three, with a concrete control for each?\n<\/details>\n\n**C2. Why does authorization exist if the system has already authenticated the user?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nAuthentication only proves *who* the user is. It says nothing about what they should be allowed to do. If every authenticated user could do everything, a junior clerk could approve payments or open every customer file. Authorization limits each identity to what its role needs, which is the idea behind least privilege.\n\n**Check:** you should have said that authentication answers \"who?\" and authorization answers \"what may they do?\".\n<\/details>\n\n**C3. What would happen if the ISMS skipped the risk assessment step?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nThe organization would pick controls without knowing what it needs to protect or how serious each risk is. It might spend heavily on a firewall while the real risk is staff clicking phishing links, or leave the loan database unprotected because nobody ranked it as critical. The risk treatment plan (step 4) depends on the risk assessment (step 3). That is why the ISMS is described as applying a risk management process.\n\n**Check:** did you link the missing step to a wrong or wasted control choice?\n<\/details>\n\n**C4. Why is a hash value not the same as an encrypted file?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nA hash is a fixed-size fingerprint made by a one-way function. You cannot get the original file back from it. It is used to detect changes (integrity). Encryption transforms the data so only someone with the key can read it, and it can be reversed with that key. Encryption protects confidentiality.\n\n**Check:** one-way vs reversible, and integrity vs confidentiality.\n<\/details>\n\n**C5. How does \"Controlling the IT environment\" relate to the ISMS?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nControlling the IT environment is the list of practical measures (access control, network security, backups, patching, training, change management, and so on). The ISMS is the management system that decides which measures are needed (through risk assessment), puts them in place, monitors them and improves them. Put simply: the controls are the \"what we do\", and the ISMS is the \"how we manage that it is the right set and that it keeps working\".\n\n**Check:** controls are the content; the ISMS is the management cycle around them.\n<\/details>\n\n**C6. Give an original example showing a breach of integrity but not confidentiality.**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nA payroll clerk with edit rights changes his own salary from 1,200,000 to 2,200,000 in the payroll system. Nobody outside the authorized staff saw anything secret, but the data is now inaccurate and the change was not authorized. Integrity is breached, and confidentiality is not.\n\n**Check:** the data is changed improperly without anyone unauthorized reading it.\n<\/details>\n\n**C7. Which part of this topic would confuse someone seeing it for the first time?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nThe usual sticking points: (1) the notes list the \"components\" as 15 items that mix goals (CIA), security functions (authentication) and management items (policy, compliance); newcomers expect only technical items. (2) Authentication vs authorization. (3) The ISMS is a process, not a tool. (4) Hash vs encryption vs digital signature. Use the Section 1.10 table to clear all four.\n<\/details>\n\n---\n\n## PHASE 3 — ACTIVE RECALL BANK (Topic 1)\n\n### Level 1 — Basic recall\n\n**Q1.** State the three components of the CIA triad and give one technique for each, using your notes' terms.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Confidentiality: only authorized individuals access sensitive information (encryption, access controls, secure channels, authentication). Integrity: accuracy, completeness and reliability of data over its lifecycle (checksums, hash functions, digital signatures, version control, audit trails). Availability: information accessible to authorized users when needed (redundant systems, backups, DR plans, firewalls, DDoS protection).\n\n**Key points / marking criteria:** 3 correct names (1 mark), 3 correct definitions (3), 3 correct techniques (3).\n\n**Common mistake:** writing \"availability means no downtime\". The goal is access *for authorized users when needed*, and backups and DR are part of it, not only uptime.\n<\/details>\n\n**Q2.** List the nine ISMS implementation steps in order.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** 1 Initiate the ISMS project. 2 Define ISMS scope and policy. 3 Perform a risk assessment. 4 Develop a risk treatment plan. 5 Implement controls. 6 Establish ISMS documentation. 7 Conduct training and awareness. 8 Monitor and review. 9 Maintain and improve.\n\n**Key points:** correct order matters; the assessment comes before treatment and controls; monitoring comes after implementation.\n\n**Common mistake:** putting \"Implement controls\" before the risk assessment, or dropping documentation and training.\n<\/details>\n\n**Q3.** What are ISO/IEC 27001, ISO/IEC 27002 and NIST SP 800-53?\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** ISO/IEC 27001 is the international standard for an ISMS (the framework). ISO/IEC 27002 is a code of practice for information security controls. NIST SP 800-53 provides a catalogue of security and privacy controls for federal information systems and organisations.\n\n**Key points:** ISMS framework vs controls code vs control catalogue.\n\n**Common mistake:** swapping 27001 and 27002.\n<\/details>\n\n**Q4.** Define non-repudiation and name two techniques that provide it.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Non-repudiation ensures a party in a communication cannot deny the authenticity of their signature on a document or the sending of a message. Techniques: digital signatures, cryptographic protocols, secure logging.\n\n**Key points:** \"cannot deny\" + two named techniques.\n\n**Common mistake:** confusing it with authentication. Authentication proves identity at the time; non-repudiation stops later denial.\n<\/details>\n\n**Q5.** Match each technique to the pillar it mainly supports: (a) checksums (b) redundant systems (c) RBAC (d) encryption (e) phishing simulations.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** (a) Integrity. (b) Availability. (c) Authorization (and confidentiality through limiting access). (d) Confidentiality. (e) User education and training.\n\n**Common mistake:** putting RBAC under authentication. RBAC decides what a verified user can do, which is authorization.\n<\/details>\n\n### Level 2 — Understanding\n\n**Q6.** Distinguish authentication from authorization, with one example of each in the same login.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Authentication verifies who the user is (password plus OTP). Authorization decides what that verified user may do (a customer can view and transfer from their own account but not see others'). Authentication comes first; authorization uses its result.\n\n**Marking points:** two correct definitions (2), a shared example showing the sequence (2), link between them (1).\n\n**Common mistake:** treating them as one step called \"login\".\n<\/details>\n\n**Q7.** Explain why a hash proves integrity but not confidentiality. (CW1 Q29 and Q38 style)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** A hash is a fixed-size string produced by a one-way function. If the receiver recomputes the hash of the received file and it matches, the file is unchanged, which shows integrity. But the file itself is not scrambled, so anyone can read it. The hash cannot be reversed to recover the data, so it is not encryption.\n\n**Marking points:** fixed-size/one-way (1), recalculate and compare (2), no secrecy (1), contrast with encryption (1).\n\n**Common mistake:** saying \"hashing is a type of encryption\".\n<\/details>\n\n**Q8.** Why does an ISMS begin with a risk assessment rather than buying the latest security tools?\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Controls should match risks. A risk assessment finds assets, threats, vulnerabilities and impacts, so the organization knows what to protect first and how much to spend. Buying tools first risks wasted money and gaps. The notes describe the ISMS as protecting information through effective risk management.\n\n**Marking points:** link controls to risk (2), prioritisation (1), waste/gap (1), reference to risk management process (1).\n\n**Common mistake:** answering \"to be compliant\". Compliance is a component, but the reason here is choosing the right controls.\n<\/details>\n\n**Q9.** Classify each incident by the CIA goal mainly breached: (a) ransomware locks all files and demands payment; (b) an employee emails a client list to the wrong person; (c) a clerk changes a supplier's bank account number without approval.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** (a) Availability (data is inaccessible). (b) Confidentiality (unauthorized disclosure). (c) Integrity (unauthorized change). Note (a) also modifies files, but the defining harm is lost access.\n\n**Common mistake:** classifying ransomware as confidentiality because it is \"an attack on data\".\n<\/details>\n\n### Level 3 — Application\n\n**Q10.** A laptop containing unencrypted customer files is stolen from a car. The IT officer says backups exist, but a restore has never been tried. Patches on the finance server are six months behind. Name the failed areas of \"controlling the IT environment\" and which CIA goals are at risk.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:**\n- Stolen unencrypted laptop: **Data protection** (no encryption at rest) and **endpoint/physical security** (hardware protection). Goal at risk: **confidentiality**.\n- Backups never restore-tested: **Backup and recovery** (the notes call for a tested DRP). Goal at risk: **availability**.\n- Patches six months behind: **Patch management** and **vulnerability management**. Goals at risk: all three, since an exploited flaw can expose, alter or disable data.\n\n**Marking points:** three failed areas correctly named (3), correct CIA link for each (3).\n\n**Common mistake:** saying \"backups exist so availability is fine\". Untested backups are not a proven control.\n<\/details>\n\n**Q11.** Three risks were scored by likelihood (L) and impact (I) on a 1 to 3 scale. Compute Risk = L × I and rank: (A) phishing L3, I2; (B) server-room fire L1, I3; (C) ransomware L2, I3.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:**\n- A: 3 × 2 = 6\n- B: 1 × 3 = 3\n- C: 2 × 3 = 6\n\nRanking: A and C tie at 6 (highest), then B at 3. For the tie, treat C first if the question says impact outweighs likelihood. Otherwise show both at 6 and say the tie needs a judgement rule.\n\n**Marking points:** three correct products (3), correct ranking (1), noted tie handling (1).\n\n**Common mistake:** adding L + I instead of multiplying.\n\n> **Supplementary explanation.** Whether 6 is \"High\" or \"Medium\" depends on the organization's own risk matrix. On a 3 × 3 matrix, 6 is usually High and 9 is Critical. CW1 Q25 (High 3 × Medium 2) expects \"High\".\n<\/details>\n\n**Q12.** A 40-person microfinance wants an ISMS. Put these in order and justify the order: train staff, write the security policy, list and classify assets, install controls, get the managing director's support, perform a risk assessment.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** (1) Get management support, because without it there is no budget or authority. (2) Write the policy and define scope. (3) List and classify assets, as the base for the assessment. (4) Perform the risk assessment. (5) Install controls from the treatment plan. (6) Train staff on the new policy and controls.\n\n**Marking points:** correct order of at least the key sequence (3), a reason for each placement (3).\n\n**Common mistake:** installing controls first.\n<\/details>\n\n### Level 4 — Exam mastery\n\n**Q13.** \"A company with a top-of-the-range firewall does not need an ISMS.\" Evaluate this statement. (10 marks)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer outline:**\n1. *Position:* the statement is wrong.\n2. *What a firewall covers:* network security only, for traffic crossing the boundary. It does not address insiders, lost laptops, phishing, weak passwords, untested backups or poor policies.\n3. *What the ISMS adds:* people, processes and IT together; risk assessment and treatment so controls match risks; policy, roles, awareness training, incident management, business continuity, monitoring and continual improvement.\n4. *Link to CIA:* a firewall helps confidentiality and availability at the network edge. It does little for integrity of internal changes or for physical theft.\n5. *Link to the notes:* the core purpose of the ISMS is risk management, not any single product (CW1 Q27).\n6. *Counterpoint to acknowledge:* the firewall is still a valid control. The ISMS decides where it sits among others.\n7. *Conclusion.*\n\n**Marking criteria:** clear position (1), firewall scope (2), ISMS components (3), risk management link (2), balanced counterpoint (1), conclusion (1).\n\n**Common mistake:** attacking firewalls instead of explaining what a management system adds.\n<\/details>\n\n**Q14.** Using the microfinance scenario in Section 1.8, propose three measurable security objectives (an ISMS component), name the control that supports each, and say how each would be monitored.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer (example):**\n1. *Objective:* \"Restore the loan system within 4 hours.\" Control: offline backups plus a tested DRP. Monitoring: a restore test each quarter, with timings recorded.\n2. *Objective:* \"100% of laptops encrypted by month 3.\" Control: disk encryption policy enforced through endpoint tools. Monitoring: monthly inventory check against the asset list.\n3. *Objective:* \"Phishing click rate below 5% within 6 months.\" Control: awareness training and phishing simulations. Monitoring: simulation results each quarter.\n\n**Marking criteria:** each objective measurable and achievable (3), matched controls (3), monitoring method (3), link to monitoring and review step (1).\n\n**Common mistake:** vague objectives (\"improve security\") with no measure.\n<\/details>\n\n\n---"}, {"id": "t2", "t": "TOPIC 2 — Information Security Threats, Risks and Cyber Crimes", "s": "2 · Information Security Threats, Risks and Cyber Crimes", "g": "Topics", "c": "#e11d48", "k": "2", "md": "# TOPIC 2 — Information Security Threats, Risks and Cyber Crimes\n\n**Classification:** Likely exam focus, Core\n**Sources:** Topic 2.1 (Threats and Risks), Topic 2.2 (Cyber Crimes), Topic 2.2 (Overview of Cyber Security). CW1 Q1 to Q25 and Q47, Q50 test this topic. About 20 of CW1's 50 questions come from here, so this is the highest-yield topic for MCQs.\n**Outline items:** (a) threats, (b) risks, (c) introduction to cyber crimes and attacks, (d) information security measures.\n\n## PHASE 1 — UNDERSTANDING\n\n### 2.1 The big picture\n\nTopic 1 told you what to protect (confidentiality, integrity, availability). Topic 2 tells you **what attacks them**, **how likely and how bad that is** (risk), and **what to do about it** (measures).\n\nThe best way to read this topic is as one chain:\n\n```\n ASSET  ->  has a  VULNERABILITY  ->  exploited by a  THREAT (actor + exploit)\n   |                                              |\n   |                                              v\n   +---------- if it happens ------------>  IMPACT on C, I or A\n                                                  |\n        Risk = Likelihood x Impact  <-------------+\n                                                  |\n                     MEASURES (prevent, detect, respond) reduce likelihood or impact\n```\n\n**Where it connects.** Back to Topic 1: every threat is a threat to C, I or A. Forward to Topic 3: policies define what staff must do about these threats. Forward to Topic 4: network and application attacks (SYN flood, ARP poisoning) are explained at packet level. Forward to Topic 7: controls are the answer to these risks.\n\n### 2.2 Key terms (the vocabulary the exam keeps reusing)\n\n| Term | Notes' definition | Plain-English check |\n|---|---|---|\n| Threat | A potential negative action or event, facilitated by a vulnerability, that can cause an unwanted impact. Also: the potential for a threat agent to exploit a vulnerability | Something that *could* hurt you |\n| Vulnerability | A weakness in a host or system that can be exploited. Types: network, operating system, human, process | The unlocked door |\n| Exploit | Code that takes advantage of a vulnerability to cause unintended behaviour. Can be known or unknown | The tool that opens the unlocked door |\n| Risk | Likelihood of a threat exploiting a vulnerability and causing harm; the potential for loss. Also: risk of financial loss, disruption or reputational damage from IT failure | Probability of the threat succeeding, combined with how bad it would be |\n| Attack | An attempt via cyberspace to disrupt, disable, destroy or maliciously control a computing environment, or destroy data integrity, or steal controlled information | The threat actually happening |\n| Attack vector | A method of gaining unauthorized access to a network or system | The route in (email, USB, open port) |\n| Attack surface | The total number of attack vectors an attacker can use | All the routes in, added up |\n| Exploitation | Monitoring, espionage and copying data on computer systems. Different from a cyber attack, which aims to affect normal functioning | Quiet copying vs loud breaking |\n| Hacker | Someone with technical skills, often used for those who breach defences | Skill, not necessarily crime |\n| Cyberspace | The global domain of interdependent IT infrastructures (internet, telecoms, computer systems, embedded processors). Three layers: physical, logical, persona | The environment attacks happen in |\n| Cybercrime | Any criminal activity involving a computer, networked device or network. The computer may be the tool or the target | |\n| Cyber security | The application of technologies, processes and controls to protect systems, networks, programs, devices and data from cyber attacks | |\n\n**One concrete chain showing all of these:**\n\n1. A bank's web server runs a version of software with a known flaw that has not been patched. That flaw is the **vulnerability** (an operating system or network vulnerability).\n2. Someone downloads code that uses the flaw to run commands on the server. That code is the **exploit**.\n3. The person, the **threat agent**, sends the exploit to the server's open web port. The open port is the **attack vector**. All the open ports and web forms together are the **attack surface**.\n4. The server executes the commands and the attacker copies customer data. This is the **attack** (and the copying is also **exploitation** in the notes' sense). The **impact** is a breach of confidentiality.\n5. The **risk** was the likelihood of step 3 succeeding times how bad step 4 would be. CW1 Q47 asks exactly this: \"a flaw that has not been fixed with a patch\" is a **vulnerability**, not a threat, risk or impact.\n\n### 2.3 The threat catalogue (16 types in your notes)\n\nFor each: what it is, the notes' examples, which of C, I, A it mainly hits.\n\n| # | Threat | Description (notes) | Examples (notes) | Mainly hits |\n|---|---|---|---|---|\n| 1 | Malware | Malicious software designed to harm, exploit or compromise systems | Viruses, worms, trojans, ransomware, spyware, adware | C, I, A |\n| 2 | Phishing | Fraudulent attempts to obtain sensitive information by pretending to be trustworthy | Email phishing, spear phishing, whaling, smishing | C |\n| 3 | DoS and DDoS | Make a machine or network resource unavailable by overwhelming it | Flood attacks, application-layer attacks, botnets | A |\n| 4 | Cross-site scripting (XSS) | Inject malicious scripts into content from otherwise trusted websites | Stored, reflected, DOM-based XSS | C |\n| 5 | Man-in-the-middle (MitM) | Attacker secretly intercepts and relays messages between two parties who think they talk directly | Eavesdropping, session hijacking, HTTPS spoofing | C, I |\n| 6 | SQL injection | Insert malicious SQL into a query to manipulate a database | Authentication bypass, data leakage, deletion or alteration | C, I, A |\n| 7 | Insider threats | Threats from within the organization | Data theft, sabotage, unintentional breaches through negligence | C, I, A |\n| 8 | APTs | Prolonged, targeted attacks to steal data or conduct surveillance over a long period | State-sponsored attacks, corporate espionage | C |\n| 9 | Password attacks | Attempts to obtain or bypass passwords | Brute force, dictionary, credential stuffing, keylogging | C |\n| 10 | Zero-day exploits | Attacks on previously unknown vulnerabilities | Exploitation before a patch is released | C, I, A |\n| 11 | Social engineering | Manipulating people into divulging information or acting insecurely | Pretexting, baiting, tailgating, quid pro quo | C |\n| 12 | Ransomware | Malware that encrypts files and demands payment for the key | Crypto-ransomware, locker ransomware | A |\n| 13 | Supply chain attacks | Target less secure elements in the supply chain to reach an organization | Software supply chain, hardware-based attacks | C, I, A |\n| 14 | IoT vulnerabilities | Weaknesses in internet-connected devices | Unauthorized access, data breaches, botnet formation | C, A |\n| 15 | Cloud security threats | Risks from using cloud services | Data breaches, insecure APIs, account hijacking, misconfiguration | C |\n| 16 | Physical security threats | Risks to the physical infrastructure | Theft of devices, destruction of hardware, unauthorized physical access | C, A |\n\n### 2.4 Threats explained step by step\n\n#### 2.4.1 Malware: telling the types apart (a heavy MCQ area)\n\n| Type | How it behaves | The key phrase that identifies it | CW1 link |\n|---|---|---|---|\n| **Virus** | Attaches itself to another file and runs only when that file is executed | \"hides within another file until that file is executed\" | Q1 |\n| **Worm** | Replicates by itself across networks, with no host file needed | \"spreads across networks without a host file\" | Q6 |\n| **Trojan horse** | Pretends to be a useful program | \"presenting itself as a seemingly useful application\" | Q1 (as a wrong option) |\n| **Logic bomb** | Code that stays dormant until a condition is met (a date, a file, an event) | \"only activates once a particular condition is satisfied\" | Q8 |\n| **Ransomware** | Encrypts files and demands payment for the key | \"encrypts critical files and demands payment\" | Q16, Q49 |\n| **Spyware** | Secretly monitors activity | | |\n| **Keylogger** | Records keystrokes to capture passwords | | Q8 (as a wrong option) |\n| **Adware** | Pushes unwanted adverts | | Q16 (wrong option: \"pop-up ads\") |\n\n> **Supplementary explanation: virus subtypes tested in CW1 but absent from the notes.**\n> - **Boot sector virus:** infects the very first section of a storage device (the boot sector, or Master Boot Record), so the computer cannot start. It can look like a hardware failure (CW1 Q2, and the sample MCQs).\n> - **File infector virus:** attaches to executable program files.\n> - **Macro virus:** hides in the macros of documents such as Word or Excel files. Disabling macros reduces the risk.\n> - **Polymorphic virus:** changes its own code each time it spreads so that signature-based antivirus does not recognise it (CW1 Q4).\n> - **Resident virus:** loads into memory and stays active.\n> - **Multipartite virus:** infects both boot sectors and files.\n> Quick memory aid: **polymorphic = shape-shifting to dodge detection**.\n\n#### 2.4.2 SQL injection: what actually happens, line by line\n\nA login page runs this query every time someone submits the form (this is a typical vulnerable pattern, shown for learning):\n\n```\nSELECT * FROM users WHERE username = '<typed username>' AND password = '<typed password>';\n```\n\n**Normal use.** Mary types `mary` and `pass123`. The database receives:\n\n```\nSELECT * FROM users WHERE username = 'mary' AND password = 'pass123';\n```\n\nIt returns Mary's row only if both match. Otherwise nothing comes back and the login fails.\n\n**Injection.** An attacker types `admin' --` as the username and anything as the password. Now the database receives:\n\n```\nSELECT * FROM users WHERE username = 'admin' --' AND password = 'x';\n```\n\nReading it line by line:\n\n- `username = 'admin'` is now closed by the attacker's own quote mark.\n- `--` starts a **comment** in SQL, so everything after it (the password check) is ignored.\n- The query becomes \"find the user called admin\", with no password test. The database returns the admin row and the application logs the attacker in.\n\nThe application *appears to work normally* while being \"secretly manipulated to bypass controls\" (the CW1 Q11 wording). This is why SQLi is an attack on **confidentiality** (data read), **integrity** (data altered or deleted) and sometimes **availability**.\n\n> **Supplementary explanation: types of SQL injection (CW1 Q10).**\n> - **In-band (classic):** the attacker gets results through the same channel used to attack (the web page).\n> - **Blind:** the page shows no data; the attacker infers answers from true/false behaviour or timing.\n> - **Out-of-band:** data is retrieved through a **separate channel such as DNS**. This is the answer to CW1 Q10.\n>\n> **How to stop it:** validate input, use parameterised queries (the typed text is treated as data, never as SQL), and place a Web Application Firewall (WAF) in front. A WAF is designed to protect against SQL injection and cross-site scripting (CW1 Q39).\n\n#### 2.4.3 Cross-site scripting (XSS): three variants\n\nAll three make a victim's browser run an attacker's script that appears to come from a trusted site.\n\n| Variant | Where the script lives | Walk-through |\n|---|---|---|\n| **Stored XSS** | Saved on the server | 1. An attacker posts a comment containing a script. 2. The site stores it in its database. 3. Every visitor who loads the page runs the script. 4. The script quietly sends each visitor's session token to the attacker. This is CW1 Q9: \"a script embedded in a comment section ... executes whenever another user loads the page\". |\n| **Reflected XSS** | In a crafted link, bounced back by the server | 1. The attacker builds a link with a script in it. 2. A victim clicks the link. 3. The server includes the script in its response page. 4. The browser runs it. Nothing is stored. |\n| **DOM-based XSS** | In the page's own client-side code | 1. The page's JavaScript reads part of the URL. 2. It writes that part into the page unsafely. 3. The attacker's script runs, without the server's response containing it. |\n\n**Memory aid:** stored = saved and hits everyone; reflected = one clicked link; DOM-based = the browser's own code is the culprit.\n\n#### 2.4.4 Man-in-the-middle (MitM)\n\n1. Two parties believe they are communicating directly, for example, a customer and a bank site over open Wi-Fi.\n2. An attacker positions themselves on the path (for example, by running a fake hotspot).\n3. The attacker receives each message, may read or **alter** it, and forwards it so neither side notices.\n4. Examples in the notes: eavesdropping, session hijacking, HTTPS spoofing.\n\n**Best prevention (CW1 Q3): strong encryption such as HTTPS or a VPN.** Ad-blockers, disabling macros, and running as administrator do nothing against MitM.\n\n#### 2.4.5 Denial of service and DDoS\n\n- **DoS:** one source floods a target so legitimate users are blocked.\n- **DDoS:** thousands of machines, often a **botnet** of infected devices whose owners do not know, send the flood together. It looks like network congestion (CW1 Q5).\n- The goal is not to steal or change data but to **deny access**, so it is an attack on **availability**.\n- Examples in the notes: flood attacks, application-layer attacks, botnets. Topic 4 covers the SYN flood in detail.\n\n#### 2.4.6 Password attacks\n\n| Attack | How it works | Difference |\n|---|---|---|\n| **Brute force** | Tries *every possible combination* until one works | Exhaustive, slow, no guessing logic |\n| **Dictionary** | Tries a *precompiled list* of likely words and common passwords | Faster; relies on people choosing predictable passwords (CW1 Q14) |\n| **Credential stuffing** | Takes usernames and passwords leaked from one site and tries them on others | Works because people reuse passwords |\n| **Keylogging** | Malware records what you type | Captures even strong passwords |\n\n**Mitigation:** strong password policy, MFA, account lockout after repeated failures, never reuse passwords.\n\n#### 2.4.7 APT and zero-day: two terms students mix up\n\n| | APT | Zero-day |\n|---|---|---|\n| Describes | **How long and how targeted** the attack is | **What kind of flaw** is exploited |\n| Key phrase | Intruder stays **undetected for months**, gathering data (CW1 Q13) | Flaw is exploited **before the vendor has a patch** (CW1 Q15) |\n| Relationship | An APT often *uses* a zero-day, but does not have to | A zero-day can be used in a quick, one-time attack |\n\n#### 2.4.8 Insider threats\n\nThe notes name three types: **malicious** (deliberate, such as a disgruntled employee copying customer data to sell, CW1 Q24), **accidental** and **negligent** (no harm intended, for example sending client data to the wrong recipient, CW1 Q12 \"Negligent insider\").\n\n> **Supplementary explanation.** CW1 Q12 also offers \"compromised insider\": an insider whose account or device has been taken over by an outsider. The employee did nothing wrong, but the insider access is being used by an attacker.\n\nInsiders include current and former employees, temporary workers and customers (notes, overview deck).\n\n#### 2.4.9 Social engineering: the main variants (CW1 Q19, Q21)\n\nSocial engineering attacks the *person*, not the computer.\n\n| Variant | What the attacker does | Spot it by |\n|---|---|---|\n| **Pretexting** | Creates a fake persona or misuses a real role | \"I'm from IT, I need your password to fix your account\" |\n| **Baiting** | Lures victims with something valuable, such as a USB labelled \"confidential\" or free downloads | Something tempting left to be picked up (CW1 Q19) |\n| **Tailgating / piggybacking** | Follows an authorized person into a restricted area | Physical following (CW1 Q21) |\n| **Quid pro quo** | Offers a service or favour in return for access or information | \"IT support\" offering to speed up your internet |\n| **Honeytrap** | Fake dating or social profiles to build a relationship | Romance scam |\n| **Scareware** | Frightens you with a fake virus warning | \"Your device is infected, click to clean\" |\n| **Watering hole** | Infects a site the target regularly visits | Drive-by download |\n| **Search engine phishing (SEO poisoning)** | Becomes the top search hit for a term | A search result that leads to a fake site |\n\n#### 2.4.10 The phishing family (the notes' list)\n\n| Name | Channel / target | Trick to remember |\n|---|---|---|\n| **Phishing** | Any communication, mostly email; mass | \"Fishing\" with a wide net |\n| **Spear phishing** | A specific person or group (for example, a system administrator) | Spear = one target |\n| **Whaling** | Top management (CEO, CFO) | Whale = big fish |\n| **Vishing** | Voice call | **V**oice |\n| **Smishing** | SMS text message | **SM**S |\n| **Business Email Compromise (BEC)** | Impersonation, account compromise, thread hijacking | Pretends to be a trusted business email |\n| **Pharming** | Redirects users to a fake website that looks real | Fake site, no click needed on a bait link |\n\n#### 2.4.11 Other threats in the catalogue\n\n- **Supply chain attacks:** the attacker compromises a weaker supplier or software update, then uses it to reach the real target.\n- **IoT vulnerabilities:** smart devices often have weak security and may become part of a botnet. Administrators sometimes fail to detect them because they run lightweight operating systems without discovery protocols (CW1 Q17, supplementary).\n- **Cloud threats:** data breaches, insecure APIs, account hijacking, misconfiguration. A very common one is a **misconfigured storage bucket or database** left public through human error rather than malware (CW1 Q18).\n- **Physical threats:** theft of devices, destruction of hardware, unauthorized physical access. An **accidental** spill on a workstation is an unintentional human action, not sabotage or a natural disaster (CW1 Q22).\n\n### 2.5 Who attacks: the nine attacker types (overview deck)\n\n| # | Attacker | Motive | Resources and notes |\n|---|---|---|---|\n| 1 | Recreational | Fame and notoriety | Limited resources; know which weakness to exploit |\n| 2 | Script kiddies | Curiosity, fun | Amateurs using ready-made tools; less skill, usually little damage |\n| 3 | Cyber criminals | Financial gain | Individuals or groups that capture systems or data to profit |\n| 4 | Hacktivists | A political agenda or cause | Not after money; may pair with malicious insiders |\n| 5 | State-sponsored | Political or military goals of a country | Very large resources; often cause APTs; cyberwar, industrial espionage |\n| 6 | Insiders | Grudge, carelessness | Disgruntled or former employees, temporary workers, customers; malicious, accidental or negligent |\n| 7 | Organized crime | Large-scale crime | Groups pooling hackers and programmers |\n| 8 | Hackers | Varies | **White hat** (ethical, find weaknesses to fix), **gray hat** (break in without harm, then tell the owner), **black hat** (unethical, for personal benefit) |\n| 9 | Nation-state actors / cyberterrorists | Steal secrets, damage facilities, create international incidents | Often target critical infrastructure such as power grids |\n\n### 2.6 Information security risks\n\n**Notes' definition:** \"the likelihood of a threat exploiting a vulnerability and causing harm\", and \"the potential for loss when the threat happens\".\n\nThe notes list 15 risks with their impacts. Learn the pairs:\n\n| Risk | Typical impacts (notes) |\n|---|---|\n| Data breaches | Loss of customer trust, legal consequences, financial loss, reputational damage |\n| Malware attacks | Data corruption, unauthorized access, downtime, financial loss |\n| Phishing | Credential theft, unauthorized access, financial loss, breaches |\n| Ransomware | Data loss, operational disruption, financial loss, reputational damage |\n| DoS / DDoS | Downtime, loss of revenue, reputational damage |\n| Insider threats | Data theft, sabotage, disruption, financial loss |\n| SQL injection | Unauthorized access to databases, data theft, data manipulation |\n| MitM | Data theft, data manipulation, unauthorized access |\n| Weak passwords | Unauthorized access, breaches, system compromise |\n| Unpatched software | Exploitation of known vulnerabilities, unauthorized access, breaches |\n| Social engineering | Credential theft, unauthorized access, breaches |\n| APTs | Data theft, espionage, operational disruption |\n| Physical security risks | Theft or damage of hardware, unauthorized data access |\n| Cloud security risks | Breaches, unauthorized access, data loss |\n| IoT vulnerabilities | Unauthorized access, breaches, system manipulation |\n\n#### Risk = Likelihood × Impact: worked, line by line (CW1 Q25)\n\n**Scenario.** Score each risk 1 (low), 2 (medium), 3 (high).\n\n1. Phishing: likelihood is **High (3)** because staff receive suspicious emails every week. Impact is **Medium (2)** because one stolen password gives limited access.\n2. Multiply: 3 × 2 = **6**.\n3. Compare with the organization's matrix. On a typical 3 × 3 scale: 1 to 2 Low, 3 to 4 Medium, 6 High, 9 Critical. So the answer is **High**.\n4. The risk is then prioritised against the others in the register.\n\n> **Supplementary explanation: the four standard responses to a risk.** Once scored, an organization can **reduce** it (apply controls), **avoid** it (stop the activity), **transfer** it (insurance or outsourcing; CW1 Q46 lists \"Risk Transfer\" as a wrong option for the definition of compliance) or **accept** it (knowingly live with it). Your notes focus on the first, which they call **mitigation**.\n\n### 2.7 Cyber crimes (Topic 2.2 deck)\n\n**Definition (notes):** any criminal activity that involves a computer, networked device or network. The computer may be the tool, or it may be the target. Harm can be to security, finances, reputation, or even mental health and life.\n\n#### 2.7.1 Crimes targeting computer systems\n\n| Crime | What it is (notes) |\n|---|---|\n| **Data diddling** | Deliberately entering wrong information into a system or document, by a person or a virus. (Link to Topic 7: input controls exist to catch this.) |\n| **Malware attacks** | Viruses, worms, trojans, logic bombs, spyware, ransomware |\n| **Data breaches** | Sensitive information copied, transmitted, viewed, stolen, altered or used without the owner's knowledge or authorization |\n| **APTs** | Prolonged, targeted attack; intruder remains undetected for a long time |\n| **DDoS** | Overwhelm a server, service or network with traffic |\n| **Spam and phishing** | Spam: unwanted notifications or ads. Phishing: attempts to get passwords or card numbers |\n| **Corporate Account Takeover (CATO)** | Criminals steal employee credentials to control systems and move information or money |\n| **ATM cash-out** | Criminals breach a bank or card processor, manipulate fraud controls and alter accounts so there is no withdrawal limit, then withdraw from many ATMs in a short time |\n\n#### 2.7.2 Crimes targeting mobiles\n\nMobile devices account for more than 60% of digital fraud (notes). The top smartphone threats listed:\n\n| Threat | Key idea |\n|---|---|\n| Data leaks | Apps collect names, birth dates, location, contacts; a breach at the app developer exposes them |\n| Poor password security | Reused or weak passwords, no multi-factor authentication |\n| Open Wi-Fi | Unencrypted networks; attackers may run fake hotspots |\n| Phishing | Tricks to give up a password, click a malware link, confirm a transaction |\n| Identity theft | Stolen identities used to open or hijack phone accounts |\n| Spyware | Software that monitors texts, location, conversations |\n| Malicious apps | Trojan-style apps that lock the phone or steal data and mobile money |\n| Apps with weak security | Weak encryption or leaked tokens that let hackers impersonate users |\n| Out-of-date devices | Phones that no longer receive security updates |\n\n> **Supplementary explanation: SIM swap (CW1 Q20).** An attacker convinces the mobile provider to move the victim's phone number onto the attacker's SIM card. Now text messages go to the attacker, including **one-time passwords** (OTPs). The attacker can reset passwords and take over accounts. The critical risk is OTP interception, not device damage.\n\n#### 2.7.3 Online scams and frauds\n\nEmail scams, phishing, vishing, smishing, whaling; online job or recruitment fraud; online sextortion; debit/credit card and online payment fraud; cyberbullying; website defacement (replacing a site's content); cybersquatting (registering domain names similar to trademarks or company names to profit); pharming (redirecting users to a fake look-alike site); cyber espionage (stealing classified or sensitive data or IP for advantage); cryptojacking (hijacking a computer to mine cryptocurrency without consent).\n\n#### 2.7.4 Social media scams and frauds\n\nImpersonation and identity theft; fake job offers; **misinformation** (false information spread, whether or not there is intent to mislead); **fake news** (false information or propaganda posed as news); cyber grooming; child sexual exploitation content; cyber stalking; cyberbullying; doxing (publishing someone's private information online).\n\n> **A fake social media account spreading misinformation during an election** is **cyber propaganda** (CW1 Q50), not sabotage, espionage or terrorism.\n\n### 2.8 Two case studies from your notes, made concrete\n\n#### Case Study I: Spear phishing (the email in your slides)\n\nThe slide shows an email from a \"Better Business Bureau\" claiming your company has been reported for violating the Fair Labor Standards Act. Work through it line by line:\n\n| Part of the email | Why it is a red flag |\n|---|---|\n| Looks like it comes from a person with a case number (\"Case:563121380649:307\") | A reference number makes it feel official and personal, which is typical of **spear** phishing (it targets a specific company) |\n| \"Better Business Bureau has received an abuse, claiming that your company is violating...\" | Authority impersonation plus an alarming legal claim. Note the odd wording (\"abuse\" instead of \"complaint\") |\n| \"Download the document ... by following the link\" `https://bit.ly/...` | A **shortened link** hides the real destination. The link likely leads to a malicious or credential-stealing site |\n| \"Please send a short reply within 24 hours\" | **Urgency** to stop you from thinking |\n| \"Keep the abuse ID unchanged in the subject\" | Makes the process seem bureaucratic and genuine |\n| Signed \"Compliant Department\" | A misspelling of \"Complaint Department\" |\n\n**What a careful employee does:** do not click; check the sender's real address; hover over or expand the link; contact the organisation through a known channel; report the email to IT.\n\n#### Case Study II: Cyber grooming (kept at the level of lessons)\n\nYour notes present a case in which an adult deceived a young person online about his age and identity, built an emotional hold on him and isolated him from his parents, and early warnings from the family were not acted on effectively. The details are distressing and you need not memorise them. What an exam will want:\n\n- **Definition (notes):** cyber grooming is when someone, often an adult, befriends a child online and builds an emotional connection with intent to sexually abuse, exploit or traffic them.\n- **Pattern-level warning signs:** an online contact who is secretive, much older than claimed, gives gifts or attention, pushes the child to hide the relationship, or urges a meeting alone.\n- **Lessons from the case:** take a family's early report seriously; preserve evidence; escalate beyond one police contact; platforms and gaming groups need reporting mechanisms; parents and schools need awareness.\n\n### 2.9 Cyber security overview, key points\n\n**Definition (notes).** Cyber security protects an organization, its employees and assets against cyber threats through technologies, processes and controls, reducing the risk of attacks and unauthorized exploitation.\n\n**Pillars (types) of cyber security:** network, cloud, endpoint, mobile, IoT, application, and **zero trust**. Zero trust replaces the perimeter-only model (\"walls around valuable assets\") because of insider threats, a broken-down perimeter and remote work.\n\n**How to deceive attackers (notes):** conceal valuable data among decoy files; camouflage infrastructure by changing addresses and topologies; give false information such as fake assets; use advisory insights; use IPS and firewalls.\n\n**Evolution of attacks:** five generations: Gen 1 late 1980s, Gen 2 mid-1990s, Gen 3 early 2000s, Gen 4 around 2010, Gen 5 around 2017.\n\n**Why the landscape is getting harder:** detection alone is no longer good enough; focus must shift to **prevention** and a consolidated architecture. Complex hybrid environments (on-premises plus several clouds), mixed endpoints including BYOD, and remote work widen the attack surface.\n\n#### Cyber warfare vs cyber terrorism\n\n| | Cyber warfare | Cyber terrorism |\n|---|---|---|\n| Who | A nation-state or international organization | Premeditated, politically motivated actors |\n| Aim | To \"weaken, disrupt or destroy\" another nation | To cause fear, threaten violence or result in violence |\n| Methods in the notes | Espionage, sabotage, DoS, power-grid attacks, propaganda, economic disruption, surprise attacks | Often ransomware and phishing |\n| Possible effects | Blackouts, military equipment failure, secrets stolen, network disruption, death | |\n\n**Case studies (as in the notes):** the 2017 attack in Ukraine and on the UK NHS (looked like ransomware but did large-scale damage; an example of economic disruption); **Stuxnet** (a worm spread through infected USB devices that targeted control systems in Iran's nuclear programme); the **Sony Pictures hack** (attributed to North Korean government hackers after a film release); the **Qatar emails** case (alleged theft and leak of a fundraiser's emails to discredit him).\n\n**Critical infrastructure.** Systems, networks and assets whose continuous operation is necessary for a nation's security, economy and public health or safety. The **protection process** has five steps: identify critical infrastructure; identify and assess vulnerabilities; analyse and prioritise infrastructure; implement protective programmes; measure effectiveness. **Cyber resilience** is the ability to keep operating and recover.\n\n### 2.10 Security measures (mitigation strategies in the notes)\n\n| Measure (notes) | Threats it mainly reduces |\n|---|---|\n| Firewalls and IDS/IPS | Network attacks, DoS, intrusion attempts |\n| Regular updates and patch management | Zero-day follow-ups, unpatched software, malware, SQLi |\n| Strong passwords, MFA | Password attacks, credential theft, phishing impact |\n| Employee training and awareness | Phishing, social engineering, insider negligence |\n| Encryption and secure protocols (data at rest and in transit) | MitM, eavesdropping, data theft |\n| Regular security audits and risk assessments | All, by finding weaknesses early |\n| Incident response and disaster recovery plans | Ransomware, outages, breaches (limits impact) |\n| Access controls and least privilege (RBAC) | Insider threats, account misuse |\n| Regular, secured and integrity-tested backups | Ransomware, data loss |\n| Physical security (surveillance, access control) | Theft, tailgating, unauthorized access |\n| Compliance with laws and regulations, with audits | Legal exposure |\n\n> **Supplementary explanation: other measures CW1 tests.** **Network segmentation** (dividing a network into isolated segments so malware cannot spread freely; CW1 Q35); **a Web Application Firewall** for SQLi and XSS (Q39); **patching** reduces the attack surface and helps availability (Q40); **incident response** as the structured process of detection, containment and recovery (Q36).\n\n### 2.11 A decision tree for scenario-style MCQs\n\nUse this to decode long, wordy stems:\n\n```\nQ: What is the attack described?\n |\n +-- Does it lock files and demand payment?  ---------------> RANSOMWARE (availability)\n +-- Does it flood a target from many machines? -----------> DDoS (availability)\n +-- Does it hide in a file and need that file to run? ----> VIRUS\n |      +-- affects the boot sector / MBR? ----------------> BOOT SECTOR VIRUS\n |      +-- changes its code to avoid detection? ----------> POLYMORPHIC VIRUS\n +-- Does it spread itself across a network, no host? ----> WORM\n +-- Does it look like useful software? -------------------> TROJAN\n +-- Does it wait for a date or condition? ----------------> LOGIC BOMB\n +-- Fake email/site to steal credentials? ----------------> PHISHING (spear / whaling / vishing / smishing)\n +-- Odd characters in a login form change the query? ----> SQL INJECTION\n +-- Script saved in a comment runs for every visitor? ---> STORED XSS\n +-- Someone secretly sits between two parties? ----------> MAN-IN-THE-MIDDLE (prevent with HTTPS/VPN)\n +-- Long-term, undetected, data-gathering intruder? -----> APT\n +-- Exploits a flaw before a patch exists? --------------> ZERO-DAY\n +-- Tries every combination / a word list? --------------> BRUTE FORCE / DICTIONARY\n +-- Employee with access misuses or leaks data? ---------> INSIDER (malicious / negligent)\n +-- Flash drive left lying around? ----------------------> BAITING\n +-- Follows someone through a secure door? --------------> TAILGATING\n +-- Fake accounts spreading false stories to sway opinion? -> CYBER PROPAGANDA\n```\n\n### 2.12 Common misconceptions and exam traps\n\n| Trap | Truth |\n|---|---|\n| \"A threat and a vulnerability are the same\" | The vulnerability is the weakness; the threat is the potential harm facilitated by it. An unpatched flaw is a **vulnerability** (CW1 Q47). |\n| \"A worm needs a host file\" | A worm replicates **without** a host; a virus needs one. |\n| \"Trojan and virus are the same\"
