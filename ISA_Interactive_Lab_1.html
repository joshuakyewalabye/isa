tandards referenced |\n| 3 | **Methodology** | Procedures, sampling, data sources from MUBSEP, and where applicable the VAPT approach |\n| 4 | **Detailed findings and recommendations** | Structured by the **nine areas** (a to i). Each finding: condition with evidence, criteria, cause, effect, recommendation with owner and timeline |\n| 5 | **Testing summaries** | For interest recomputation, tariff accuracy and excise duty, product eligibility, and access and segregation reviews: the basis of calculation and reconciliation outcomes |\n| 6 | **Availability, capacity, performance and DR/BCP observations** | With any identified gaps |\n| 7 | **Management action plan** | Consolidated agreed actions, owners and target dates |\n| 8 | **Appendices** | Referenced artefacts, workpapers, calculations, screenshots, evidence logs |\n\n**The nine areas (CW2):** (a) IT policy review; (b) password configuration compliance; (c) tariff application accuracy; (d) application controls for interest income recomputation; (e) product eligibility validation; (f) segregation of duties and access rights; (g) vulnerability assessment and penetration testing; (h) ICT capability and operations; (i) authentication, authorisation and accounting mechanisms.\n\n**Submission rules (CW2 brief), worth ticking off:**\n- Submit the **PDF report** and **one ZIP titled GroupName_WorkingPapers.zip** (test sheets, recomputation worksheets, screenshots, evidence logs) via MUBSEP.\n- The PDF must have a **cover page** with the group number and members, including student and registration numbers.\n- Report length: **not less than 15 pages and not more than 20**.\n- Check **Turnitin** before uploading; plagiarism must be **below 20%**.\n- Each member must complete the **self and peer evaluation** form.\n- After submission, each group gets a **scope area to present and defend** orally; each member must contribute and be ready to answer if chosen randomly.\n- Show all worksheets and justify choices.\n\n#### 8.8.2 What the executive summary looks like (supplementary)\n\nA one-to-two page summary that a busy director can read alone:\n\n1. **Overall opinion.** One sentence on the adequacy and effectiveness of the IT control environment (for example, \"needs significant improvement\").\n2. **Top findings.** The three to five most serious, each in one line with its risk.\n3. **High-level risk posture.** Which of confidentiality, integrity and availability are most exposed.\n4. **What must happen next.** The key actions and timeline.\n\n**Sample (invented) executive summary extract:**\n\n> \"Overall, the control environment over BBCBank's core systems requires significant improvement. Key issues: (1) password settings do not meet policy and administrators lack multi-factor authentication; (2) excise duty was not applied on 1,620 of 60,000 mobile transactions, a shortfall of UGX 486,000 in the sample period; (3) 12 leavers retain active accounts. Confidentiality and integrity carry the highest risk; availability arrangements are partly effective. Management has agreed 14 actions, the most urgent due within 30 days.\"\n\n#### 8.8.3 Ratings and opinions (supplementary)\n\nOrganizations use different scales, so state yours in the report.\n\n**A simple finding rating (illustrative):**\n\n| Rating | Meaning |\n|---|---|\n| **High** | Serious weakness with significant likelihood and impact; act immediately |\n| **Medium** | Weakness that needs timely correction |\n| **Low** | Minor improvement |\n\n**A simple overall opinion scale (illustrative):** *Satisfactory* (controls adequate and effective), *Needs improvement* (some weaknesses), *Unsatisfactory* (significant weaknesses, objectives at risk).\n\n#### 8.8.4 Writing clearly and concisely (supplementary)\n\n| Rule | Why |\n|---|---|\n| **One finding, one issue** | Easier to assign and track |\n| **Lead with the number** | \"12 of 480 (2.5%)\" beats \"some\" |\n| **Short sentences, active voice** | Clear and readable |\n| **Define a term once, then use it consistently** | Avoids confusion |\n| **Neutral, factual tone: criticise the control, not the person** | Keeps the report credible and fair |\n| **Reference evidence (WP numbers)** | The reader can verify |\n| **Use tables for summaries** | Dense information is easier to scan |\n| **Avoid padding and copied text** | Plagiarism limit; the report must be 15 to 20 pages |\n\n### 8.9 Communicating findings to different stakeholders\n\nThe same finding is told differently to different audiences.\n\n| Audience | What they need | Format and tone |\n|---|---|---|\n| **Board audit and risk committee** | The overall opinion, the biggest risks, trends and decisions needed | Executive summary, one page, no technical jargon |\n| **Senior management** | Findings that need resources or decisions; deadlines; ownership | Summary tables, priorities, business impact |\n| **IT managers and process owners** | Detail: exactly what, where, why and how to fix | Full finding, evidence references, technical detail |\n| **Regulators or external auditors (where relevant)** | Compliance status and remediation | Formal, factual, evidence-backed |\n| **Operational staff affected** | What changes for them | Practical, short |\n\n**Same finding, three versions (illustrative).**\n\n- *To the board:* \"Former staff can still log in to core banking, which creates a fraud and data theft risk. Management has agreed an automated fix within 60 days.\"\n- *To the CIO:* \"12 of 480 leavers (2.5%) retain active core banking accounts; two logged in post-exit. HR-to-IT notification is manual. Recommend automated deprovisioning and monthly reconciliation; owner Head of IT; 60 days.\"\n- *To the helpdesk team:* \"Disable accounts on the leaver's last day. You will receive a daily list from HR starting next month; confirm completion in the ticket.\"\n\n### 8.10 Presenting and defending the report (CW2 oral session)\n\n(From the CW2 brief: each group is assigned a scope area to present and defend; each member must contribute and answer if chosen randomly.)\n\n> **Supplementary explanation: how to prepare.**\n> - Know **your numbers**: population, sample, exceptions, rates, amounts, and where the working paper is.\n> - Be able to explain **why** you chose each procedure and each sampling decision (the brief says to \"justify your decision for choices taken\").\n> - Be ready for **\"what if\"** questions: \"What if the sample had been larger?\", \"What if management disagrees?\", \"What is the effect in money terms?\".\n> - Practise explaining a finding in **thirty seconds** using condition, criteria, cause, effect, recommendation.\n> - **Every member** should be able to explain the whole methodology, not just their own area.\n\n### 8.11 Text diagram: the reporting flow\n\n```\n TEST RESULT (exception)\n      |\n      v\n CONFIRM FACTS with process owner\n      |\n      v\n WRITE FINDING (condition, criteria, cause, effect, recommendation) + rating + WP reference\n      |\n      v\n MANAGEMENT RESPONSE (agree, action, owner, date)\n      |\n      v\n REPORT: executive summary -> findings -> testing summaries -> management action plan -> appendices\n      |\n      v\n COMMUNICATE to audience (board, management, IT, regulators)\n      |\n      v\n FOLLOW UP: were actions done? did they work?\n```\n\n### 8.12 Common misconceptions and exam traps\n\n| Trap | Truth |\n|---|---|\n| \"A finding is just a list of problems\" | A finding needs five elements: condition with evidence, criteria, cause, effect, recommendation with owner and timeline. |\n| \"Cause and effect are the same\" | Cause is **why** it happened; effect is **what it means** for the organization. |\n| \"The recommendation can be general\" | It must be specific, owned, time-bound and aimed at the cause. |\n| \"VA and PT are the same\" | VA finds and ranks weaknesses; PT tries to exploit them to show impact. |\n| \"Severity decides priority on its own\" | Priority combines severity with asset criticality and exposure. |\n| \"The executive summary is an introduction\" | It states the overall opinion, top findings and risk posture. |\n| \"The report is the end\" | Follow-up verifies that actions were implemented and effective. |\n| \"A longer report is a better report\" | CW2 requires 15 to 20 pages; clarity and evidence matter more than length. |\n| \"Everyone gets the same version of the findings\" | Tailor the detail and tone to the audience. |\n| \"Unauthorised testing is fine if it finds weaknesses\" | VAPT needs written authorisation and rules of engagement. |\n\n### 8.13 Checklist: reviewing a draft finding or report\n\n1. **Condition:** a fact, with numbers and an evidence reference?\n2. **Criteria:** the policy, standard or approved parameter is named?\n3. **Cause:** the root cause, not just a repeat of the condition?\n4. **Effect:** business or regulatory risk, ideally with money, time or customers?\n5. **Recommendation:** specific, owned, time-bound, aimed at the cause?\n6. **Rating** stated and consistent?\n7. **Does the executive summary match the findings?**\n8. **Can every number be traced to a working paper?**\n9. **Tone** neutral and professional? **Audience** right?\n10. **Length and formatting** within the brief (15 to 20 pages, cover page, Turnitin below 20%)?\n\n### 8.14 Revision summary (Topic 8)\n\n- Finding = condition (with evidence), criteria, cause, effect, recommendation (with owner and timeline).\n- Policy review gives the criteria; control testing gives the condition.\n- VA finds and ranks weaknesses; PT exploits them under written authority. VAPT steps: scope, tools and techniques, discovery, exploitation (PT), severity classification, business impact, prioritised remediation, retest.\n- Actionable recommendation: specific, addresses the cause, owned, time-bound, proportionate, measurable.\n- CW2 report: executive summary; background and scope; methodology; detailed findings by nine areas; testing summaries; availability/capacity/performance/DR-BCP observations; management action plan; appendices. PDF of 15 to 20 pages with cover page; working papers ZIP; plagiarism below 20%; oral defence.\n- Communicate to different stakeholders: tailor detail and tone (board, senior management, IT, regulators).\n- Follow up: monitor implementation and re-audit to verify effectiveness.\n\n\n---\n\n## PHASE 2 — COMPREHENSION CHECKS (Topic 8)\n\n**C1. Explain, in your own words, why a finding needs a cause and not just a condition and recommendation.**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nThe condition says what is wrong; the recommendation says what to do. Without the cause, the recommendation may fix only the symptom. For example, if 12 leavers have active accounts and the recommendation is simply \"disable them\", the same problem will reappear next month because the underlying cause (no automatic link between HR and IT) remains. Stating the cause lets management fix the root and lets the auditor check later that the right thing was fixed.\n\n**Check:** symptom vs root cause.\n<\/details>\n\n**C2. Why do audit reports separate \"criteria\" from \"condition\"?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nBecause a gap only exists relative to a benchmark. The condition is what you found; the criteria are what it should have been (policy, standard or approved parameter). Separating them shows the reader the benchmark and proves the finding is not just the auditor's opinion. If management disputes the finding, the argument is about whether the criteria apply, not about whether the auditor likes the result.\n\n**Check:** the finding is a comparison between two things.\n<\/details>\n\n**C3. What would happen if a report gave recommendations without owners and timelines?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nNobody would be accountable, and nobody would know when to act, so actions would drift and many would never be done. At follow-up, the auditor would have nothing specific to verify. The management action plan in the CW2 brief exists precisely to record agreed actions, owners and target dates.\n\n**Check:** accountability and verifiability.\n<\/details>\n\n**C4. How does a vulnerability assessment relate to a penetration test?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nA vulnerability assessment finds and ranks weaknesses, usually with scanning tools, giving breadth. A penetration test takes some of those weaknesses and attempts to exploit them under written authority, showing depth and real impact. They complement each other: the VA tells you what could be exploited; the PT shows what actually can be, and how far an attacker could go. Both end with a severity ranking and prioritised remediation.\n\n**Check:** find and rank vs exploit and demonstrate.\n<\/details>\n\n**C5. Why should the same finding be written differently for the board and for the IT manager?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nThey need different things. The board needs the risk, the overall opinion and any decision required, in plain language. The IT manager needs the exact detail (what, where, evidence, cause and fix) to act. Giving the board technical detail wastes their time and hides the message; giving the IT manager only a high-level summary leaves them unable to fix anything.\n\n**Check:** content and tone follow the audience's decision.\n<\/details>\n\n**C6. Give an original example of a weak finding and rewrite it using the five elements.**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\n*Weak:* \"Backups are not done properly.\"\n*Rewritten:*\n- *Condition:* the restore test log (WP D1) shows no restore of the core banking backup in the last 18 months; 2 of 10 sampled nightly backups failed without follow-up.\n- *Criteria:* the DR policy requires a restore test every quarter and daily failure follow-up.\n- *Cause:* no owner is assigned to backup monitoring.\n- *Effect:* in a failure, data may not be recoverable, risking prolonged outage and data loss.\n- *Recommendation:* assign an owner; run and document quarterly restore tests starting this quarter; report failures daily. Owner: Head of Infrastructure. 60 days.\n\n**Check:** numbers, benchmark, root cause, consequence, owned action.\n<\/details>\n\n**C7. Which part of this topic would confuse someone seeing it for the first time?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\n(1) Cause vs effect. (2) VA vs PT. (3) Severity vs priority. (4) Executive summary vs introduction. (5) The CW2 structure, since the nine areas, the testing summaries and the management action plan are different parts of the report.\n<\/details>\n\n---\n\n## PHASE 3 — ACTIVE RECALL BANK (Topic 8)\n\n### Level 1 — Basic recall\n\n**Q1.** List the five elements of a finding in the CW2 brief.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Condition supported by evidence; criteria from policy, standards or approved parameters; cause explaining the underlying reason; effect describing the business or regulatory risk; recommendation with responsible owner and realistic timeline.\n\n**Common mistake:** leaving out the owner or the timeline.\n<\/details>\n\n**Q2.** List the eight components the CW2 audit report must include.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Executive summary; background and scope; methodology; detailed findings and recommendations (by the nine areas); testing summaries; availability, capacity, performance and DR/BCP observations; management action plan; appendices.\n\n**Common mistake:** omitting the management action plan or the testing summaries.\n<\/details>\n\n**Q3.** Name the nine areas the CW2 audit must examine.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** (a) IT policy review; (b) password configuration compliance; (c) tariff application accuracy; (d) application controls for interest income recomputation; (e) product eligibility validation; (f) segregation of duties and access rights; (g) vulnerability assessment and penetration testing; (h) ICT capability and operations; (i) authentication, authorisation and accounting mechanisms.\n\n**Marking:** one mark each.\n\n**Common mistake:** replacing (i) with \"network security\".\n<\/details>\n\n**Q4.** State the CW2 submission requirements for the PDF and the ZIP.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** One PDF report (cover page with group number and members and their student and registration numbers; 15 to 20 pages; formal professional language; Turnitin plagiarism below 20%) and one ZIP titled GroupName_WorkingPapers.zip containing test sheets, recomputation worksheets, screenshots and evidence logs, both submitted via MUBSEP. Each member also submits the self and peer evaluation form.\n\n**Common mistake:** forgetting the self and peer evaluation.\n<\/details>\n\n**Q5.** Define vulnerability assessment and penetration test in one sentence each.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** A vulnerability assessment identifies and ranks weaknesses in systems, usually with scanning tools. A penetration test is an authorised simulated attack that tries to exploit weaknesses to show real impact.\n\n**Common mistake:** omitting \"authorised\".\n<\/details>\n\n### Level 2 — Understanding\n\n**Q6.** Distinguish cause from effect, with an example from an access control finding.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Cause is why the condition exists; effect is what it means for the business. In a leavers' access finding, the cause is that HR does not automatically notify IT when staff leave; the effect is the risk of unauthorised access, fraud and data theft using former staff credentials.\n\n**Marking:** two definitions (2), example (2).\n\n**Common mistake:** writing the effect as the cause (\"accounts remain active, so there is a risk\").\n<\/details>\n\n**Q7.** Explain why severity alone should not decide the order of remediation in a VAPT report.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** The importance of a weakness also depends on the asset's criticality and exposure. A high-severity flaw on an internal test machine may matter less than a high-severity flaw on an internet-facing core system, and a medium flaw on a critical system may outrank a high flaw on a low-value one. Prioritised remediation combines severity, business impact and exposure.\n\n**Common mistake:** ordering purely by the scanner's severity label.\n<\/details>\n\n**Q8.** What makes a recommendation actionable? Give four qualities and one example.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Specific; addresses the cause; owned; time-bound and realistic (also proportionate and measurable). Example: \"Set the Active Directory minimum password length to 8 characters within 30 days. Owner: Head of IT Security.\"\n\n**Common mistake:** writing \"management should consider improving\".\n<\/details>\n\n**Q9.** Describe what the executive summary of an audit report must contain and who it is for.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** It must give the overall opinion, the top findings and the high-level risk posture (and the key actions needed). It is for senior readers such as the board audit and risk committee, who may read nothing else, so it must stand alone in plain language.\n\n**Common mistake:** using it as a description of the audit procedures.\n<\/details>\n\n### Level 3 — Application\n\n**Q10.** (Calculation and writing) In testing tariff accuracy, you recomputed fees for 40,000 transactions. The approved fee is 1,500 plus excise duty of 15% of the fee. You find 800 transactions charged 1,500 only. Compute the correct charge, the exception rate and the shortfall, then write the condition and effect.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** *Correct charge:* excise duty = 15% × 1,500 = 225, so the total = 1,725. *Exception rate:* 800 ÷ 40,000 = 2.0%. *Shortfall:* 800 × 225 = 180,000. *Condition:* \"Recomputation of all 40,000 transactions showed 800 (2.0%) charged 1,500 instead of 1,725; excise duty of 225 was not applied. Shortfall: 180,000 (WP C1).\" *Effect:* under-collection of excise duty owed to the revenue authority, with risk of penalties and inconsistent customer charges.\n\n**Marking:** three computations (3), condition (1), effect (1), evidence reference (1).\n\n**Common mistake:** computing 15% of the total after adding it, or dividing the exceptions by something other than the population.\n<\/details>\n\n**Q11.** Rewrite this weak finding in the five-part format and add a rating: \"Password settings are weak and management does not care about security.\"\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer (example):**\n- *Condition:* AD allows a minimum length of 6 with no expiry; lockout after 10 attempts; MFA is not enabled for privileged accounts (WP B1).\n- *Criteria:* policy requires 8 characters, 90-day expiry, lockout after 5 attempts, MFA for privileged accounts.\n- *Cause:* defaults were never reconciled to the policy; no periodic configuration review.\n- *Effect:* increased risk of unauthorised access and fraud; weak compliance with the policy.\n- *Recommendation:* align settings within 30 days; enable MFA for privileged accounts within 60; quarterly configuration check. Owner: Head of IT Security.\n- *Rating:* High.\nThe unprofessional phrase \"management does not care\" is removed: criticise the control, not the people.\n\n**Marking:** five elements (5), rating (1), neutral tone (1).\n\n**Common mistake:** keeping blame language in a formal report.\n<\/details>\n\n**Q12.** A VA shows: (1) an unpatched server on the internet with a serious known flaw; (2) a default password on an internal printer; (3) a missing patch on an internal workstation used by one clerk; (4) weak encryption setting on the mobile banking gateway. Propose a priority order with reasons.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** (1) first: internet-facing and serious; (4) second: the mobile banking gateway handles customer transactions and weak encryption could expose data in transit; (3) third: single workstation, internal; (2) last: printer, internal and low impact (but still change the default). Give timelines such as 7, 14, 30 and 90 days.\n\n**Marking:** order (2), reasons referencing exposure and criticality (3), timelines (1).\n\n**Common mistake:** ranking only by \"who found it first\".\n<\/details>\n\n**Q13.** You must present the same finding on weak change management to (a) the board audit committee and (b) the IT operations manager. Write one or two sentences for each.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** (a) \"Changes to core banking systems are not consistently approved or tested, which creates a risk of outages and unauthorised changes. Management has committed to enforce approval in the change tool within 60 days.\" (b) \"7 of 25 sampled changes had no recorded CAB approval and 4 lacked test evidence. Enforce mandatory approval fields in the change tool, require attached test results before closure, and review emergency changes weekly. Owner: head of IT operations; 60 days.\"\n\n**Marking:** audience-appropriate tone and content for both (4).\n\n**Common mistake:** giving both audiences the technical version.\n<\/details>\n\n### Level 4 — Exam mastery\n\n**Q14.** Critically evaluate the claim: \"An audit report's value is in the number of findings it contains.\" (10 marks)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer outline:**\n1. *Position:* the claim is wrong; value lies in accuracy, significance and usefulness.\n2. *Why quantity misleads:* many trivial findings can hide the few that matter; padding reduces credibility; the notes' risk-based approach says to prioritise by exposure and likelihood.\n3. *What gives value:* accurate facts supported by evidence; clear criteria; root causes; effects tied to business risk; actionable recommendations with owners and dates; an executive summary that tells the reader what matters.\n4. *Where numbers do matter:* quantifying scope and results (for example, 12 of 480; 486,000 shortfall) makes a finding convincing; a long list of findings may be justified if the environment really is weak.\n5. *Follow-up:* value is realised only when actions are implemented and verified.\n6. *Conclusion:* a good report has the right findings, clearly written, ranked and actioned.\n\n**Marking criteria:** position (1), quantity problem (2), what gives value (3), nuance (2), conclusion (2).\n\n**Common mistake:** saying \"fewer findings is always better\".\n<\/details>\n\n**Q15.** Using the CW2 structure, outline an audit report for area (f) segregation of duties and access rights. Include the criteria you would use, the tests, the testing summary content, two findings in brief, and the management action plan entries. (14 marks)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer outline:**\n*Criteria:* the access control policy (joiner-mover-leaver timing, privileged access rules), the approved SoD conflict matrix, ISO/IEC 27001 access control good practice.\n*Tests:* (1) match HR leavers to active users (100% in Excel/IDEA); (2) sample joiners and movers: access request, approval, role fit; (3) compare the user-role matrix to the conflict matrix to find set-up and approve, or post and approve conflicts; (4) list privileged accounts and review ownership, justification and log review.\n*Testing summary:* basis of calculation (populations, sample sizes, comparison logic), reconciliation outcomes (counts matched, exceptions, rates) with reference to workpapers.\n*Findings:* (1) leavers' accounts active (12 of 480, 2.5%): cause no HR-IT link; effect fraud risk; recommendation automate within 60 days. (2) five users with conflicting rights (create supplier and approve payment): cause role design; effect fictitious supplier fraud; recommendation remove conflicting rights, add compensating review, owner head of IT/finance, 30 days.\n*Management action plan entries:* each action with owner, target date and status.\n*Executive summary mention:* these two findings in the top findings if rated High.\n\n**Marking criteria:** criteria (2), tests (4), testing summary (2), two findings with all five elements (4), action plan (2).\n\n**Common mistake:** describing procedures without explaining how the results were reconciled and referenced to workpapers.\n<\/details>\n\n\n---"}, {"id": "t9", "t": "TOPIC 9 — Compliance and Ethics in IS Audit", "s": "9 · Compliance and Ethics in IS Audit", "g": "Topics", "c": "#ca8a04", "k": "9", "md": "# TOPIC 9 — Compliance and Ethics in IS Audit\n\n**Classification:** Core (short topic, 2 teaching hours)\n**Sources:** There is **no dedicated deck or handout** for this topic in your zip. Official fragments only: GDPR, HIPAA, ISO/IEC 27001 and PCI DSS appear as examples of laws and standards in Topics 1 and 5 (\"compliance monitoring\", \"compliance audits and assessments\"); CW1 Q26 and Q46 test the Uganda Data Protection and Privacy Act, 2019 and the idea of compliance; Topic 2 introduces white, gray and black hat hackers; Topic 6 describes compliance audits. **Everything else here is Supplementary explanation.** Legal details (names of laws, regulator roles) are given from general knowledge and **must be checked against what your lecturer teaches and the current text of each law**.\n**Outline items:** (a) legal and regulatory compliance: overview of relevant laws and regulations; compliance audits and assessments. (b) Professional ethics for IS auditors: code of ethics and professional conduct for IS auditors; ethical considerations in auditing practices.\n\n## PHASE 1 — UNDERSTANDING\n\n### 9.1 The big picture\n\nTwo questions run through this topic:\n\n1. **Compliance:** is the organization following the laws, regulations, standards and contracts that apply to it? (An external yardstick.)\n2. **Ethics:** is the **auditor** behaving honestly, independently and carefully while checking? (An internal, professional yardstick.)\n\nThey are related but different. **Compliance** means obeying rules that exist. **Ethics** means doing the right thing, including where the rules are silent.\n\n**Where it connects.** Backward: the \"Compliance\" attribute in Topic 6 and the \"compliance and legal requirements\" component of the ISMS in Topic 1 and the governance principle in Topic 5 all point here. Forward: Topic 8's reporting duties (honesty, completeness) and the Practical Lab's handling of data (privacy, confidentiality) are ethics applied.\n\n### 9.2 Key terms\n\n| Term | Meaning |\n|---|---|\n| **Compliance** | Following the laws, regulations, standards and internal policies that apply (CW1 Q46: ensuring an organization follows laws like GDPR and the Uganda Data Protection Act) |\n| **Compliance audit** | Gives management a tool for internal review of compliance in their operating units; the audit programme covers one or many compliance areas (Topic 6 notes) |\n| **Compliance assessment** | An evaluation of how well the organization meets specific requirements, identifying gaps (Topic 5 notes: \"compliance audits and assessments to identify gaps or deficiencies in policy implementation and enforcement\") |\n| **Regulation** | A rule issued by a regulator with legal force (for example a financial regulator's guidelines) |\n| **Personal data** | Information that identifies a living person |\n| **Data subject** | The person the personal data is about |\n| **Consent** | The data subject's agreement to the collection or use of their personal data |\n| **Data minimisation** | Collect only the data that is necessary for the stated purpose |\n| **Code of ethics** | A profession's published standards of behaviour for its members |\n| **Independence** | Freedom from conflicts that could bias the auditor's judgement, in fact and in appearance |\n| **Objectivity** | Basing conclusions on evidence, not on pressure or preference |\n| **Confidentiality** | Not disclosing information obtained during the audit without authority |\n| **Due professional care** | Diligence, competence and caution in carrying out the work |\n\n### 9.3 Legal and regulatory compliance: an overview\n\n#### 9.3.1 What the notes name\n\n| Item | Where it appears | What it is (from the notes' usage) |\n|---|---|---|\n| **GDPR** | Topics 1 and 5 | A data protection regulation (the General Data Protection Regulation of the European Union) |\n| **HIPAA** | Topics 1, 5, and the audit slides (healthcare audit example) | A US law on health information |\n| **PCI DSS** | Topic 5, and the audit slides (e-commerce audit example) | The payment card industry data security standard |\n| **ISO/IEC 27001** | Topics 1, 3, 5 | The ISMS standard against which organizations are certified |\n| **Uganda Data Protection and Privacy Act, 2019** | CW1 Q26 and Q46 | Ugandan data protection law |\n\n**CW1 questions to know:**\n- **Q26:** the Act places a strong emphasis on a specific provision *before collecting personal data*. The expected answer in this question set is **explicit consent**.\n- **Q46:** the practice of ensuring an organization follows laws like GDPR and the Uganda Data Protection Act is **compliance** (not risk transfer, data masking or threat modelling).\n\n#### 9.3.2 Laws and regulators likely to matter in Uganda (supplementary; verify with your lecturer)\n\n> **Supplementary explanation.** For a Ugandan bank like the fictional BBCBank in CW2, the main layers of requirement are:\n>\n> | Layer | Examples (general knowledge, check current texts) | Relevance |\n> |---|---|---|\n> | **Data protection law** | The Data Protection and Privacy Act, 2019 | Rules on collecting, using, storing and sharing personal data; consent; security safeguards; rights of data subjects |\n> | **Cyber and electronic law** | The Computer Misuse Act, 2011; the Electronic Transactions Act, 2011; the Electronic Signatures Act, 2011 | Offences such as unauthorised access; legal recognition of electronic records and signatures |\n> | **Sector regulation** | Bank of Uganda requirements for financial institutions, including expectations on ICT risk, security, outsourcing and business continuity (the CW2 brief refers to \"prudential expectations for the financial sector in Uganda\") | Binding on banks; auditors test against them |\n> | **International standards** | ISO/IEC 27001, COBIT, NIST, PCI DSS (where cards are processed) | Good practice or contractual requirements |\n> | **Internal policy** | The organization's own IT and security policies | The nearest criteria for day-to-day audit tests |\n>\n> **Note:** this table is a map, not legal advice. Exam answers should name the laws your lecturer named and describe what they require, not rely on section numbers.\n\n#### 9.3.3 Data protection ideas that run through most laws (supplementary)\n\n| Principle | Plain meaning | Example in a bank |\n|---|---|---|\n| **Lawful, fair processing, with consent where required** | Only collect and use data with a lawful basis; ask the person before collecting | Account opening form has a clear consent statement |\n| **Purpose limitation** | Use data only for the stated purpose | Customer phone numbers are not sold to marketers |\n| **Data minimisation** | Collect only what is necessary | Do not ask for religion on a savings form |\n| **Accuracy** | Keep data correct and up to date | A process to correct customer records |\n| **Storage limitation** | Keep data only as long as needed | A retention schedule with deletion |\n| **Security safeguards** | Protect against loss, misuse and unauthorised access | Encryption, access controls (Topics 1 to 4, 7) |\n| **Accountability and openness** | Be able to show compliance; tell people how data is used | A privacy notice; a named data protection officer |\n| **Data subject rights** | People can ask to see or correct their data | A process for access requests |\n\nNotice how these tie to what you have already learned: the **security safeguards** principle *is* Topics 1 to 4 and 7; **data masking** (CW1 Q28) and **encryption** are techniques that help meet it.\n\n### 9.4 Compliance audits and assessments\n\n**What the notes say.**\n- Topic 6: a **compliance audit** gives management a tool for internal review of compliance in their operating units; the audit programme covers one or many compliance areas, each applicable to a unit depending on its activities, funding, regulatory rules or any other pre-defined criterion. Example in the slides: compliance audits such as GDPR and HIPAA.\n- Topic 5: \"assess compliance\", \"conduct compliance audits and assessments to identify gaps or deficiencies in policy implementation and enforcement\", and \"review evidence of compliance, such as audit reports, compliance assessments, and regulatory filings\".\n\n> **Supplementary explanation: a step-by-step compliance audit.**\n>\n> | Step | What happens | Concrete example |\n> |---|---|---|\n> | 1. **Identify requirements** | List every law, regulation, standard and contract clause that applies, in a compliance register | Data Protection Act; bank regulator guidelines; PCI DSS; the internal data policy |\n> | 2. **Map to controls** | For each requirement, name the control that is supposed to meet it | \"Consent before collection\" → consent field in account opening form |\n> | 3. **Plan tests** | Decide evidence and procedures; sample or test all | Review 50 account opening forms |\n> | 4. **Test** | Gather evidence and evaluate | Count forms with signed consent |\n> | 5. **Assess gaps** | Where requirements are not met | 8 of 50 lack consent |\n> | 6. **Report** | Findings in five-part format (Topic 8) | Condition, criteria (the Act), cause, effect, recommendation |\n> | 7. **Follow up** | Verify fixes; update register as laws change | Re-test in 90 days |\n\n**Worked example (illustrative): a data protection compliance check of account opening.**\n\n| Requirement | Test | Evidence | Result |\n|---|---|---|---|\n| Consent obtained before collecting personal data | Sample 50 account opening files; check signed consent | Files | 8 of 50 have no consent: **non-compliant** |\n| Collect only necessary data | Compare form fields with the stated purposes | Form | Asks for tribe and religion with no stated purpose: **non-compliant** |\n| Security safeguards | Check storage of scanned IDs | Server access list | Scanned IDs accessible to all branch staff: **non-compliant** |\n| Retention | Compare retention policy with records kept | Retention schedule, file sample | Records kept for 15 years with no justification: **gap** |\n| Data subject access process | Ask for the procedure and a log of requests | Procedure, log | Procedure exists and is used: **compliant** |\n\n**Finding (condition, criteria, cause, effect, recommendation) for the first line:**\n- *Condition:* 8 of 50 sampled account files (16%) contain no evidence of customer consent (WP I1).\n- *Criteria:* the data protection law requires consent before collecting personal data; the bank's data policy mirrors this.\n- *Cause:* the consent clause was removed from the revised form and not restored.\n- *Effect:* regulatory sanctions, complaints and reputational harm.\n- *Recommendation:* reinstate the consent clause within 14 days; obtain consent for the affected customers; add a form checklist at account opening. Owner: Head of Retail Operations.\n\n**Compliance is not the same as security.** A bank can comply with every written rule and still be vulnerable; it can also be secure in places and non-compliant (for example, no consent form). Auditors report on both.\n\n### 9.5 Professional ethics for IS auditors\n\n#### 9.5.1 Why ethics matters to an auditor\n\nAn audit opinion has value only if readers trust the auditor. Auditors see confidential data, have powerful access, and are paid by the organization they examine. **Ethics** keeps the auditor honest, independent and careful when it would be easier not to be.\n\n#### 9.5.2 The code of ethics and professional conduct (supplementary)\n\n> **Supplementary explanation.** Your notes mention ISACA guidelines (Topic 6) but do not reproduce its code of professional ethics. In summary, ISACA's code expects its members to:\n> 1. **Support standards and procedures** for the effective governance and management of information systems, including audit, control, security and risk management.\n> 2. **Perform duties with objectivity, due diligence and professional care**, following professional standards.\n> 3. **Serve stakeholders' interests lawfully**, maintaining high standards of conduct and character and not discrediting the profession.\n> 4. **Maintain the privacy and confidentiality of information** obtained in the course of their duties, unless disclosure is legally required; never use it for personal benefit or release it to inappropriate parties.\n> 5. **Maintain competence** and undertake only activities they can reasonably expect to complete with professional competence.\n> 6. **Disclose accurate results of all work** to appropriate parties, including all material facts known to them that, if hidden, might distort the reporting.\n> 7. **Support the professional education of stakeholders** about information systems security and control.\n>\n> (This is a paraphrase; check the exact code wording, and check which professional bodies your lecturer wants you to cite, for example internal audit and national accounting bodies as well.)\n\n**The core principles, in a form to memorise:**\n\n| Principle | What it means | Concrete example |\n|---|---|---|\n| **Integrity** | Honesty and straightforwardness | Reporting an unfavourable result even when management objects |\n| **Objectivity** | Conclusions based on evidence, free of bias | Not softening a finding because the auditee is a friend |\n| **Independence** | Free from conflicts of interest, in fact **and** appearance | Not auditing a system you designed or run |\n| **Confidentiality** | Do not disclose or misuse audit information | Encrypting working papers; not discussing findings outside the engagement |\n| **Competence** | Take on only work you are qualified to do; keep skills current | Bring in a specialist for a technical test beyond your skill |\n| **Due professional care and scepticism** | Diligence, evidence-based doubt | Do not accept an explanation without evidence |\n| **Compliance with law and authority** | Work lawfully and within the engagement authority | Test only with written authorisation |\n| **Full and accurate reporting** | Disclose all material facts | Do not omit a serious finding |\n\n#### 9.5.3 Ethical considerations in auditing practice\n\n| Issue | The ethical question | Good practice |\n|---|---|---|\n| **Authorisation and scope** | Am I allowed to do this test? | Written authorisation and rules of engagement before any VAPT; never exceed scope. Note Topic 2: **white hat** (authorised), **gray hat** (breaks in without harm, then tells; still unauthorised), **black hat** (malicious). Authority is what separates an auditor from an offender. |\n| **Privacy in testing** | Am I handling people's data properly? | Use the minimum data necessary; protect extracts with encryption and access controls; delete when no longer needed; do not look at records unrelated to the audit |\n| **Independence and conflicts** | Could my judgement be, or look, biased? | Disclose and avoid conflicts (auditing your own work, a relative's department); rotate where possible |\n| **Gifts and pressure** | Am I being influenced? | Decline gifts and favours; escalate pressure to soften a finding |\n| **Honest reporting** | Am I reporting everything material? | Include all material findings; do not let management delete findings; record management's disagreement rather than hide it |\n| **Competence** | Can I do this properly? | Do not claim expertise you lack; seek help or decline |\n| **Handling discovered fraud or illegal acts** | What if I find something criminal? | Do not investigate beyond competence or authority; escalate to the appropriate person (for example the audit committee) per policy and law |\n| **Use of tools and data** | Is my own conduct lawful? | Use licensed tools; follow the law (unauthorised access is an offence); acknowledge sources and avoid plagiarism in the report |\n| **Academic integrity** | Is the work honestly mine? | Your CW2 brief requires Turnitin below 20% and individual contribution; the outline says academic dishonesty is a serious offence |\n\n#### 9.5.4 A method for ethical dilemmas (supplementary)\n\n1. **Identify the facts** and who is affected.\n2. **Identify the principles** involved (independence, confidentiality, integrity, law).\n3. **List options** (including escalating).\n4. **Test each option:** is it lawful? honest? fair to stakeholders? defensible if made public?\n5. **Decide, document and, where required, escalate.**\n\n**Worked dilemma 1 (illustrative).** *During an access review you notice that the CFO's account was used at 3 a.m. to approve a large payment to a company owned by the CFO's brother. The CFO asks you to leave it out of the report \"for now\".*\n- Principles: integrity, objectivity, full reporting, independence.\n- Options: (a) leave it out; (b) include it quietly; (c) report to the audit committee per policy and present the factual evidence without accusing.\n- Decision: (c). Omitting a material fact breaches full and accurate reporting; accusing without proof exceeds the auditor's role. Document the request to omit and escalate.\n\n**Worked dilemma 2 (illustrative).** *While doing a penetration test within scope, you discover a weakness in a connected system that was not in scope.*\n- Principles: legality, authorisation.\n- Decision: stop; do not test it; report that the weakness may exist and ask for authority to include it. Testing outside scope would be unauthorised access.\n\n**Worked dilemma 3 (illustrative).** *You extracted customer ID numbers into Excel for testing and want to keep the file on your laptop for revision.*\n- Principles: confidentiality, privacy.\n- Decision: not allowed. Use the minimum data, protect the file, and delete or return it at the end of the engagement per the agreed terms.\n\n### 9.6 Text diagram: compliance and ethics around the audit\n\n```\n          LAW, REGULATION, STANDARDS, CONTRACTS, POLICY   (what the auditee must meet)\n                              |\n                        COMPLIANCE AUDIT\n                              |\n  AUDITOR ---> INDEPENDENCE, OBJECTIVITY, CONFIDENTIALITY, COMPETENCE, INTEGRITY <--- AUDITOR\n      |             (what the auditor must meet while auditing)                           |\n      +---> authorised scope ---> evidence ---> honest, complete report ---> follow-up ---+\n```\n\n### 9.7 Common misconceptions and exam traps\n\n| Trap | Truth |\n|---|---|\n| \"Compliance and ethics are the same thing\" | Compliance = following external rules; ethics = the auditor's professional conduct, including where rules are silent. |\n| \"If we are compliant we are secure\" | Compliance is a minimum yardstick; security needs risk-based controls. |\n| \"Compliance is transferring risk\" | CW1 Q46: compliance is following the laws (not risk transfer). |\n| \"Consent is optional in data protection\" | CW1 Q26: the Act emphasises explicit consent before collecting personal data. |\n| \"A gray hat is acceptable because no harm is done\" | Gray hat activity is still done without authority; an auditor works only with authorisation. |\n| \"Independence only means not being related to the auditee\" | It also means being free from bias in judgement, in fact and in appearance. |\n| \"I can keep audit data for later use\" | Confidentiality and privacy require minimum use, protection and secure disposal. |\n| \"If management asks, I can leave out a finding\" | The auditor must report all material facts. |\n| \"Ethics means only avoiding crime\" | It also covers competence, objectivity, due care and honesty. |\n\n### 9.8 Checklist: compliance and ethics in any scenario\n\n1. **Which requirement applies?** (law, regulation, standard, contract, internal policy)\n2. **What is the control and what is the evidence?**\n3. **Is it a compliance gap, a security gap, or both?**\n4. **For the auditor's conduct:** authorised? independent? objective? confidential? competent? complete?\n5. **If unsure, escalate and document.**\n\n### 9.9 Revision summary (Topic 9)\n\n- Compliance = following laws, regulations, standards and policies (examples in notes: GDPR, HIPAA, PCI DSS, ISO/IEC 27001, Uganda Data Protection and Privacy Act, 2019). CW1: the Act emphasises explicit consent; ensuring law-following is compliance.\n- Compliance audit: identify requirements, map to controls, test, assess gaps, report, follow up.\n- Data protection ideas: consent, purpose limitation, minimisation, accuracy, storage limitation, security safeguards, accountability, data subject rights.\n- Ethics for IS auditors: integrity, objectivity, independence, confidentiality, competence, due care, lawful conduct, full and accurate reporting.\n- Ethical practice: authorised scope, privacy in testing, conflicts, gifts and pressure, honest reporting, handling fraud, lawful tools, academic integrity.\n- Compliance is not security; ethics is not only avoiding crime.\n\n---\n\n## PHASE 2 — COMPREHENSION CHECKS (Topic 9)\n\n**C1. Explain, in your own words, the difference between compliance and ethics.**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nCompliance is whether the organization follows the rules that apply to it (laws, regulations, standards, policies). Ethics is whether people, here the auditor, act honestly, independently and carefully, including in situations the rules do not cover. A bank can be compliant while its auditor is biased, and an auditor can be ethical while the bank is non-compliant.\n\n**Check:** external rules vs professional conduct.\n<\/details>\n\n**C2. Why does the data protection principle of consent exist? What would happen if a bank collected customers' personal data without it?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nIt gives people control over their own data. Without consent the bank could collect and use information the customer never agreed to, breaching privacy and the law. Consequences: regulatory penalties, complaints, loss of customer trust and possible compensation claims. (CW1 Q26 expects explicit consent before collecting personal data.)\n\n**Check:** control for the data subject; legal and reputational risk.\n<\/details>\n\n**C3. Why must an auditor have written authorisation before a penetration test, even when the aim is to help?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nBecause accessing systems without authority is unlawful and can disrupt services, regardless of intent. Authorisation defines scope, timing and methods and protects both the auditor and the organization. It is what separates an ethical (white hat) test from unauthorised access, which is why the notes distinguish white hat from gray hat and black hat.\n\n**Check:** authority, scope and legality.\n<\/details>\n\n**C4. What would happen to the credibility of an audit if the auditor were not independent?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nReaders could not be sure that the findings and opinion were unbiased. If the auditor audited their own system or depended on the auditee's favour, they might understate problems. Even the appearance of bias damages trust, so the report would carry less weight with the board, regulators and external parties.\n\n**Check:** trust depends on freedom from bias in fact and appearance.\n<\/details>\n\n**C5. How does a compliance audit relate to the five-part finding format of Topic 8?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\nIn a compliance audit, the **criteria** are the law, regulation, standard or policy requirement. The tests produce the **condition** (what was found). The cause, effect and recommendation then complete the finding. The legal requirement therefore becomes the benchmark in the report.\n\n**Check:** requirement = criteria.\n<\/details>\n\n**C6. Give an original example of an ethical conflict for an IS auditor and how to resolve it.**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\n*Example:* an auditor is offered a paid consulting contract by the manager whose department is currently being audited. Accepting would create a conflict of interest that threatens independence. Resolution: decline or disclose and withdraw from that audit, tell the audit leadership, and document the decision.\n\n**Check:** identify the conflict, protect independence, disclose, document.\n<\/details>\n\n**C7. Which part of this topic would confuse someone seeing it for the first time?**\n\n<details>\n<summary>Reveal model answer<\/summary>\n\n(1) Compliance vs ethics. (2) Compliance vs security. (3) Gray hat hackers: no harm intended but still no authority. (4) The list of laws, since your notes name few: learn the five named in the notes, and what your lecturer says about the Ugandan laws.\n<\/details>\n\n---\n\n## PHASE 3 — ACTIVE RECALL BANK (Topic 9)\n\n### Level 1 — Basic recall\n\n**Q1.** Name four laws, regulations or standards mentioned in your notes and CW1 as compliance examples.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** GDPR; HIPAA; PCI DSS; ISO/IEC 27001; the Uganda Data Protection and Privacy Act, 2019.\n\n**Common mistake:** naming NIST or COBIT, which are frameworks rather than laws, although they can serve as criteria.\n<\/details>\n\n**Q2.** Which provision does the Uganda Data Protection and Privacy Act, 2019 emphasise before personal data is collected (CW1 Q26)?\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Explicit consent (of the data subject).\n\n**Common mistake:** choosing \"data masking\" or \"multi-factor authentication\"; those are technical controls, not provisions on collection.\n<\/details>\n\n**Q3.** Define compliance (CW1 Q46 style).\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Compliance is ensuring that an organization follows applicable laws, regulations, standards and its own policies, such as GDPR and the Uganda Data Protection Act.\n\n**Common mistake:** confusing it with risk transfer.\n<\/details>\n\n**Q4.** List five principles an IS auditor's ethics should include.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Any five of: integrity; objectivity; independence; confidentiality; competence; due professional care; lawful conduct; full and accurate reporting.\n\n**Common mistake:** listing technical skills instead of ethical principles.\n<\/details>\n\n### Level 2 — Understanding\n\n**Q5.** Distinguish a compliance audit from a security audit.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** A compliance audit compares practice with specific requirements (laws, regulations, standards, policies) and reports gaps. A security audit (Topic 6) provides vulnerability assessments of networks and systems, reports weaknesses and recommends remedies. One checks conformity with rules; the other checks resistance to threats. A system can pass one and fail the other.\n\n**Marking:** two definitions (2), contrast (2).\n\n**Common mistake:** treating them as the same.\n<\/details>\n\n**Q6.** Explain what independence means for an IS auditor and why it matters.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Independence means being free from conflicts of interest and undue influence that could bias judgement, both in fact and in appearance (for example, not auditing a system you designed or operate). It matters because the value of the audit opinion depends on readers trusting that it is unbiased.\n\n**Common mistake:** limiting it to \"not being related to the auditee\".\n<\/details>\n\n**Q7.** Explain how data protection principles overlap with the security controls you studied in Topics 1 to 4.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** The \"security safeguards\" principle requires protecting personal data against loss, misuse and unauthorised access, which is delivered by confidentiality controls, encryption, access control (DAC/MAC/RBAC), network security, physical security and incident response. Data masking supports confidentiality in non-production environments. Compliance therefore depends in part on the security controls working.\n\n**Common mistake:** treating compliance as paperwork unrelated to security controls.\n<\/details>\n\n### Level 3 — Application\n\n**Q8.** An auditor reviews 60 loan files and finds 9 without a signed customer consent for credit bureau checks, and the form also collects marital status for no stated reason. Identify the compliance issues and write the finding for the consent gap (five parts).\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** *Issues:* (1) missing consent before collecting or using personal data; (2) collection of data not needed for a stated purpose (minimisation). *Finding:* *Condition:* 9 of 60 sampled loan files (15%) have no signed consent for credit bureau checks (WP I2). *Criteria:* the data protection law and the bank's data policy require consent before collecting and using personal data. *Cause:* consent is a paper form that is not checked before loan processing. *Effect:* regulatory sanctions, complaints and reputational harm. *Recommendation:* make consent a mandatory step in the system before approval; obtain consent from the affected customers; owner head of credit; 30 days.\n\n**Marking:** two issues (2), five-part finding (5).\n\n**Common mistake:** writing the effect as a cause.\n<\/details>\n\n**Q9.** During a penetration test within scope, you find an exposed admin page on a server that is not in the scope. A colleague says \"just have a quick look\". What should you do and why?\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** Do not test it. Stop at the scope boundary, record what was observed, inform the engagement lead and the client, and ask for written authority to include the server. Testing without authority could be unauthorised access under the law and breach the code of ethics (compliance with law, authorised scope).\n\n**Marking:** decision (1), reasons (2), steps (2).\n\n**Common mistake:** arguing that good intentions justify it.\n<\/details>\n\n**Q10.** Management asks the auditor to remove a medium-rated finding \"to avoid upsetting the board\". Describe the ethical considerations and the proper response.\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer:** The auditor must report all material facts accurately; omitting a finding would breach integrity and objectivity and could mislead the board. Proper response: re-check the evidence and rating; discuss with management; if they disagree, record their response in the report rather than removing the finding; escalate to the audit committee if pressure continues; document the request.\n\n**Marking:** principles (2), actions (3).\n\n**Common mistake:** agreeing to remove it in exchange for a promise to fix it.\n<\/details>\n\n### Level 4 — Exam mastery\n\n**Q11.** \"A bank that complies with every applicable law is secure.\" Discuss. (10 marks)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer outline:**\n1. *Position:* false; compliance is necessary but not sufficient.\n2. *What compliance gives:* a minimum, externally set baseline; evidence of accountability; avoidance of penalties.\n3. *Why it is not security:* laws set general requirements and change slowly; they cannot cover every threat or technology; controls may exist on paper but not operate (design vs operating effectiveness); a bank can meet a requirement narrowly while remaining exposed (for example, a consent form exists but data is poorly protected).\n4. *Why security is not compliance either:* a technically strong organization might still lack consent forms or retention rules.\n5. *Link to the course:* compliance audits (Topic 6), risk-based controls (Topic 7), ISMS (Topic 1) and governance (Topic 5): compliance is one component of a broader approach.\n6. *Conclusion:* aim for compliance as a floor and risk-based security as the goal; audit both.\n\n**Marking criteria:** position (1), compliance role (2), limits (3), converse point (1), course link (2), conclusion (1).\n\n**Common mistake:** treating compliance as worthless.\n<\/details>\n\n**Q12.** You are auditing BBCBank's customer onboarding. (a) Describe the compliance audit you would run for data protection, with five requirements, tests and evidence. (b) Identify three ethical issues for you as auditor in handling the data and say how you would manage each. (c) Say how you would report one finding. (14 marks)\n\n<details>\n<summary>Reveal answer<\/summary>\n\n**Model answer outline:**\n(a) *Requirements, tests, evidence:* consent before collection (sample files, signed consent); minimisation (compare form fields with purposes); security safeguards (access list to scanned IDs and data stores); retention (retention schedule vs record age); data subject access process (procedure and request log); possibly breach response and third-party processors (contracts). Evidence: files, forms, access lists, schedules, logs.\n(b) *Ethical issues:* (1) privacy: use the minimum data, mask or avoid copying personal details, store extracts encrypted, delete at the end; (2) authority and confidentiality: access only under the authority of the engagement, do not discuss customer information outside the team; (3) independence and objectivity: report gaps honestly even if the head of retail is a friend, disclose any conflict.\n(c) *Finding:* five parts, for example the consent gap: condition (8 of 50 files, 16%), criteria (the law and bank policy), cause (form change), effect (sanctions, trust), recommendation (restore clause, obtain consent, owner, 14 days).\n\n**Marking criteria:** (a) 6, (b) 5, (c) 3.\n\n**Common mistake:** describing only technical tests and ignoring the auditor's own handling of data.\n<\/details>\n\n\n---"}, {"id": "lab", "t": "PRACTICAL LAB — Testing Controls with Excel and IDEA", "s": "Practical Lab (Excel and IDEA)", "g": "Practice", "c": "#0d9488", "k": "Lab", "md": "# PRACTICAL LAB — Testing Controls with Excel and IDEA\n\n**Classification:** Applied/Practical, Likely exam focus (the practical test, and the testing summaries in CW2)\n**Sources:** The outline lists a **practical test** (Assignment 3) and \"auditing tools\" (Topic 6e), but **your zip contains no practical notes**. The CW2 brief tells you *what* to test (areas b to f in particular) and what the testing summaries must show. **Everything in this lab is Supplementary explanation**: standard audit data analysis built from the concepts in Topics 6 and 7. You said the practical will probably use **both IDEA and Excel, leaning toward Excel**, so this lab teaches every test in Excel first, with the IDEA equivalent alongside.\n**Caution on tools:** formulas below work in current desktop Excel (Excel 2021 or Microsoft 365 for `XLOOKUP`; I give a `VLOOKUP` alternative). IDEA menu names change between versions, so I describe what each IDEA function **does** and leave exact click-paths to your lecturer's guide.\n\n## PHASE 1 — UNDERSTANDING\n\n### P.1 The big picture\n\nTopic 6 introduced auditing **with the computer**: loading the entity's data into a tool and testing **all** of it instead of a sample. Topic 7 gave you the controls to test (completeness, accuracy, validity, segregation of duties, access). The Practical Lab joins them: **take a control, turn it into a test on data, run it, investigate the exceptions, and write the result as a finding** (Topic 8).\n\n```\n CONTROL (Topic 7)  ->  TEST ON DATA  ->  EXCEPTIONS  ->  INVESTIGATE  ->  WORKING PAPER  ->  FINDING (Topic 8)\n e.g. \"leavers'          match HR list     list of active     real problem     record every      condition, criteria,\n accounts are            to user list      leavers            or data issue?   step              cause, effect, rec.\n disabled in 1 day\"\n```\n\n### P.2 The seven-step method for every practical task\n\nFollow this order every time. It is also how marks are earned.\n\n| # | Step | What to do | Why |\n|---|---|---|---|\n| 1 | **Define the objective, control and criteria** | State what you are testing and the benchmark (policy, tariff guide, rule) | Without criteria there is no \"exception\" |\n| 2 | **Obtain the data and note its source** | Record file name, source system, date extracted, who provided it | Evidence must be traceable |\n| 3 | **Validate the data (completeness and accuracy)** | Record count, control totals, blanks, data types, date ranges; compare to the source system totals | If the data is incomplete, every result is unreliable |\n| 4 | **Prepare the data** | Keep the **raw data untouched** on one sheet; work on a copy; clean text and dates | Protects evidence |\n| 5 | **Run the test** | Formulas, filters or the IDEA function | The core of the work |\n| 6 | **Investigate exceptions** | Is each exception a real control failure, a timing difference, or a data error? Find the cause | Not every flag is a finding |\n| 7 | **Document and conclude** | Working paper: objective, procedure, population, result, exceptions, conclusion, reference | The report and the oral defence depend on it |\n\n### P.3 Step 3 in practice: validating the data\n\n**Why it comes first.** Suppose the HR leavers file is meant to have 480 rows but your copy has 450 because of a failed export. Your leavers test would look cleaner than reality. Validation catches that.\n\n| Check | Excel | What it tells you |\n|---|---|---|\n| **Record count** | `=COUNTA(A2:A5000)` (counts non-blank cells in the ID column) | Does the number of rows match the source system's record count? |\n| **Control total** | `=SUM(D2:D5000)` | Does the sum of amounts match the source report or general ledger? |\n| **Blanks** | `=COUNTBLANK(D2:D5000)` | Missing values in a key field |\n| **Duplicate IDs** | `=SUMPRODUCT((COUNTIF(A2:A5000,A2:A5000)>1)*1)` | How many rows share an ID |\n| **Data types** | Click a cell; check whether dates are real dates (right-aligned) or text (left-aligned) | Dates stored as text break calculations |\n| **Date range** | `=MIN(E2:E5000)` and `=MAX(E2:E5000)` | Are all dates inside the period under review? |\n| **Extra spaces** | `=TRIM(A2)` and compare with `=A2` | Hidden spaces make matches fail |\n\n**Worked example (illustrative).** The source system says the payments file for September contains **1,250 payments totalling UGX 842,300,000**. Your file shows `COUNTA = 1,250` and `SUM = 842,300,000`. Both agree, so the data is **complete** for your purposes. If the count had been 1,198, you would stop, ask for a new extract and record the difference as a limitation.\n\n### P.4 The Excel toolkit: which tool for which test\n\nRead this table, then work through the labs. Every formula is explained line by line in the labs.\n\n| Test | Excel tool | IDEA equivalent (what it does) |\n|---|---|---|\n| Import and validate | Data > From Text/CSV; `COUNTA`, `SUM` | Import Assistant; field statistics to compare record counts and totals |\n| Find duplicates | `COUNTIF`, `COUNTIFS` | Duplicate Key Detection |\n| Find gaps in a sequence | Sort ascending, then `=A3-A2-1` | Gaps Detection |\n| Match two lists | `XLOOKUP`, `VLOOKUP`, `INDEX/MATCH`, `COUNTIF` | Join Databases (matches, non-matches) |\n| Recompute values | A formula column; difference column | Add a computed field with an equation |\n| Summarise | PivotTable, `SUMIFS`, `COUNTIFS` | Summarization |\n| Group into bands | `COUNTIFS` bands, histogram | Stratification, Aging |\n| Select exceptions | Filter, Advanced Filter | Extract with criteria |\n| Sample | `RAND`, `RANDBETWEEN`, `MOD` | Sampling (random, systematic, monetary unit, attribute) |\n| Test digit patterns | (not simple) | Benford's Law analysis |\n| Record the audit trail | Working paper tab | Step history recorded automatically |\n\n**Excel or IDEA?**\n\n| | **Excel** | **IDEA** |\n|---|---|---|\n| Strengths | Familiar; flexible; easy to show formulas and explain; good for files up to about one million rows | Handles very large files; works on a copy so the source stays unchanged; records every step automatically; built-in audit tests |\n| Limits | A worksheet has a row limit (1,048,576 rows); easy to overwrite data by accident; the auditor must document steps manually | Needs the software; less flexible for custom logic; requires learning menus |\n| When to choose | Small to medium data; logic you must explain line by line | Large data; need an automatic audit trail; standard audit tests |\n\n### P.5 Lab 1: Leavers still active (CW2 area f)\n\n**Objective.** Test the control \"accounts of staff who leave are disabled within one working day.\"\n**Criteria.** Access control policy: disable within 1 working day of exit.\n**Assertion.** Validity and confidentiality of access (only authorised people have access).\n**Data.** Two lists:\n\n*HR_Leavers sheet*\n\n| EmpID | Name | ExitDate |\n|---|---|---|\n| E101 | Agnes N. | 2026-06-30 |\n| E102 | Peter K. | 2026-07-15 |\n| E103 | Susan A. | 2026-07-31 |\n| E104 | Brian M. | 2026-08-10 |\n\n*Users sheet (system export)*\n\n| UserID | EmpID | Status | LastLogin |\n|---|---|---|---|\n| u201 | E101 | Active | 2026-07-12 |\n| u202 | E102 | Disabled | 2026-07-14 |\n| u203 | E103 | Disabled | 2026-07-31 |\n| u205 | E105 | Active | 2026-09-01 |\n\n(E104 has no user record. E105 is not a leaver.)\n\n**Steps, line by line.**\n\n1. **Validate.** Count rows in each sheet and agree to the source counts.\n2. **Look up each leaver's status.** In `HR_Leavers!D2`:\n `=XLOOKUP(A2, Users!B:B, Users!C:C, \"No account\")`\n - `A2` is the leaver's EmpID.\n - `Users!B:B` is where to look (EmpID column in Users).\n - `Users!C:C` is what to return (the Status).\n - `\"No account\"` is shown if no match is found.\n *If your Excel lacks XLOOKUP:* `=IFERROR(VLOOKUP(A2, Users!B:D, 2, FALSE), \"No account\")`. (`2` means the second column of `B:D`, which is Status; `FALSE` forces an exact match.)\n3. **Look up the last login.** In `E2`: `=XLOOKUP(A2, Users!B:B, Users!D:D, \"\")`\n4. **Flag active leavers.** In `F2`:\n `=IF(D2=\"Active\", \"EXCEPTION: active after exit\", \"OK\")`\n5. **Flag logins after exit.** In `G2`:\n `=IF(AND(D2=\"Active\", E2>C2), \"EXCEPTION: login after exit\", \"\")`\n - `AND(...)` requires both: the account is active and the last login date is later than the exit date.\n6. **Count and rate.** `=COUNTIF(F2:F5,\"EXCEPTION*\")` counts exceptions; divide by `=COUNTA(A2:A5)` for the rate. (`*` is a wildcard.)\n\n**Expected result.**\n\n| EmpID | Status | LastLogin | Exit | Result |\n|---|---|---|---|---|\n| E101 | Active | 2026-07-12 | 2026-06-30 | **Active after exit; login 12 days after exit** |\n| E102 | Disabled | 2026-07-14 | 2026-07-15 | OK |\n| E103 | Disabled | 2026-07-31 | 2026-07-31 | OK |\n| E104 | No account | | 2026-08-10 | OK (no account to disable; confirm none existed) |\n\nExceptions: 1 of 4 (25%) in this tiny sample; in a real file of 480 you would report counts and rates like \"12 of 480 (2.5%)\".\n\n**Investigate.** For E101: was there a documented reason (handover)? Was it a shared account? Who used it? For E104: confirm the person never had an account, or that it was deleted (not just missing from this export).\n\n**Finding.** See the finding in Topic 8 (8.3, finding 3).\n\n**IDEA equivalent.** *Join Databases* between the leavers file and the users file on EmpID, keeping matches only; then *extract* those with Status = Active.\n\n### P.6 Lab 2: Duplicate payments, gaps and unusual transactions (completeness and fraud risk)\n\n**Objective.** Test completeness and look for duplicate payments, missing document numbers and unusual patterns.\n**Criteria.** Duplicate payments should be rejected (completeness control); payment cheque numbers should be sequential; payments above the approval limit need a second approver.\n**Data (Payments sheet, sample):**\n\n| Row | Cheque | Supplier | Invoice | Amount | Date |\n|---|---|---|---|---|---|\n| 2 | 5001 | S01 | INV-203 | 450,000 | Mon |\n| 3 | 5002 | S02 | INV-118 | 1,200,000 | Mon |\n| 4 | 5004 | S01 | INV-203 | 450,000 | Tue |\n| 5 | 5005 | S03 | INV-331 | 4,800,000 | Sat |\n| 6 | 5009 | S04 | INV-402 | 300,000 | Wed |\n\n*(Column letters used in the formulas: A = Row, B = Cheque, C = Supplier, D = Invoice, E = Amount, F = Date. In your own file, put real dates in column F.)*\n\n**Test A: duplicates.** Same supplier, same invoice, same amount.\nIn `G2`: `=COUNTIFS($C$2:$C$6, C2, $D$2:$D$6, D2, $E$2:$E$6, E2)`\n- `COUNTIFS` counts rows where **all** the conditions are true.\n- `$C$2:$C$6` is the supplier column, locked with `$` so it does not move when you copy the formula down.\n- It counts how many rows share this row's supplier, invoice **and** amount.\nResult: rows 2 and 4 both give **2**, so they are **duplicate payment suspects** (INV-203 paid twice). Flag with `=IF(G2>1,\"DUPLICATE?\",\"\")`.\n\n> **Do not use \"Remove Duplicates\" on your original data.** It deletes rows, destroying evidence. Flag, do not delete.\n\n**Test B: gaps in the cheque sequence.** Sort the data by cheque number, ascending. In `H3`: `=B3-B2-1`\n- `B3-B2` is the difference between consecutive cheque numbers; subtracting 1 gives how many numbers are **missing** between them.\nResults: row 3: 5002 − 5001 − 1 = 0; row 4: 5004 − 5002 − 1 = **1** (5003 missing); row 5: 5005 − 5004 − 1 = 0; row 6: 5009 − 5005 − 1 = **3** (5006 to 5008 missing).\nShow the gap in words: `=IF(H4>0,\"GAP: \"&B3+1&\" to \"&B4-1,\"\")` gives \"GAP: 5003 to 5003\".\n**Total missing cheques:** 4. Investigate: voided, cancelled, or unrecorded payments?\n\n**Test C: near the approval limit.** Suppose payments above 5,000,000 need a second approver. In `I2`:\n`=IF(AND(E2>=0.9*5000000, E2<5000000), \"NEAR LIMIT\", \"\")`\n- It flags amounts from 90% of the limit up to just below it (4,500,000 to 4,999,999). This detects possible splitting to avoid approval.\nResult: 4,800,000 on row 5 is flagged.\n\n**Test D: weekend payments.** In `J2`: `=IF(WEEKDAY(F2,2)>5, \"WEEKEND\", \"\")`\n- `WEEKDAY(date, 2)` numbers Monday as 1 up to Sunday as 7, so `>5` means Saturday or Sunday. (Use real dates in column F.)\nResult: row 5 (Saturday) is also flagged: the same payment is near the limit **and** on a weekend. Two flags on one item raises priority.\n\n**Test E: round amounts.** `=IF(MOD(E2,100000)=0,\"ROUND\",\"\")` flags amounts that are exact multiples of 100,000. (`MOD` gives the remainder after division.)\n\n**IDEA equivalents.** *Duplicate Key Detection* (keys: supplier, invoice, amount); *Gaps Detection* (key: cheque number); *extract* with criteria for near-limit amounts.\n\n**Interpreting exceptions.** A duplicate may be a legitimate part-payment with the same amount; a gap may be a voided cheque. The test finds **candidates**; the auditor decides after checking documents.\n\n### P.7 Lab 3: Independent recomputation of interest (CW2 area d)\n\n**Objective.** Test whether interest credited to savings accounts was computed correctly (accuracy).\n**Criteria.** Product definition and approved rate table: interest = balance × annual rate × days in period ÷ 365.\n**Data (illustrative):**\n\n| Account | Balance | Approved rate | Days | Interest posted |\n|---|---|---|---|---|\n| A | 5,000,000 | 10% | 30 | 41,096 |\n| B | 2,000,000 | 12% | 31 | 19,726 |\n| C | 8,000,000 | 9% | 30 | 59,178 |\n| D | 1,500,000 | 15% | 30 | 17,260 |\n\n**Steps, line by line.**\n\n1. **Recompute.** In `F2`: `=ROUND(B2*C2*D2/365, 0)`\n - `B2*C2` is balance × rate (the annual interest).\n - `*D2/365` scales it to the number of days.\n - `ROUND(...,0)` rounds to the nearest whole shilling to match how the system posts.\n2. **Compute the difference.** In `G2`: `=E2-F2` (posted minus recomputed).\n3. **Flag differences beyond a tolerance for rounding.** In `H2`: `=IF(ABS(G2)>1, \"EXCEPTION\", \"OK\")` (`ABS` ignores the sign).\n\n**Results.**\n\n| Account | Recomputed | Posted | Difference | Result |\n|---|---|---|---|---|\n| A | 41,096 | 41,096 | 0 | OK |\n| B | 20,384 | 19,726 | **−658** | EXCEPTION |\n| C | 59,178 | 59,178 | 0 | OK |\n| D | 18,493 | 17,260 | **−1,233** | EXCEPTION |\n| **Total** | **139,151** | **137,260** | **−1,891** | |\n\n**Reconcile the totals.** `=SUM(F2:F5)` gives 139,151 (recomputed); `=SUM(E2:E5)` gives 137,260 (posted); the difference −1,891 equals the sum of the individual differences (−658 + −1,233), so the reconciliation closes. Also agree the posted total to the **general ledger** control account.\n\n**Investigate each exception, line by line.**\n\n- **Account B (−658).** One day's interest on this account is 2,000,000 × 12% ÷ 365 = **657.53 ≈ 658**. The difference is exactly one day. The system used **30** days for a 31-day month. *Cause:* the day-count parameter is fixed at 30 for the batch. *Effect:* customers under-credited; the pattern would repeat for every account in 31-day months.\n- **Account D (−1,233).** Recompute at 14%: 1,500,000 × 14% × 30 ÷ 365 = 17,260. The posted amount matches **14%**, but the approved product rate is **15%**. *Cause:* the rate table was not updated after a rate change (a master data or change management weakness). *Effect:* under-credited interest; possible customer complaints and regulatory exposure.\n\n**How this appears in the report.** In the **testing summary**: the basis of calculation (formula and parameters), population and results, reconciliation outcome. In the **findings**: two five-part findings (day-count error; rate table error), with the shortfall quantified. In the **working paper**: the sheet with formulas visible.\n\n**Note on direction.** Here the bank *under-credited* savers. In a loan product the same errors would mean the bank *under-charged* or *over-charged* borrowers. Always state the direction and who is affected.\n\n**IDEA equivalent.** Add a computed field with the same equation, then *extract* records where the absolute difference exceeds the tolerance.\n\n\n### P.8 Lab 4: Tariff accuracy and excise duty (CW2 area c)\n\n**Objective.** Test whether the correct fee and excise duty were charged on transactions (accuracy), and whether overrides were controlled.\n**Criteria.** Approved tariff guide (illustrative): fee by amount band; excise duty = 15% of the fee.\n\n*Tariff sheet (sorted ascending by the lower bound)*\n\n| LowerBound | Fee |\n|---|---|\n| 0 | 500 |\n| 50,001 | 1,000 |\n| 200,001 | 2,000 |\n\n*Transactions sheet*\n\n| TxnID | Amount | Charged |\n|---|---|---|\n| T1 | 30,000 | 575 |\n| T2 | 120,000 | 1,000 |\n| T3 | 250,000 | 2,500 |\n| T4 | 60,000 | 1,150 |\n| T5 | 40,000 | 500 |\n\n**Steps, line by line** (columns: A TxnID, B Amount, C Charged, D Fee, E Excise, F Expected, G Difference, H Result).\n\n1. **Find the fee from the band.** `D2`: `=VLOOKUP(B2, Tariff!$A$2:$B$4, 2, TRUE)`\n - The last argument `TRUE` means **approximate match**: Excel finds the **largest lower bound that is not greater than the amount**. For 120,000 it picks the row starting at 50,001, so the fee is 1,000.\n - **The tariff table must be sorted ascending** for approximate match to work.\n2. **Compute excise duty.** `E2`: `=ROUND(D2*0.15, 0)`\n3. **Expected total.** `F2`: `=D2+E2`\n4. **Difference.** `G2`: `=C2-F2` (charged minus expected: negative = under-charged)\n5. **Result.** `H2`: `=IF(G2<0,\"UNDER-CHARGED\",IF(G2>0,\"OVER-CHARGED\",\"OK\"))`\n\n**Results.**\n\n| TxnID | Amount | Fee | Excise | Expected | Charged | Difference | Result |\n|---|---|---|---|---|---|---|---|\n| T1 | 30,000 | 500 | 75 | 575 | 575 | 0 | OK |\n| T2 | 120,000 | 1,000 | 150 | 1,150 | 1,000 | **−150** | UNDER-CHARGED |\n| T3 | 250,000 | 2,000 | 300 | 2,300 | 2,500 | **+200** | OVER-CHARGED |\n| T4 | 60,000 | 1,000 | 150 | 1,150 | 1,150 | 0 | OK |\n| T5 | 40,000 | 500 | 75 | 575 | 500 | **−75** | UNDER-CHARGED |\n\n**Summarise gross, not only net.**\n- Under-charged total: `=SUMIF(G2:G6,\"<0\")` = **−225**.\n- Over-charged total: `=SUMIF(G2:G6,\">0\")` = **+200**.\n- Net: −25.\nThe net of −25 would look harmless, but it **hides offsetting errors**: the bank under-collected 225 (and the excise duty owed to the revenue authority) and over-charged a customer 200. Always report under and over separately.\n\n**Investigate.**\n- *T2 and T5:* the charge equals the fee alone (150 = 15% of 1,000; 75 = 15% of 500). **Excise duty was not applied** for these transactions. Look for what they have in common (channel? product code?).\n- *T3:* charged 2,500 where the approved total is 2,300. 2,500 is not a tariff value, so check for a **manual override** or a different tariff version.\n- **Override controls.** Filter on the override flag. For each override, check there is an **approver**, a **reason**, and that the approver is **not the same person** who made the override (segregation of duties).\n\n**IDEA equivalent.** Add a computed field using the tariff logic (or *Join* to the tariff table), compute the difference, *extract* non-zero differences, then *summarise* by product code or channel.\n\n### P.9 Lab 5: Product eligibility validation (CW2 area e)\n\n**Objective.** Test whether accounts were opened only for customers who meet the product rules (validity and accuracy).\n**Criteria (illustrative):** *Junior Savings:* customer must be **un
