<script src="assets/meta.js"></script><script src="assets/index.js"></script><script>window.PAGE={"id": "rr", "t": "RAPID RECALL SHEETS", "s": "Rapid recall sheets", "g": "Reference", "c": "#0284c7", "k": "RR", "f": "rapid-recall.html", "w": 2005, "md": "# RAPID RECALL SHEETS\n\n**How to use:** read a sheet once, **close the guide**, write everything you remember, then compare. Anything you missed goes in your error log. These sheets summarise; the explanations are in Phase 1.\n\n---\n\n## Sheet 1 — Topic 1: Introduction to Information Security\n\n- **InfoSec:** protect information from unauthorized access, use, disclosure, disruption, modification, destruction.\n- **CIA:** Confidentiality (encryption, access control, secure channels, authentication) | Integrity (checksums, hashes, digital signatures, version control, audit trails) | Availability (redundancy, backups, DR plans, firewalls, DDoS protection).\n- **Also:** authentication (passwords, biometrics, smart cards, MFA); authorization (RBAC, ACLs); non-repudiation (digital signatures, cryptographic protocols, secure logging).\n- **15 components:** CIA, authentication, authorization, non-repudiation, risk management, incident response, policies and procedures, compliance, physical, network, application, data security, user education.\n- **14 areas of controlling the IT environment:** governance and policies; access control; network; endpoint; data protection; backup and recovery; monitoring and logging; patching; physical; user training; incident response; compliance and auditing; cloud; change management.\n- **ISMS:** people, processes, IT systems through a **risk management process**. 13 components (policy, risk assessment, risk treatment, objectives and controls, roles, asset management, access control, compliance, incident management, business continuity, training, monitoring and review, continuous improvement).\n- **9 steps:** initiate; scope and policy; risk assessment; risk treatment plan; implement controls; documentation; training; monitor and review; maintain and improve.\n- **Standards:** ISO/IEC 27001 (ISMS), ISO/IEC 27002 (controls code), NIST SP 800-53 (control catalogue).\n- **Traps:** hash is not encryption; ransomware = availability; ISMS is not a product; 3-2-1 backup = availability.\n\n## Sheet 2 — Topic 2: Threats, Risks and Cyber Crimes\n\n- **Chain:** vulnerability (weakness) → exploit (code) → threat (potential harm) → attack → impact. **Risk = likelihood × impact.**\n- **16 threats:** malware, phishing, DoS/DDoS, XSS, MitM, SQLi, insiders, APTs, password attacks, zero-day, social engineering, ransomware, supply chain, IoT, cloud, physical.\n- **Malware phrases:** virus (needs host file) | worm (spreads alone) | trojan (looks useful) | logic bomb (condition) | ransomware (locks files for payment).\n- **Supplementary viruses:** boot sector; file infector; macro; polymorphic (changes code); resident; multipartite.\n- **SQLi:** quote plus comment turns the password check into a comment; types in-band, blind, out-of-band; fix with parameterised queries, validation, WAF.\n- **XSS:** stored (saved, hits every visitor), reflected (crafted link), DOM-based.\n- **MitM:** stop with HTTPS or VPN. **DDoS:** botnet, availability.\n- **Passwords:** brute force (all combinations), dictionary (word list), credential stuffing (reused leaked), keylogging.\n- **APT** = long, targeted, undetected. **Zero-day** = no patch yet.\n- **Insiders:** malicious, accidental, negligent (compromised insider supplementary).\n- **Social engineering:** pretexting, baiting, tailgating, quid pro quo, honeytrap, scareware, watering hole.\n- **Phishing family:** phishing; spear (target); whaling (executives); vishing (voice); smishing (SMS); BEC; pharming.\n- **9 attackers:** recreational, script kiddies, cyber criminals, hacktivists, state-sponsored, insiders, organized crime, hackers (white/gray/black), nation-state actors.\n- **Warfare vs terrorism:** nation-state weaken/destroy vs political fear or violence. Critical infrastructure protection: 5 steps.\n- **SIM swap:** attacker takes the number, so gets OTPs.\n\n## Sheet 3 — Topic 3: Policy and Standards\n\n- **Policy:** guidelines dictating behaviour. Cheapest control, hardest to implement. Rules: never conflict with law; stand up in court; supported and administered.\n- **6 guidelines:** developed, distributed, read, understood, agreed to, uniformly enforced.\n- **Types:** EISP (purpose; IT security elements; need; responsibilities; references) | ISSP (purpose; authorized use; prohibited use; systems management; violations; review; liability) | SysSP (managerial guidance + technical spec: ACLs and configuration rules).\n- **Development steps:** investigation, analysis, design, implement, maintenance, distribution. PDCA = continuous improvement (supplementary).\n- **SecSDLC:** investigation/planning, analysis (risk management), design (logical, physical), implementation, maintenance.\n- **ISO:** BS 7799 → ISO 17799 → ISO/IEC 27002 (controls guidance); ISO/IEC 27001 (ISMS, certification).\n- **NIST:** free, widely reviewed. **CSF:** Identify, Protect, Detect, Respond, Recover; tiers Partial, Risk Informed, Repeatable, Adaptive; profile and gap analysis; 7-step approach.\n- **Traps:** AUP is an ISSP; tiers measure maturity; CSF is voluntary.\n\n## Sheet 4 — Topic 4: Domains of IT Security\n\n- **Access control:** I&A, authorization, accountability. Factors: know, have, are, where. Permissions R, W, X. ACL (on object) vs capability (held by subject).\n- **DAC** owner decides | **MAC** system with labels (clearance must dominate classification) | **RBAC** system with roles; rules: role assignment, role authorization, transaction authorization.\n- **AAAA:** authentication, authorization, auditing, action (prevention, detection, reaction). Software vulnerabilities: bugs, inappropriate features, inappropriate use of features.\n- **Hardware attacks:** Rowhammer, evil maid, modification, counterfeit, eavesdropping. **6 mitigations:** vendors, encrypt, minimise attack surface, physical security, monitoring, firmware updates.\n- **Annex A.11:** perimeter; entry controls; secure offices; external threats; secure areas; delivery areas; equipment siting; utilities; cabling; maintenance; off-premises; disposal; clear desk and screen.\n- **OSI (top to bottom):** application, presentation, session, transport, network, data link, physical.\n- **Attacks:** SYN flood (half-open list full); ARP poisoning (forged MAC mapping); DNS poisoning; sniffing (passive); IP spoofing (ingress filtering).\n- **VPN:** encapsulation, encryption, tunnelling.\n- **7 firewalls:** packet filtering; proxy; application-level proxy; circuit-level proxy; stateful inspection; dynamic packet filtering; kernel proxy.\n- **IDS:** network or host; signature, anomaly, protocol; TP, TN, FP (alert on normal), FN (silent on attack).\n- **Supplementary:** digital signature = hash signed with private key; BCP vs DRP; RTO, RPO; 3-2-1 backup; hot/warm/cold sites.\n\n## Sheet 5 — Topic 5: IT Governance and Management\n\n- **Governance** = direction and oversight (element of corporate governance). **Management** = plan, implement, maintain, support.\n- **Benefits:** measurable results; legal compliance; stakeholder assurance; higher return on IT investment; comply with governance rules.\n- **Frameworks:** ISO 38500, COBIT, ITIL, Calder-Moir, King reports, BCM/DR, PRINCE2/PMBOK.\n- **5 domains:** strategic alignment, value delivery, risk management, resource management, performance management.\n- **10 principles:** the five (performance measurement) plus transparency and accountability, compliance, continuous improvement, stakeholder engagement, decision-making structures.\n- **Assessment (9):** objectives and KPIs; gap analysis; review documents; assess structures; review risk; measure resources; monitor compliance; stakeholder feedback; continuous improvement.\n- **Governance audit:** objectives, evidence, structures, policies, risk, resources, compliance, performance, findings, communicate, follow-up.\n- **10 management aspects:** strategic planning, infrastructure, applications, data, cybersecurity, ITSM, governance, vendors, user support, performance monitoring.\n- **Evaluating controls (8):** documentation; compliance; implementation; examine (technical, administrative, physical); test; change management; incident response; improvement.\n- **Change management (5):** request, assessment and approval (CAB), planning and scheduling, implementation and testing, review and closure.\n- **Configuration control (5):** identification, baseline, change control, status accounting, auditing and verification.\n\n## Sheet 6 — Topic 6: IS Auditing Concepts\n\n- **Audit:** systematic, independent, objective evaluation of evidence against criteria. **IS audit:** safeguards assets, maintains data integrity, achieves goals effectively, uses resources efficiently.\n- **3 questions:** availability, confidentiality, integrity.\n- **IS components:** hardware, software, procedures, data, people. **Environment:** boundary, subsystem, supra-system. Model: input, process, output.\n- **Goals:** safeguard assets (data, application systems, technology, facilities, people); data integrity (9 attributes); effective and efficient goals.\n- **9 attributes:** effectiveness, efficiency, confidentiality, integrity, availability, compliance, reliability, accuracy, completeness.\n- **9 objectives:** control adequacy; resource efficiency; assets safeguarded; accurate information; errors prevented/detected/corrected/reported; compliance; user needs and audit trails; identify threats; management actions.\n- **Categories:** general controls, application controls, system development. **Types:** system, application, compliance, security, performance.\n- **Benefits (S-O-F-T):** strategic, operational, financial, technical.\n- **9 risk factors:** access, business disruption, credit, customer service, data integrity, financial report misstatement, fraud, legal and regulatory, physical harm.\n- **Terms:** threat, vulnerability, exposure (extent of loss), likelihood, attack. **Effectiveness** vs **efficiency.**\n- **Abuse (6):** destruction, theft, modification, privacy violation, disruption, unauthorised use.\n- **Process:** plan, gather information, evaluate controls, report; follow up.\n- **Supplementary:** evidence (inspection, observation, inquiry, confirmation, re-performance, recomputation, analytical); around (black box), through (test logic), with (tool on data).\n\n## Sheet 7 — Topic 7: Controls\n\n- **Control:** policies, procedures, practices, organizational structures giving **reasonable assurance** that objectives are met and undesired events prevented or detected and corrected.\n- **12 objectives:** controllability, maintainability, usability, effectiveness, economy and efficiency, quality, safeguarding assets, compliance, reliability, data integrity, security, availability.\n- **4 classes:** general; application (business process); objective-based; user. **Outline:** administrative, technical, physical, logical.\n- **General controls:** organizational; management (responsibility, IT structure, steering committee); financial techniques (authorization, budgets, cancellation, documentation, dual control, input/output verification, safekeeping, SoD, sequential numbering, supervisory review); development and documentation; hardware/system software (configuration management); business continuity.\n- **Application controls CAVC:** completeness (batch totals, sequence, matching, duplicate check, reconciliations, control totals, exception reports) | accuracy (edit checks: validation, reasonableness, dependency, existence, format, math accuracy, range; check digits) | validity (one-for-one, matching) | confidentiality (restricted access, SoD, restricted extraction tools).\n- **4 categories:** application-level general; business process (input, processing, output, master data); interface; data management system (business rules).\n- **Objective-based (5):** preventive, detective, corrective, directive, recovery.\n- **User controls (5):** boundary (identification, authentication, authorization), input, processing, output, database.\n- **Audit trail:** accounting and operations; detect unauthorised access; reconstruct events; personal accountability.\n- **Effect of computers (7):** personnel; SoD; authorization; record keeping; access to assets and records; supervision; concentration of programs and data.\n- **Testing:** design, implementation, operating effectiveness; compensating controls.\n\n## Sheet 8 — Topic 8: IS Audit Reporting\n\n- **Finding (5):** condition (with evidence), criteria, cause, effect, recommendation (owner and timeline).\n- **Recommendation qualities:** specific, addresses the cause, owned, time-bound, proportionate, measurable.\n- **VA vs PT:** find and rank vs exploit under written authority. **VAPT:** scope, tools, discovery, exploitation, severity, business impact, prioritised remediation, retest.\n- **CW2 report:** executive summary; background and scope; methodology; detailed findings by 9 areas; testing summaries; availability/capacity/performance/DR-BCP; management action plan; appendices.\n- **9 areas:** policy; passwords; tariff; interest; eligibility; SoD and access; VAPT; ICT capability and operations; AAA.\n- **Rules:** PDF 15 to 20 pages; cover page; ZIP of working papers; Turnitin below 20%; peer evaluation; oral defence.\n- **Audience:** board (opinion, risk), management (priorities), IT (detail).\n\n## Sheet 9 — Topic 9: Compliance and Ethics\n\n- **Compliance:** following laws, regulations, standards, policies (GDPR, HIPAA, PCI DSS, ISO 27001, Uganda Data Protection and Privacy Act 2019). **CW1:** the Act emphasises explicit consent.\n- **Compliance audit steps:** identify requirements; map to controls; plan tests; test; assess gaps; report; follow up.\n- **Data protection ideas:** consent, purpose limitation, minimisation, accuracy, storage limitation, security safeguards, accountability, data subject rights.\n- **Ethics:** integrity, objectivity, independence, confidentiality, competence, due care, lawful conduct, full and accurate reporting.\n- **Practice:** authorised scope; privacy in testing; conflicts; gifts and pressure; honest reporting; handling fraud; lawful tools; academic integrity.\n- **Trap:** compliant does not mean secure; gray hat is still unauthorised.\n\n## Sheet 10 — Practical Lab\n\n- **7 steps:** objective and criteria; obtain data; validate (count, totals, blanks, dates); prepare (raw untouched); run test; investigate exceptions; document and conclude.\n- **Excel:** `COUNTIFS` duplicates | sorted difference `=A3-A2-1` gaps | `XLOOKUP`/`VLOOKUP(…,FALSE)` matching | `VLOOKUP(…,TRUE)` bands (sorted ascending) | `DATEDIF(dob,date,\"Y\")` age | `WEEKDAY(d,2)>5` weekend | `MOD` round amounts and systematic samples | `RAND` random samples (paste values) | PivotTable.\n- **IDEA:** import, validate, duplicate key detection, gaps detection, join, summarization, stratification, sampling, Benford, history log.\n- **Labs:** leavers; duplicates and gaps; interest recomputation; tariff and excise; eligibility; SoD; password compliance; sampling.\n- **Pitfalls:** text numbers, spaces, text dates, unsorted approximate match, missing `$`, net only, deleting duplicates, treating every flag as a finding.\n\n---\n\n## Numbers and formulas sheet\n\n| Item | Formula or rule |\n|---|---|\n| Risk | Likelihood × Impact |\n| Priority for audit testing | Exposure × Likelihood of failure |\n| Deviation rate | Exceptions ÷ **sample size**; compare with tolerable rate |\n| Interest (simple, days basis 365) | Balance × annual rate × days ÷ 365 |\n| One day's interest | Balance × annual rate ÷ 365 |\n| Tariff expected charge | Fee from band + excise (rate × fee) |\n| Difference | Charged (or posted) − expected (or recomputed); negative = under |\n| Gap in sequence | Next − previous − 1 |\n| Age at opening | `DATEDIF(DOB, OpenDate, \"Y\")` |\n| Systematic sample interval | Population ÷ sample size (rounded down) |\n| IDS counts | TP + FN = real attacks; FP = alerts − TP; TN = events − attacks − FP |\n| Check digit (illustrative) | Weighted sum of digits, last digit |\n| Reconciliation | Sum of individual differences = difference of totals |\n\n\n---"};</script><script src="assets/app.js"></script><script src="assets/live.js"></script></html>
